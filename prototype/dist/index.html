      var s = '', i, ex;
      for (i = -1; i <= 1; i += 2) {
        ex = cx + dx * i;
        if (closed) {
          s += E('path', { d: 'M' + N(ex - r) + ' ' + N(cy) + ' Q' + N(ex) + ' ' + N(cy + r * 1.05) +
                 ' ' + N(ex + r) + ' ' + N(cy), stroke: INK, 'stroke-width': 2.8, fill: 'none',
                 'stroke-linecap': 'round' });
          if (o.lash !== false) {
            s += E('path', { d: 'M' + N(ex + r * 0.72 * i) + ' ' + N(cy + r * 0.72) + ' L' +
                   N(ex + r * 1.2 * i) + ' ' + N(cy + r * 1.2), stroke: INK, 'stroke-width': 2,
                   fill: 'none', 'stroke-linecap': 'round' });
          }
        } else {
          s += E('ellipse', { cx: N(ex), cy: N(cy), rx: N(r), ry: N(ry), fill: INK });
          if (o.spark) {
            s += c.sparkle(ex - r * 0.2, cy - ry * 0.26, r * 0.66, '#FFFFFF', 0.95);
            s += E('circle', { cx: N(ex + r * 0.32), cy: N(cy + ry * 0.34), r: N(r * 0.2),
                   fill: '#FFFFFF', opacity: 0.85 });
          } else {
            s += E('circle', { cx: N(ex - r * 0.3), cy: N(cy - ry * 0.32), r: N(r * 0.42), fill: '#FFFFFF' });
            s += E('circle', { cx: N(ex + r * 0.32), cy: N(cy + ry * 0.3), r: N(r * 0.2),
                   fill: '#FFFFFF', opacity: 0.9 });
          }
        }
      }
      return s;
    };
    c.cheeks = function (cx, cy, dx, o) {
      if (c.sil) return '';
      o = o || {};
      var rx = o.rx || 4.2, ry = o.ry || 2.8, op = o.op != null ? o.op : 0.55;
      return E('ellipse', { cx: N(cx - dx), cy: N(cy), rx: N(rx), ry: N(ry), fill: CHEEK, opacity: op }) +
             E('ellipse', { cx: N(cx + dx), cy: N(cy), rx: N(rx), ry: N(ry), fill: CHEEK, opacity: op });
    };
    c.mouth = function (cx, cy, type, o) {
      if (c.sil || type === 'none') return '';
      o = o || {};
      var w = o.w || 9;
      if (c.mood === 'sleep' && !o.force) {
        return E('path', { d: 'M' + N(cx - 2.6) + ' ' + N(cy) + ' Q' + N(cx) + ' ' + N(cy + 2.2) +
               ' ' + N(cx + 2.6) + ' ' + N(cy), stroke: INK, 'stroke-width': 2.2, fill: 'none',
               'stroke-linecap': 'round' });
      }
      if (type === 'open') {
        return E('path', { d: 'M' + N(cx - w / 2) + ' ' + N(cy) +
                 ' Q' + N(cx) + ' ' + N(cy + w * 0.95) + ' ' + N(cx + w / 2) + ' ' + N(cy) +
                 ' Q' + N(cx) + ' ' + N(cy + w * 0.16) + ' ' + N(cx - w / 2) + ' ' + N(cy) + ' Z',
                 fill: INK, 'stroke-linejoin': 'round' }) +
               E('path', { d: 'M' + N(cx - w * 0.22) + ' ' + N(cy + w * 0.3) +
                 ' Q' + N(cx) + ' ' + N(cy + w * 0.64) + ' ' + N(cx + w * 0.22) + ' ' + N(cy + w * 0.3) +
                 ' Q' + N(cx) + ' ' + N(cy + w * 0.4) + ' ' + N(cx - w * 0.22) + ' ' + N(cy + w * 0.3) + ' Z',
                 fill: '#FF8FA0' });
      }
      if (type === 'o') return E('circle', { cx: N(cx), cy: N(cy + 1), r: 2.2, fill: INK });
      return E('path', { d: 'M' + N(cx - w / 2) + ' ' + N(cy) + ' Q' + N(cx) + ' ' + N(cy + w * 0.5) +
             ' ' + N(cx + w / 2) + ' ' + N(cy), stroke: INK, 'stroke-width': 2.6, fill: 'none',
             'stroke-linecap': 'round' });
    };
    c.face = function (cx, cy, o) { // pratik birleşik yüz
      if (c.sil) return '';
      o = o || {};
      var s = c.eyes(cx, cy - 2, o.eyes || {});
      if (o.cheeks !== false) {
        var edx = (o.eyes && o.eyes.dx != null ? o.eyes.dx : 8);
        s += c.cheeks(cx, cy + 4.5, edx + 6, o.cheekOpts || {});
      }
      s += c.mouth(cx, cy + (o.my != null ? o.my : 6.5), o.m || 'smile', o.mOpts || {});
      return s;
    };

    /* --- karakter parçaları --- */
    c.beak = function (cx, cy, w, col, o) { // gaga (o.open → sevinçli açık)
      o = o || {};
      var dk = o.dk || col;
      var open = o.open && c.mood !== 'sleep' && !c.sil;
      var s = c.path('M' + N(cx - w / 2) + ' ' + N(cy) +
              ' Q' + N(cx) + ' ' + N(cy - w * 0.52) + ' ' + N(cx + w / 2) + ' ' + N(cy) +
              ' Q' + N(cx) + ' ' + N(cy + w * (open ? 0.3 : 0.55)) + ' ' + N(cx - w / 2) + ' ' + N(cy) + ' Z',
              col, { lw: LW2 });
      if (open) {
        s += c.path('M' + N(cx - w * 0.32) + ' ' + N(cy + w * 0.22) +
             ' Q' + N(cx) + ' ' + N(cy + w * 0.78) + ' ' + N(cx + w * 0.32) + ' ' + N(cy + w * 0.22) +
             ' Q' + N(cx) + ' ' + N(cy + w * 0.4) + ' ' + N(cx - w * 0.32) + ' ' + N(cy + w * 0.22) + ' Z',
             dk, { lw: LW2 });
      }
      return s;
    };
    c.earRound = function (cx, cy, r, fill, inner) { // fare/ayı kulağı
      var s = c.ball(cx, cy, r, fill, {});
      if (!c.sil) {
        s += E('circle', { cx: N(cx), cy: N(cy + r * 0.08), r: N(r * 0.55), fill: inner });
        s += c.dot(cx - r * 0.38, cy - r * 0.38, r * 0.2, 0.6);
      }
      return s;
    };
    c.antenna = function (d, col, tx, ty, tr) { // anten: eğri sap + top uç
      return c.line(d, 2.6, c.sil ? SIL : col) + c.ball(tx, ty, tr || 3, col, { lw: LW2 });
    };
    c.sparkle = function (x, y, s, col, op) { // 4 uçlu ışıltı
      return E('path', { d: 'M' + N(x) + ' ' + N(y - s) +
        ' Q' + N(x + s * 0.22) + ' ' + N(y - s * 0.22) + ' ' + N(x + s) + ' ' + N(y) +
        ' Q' + N(x + s * 0.22) + ' ' + N(y + s * 0.22) + ' ' + N(x) + ' ' + N(y + s) +
        ' Q' + N(x - s * 0.22) + ' ' + N(y + s * 0.22) + ' ' + N(x - s) + ' ' + N(y) +
        ' Q' + N(x - s * 0.22) + ' ' + N(y - s * 0.22) + ' ' + N(x) + ' ' + N(y - s) + ' Z',
        fill: c.sil ? SIL : col, opacity: c.sil ? 1 : (op != null ? op : 0.9) });
    };
    c.moon = function (cx, cy, r, col, o) { // hilal (ağzı sağa bakar)
      o = o || {};
      var d = 'M' + N(cx) + ' ' + N(cy - r) +
              ' A' + N(r) + ' ' + N(r) + ' 0 1 0 ' + N(cx) + ' ' + N(cy + r) +
              ' A' + N(r * 1.55) + ' ' + N(r * 1.55) + ' 0 0 1 ' + N(cx) + ' ' + N(cy - r) + ' Z';
      return E('path', mix({ d: d, fill: c.paint(col), transform: rotAt(o.rot, cx, cy),
        opacity: o.op != null ? c.o(o.op) : null }, outAttrs(c, o, LW2)));
    };
    c._hn = 0;
    c.aura = function (col, cy, r, a) { // nadirlik ışıması (arka plan)
      if (c.sil) return '';
      var gid = c.uid + '-au' + (c._hn++);
      a = a != null ? a : 0.5;
      c.defs.push(
        '<radialGradient id="' + gid + '" cx="0.5" cy="0.5" r="0.5">' +
        '<stop offset="0" stop-color="' + col + '" stop-opacity="' + N(a) + '"/>' +
        '<stop offset="0.65" stop-color="' + col + '" stop-opacity="' + N(a * 0.42) + '"/>' +
        '<stop offset="1" stop-color="' + col + '" stop-opacity="0"/></radialGradient>');
      return E('circle', { cx: 60, cy: cy != null ? N(cy) : 58, r: r != null ? N(r) : 54,
        fill: 'url(#' + gid + ')' });
    };

    /* --- poz yardımcıları --- */
    c.grp  = function (attrs, inner) { return E('g', attrs, inner); };
    c.move = function (x, y, inner) {
      return E('g', { transform: 'translate(' + N(x) + ' ' + N(y) + ')' }, inner);
    };
    c.spin = function (deg, px, py, inner) {
      return E('g', { transform: 'rotate(' + N(deg) + ' ' + N(px) + ' ' + N(py) + ')' }, inner);
    };
    c.zoom = function (s, px, py, inner) {
      return E('g', { transform: 'translate(' + N(px * (1 - s)) + ' ' + N(py * (1 - s)) +
        ') scale(' + N(s) + ')' }, inner);
    };

    return c;
  }

  function svgWrap (c, inner) {
    var defs = c.defs.length ? '<defs>' + c.defs.join('') + '</defs>' : '';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true">' +
           defs + inner + '</svg>';
  }

  // Beyaz sticker halesi: karakter grubunu dilate-beyaz filtresine sarar.
  function sticker (c, inner) {
    if (c.sil || !inner) return inner;
    var fid = c.uid + '-stk';
    c.defs.push(
      '<filter id="' + fid + '" x="-18%" y="-18%" width="136%" height="136%">' +
      '<feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="yvd"/>' +
      '<feFlood flood-color="#FFFFFF"/>' +
      '<feComposite in2="yvd" operator="in" result="yvh"/>' +
      '<feMerge><feMergeNode in="yvh"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter>');
    return '<g filter="url(#' + fid + ')">' + inner + '</g>';
  }

  // Zemin gölgesi (API basar; ressam çizmez)
  function groundShadow (op, ry) {
    return E('ellipse', { cx: 60, cy: 104.5, rx: 25, ry: ry || 4.6, fill: SIL, opacity: op || 0.14 });
  }
  /* =====================================================================
     KAYIT SİSTEMİ — Yuvo.art.registerKind
     ===================================================================== */

  var KINDS = {};

  Y.art.registerKind = function (kind, def) {
    if (!kind || !def || typeof def.pufi !== 'function') return false;
    KINDS[String(kind)] = def;
    return true;
  };

  /* --- yer tutucu: "gizemli Pufi" (kayıtsız kind sevimli kalır) --- */

  function placeholderPufi (c) {
    var LT = '#EFE4FB', DK = '#B49BDD';
    var s = '';
    // ayaklar
    s += c.caps(48, 98, 13, 8, '#C9B4E8', {});
    s += c.caps(72, 98, 13, 8, '#C9B4E8', {});
    // tombul gövde-baş tek kütle
    s += c.blob(60, 68, 29, 33, c.vinyl('bd', LT, DK), {});
    s += c.blob(60, 86, 15, 11, '#F8F1FF', { line: false, op: 0.9 });
    s += c.gloss(46, 48, 9.5, 6);
    s += c.bounce(60, 95, 17, 5, '#EFE4FB');
    // filiz anten + soru kıvrımı
    s += c.antenna('M60 35 Q59 24 64 19', '#8F76C2', 65, 17.5, 3.2);
    s += c.line('M64 19 Q72 14 74 21 Q75 26 69 26', 2.6, c.sil ? SIL : '#8F76C2');
    // yüz
    s += c.face(60, 60, { eyes: { dx: 9, r: 5 }, m: 'smile' });
    return s;
  }

  function placeholderParts (c) {
    var LT = '#EFE4FB', DK = '#B49BDD';
    return {
      govde: c.caps(49, 84, 13, 8, '#C9B4E8', {}) + c.caps(71, 84, 13, 8, '#C9B4E8', {}) +
             c.blob(60, 60, 28, 26, c.vinyl('bd', LT, DK), {}) +
             c.blob(60, 72, 14, 9, '#F8F1FF', { line: false, op: 0.9 }) +
             c.gloss(47, 44, 9, 5.5),
      bas:   c.ball(60, 60, 26, c.vinyl('hd', LT, DK), {}) + c.gloss(48, 48, 8.5, 5) +
             c.face(60, 62, { eyes: { dx: 9.5, r: 5.2 }, m: 'smile' }),
      aksesuar: c.antenna('M60 78 Q58 58 66 48', '#8F76C2', 68, 45, 4.2) +
                c.line('M68 45 Q80 38 82 48 Q83 55 74 55', 3, c.sil ? SIL : '#8F76C2') +
                c.sparkle(40, 52, 5, '#D9C6F5', 0.9) + c.sparkle(84, 72, 4, '#D9C6F5', 0.8)
    };
  }

  var PLACEHOLDER = { pufi: placeholderPufi, parts: placeholderParts };

  function kindDef (pufi) {
    var kind = (pufi && pufi.kind) ? String(pufi.kind) : '';
    return KINDS[kind] || PLACEHOLDER;
  }

  /* =====================================================================
     BEŞ ÖRNEK KARAKTER (kalite çıtası — ressamlar bu düzeye çıkar)
     ===================================================================== */

  /* --- 1. CİVCİV (cikcik) — sarı tombiş, horoz çırağı --- */

  function civcivBits (c) {
    var LT = '#FFF6BE', DK = '#FFC531', WG = '#F5A623', FT = '#FF9F3D';
    var b = {};
    b.tail = c.drop(85, 84, 4.6, 12, c.vinyl('tl', '#FFE98F', WG), { rot: 118 });
    b.feet = c.caps(48, 99, 13, 8, FT, {}) + c.caps(72, 99, 13, 8, FT, {});
    b.body = c.blob(60, 80, 25, 21, c.vinyl('bd', LT, DK), {}) +
             c.blob(60, 86, 13.5, 10.5, '#FFF1B0', { line: false, op: 0.95 }) +
             c.gloss(47.5, 67, 9.5, 5.5) +
             c.bounce(60, 96, 16, 4.6, '#FFF3C0', 0.22);
    b.wingL = c.drop(35.5, 82, 6.8, 14, c.vinyl('w1', '#FFEC9E', WG), { rot: -150 });
    b.wingR = c.drop(84.5, 82, 6.8, 14, c.vinyl('w2', '#FFEC9E', WG), { rot: 150 });
    b.head = c.ball(60, 43, 21.5, c.vinyl('hd', LT, DK), {}) +
             c.gloss(49.5, 32.5, 8.2, 4.6);
    b.crest = c.drop(52, 26.5, 3.3, 8.5, c.vinyl('c1', '#FFEC9E', WG), { rot: -16 }) +
              c.drop(60, 23.5, 3.9, 10.5, c.vinyl('c2', '#FFF3B8', WG), {}) +
              c.drop(68, 26.5, 3.3, 8.5, c.vinyl('c3', '#FFEC9E', WG), { rot: 16 });
    b.face = c.eyes(60, 42, { dx: 8.6, r: 4.9 }) +
             c.cheeks(60, 49, 14.6, {}) +
             c.beak(60, 52.5, 9.5, FT, { open: true, dk: '#E8842B' });
    return b;
  }

  Y.art.registerKind('civciv', {
    pufi: function (c) {
      var b = civcivBits(c);
      return b.tail + b.feet + b.body + b.wingL + b.wingR + b.head + b.crest + b.face;
    },
    parts: function (c) {
      var b = civcivBits(c);
      return {
        govde: c.move(0, -10, b.tail + b.feet + b.body),
        bas:   c.zoom(1.25, 60, 44, c.move(0, 14, b.head + b.face)),
        aksesuar: c.zoom(1.35, 60, 60,
          c.move(0, 22, b.crest) +
          c.move(14, -14, b.wingL) + c.move(-14, -14, b.wingR))
      };
    }
  });

  /* --- 2. FARE (toprik) — tarla faresi, kulağında başak --- */

  function fareBits (c) {
    var LT = '#F5F2FB', DK = '#BDB6D4', EAR = '#FFC4D9', TAIL = '#F49CC0';
    var b = {};
    b.tail = c.rope('M79 90 Q104 94 102 75 Q100 62 88 67', 6, TAIL, { hi: true });
    b.feet = c.caps(48, 99, 13, 8, '#E3DDF2', {}) + c.caps(72, 99, 13, 8, '#E3DDF2', {});
    b.body = c.blob(60, 81, 24.5, 20, c.vinyl('bd', LT, DK), {}) +
             c.blob(60, 86.5, 13.5, 10, '#FDFBFF', { line: false, op: 0.95 }) +
             c.gloss(48, 68, 9, 5.2) +
             c.bounce(60, 96, 15, 4.4, '#F5F2FB', 0.2);
    b.paws = c.ball(45, 89, 4.6, c.vinyl('p1', LT, DK), { lw: LW2 }) +
             c.ball(75, 89, 4.6, c.vinyl('p2', LT, DK), { lw: LW2 });
    b.ears = c.earRound(40, 26, 11.5, c.vinyl('e1', LT, DK), EAR) +
             c.earRound(80, 26, 11.5, c.vinyl('e2', LT, DK), EAR);
    // başak (hasat şarkıları!): kulağın arkasına sıkıştırılmış
    var wheat = c.line('M87 33 Q92 24 92 15', 2.6, c.sil ? SIL : '#D9A43C');
    var gy = [15, 19, 23], i;
    for (i = 0; i < 3; i++) {
      wheat += c.leaf(89 - i * 0.6, gy[i], 2.6, 4.4, '#F2C14E', { rot: -28, lw: 1.8 });
      wheat += c.leaf(94.6 + i * 0.4, gy[i] + 1, 2.6, 4.4, '#F2C14E', { rot: 28, lw: 1.8 });
    }
    b.wheat = wheat;
    b.head = c.blob(60, 45, 22, 20.5, c.vinyl('hd', LT, DK), {}) +
             c.gloss(49, 34.5, 8.4, 4.6);
    b.face = c.eyes(60, 42.5, { dx: 9, r: 4.7 }) +
             c.cheeks(60, 49.5, 15, {}) +
             c.blob(60, 54, 7.2, 5.4, '#FDFBFF', { line: false, op: 0.95 }) +
             c.path('M57.6 50.6 Q60 48.6 62.4 50.6 Q60.6 53.4 60 53.4 Q59.4 53.4 57.6 50.6 Z',
                    '#F4779B', { lw: 1.8 }) +
             c.mouth(60, 55.5, 'smile', { w: 7 }) +
             (c.sil ? '' : c.line('M38 48 Q31 47 26 48 M39 52 Q33 53 28 55', 1.6, '#B9AECE', { op: 0.85 }) +
                           c.line('M82 48 Q89 47 94 48 M81 52 Q87 53 92 55', 1.6, '#B9AECE', { op: 0.85 }));
    return b;
  }

  Y.art.registerKind('fare', {
    pufi: function (c) {
      var b = fareBits(c);
      return b.tail + b.feet + b.body + b.paws + b.wheat + b.ears + b.head + b.face;
    },
    parts: function (c) {
      var b = fareBits(c);
      return {
        govde: c.move(0, -8, b.tail + b.feet + b.body + b.paws),
        bas:   c.zoom(1.2, 60, 45, c.move(0, 12, b.head + b.face)),
        aksesuar: c.zoom(1.15, 60, 60,
          c.move(8, 26, b.ears) + c.move(-24, 30, b.wheat))
      };
    }
  });

  /* --- 3. KELEBEK (pirpir) — şeker pembesi kanatlar --- */

  function kelebekBits (c) {
    var WLT = '#FFD9EC', WDK = '#FF8FC8', LLT = '#FFE9C9', LDK = '#FFB566';
    var BLT = '#DCCFF7', BDK = '#8F79D9';
    var b = {};
    function upperWing (cx, cy, rot, n) {
      return c.blob(cx, cy, 17.5, 21.5, c.vinyl('uw' + n, WLT, WDK), { rot: rot }) +
             c.blob(cx, cy, 10.8, 14, '#FFF2F9', { line: false, op: 0.9, rot: rot }) +
             c.ball(cx, cy - 4, 3.4, '#FFB56B', { lw: 1.8 }) +
             c.ball(cx + (rot < 0 ? -3 : 3), cy + 6.5, 2.2, '#FF8FC8', { lw: 1.6 });
    }
    function lowerWing (cx, cy, rot, n) {
      return c.blob(cx, cy, 11.5, 13.5, c.vinyl('lw' + n, LLT, LDK), { rot: rot }) +
             c.blob(cx, cy + 1, 6.4, 8, '#FFF6E8', { line: false, op: 0.85, rot: rot }) +
             c.ball(cx, cy + 2, 2, '#FFB566', { lw: 1.5 });
    }
    b.wings = upperWing(33.5, 49, -22, 1) + upperWing(86.5, 49, 22, 2) +
              lowerWing(40, 80, 16, 1) + lowerWing(80, 80, -16, 2);
    b.body = c.caps(60, 77, 17.5, 37, c.vinyl('bd', BLT, BDK), { rx: 8.6 }) +
             c.gloss(55.5, 65, 4.2, 7.5, -8) +
             c.bounce(60, 91, 6.5, 3.4, '#EFE8FC', 0.24);
    b.head = c.ball(60, 44, 16, c.vinyl('hd', BLT, BDK), {}) +
             c.gloss(52.5, 36.5, 5.6, 3.4);
    b.ant = c.antenna('M53 31 Q47 21 41 18', '#7A66C2', 40, 17, 3) +
            c.antenna('M67 31 Q73 21 79 18', '#7A66C2', 80, 17, 3);
    b.face = c.eyes(60, 43, { dx: 6.6, r: 4.4 }) +
             c.cheeks(60, 49, 11.6, { rx: 3.6, ry: 2.4 }) +
             c.mouth(60, 51, 'smile', { w: 7 });
    b.spark = c.sparkle(22, 30, 4, '#FFD9EC', 0.85) + c.sparkle(98, 32, 3.4, '#FFE9C9', 0.85) +
              c.sparkle(25, 74, 3, '#FFD9EC', 0.7);
    return b;
  }

  Y.art.registerKind('kelebek', {
    pufi: function (c) {
      var b = kelebekBits(c);
      return b.wings + b.body + b.head + b.ant + b.face + b.spark;
    },
    parts: function (c) {
      var b = kelebekBits(c);
      return {
        govde: c.zoom(1.15, 60, 78, b.body),
        bas:   c.zoom(1.3, 60, 44, c.move(0, 14, b.head + b.ant + b.face)),
        aksesuar: c.zoom(0.98, 60, 60, c.move(0, 12, b.wings))
      };
    }
  });
  /* --- 4. GÜNEŞ KUŞU (gundogan) — EFSANEVİ: güneş diski + alev sorguç --- */

  function guneskusuBits (c) {
    var LT = '#FFE4A6', DK = '#FF9C3F', CO = '#FF7E4E', GOLD = '#FFD76B';
    var b = {};
    // katmanlı altın aura
    b.aura = c.aura('#FFB63C', 54, 56, 0.5) + c.aura('#FFE28A', 48, 34, 0.45);
    // güneş diski: ışın tacı + çekirdek

  /* --- 5. KORKULUK (hisir) — GİZLİ: ay ışığında dans eden çuval dostu --- */

  function korkulukBits (c) {

    var HLT = '#F7E8C2', HDK = '#D2AE72';   // kafa (daha aydınlık)
    var HAT1 = '#8F76C2', HAT2 = '#5C4696'; // gece moru şapka
    var STRAW = '#E8BE5C';
    var b = {};
    b.aura = c.aura('#8D7BD8', 56, 54, 0.42) + c.aura('#B9A8E8', 30, 26, 0.3);
    // gövde: yamalı çuval
    b.body = c.path('M45 61 Q38 63 38 76 L38 86 Q38 98 52 98 L68 98 Q82 98 82 86 L82 76 Q82 63 75 61 Q60 55 45 61 Z',
                    c.vinyl('bd', BLT, BDK)) +
             c.gloss(48, 68, 8.4, 4.8) +
             c.bounce(60, 93, 15, 4, '#F7EBC6', 0.2);
    // alt saman püskülü
    var straw = '', sx = [44, 50, 57, 64, 71, 77], i;
    for (i = 0; i < sx.length; i++) {
      straw += c.line('M' + sx[i] + ' 96 L' + N(sx[i] + (i % 2 ? 3.4 : -3.4)) + ' 105', 3,
                      c.sil ? SIL : STRAW);
    }
    b.straw = straw +
              c.line('M40 74 L34 70 M40 79 L33 78', 2.6, c.sil ? SIL : STRAW) +
              c.line('M80 74 L86 70 M80 79 L87 78', 2.6, c.sil ? SIL : STRAW);
    // yamalar + dikişler
    b.patch = c.caps(50, 78, 12, 11, '#E8897A', { rot: -8, rx: 3.5, lw: LW2 }) +
              (c.sil ? '' : c.line('M45.5 74 L48 76 M49 73 L51.5 75', 1.6, '#FFF1E8', { op: 0.9 })) +
              c.path('M70.8 83.2 Q73 80.6 75.2 83.2 Q77.4 85.8 71 89.8 Q64.6 85.8 66.8 83.2 Q69 80.6 70.8 83.2 Z',
                     '#EFA8C0', { lw: LW2 }) +
              (c.sil ? '' : c.line('M56 66 L60 66 M58 64 L58 68', 1.8, '#A8874E', { op: 0.9 }));
    b.head = c.ball(60, 41, 20.5, c.vinyl('hd', HLT, HDK), {}) +
             c.gloss(50, 31.5, 7.8, 4.4) +
             (c.sil ? '' : c.line('M74 30 Q77 36 76.5 42', 1.8, '#B8955A', { dash: '3 3.4', op: 0.9 }));
    // şapka: eğik uçlu gece moru sivri şapka + yıldız uç
    b.hat = c.blob(60, 25.5, 24.5, 6.6, c.vinyl('hb', HAT1, HAT2), {}) +
            c.path('M42 24 Q46 6 64 5 Q79 5 88 12 Q84 15 78 14 Q80 20 76 25 Q59 30 42 24 Z',

            (c.sil ? '' : c.caps(60, 15, 9, 7, '#B9A8E8', { rot: -10, rx: 2.6, lw: 1.8, op: 0.95 }) +
                          c.sparkle(90, 10, 4.4, '#FFE9B0', 0.95)) +
            c.line('M46 28 L42 34 M51 29 L49 36 M72 29 L76 35', 2.6, c.sil ? SIL : STRAW);
    // yüz: hilal parlamalı iri gözler + dikiş gülümseme
    var eyes;
    if (c.sil) { eyes = ''; }
    else if (c.mood === 'sleep') {
      eyes = c.eyes(60, 41, { dx: 8.6, r: 4.8 });

      eyes = E('ellipse', { cx: 51.4, cy: 41, rx: 4.8, ry: 5.6, fill: INK }) +

  Y.art.registerKind('korkuluk', {

  /* =====================================================================
     KAMU API — imzalar ARCHITECTURE.md ile birebir
     ===================================================================== */

  var AURA_BY_RARITY = { efsanevi: '#FFB63C', gizli: '#8D7BD8' };

  Y.art.hasKind = function (kind) { return !!KINDS[String(kind)]; };

  function buildPufi (pufi, opts) {
    var id = (pufi && pufi.id) ? String(pufi.id) : 'pufi';
    var c = makeCtx(id, opts);
    var def = kindDef(pufi);
    var body;
    try { body = def.pufi(c, opts || {}); }
    catch (e) { def = PLACEHOLDER; body = placeholderPufi(c); }
    if (!body) { def = PLACEHOLDER; body = placeholderPufi(c); }
    return { c: c, def: def, body: body };
  }

  Y.art.pufiSVG = function (pufi, opts) {
    opts = opts || {};
    var r = buildPufi(pufi, { tag: 'm', mood: opts.mood });
    var inner = '';
    var auraCol = AURA_BY_RARITY[(pufi && pufi.rarity) || ''];
    if (auraCol && !r.def.ownAura) inner += r.c.aura(auraCol, 58, 54, 0.5);
    inner += groundShadow();
    inner += sticker(r.c, r.body);
    return svgWrap(r.c, inner);
  };

  Y.art.pufiSilhouetteSVG = function (pufi) {
    var r = buildPufi(pufi, { tag: 's', sil: true });
    return svgWrap(r.c, r.body);
  };

  Y.art.toyParts = function (pufi) {
    var id = (pufi && pufi.id) ? String(pufi.id) : 'pufi';
    var order = ['govde', 'bas', 'aksesuar'];
    var tags = { govde: 'pg', bas: 'pb', aksesuar: 'pa' };
    var out = [], i, c, def, piece, set;
    for (i = 0; i < order.length; i++) {
      c = makeCtx(id, { tag: tags[order[i]] });
      def = kindDef(pufi);
      piece = '';
      try {
        set = (typeof def.parts === 'function') ? def.parts(c) : null;
        piece = (set && set[order[i]]) ? set[order[i]] : '';
      } catch (e) { piece = ''; }
      if (!piece) { // savunmacı: boş parça olmasın
        try { set = placeholderParts(c); piece = set[order[i]] || ''; } catch (e2) {}
        if (!piece) piece = c.ball(60, 60, 14, '#C9B4E8', {});
      }
      out.push({ id: order[i], svg: svgWrap(c, sticker(c, piece)) });
    }
    return out;
  };

  Y.art.toyAssembledSVG = function (pufi) {
    var r = buildPufi(pufi, { tag: 't' });
    var c = r.c;
    var inner = '';
    var auraCol = AURA_BY_RARITY[(pufi && pufi.rarity) || ''];
    if (auraCol && !r.def.ownAura) inner += c.aura(auraCol, 56, 54, 0.5);
    inner += E('ellipse', { cx: 60, cy: 108, rx: 33, ry: 5.5, fill: SIL, opacity: 0.15 });
    // vinil kaide + üstünde oyuncak — tek sticker kütlesi
    var ped = c.blob(60, 104, 32, 7.5, c.vinyl('ped', '#FFF8E8', '#E0CFA8'), {}) +
              c.blob(60, 102, 25, 4, '#FFFDF6', { line: false, op: 0.85 });
    inner += sticker(c, ped + c.zoom(0.94, 60, 103, r.body));
    inner += c.sparkle(21, 30, 4.4, '#FFE28A', 0.95) +
             c.sparkle(99, 23, 3.6, '#FFE28A', 0.9) +
             c.sparkle(103, 74, 3, '#FFD9EC', 0.8);
    return svgWrap(c, inner);
  };

  var EGG_D = 'M60 13 C82 13 96 41 96 67 C96 90 80 106 60 106 C40 106 24 90 24 67 C24 41 38 13 60 13 Z';

  var EGGS = {
    yaygin:    { lt: '#FFFDF4', dk: '#E0D2B4', crack: '#8A7458' },
    azbulunur: { lt: '#F2FBEA', dk: '#AEDB96', crack: '#54804A' },
    nadir:     { lt: '#F4FCFF', dk: '#A2D6E8', crack: '#3E7E9E' },
    destansi:  { lt: '#F9F1FF', dk: '#C79EEB', crack: '#7A4EA8' },
    efsanevi:  { lt: '#FFF9E2', dk: '#F2C258', crack: '#A87A2E', aura: '#FFB63C' },
    gizli:     { lt: '#8F7ED0', dk: '#463781', crack: '#2A2058', aura: '#8D7BD8' }

  var CRACKS = [
    'M62 22 L53 32 L63 40 L55 49',
    'M55 49 L66 56 L57 65 M63 40 L73 46 L68 54',

  function sp4 (x, y, s, col, op) { // bağımsız 4 uçlu ışıltı (yumurta için)
    return E('path', { d: 'M' + N(x) + ' ' + N(y - s) +
      ' Q' + N(x + s * 0.22) + ' ' + N(y - s * 0.22) + ' ' + N(x + s) + ' ' + N(y) +
      ' Q' + N(x + s * 0.22) + ' ' + N(y + s * 0.22) + ' ' + N(x) + ' ' + N(y + s) +
      ' Q' + N(x - s * 0.22) + ' ' + N(y + s * 0.22) + ' ' + N(x - s) + ' ' + N(y) +
      ' Q' + N(x - s * 0.22) + ' ' + N(y - s * 0.22) + ' ' + N(x) + ' ' + N(y - s) + ' Z',
      fill: col, opacity: op });
  }

  function eggTexture (rarity, P, rnd) {
    var t = '', i, x, y;
    if (rarity === 'yaygin') { // mat: usulca çilli krem
      for (i = 0; i < 5; i++) {
        x = 36 + rnd() * 48; y = 36 + rnd() * 52;
        t += E('circle', { cx: N(x), cy: N(y), r: N(1.2 + rnd() * 1.2), fill: '#D9C8A4', opacity: 0.5 });
      }
    } else if (rarity === 'azbulunur') { // benekli: iki ton yeşil puan
      for (i = 0; i < 12; i++) {
        var a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd());
        x = 60 + Math.cos(a) * rr * 29; y = 62 + Math.sin(a) * rr * 36;
        t += E('circle', { cx: N(x), cy: N(y), r: N(1.6 + rnd() * 1.9),
               fill: (i % 2 ? '#6FBE62' : '#4E9E54'), opacity: 0.55 });

             transform: 'rotate(-24 50 47)' });
      t += E('ellipse', { cx: 66, cy: 76, rx: 32, ry: 5.5, fill: '#FFFFFF', opacity: 0.3,
             transform: 'rotate(-24 66 76)' });
      t += E('ellipse', { cx: 68, cy: 73, rx: 32, ry: 2, fill: '#BFEAF5', opacity: 0.55,
             transform: 'rotate(-24 68 73)' });
      for (i = 0; i < 7; i++) {
        x = 32 + rnd() * 54; y = 30 + rnd() * 60;
        t += E('circle', { cx: N(x), cy: N(y), r: 1, fill: '#FFFFFF', opacity: 0.75 });
      }
      t += sp4(74, 40, 3, '#FFFFFF', 0.9);
    } else if (rarity === 'destansi') { // akış deseni: hareket hissi
      t += E('path', { d: 'M20 50 Q34 41 48 50 Q62 59 76 50 Q88 42 100 49', stroke: '#A86BE0',
             'stroke-width': 3.4, fill: 'none', opacity: 0.5, 'stroke-linecap': 'round' });
      t += E('path', { d: 'M20 68 Q34 59 48 68 Q62 77 76 68 Q88 60 100 67', stroke: '#8F4ED0',
             'stroke-width': 3, fill: 'none', opacity: 0.42, 'stroke-linecap': 'round' });
      t += E('path', { d: 'M26 86 Q40 78 54 85 Q68 92 84 85', stroke: '#A86BE0',
             'stroke-width': 2.6, fill: 'none', opacity: 0.35, 'stroke-linecap': 'round' });
      for (i = 0; i < 5; i++) {
        x = 34 + rnd() * 52; y = 28 + rnd() * 62;
        t += E('rect', { x: N(x - 2.1), y: N(y - 2.1), width: 4.2, height: 4.2, rx: 1.3,
               fill: '#8F4ED0', opacity: 0.45,
               transform: 'rotate(45 ' + N(x) + ' ' + N(y) + ')' });
      }
      t += E('path', { d: 'M78 32 Q84 28 90 30', stroke: '#C79EEB', 'stroke-width': 2.4,
             fill: 'none', opacity: 0.7, 'stroke-linecap': 'round' }) +
           E('circle', { cx: 76, cy: 33, r: 2, fill: '#C79EEB', opacity: 0.8 });
    } else if (rarity === 'efsanevi') { // altın ışıma + minik yıldızlar
      t += E('ellipse', { cx: 56, cy: 50, rx: 25, ry: 19, fill: '#FFF6D0', opacity: 0.75 });
      t += E('path', { d: 'M34 78 Q46 92 66 92', stroke: '#FFFFFF', 'stroke-width': 2.6,
             fill: 'none', opacity: 0.45, 'stroke-linecap': 'round' });
      t += sp4(46, 42, 5.4, '#FFD76B', 0.95) + sp4(74, 58, 4.4, '#FFD76B', 0.9) +
           sp4(52, 82, 3.6, '#FFE9A8', 0.85) + sp4(78, 34, 3, '#FFFFFF', 0.95) +
           sp4(38, 62, 2.6, '#FFFFFF', 0.85);
      for (i = 0; i < 5; i++) {
        x = 34 + rnd() * 52; y = 28 + rnd() * 62;
        t += E('circle', { cx: N(x), cy: N(y), r: 1.1, fill: '#FFF3B8', opacity: 0.85 });
      }
    } else if (rarity === 'gizli') { // gece moru: hilal + yıldız tozu bulutu
      t += E('ellipse', { cx: 48, cy: 74, rx: 22, ry: 14, fill: '#B9A8E8', opacity: 0.22 });
      t += E('path', { d: 'M70 34 A11.5 11.5 0 1 0 70 57 A15.5 15.5 0 0 1 70 34 Z',

           sp4(80, 72, 3, '#D9CFFA', 0.85) + sp4(38, 84, 2.4, '#D9CFFA', 0.75);
      for (i = 0; i < 6; i++) {

      }

    return t;

  Y.art.eggSVG = function (rarity, opts) {
    rarity = EGGS[rarity] ? rarity : 'yaygin';
    var P = EGGS[rarity];
    var crack = Math.max(0, Math.min(3, (opts && opts.crack) | 0));
    var uid = 'yv-egg-' + rarity + '-' + (SEQ++);
    var rnd = seeded(hash('egg-' + rarity));
    var defs = [], inner = '', i;

    defs.push(
      '<radialGradient id="' + uid + '-g" cx="0.37" cy="0.27" r="1.02">' +
      '<stop offset="0" stop-color="' + P.lt + '"/>' +
      '<stop offset="1" stop-color="' + P.dk + '"/></radialGradient>');
    defs.push('<clipPath id="' + uid + '-c"><path d="' + EGG_D + '"/></clipPath>');
    defs.push(
      '<filter id="' + uid + '-stk" x="-18%" y="-18%" width="136%" height="136%">' +
      '<feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="yvd"/>' +
      '<feFlood flood-color="#FFFFFF"/>' +
      '<feComposite in2="yvd" operator="in" result="yvh"/>' +
      '<feMerge><feMergeNode in="yvh"/><feMergeNode in="SourceGraphic"/></feMerge></filter>');

    // aura (efsanevi altın / gizli gece moru)
    if (P.aura) {
      defs.push(
        '<radialGradient id="' + uid + '-a" cx="0.5" cy="0.5" r="0.5">' +
        '<stop offset="0" stop-color="' + P.aura + '" stop-opacity="0.55"/>' +
        '<stop offset="0.65" stop-color="' + P.aura + '" stop-opacity="0.24"/>' +
        '<stop offset="1" stop-color="' + P.aura + '" stop-opacity="0"/></radialGradient>');
      inner += E('circle', { cx: 60, cy: 60, r: 58, fill: 'url(#' + uid + '-a)' });
    }

    inner += E('ellipse', { cx: 60, cy: 108, rx: 27, ry: 5, fill: SIL, opacity: 0.15 });

    // --- sticker gövde ---
    var egg = E('path', { d: EGG_D, fill: 'url(#' + uid + '-g)', stroke: INK,
      'stroke-width': LW, 'stroke-linejoin': 'round' });

    var clipped = eggTexture(rarity, P, rnd);

    // üst parlama şeridi + alt yansıma (vinil reçetesi)
    var glossOp = (rarity === 'yaygin') ? 0.38 : (rarity === 'gizli' ? 0.3 : 0.55);
    clipped += E('ellipse', { cx: 46, cy: 34, rx: 7.5, ry: 13.5, fill: '#FFFFFF',
      opacity: glossOp, transform: 'rotate(24 46 34)' });
    clipped += E('circle', { cx: 52, cy: 52, r: 2.6, fill: '#FFFFFF', opacity: glossOp * 0.6 });
    clipped += E('ellipse', { cx: 60, cy: 97, rx: 16, ry: 5.5,
      fill: rarity === 'gizli' ? '#B9A8E8' : '#FFFFFF', opacity: rarity === 'gizli' ? 0.24 : 0.18 });

    // çatlaklar (birikimli); 3. aşamada içten ışık sızar
    if (crack > 0) {
      var cg = '';
      if (crack >= 3) {
        defs.push(
          '<radialGradient id="' + uid + '-b" cx="0.5" cy="0.5" r="0.5">' +
          '<stop offset="0" stop-color="#FFF3B8" stop-opacity="0.95"/>' +
          '<stop offset="1" stop-color="#FFF3B8" stop-opacity="0"/></radialGradient>');
        cg += E('circle', { cx: 58, cy: 54, r: 26, fill: 'url(#' + uid + '-b)' });
        for (i = 0; i < crack; i++) {
          cg += E('path', { d: CRACKS[i], stroke: '#FFEDA8', 'stroke-width': 6.5, fill: 'none',
                 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.8 });
        }
      }
      for (i = 0; i < crack; i++) {
        cg += E('path', { d: CRACKS[i], stroke: '#FFFFFF', 'stroke-width': 4.4, fill: 'none',
               'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.3 });
        cg += E('path', { d: CRACKS[i], stroke: P.crack, 'stroke-width': 2.6, fill: 'none',
               'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.9 });
      }
      clipped += cg;
    }

    egg += E('g', { 'clip-path': 'url(#' + uid + '-c)' }, clipped);
    inner += '<g filter="url(#' + uid + '-stk)">' + egg + '</g>';

    // kabuk çevresinde süzülen ışıltılar (tören/sepette büyük boyda şahane)
    if (rarity === 'efsanevi') {
      inner += sp4(21, 34, 4.6, '#FFD76B', 0.95) + sp4(101, 44, 3.8, '#FFD76B', 0.9) +
               sp4(96, 92, 3, '#FFE9A8', 0.8);
    } else if (rarity === 'gizli') {
      inner += sp4(20, 40, 3.8, '#B9A8E8', 0.9) + sp4(100, 52, 3.2, '#B9A8E8', 0.85) +
               sp4(94, 90, 2.6, '#D9CFFA', 0.8);
    } else if (rarity === 'destansi') {
      inner += sp4(22, 42, 3.2, '#C79EEB', 0.8) + sp4(99, 56, 2.8, '#C79EEB', 0.75);
    }
    if (crack >= 3) {
      inner += sp4(30, 26, 4, '#FFEDA8', 0.95) + sp4(94, 30, 3.4, '#FFEDA8', 0.9);
    }

    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true"><defs>' +
           defs.join('') + '</defs>' + inner + '</svg>';
  };
})();

   SAHNE STİLİSTLERİNİN SÖZLEŞMESİ — window.Yuvo.art.env

   Tüm üreticiler SVG STRING döndürür (innerHTML ile basılır). Her çıktı
   kendi <svg ... aria-hidden="true"> sarmalayıcısını taşır, dış kaynak
   içermez ve 6KB'nin altındadır. Id'ler "ye-" önekiyle her çağrıda
   BENZERSİZ üretilir (aynı üretici aynı sayfada iki kez basılabilir).
   Sanat deterministiktir: aynı üretici her çağrıda aynı kompozisyon.

   ÜRETİCİLER (viewBox / preserveAspectRatio / kullanım):

   sky()        0 0 360 240 / xMidYMax slice
     Gök bandı: dikey #8AD9F7->#CFF0FE gradyan, ufukta #FFE9A8 gün doğumu
     ışıması, sağda ışın taçlı güneş (#FFC734/#F2A400). ALT kenara
     çapalıdır (YMax): dar-yüksek kutuda üstten kırpılır; kritik içerik
     (ufuk + güneş, y>=44) alt bantta durur. Öneri: sahnenin üst yarısı,
     position:absolute; top:0; left:0; width:100%; height:~45%.

   clouds()     0 0 360 120 / xMidYMin slice
     3 tombul bulut (defs'te tek bulut + <use>). Her <use>
     class="env-cloud" taşır -> stilist süzülme animasyonu bağlayabilir
     (öneri: transform-box:fill-box ile yavaş translateX salınımı).
     sky() üzerine AYRI katman olarak, üst kenara hizalı basılır.

   meadow()     0 0 360 200 / xMidYMax slice
     3 katman yuvarlak tepe (#A5E36B / #8ED94F / #55B944) + seeded çiçek
     (#FF8FB0/beyaz taç, #FFC734 merkez) ve çim serpme + beyaz benekler.
     Ekranın alt bandı: position:absolute; left:0; right:0; bottom:0;
     height:~42%. Kritik içerik alt yarıda (YMax güvenli).

   rays(renk)   0 0 240 240 / xMidYMid slice
     Tören huzmeleri: 12 huzme (uzun/kısa dönüşümlü), merkezden dışa
     "renk" %35->0 solar; merkezde renk + beyaz yumuşak parlama.
     "renk" #RRGGBB doğrulanır; geçersizse #FFC734'e düşer. Huzme grubu
     <g class="env-rays"> -> stilist spin verebilir (öneri:
     .env-rays{transform-box:fill-box; transform-origin:center;
     animation:ye-spin 24s linear infinite}). Yumurtanın ARKASINA,
     merkezi (120,120) yumurta merkeziyle çakışacak şekilde konur.

   sparkles()   0 0 360 360 / xMidYMid slice
     12 süzülen ışıltı (#FFE9A8/#FFD76B/beyaz, 4 uçlu yıldız + minik
     daire). Her örnek class="env-sp" ve style="--i:n" taşır ->
     gecikmeli süzülme: .env-sp{animation-delay:calc(var(--i)*.35s)}.
     Tören/kutlama üst katmanı; tam ekran overlay.

   basket()     0 0 240 170 / xMidYMid meet
     Yuva sepeti — TAM sticker reçetesi (BRAND §3): #3E2A1C kontur (lw 4),
     feMorphology beyaz hale, #B77B3F->#8E5A2B şeker-vinil gövde, hasır
     örgü dokusu (<use> ×3 satır), kalın kapsül ağız (rim, y=52..82),
     üst-sol parlama şeridi, iç sert alt gölge bandı, zemin gölge elipsi.
     YUMURTALAR SEPETE DAHİL DEĞİLDİR: sahne yumurtaları ayrı katman
     olarak basar; yumurtalar alt uçları rim bandının (y~52-82) arkasında
     kalacak şekilde sepetin ÜSTÜNE bindirilir — "sepetin içinde" hissi
     böyle kurulur (.home-egg yerleşimi sahne stilistinindir).

   tableWood()  0 0 360 200 / xMidYMid slice
     Atölye masası: --bg2 (#FFE9C4) taban; yalnız marka kahveleri —
     plaka ayrım çizgileri #B77B3F ~%28, damar kıvrımları #8E5A2B
     %12-15 (<use> ×3), 2 budak halkası <=%10, üst kenarda #FFF9EC %35
     ışık bandı. Assembly zemini: inset:0; width/height:100%.

   paper()      0 0 360 360 / xMidYMid slice
     Albüm kâğıdı: --paper (#FFF9EC) taban + %4-5 benek graini (#8A6B4F,
     <use> ×4 döndürme) + köşelerde #FFE9C4 %6 vinyet. Metin arkasında
     güvenli (BRAND §3: doku <=%6). Hafif (~1.4KB).

   flowers()    0 0 360 56 / xMidYMax meet
     Dekoratif kenar çelengi: 4 çiçek (#FF8FB0 / #FFC734 dönüşümlü,
     ince #3E2A1C kontur, beyaz parlamalı merkez) + 3 yaprak çifti
     (#8ED94F) yatay dizi. Albüm başlığı altı / modal üstü süsü;
     height:28-32px önerilir.

   RENK KAYNAĞI: yalnız BRAND.md §1 + §5 hexleri; yeni ton türetilmez.
   Çevre kontur mürekkebi DAİMA #3E2A1C (--line); pufi-svg'nin #4A3653
   INK'i karaktere özeldir, burada KULLANILMAZ. Id alanları: "ye-" bu
   dosyanın, "yv-" pufi-svg'nin, "yi-" ui-icons'undur.
   ===================================================================== */
(function () {
  window.Yuvo = window.Yuvo || { data: {}, art: {}, audio: {}, engine: {}, scenes: {}, test: {} };
  var Y = window.Yuvo;
  Y.art = Y.art || {};

  /* ---------- ortak yardımcılar (pufi-svg desenine paralel, bağımsız kopya) ---------- */

  var LINE = '#3E2A1C';  // çevre kontur mürekkebi (BRAND §1.1)
  var SEQ = 0;           // benzersiz id sayacı — "ye-" öneki bu dosyaya ayrılmıştır

  function N (x) { return Math.round(x * 100) / 100; }

  function E (name, attrs, inner) {
    var s = '<' + name;
    for (var k in attrs) {
      var v = attrs[k];
      if (v === null || v === undefined || v === '') continue;
      s += ' ' + k + '="' + v + '"';
    }
    return (inner === undefined || inner === null) ? s + '/>' : s + '>' + inner + '</' + name + '>';
  }

  function uid (name) { return 'ye-' + name + '-' + (SEQ++); }

  function hash (s) {
    s = String(s);
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function seeded (a) { // mulberry32 — deterministik serpme (her çağrıda aynı sanat)
    a = a >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var HEX_RE = /^#[0-9A-Fa-f]{6}$/;
  function hex (s, fb) { return HEX_RE.test(String(s == null ? '' : s)) ? String(s) : fb; }

  function wrap (vb, par, defs, inner) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb +
           '" preserveAspectRatio="' + par + '" aria-hidden="true">' +
           (defs ? '<defs>' + defs + '</defs>' : '') + inner + '</svg>';
  }

  function use (id, tr, extra) {
    var a = { href: '#' + id, transform: tr || null };
    if (extra) { for (var k in extra) a[k] = extra[k]; }
    return E('use', a);
  }

  function stops (list) {
    var s = '', i;
    for (i = 0; i < list.length; i++) {
      s += '<stop offset="' + list[i][0] + '" stop-color="' + list[i][1] + '"' +
           (list[i][2] != null ? ' stop-opacity="' + list[i][2] + '"' : '') + '/>';
    }
    return s;
  }

  function lin (id, list, x1, y1, x2, y2) {
    return '<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 +
           '" x2="' + x2 + '" y2="' + y2 + '">' + stops(list) + '</linearGradient>';
  }

  function rad (id, list, cx, cy, r) {
    return '<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '">' +
           stops(list) + '</radialGradient>';
  }

  /* ---------- sky: gök bandı + gün doğumu ışıması + ışın taçlı güneş ---------- */

  function sky () {
    var u = uid('sky');
    var gSky = u + '-g', gHz = u + '-h', gSun = u + '-s', ray = u + '-r';
    var SX = 264, SY = 100;
    var defs =
      lin(gSky, [[0, '#8AD9F7'], [1, '#CFF0FE']], 0, 0, 0, 1) +
      rad(gHz, [[0, '#FFE9A8', 0.9], [1, '#FFE9A8', 0]], 0.5, 0.5, 0.5) +
      rad(gSun, [[0, '#FFC734'], [0.68, '#FFC734'], [1, '#F2A400']], 0.38, 0.32, 0.95) +
      E('rect', { id: ray, x: -4, y: -56, width: 8, height: 20, rx: 4, fill: '#FFC734', opacity: 0.85 });
    var i, beams = '';
    for (i = 0; i < 10; i++) beams += use(ray, 'rotate(' + (i * 36) + ')');
    var s =
      E('rect', { x: 0, y: 0, width: 360, height: 240, fill: 'url(#' + gSky + ')' }) +
      E('ellipse', { cx: 180, cy: 236, rx: 240, ry: 80, fill: 'url(#' + gHz + ')' }) +
      E('circle', { cx: SX, cy: SY, r: 46, fill: '#FFE9A8', opacity: 0.35 }) +
      E('g', { transform: 'translate(' + SX + ' ' + SY + ')' }, beams) +
      E('circle', { cx: SX, cy: SY, r: 30, fill: 'url(#' + gSun + ')' }) +
      E('circle', { cx: SX, cy: SY, r: 25, fill: 'none', stroke: '#FFF9EC', 'stroke-width': 2, opacity: 0.45 }) +
      E('ellipse', { cx: SX - 10, cy: SY - 12, rx: 8, ry: 4.6, fill: '#FFFFFF', opacity: 0.75,
        transform: 'rotate(-18 ' + (SX - 10) + ' ' + (SY - 12) + ')' });
    return wrap('0 0 360 240', 'xMidYMax slice', defs, s);
  }

  /* ---------- clouds: defs'te 1 tombul bulut, <use> ×3 ---------- */

  function clouds () {
    var u = uid('clouds'), c = u + '-c';
    var defs = E('g', { id: c },
      E('ellipse', { cx: 0, cy: 8, rx: 34, ry: 10, fill: '#FFFFFF' }) +
      E('circle', { cx: -17, cy: 0, r: 13, fill: '#FFFFFF' }) +
      E('circle', { cx: 1, cy: -7, r: 16, fill: '#FFFFFF' }) +
      E('circle', { cx: 18, cy: 1, r: 11, fill: '#FFFFFF' }) +
      E('ellipse', { cx: 2, cy: 12.5, rx: 26, ry: 5, fill: '#CFF0FE', opacity: 0.8 }));
    var s =
      use(c, 'translate(64 40)', { 'class': 'env-cloud', opacity: 0.95 }) +
      use(c, 'translate(198 26) scale(0.72)', { 'class': 'env-cloud', opacity: 0.85 }) +
      use(c, 'translate(314 48) scale(0.55)', { 'class': 'env-cloud', opacity: 0.7 });
    return wrap('0 0 360 120', 'xMidYMin slice', defs, s);
  }

  /* ---------- meadow: 3 tepe + seeded çiçek/çim serpme ---------- */

  function meadow () {
    var u = uid('meadow'), p = u + '-p', f = u + '-f', g = u + '-g';
    var defs =
      E('ellipse', { id: p, cx: 0, cy: -6, rx: 3.1, ry: 5.4, stroke: LINE, 'stroke-width': 1 }) +
      E('g', { id: f },
        E('path', { d: 'M0 14 Q-1.4 7 0 2', stroke: '#55B944', 'stroke-width': 2.4,
          fill: 'none', 'stroke-linecap': 'round' }) +
        E('path', { d: 'M0 10 Q-6 8.6 -7.6 3.4 Q-2 4.6 0 10 Z', fill: '#55B944' }) +
        use(p) + use(p, 'rotate(72)') + use(p, 'rotate(144)') +
        use(p, 'rotate(216)') + use(p, 'rotate(288)') +
        E('circle', { cx: 0, cy: 0, r: 3, fill: '#FFC734', stroke: LINE, 'stroke-width': 1 })) +
      E('path', { id: g, d: 'M0 0 Q-1.6 -8 -5.4 -11 M0 0 Q0.4 -9 1.4 -13 M0 0 Q2.4 -7 6.2 -10',
        stroke: '#55B944', 'stroke-width': 2.2, fill: 'none', 'stroke-linecap': 'round' });
    var s =
      E('path', { d: 'M0 84 Q48 44 118 60 Q168 71 216 56 Q272 39 322 58 Q344 66 360 62 L360 200 L0 200 Z', fill: '#A5E36B' }) +
      E('path', { d: 'M0 126 Q56 92 136 106 Q206 118 262 102 Q316 88 360 104 L360 200 L0 200 Z', fill: '#8ED94F' }) +
      E('path', { d: 'M0 172 Q72 140 172 154 Q272 168 360 146 L360 200 L0 200 Z', fill: '#55B944' });
    var rnd = seeded(hash('yuvo-meadow')), i, x, y, sc;
    for (i = 0; i < 7; i++) {
      x = N(18 + i * 47 + rnd() * 22);
      y = N(112 + rnd() * 64);
      sc = N(0.75 + rnd() * 0.5);
      s += use(f, 'translate(' + x + ' ' + y + ') scale(' + sc + ')',
               { fill: (i % 2 ? '#FFFFFF' : '#FF8FB0') });
    }
    for (i = 0; i < 5; i++) {
      x = N(32 + i * 66 + rnd() * 28);
      y = N(122 + rnd() * 62);
      s += use(g, 'translate(' + x + ' ' + y + ') scale(' + N(0.8 + rnd() * 0.5) + ')');
    }
    for (i = 0; i < 6; i++) {
      s += E('circle', { cx: N(14 + rnd() * 332), cy: N(98 + rnd() * 88), r: N(1.4 + rnd() * 1.1),
             fill: '#FFFFFF', opacity: 0.55 });
    }
    return wrap('0 0 360 200', 'xMidYMax slice', defs, s);
  }

  /* ---------- rays: tören huzmeleri (renk doğrulamalı) ---------- */

  function rays (renk) {
    var col = hex(renk, '#FFC734');
    var u = uid('rays');
    var gB = u + '-g', gC = u + '-c', gW = u + '-w', bL = u + '-l', bS = u + '-s';
    var defs =
      lin(gB, [[0, col, 0.35], [1, col, 0]], 0, 1, 0, 0) +
      rad(gC, [[0, col, 0.4], [0.6, col, 0.16], [1, col, 0]], 0.5, 0.5, 0.5) +
      rad(gW, [[0, '#FFFFFF', 0.55], [1, '#FFFFFF', 0]], 0.5, 0.5, 0.5) +
      E('path', { id: bL, d: 'M0 -16 L15 -122 L-15 -122 Z', fill: 'url(#' + gB + ')' }) +
      E('path', { id: bS, d: 'M0 -16 L11 -97 L-11 -97 Z', fill: 'url(#' + gB + ')' });
    var i, beams = '';
    for (i = 0; i < 12; i++) beams += use(i % 2 ? bS : bL, 'rotate(' + (i * 30) + ')');
    var s = E('g', { transform: 'translate(120 120)' },
      E('circle', { cx: 0, cy: 0, r: 54, fill: 'url(#' + gC + ')' }) +
      E('g', { 'class': 'env-rays' }, beams) +
      E('circle', { cx: 0, cy: 0, r: 26, fill: 'url(#' + gW + ')' }));
    return wrap('0 0 240 240', 'xMidYMid slice', defs, s);
  }

  /* ---------- sparkles: süzülen ışıltılar ---------- */

  function sparkles () {
    var u = uid('sparkles'), sp = u + '-s', dt = u + '-d';
    var defs =
      E('path', { id: sp, d: 'M0 -10 Q2.2 -2.2 10 0 Q2.2 2.2 0 10 Q-2.2 2.2 -10 0 Q-2.2 -2.2 0 -10 Z' }) +
      E('circle', { id: dt, cx: 0, cy: 0, r: 3 });
    var cols = ['#FFE9A8', '#FFD76B', '#FFFFFF'];
    var rnd = seeded(hash('yuvo-sparkles'));
    var s = '', i, x, y, sc;
    for (i = 0; i < 12; i++) {
      x = N(26 + rnd() * 308);
      y = N(26 + rnd() * 308);
      sc = N(0.5 + rnd() * 0.9);
      s += use(i % 3 === 2 ? dt : sp, 'translate(' + x + ' ' + y + ') scale(' + sc + ')',
               { fill: cols[i % 3], opacity: N(0.6 + rnd() * 0.35), 'class': 'env-sp', style: '--i:' + i });
    }
    return wrap('0 0 360 360', 'xMidYMid slice', defs, s);
  }

  /* ---------- basket: sticker reçeteli hasır yuva sepeti ---------- */

  function basket () {
    var u = uid('basket');
    var halo = u + '-halo', gb = u + '-b', gr = u + '-r', w = u + '-w';
    var defs =
      '<filter id="' + halo + '" x="-14%" y="-14%" width="128%" height="128%">' +
      '<feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>' +
      '<feFlood flood-color="#FFFFFF"/>' +
      '<feComposite in2="d" operator="in" result="h"/>' +
      '<feMerge><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
      lin(gb, [[0, '#B77B3F'], [1, '#8E5A2B']], 0, 0, 0, 1) +
      lin(gr, [[0, '#B77B3F'], [0.55, '#B77B3F'], [1, '#8E5A2B']], 0, 0, 0, 1) +
      E('path', { id: w,
        d: 'M0 0 Q10 9 20 0 Q30 9 40 0 Q50 9 60 0 Q70 9 80 0 Q90 9 100 0 Q110 9 120 0 Q130 9 140 0',
        fill: 'none', stroke: LINE, 'stroke-width': 2.2, opacity: 0.4, 'stroke-linecap': 'round' });
    var body =
      E('path', { d: 'M45 70 Q47 116 60 134 Q72 148 120 148 Q168 148 180 134 Q193 116 195 70 Z',
        fill: 'url(#' + gb + ')', stroke: LINE, 'stroke-width': 4, 'stroke-linejoin': 'round' }) +
      use(w, 'translate(50 88)') +
      use(w, 'translate(54 106) scale(0.95 1)') +
      use(w, 'translate(59 124) scale(0.87 1)') +
      E('ellipse', { cx: 120, cy: 141.5, rx: 50, ry: 4.6, fill: '#8E5A2B', opacity: 0.5 }) +
      E('ellipse', { cx: 74, cy: 88, rx: 15, ry: 5.6, fill: '#FFFFFF', opacity: 0.3,
        transform: 'rotate(-14 74 88)' }) +
      E('rect', { x: 32, y: 52, width: 176, height: 30, rx: 15, fill: 'url(#' + gr + ')',
        stroke: LINE, 'stroke-width': 4 }) +
      E('ellipse', { cx: 66, cy: 61, rx: 23, ry: 5.2, fill: '#FFFFFF', opacity: 0.55,
        transform: 'rotate(-3 66 61)' }) +
      E('circle', { cx: 97, cy: 66, r: 2.6, fill: '#FFFFFF', opacity: 0.4 });
    var s =
      E('ellipse', { cx: 120, cy: 156, rx: 82, ry: 8.5, fill: '#8E5A2B', opacity: 0.18 }) +
      E('g', { filter: 'url(#' + halo + ')' }, body);
    return wrap('0 0 240 170', 'xMidYMid meet', defs, s);
  }

  /* ---------- tableWood: atölye masası (yalnız marka kahveleri) ---------- */

  function tableWood () {
    var u = uid('wood'), g = u + '-g';
    var defs = E('g', { id: g },
      E('path', { d: 'M0 0 Q30 6 62 2 Q96 -3 130 3', fill: 'none', stroke: '#8E5A2B',
        'stroke-width': 2, 'stroke-linecap': 'round', opacity: 0.15 }) +
      E('path', { d: 'M6 12 Q44 17 84 12 Q110 8.6 128 13', fill: 'none', stroke: '#8E5A2B',
        'stroke-width': 1.6, 'stroke-linecap': 'round', opacity: 0.12 }));
    var s =
      E('rect', { x: 0, y: 0, width: 360, height: 200, fill: '#FFE9C4' }) +
      E('path', { d: 'M0 52H360M0 103H360M0 152H360', fill: 'none', stroke: '#B77B3F',
        'stroke-width': 2.5, opacity: 0.28 }) +
      use(g, 'translate(18 22)') +
      use(g, 'translate(146 72) scale(1.15 1)') +
      use(g, 'translate(40 166)') +
      E('ellipse', { cx: 86, cy: 128, rx: 9, ry: 5.6, fill: 'none', stroke: '#8E5A2B',
        'stroke-width': 2, opacity: 0.1 }) +
      E('ellipse', { cx: 86, cy: 128, rx: 3.4, ry: 2, fill: '#8E5A2B', opacity: 0.1 }) +
      E('ellipse', { cx: 272, cy: 28, rx: 8, ry: 5, fill: 'none', stroke: '#8E5A2B',
        'stroke-width': 2, opacity: 0.09 }) +
      E('ellipse', { cx: 272, cy: 28, rx: 3, ry: 1.8, fill: '#8E5A2B', opacity: 0.09 }) +
      E('rect', { x: 0, y: 0, width: 360, height: 16, fill: '#FFF9EC', opacity: 0.35 });
    return wrap('0 0 360 200', 'xMidYMid slice', defs, s);
  }

  /* ---------- paper: albüm kâğıdı (hafif grain + köşe vinyeti) ---------- */

  function paper () {
    var u = uid('paper'), nId = u + '-n';
    var rnd = seeded(hash('yuvo-paper'));
    var d = '', i;
    for (i = 0; i < 14; i++) {
      d += 'M' + N(8 + rnd() * 158) + ' ' + N(8 + rnd() * 158) + 'h.6';
    }
    var defs = E('path', { id: nId, d: d, fill: 'none', stroke: '#8A6B4F',
      'stroke-width': 2.6, 'stroke-linecap': 'round' });
    var s =
      E('rect', { x: 0, y: 0, width: 360, height: 360, fill: '#FFF9EC' }) +
      use(nId, null, { opacity: 0.05 }) +
      use(nId, 'rotate(90 180 180)', { opacity: 0.04 }) +
      use(nId, 'rotate(180 180 180)', { opacity: 0.05 }) +
      use(nId, 'rotate(270 180 180)', { opacity: 0.04 }) +
      E('ellipse', { cx: 0, cy: 0, rx: 150, ry: 120, fill: '#FFE9C4', opacity: 0.06 }) +
      E('ellipse', { cx: 360, cy: 0, rx: 150, ry: 120, fill: '#FFE9C4', opacity: 0.06 }) +
      E('ellipse', { cx: 0, cy: 360, rx: 150, ry: 120, fill: '#FFE9C4', opacity: 0.06 }) +
      E('ellipse', { cx: 360, cy: 360, rx: 150, ry: 120, fill: '#FFE9C4', opacity: 0.06 });
    return wrap('0 0 360 360', 'xMidYMid slice', defs, s);
  }

  /* ---------- flowers: dekoratif kenar çelengi ---------- */

  function flowers () {
    var u = uid('flowers'), p = u + '-p', f = u + '-f', l = u + '-l';
    var defs =
      E('ellipse', { id: p, cx: 0, cy: -6.4, rx: 3.4, ry: 5.6, stroke: LINE, 'stroke-width': 1.2 }) +
      E('g', { id: f },
        use(p) + use(p, 'rotate(72)') + use(p, 'rotate(144)') +
        use(p, 'rotate(216)') + use(p, 'rotate(288)') +
        E('circle', { cx: 0, cy: 0, r: 3.4, fill: '#FFF9EC', stroke: LINE, 'stroke-width': 1.2 }) +

/* == js/audio.js == */
/* Yuvo — audio.js (art-audio ajanı)
   WebAudio sentez, dosyasız. Ses yoksa / başlatılamazsa SESSİZCE çalışır, asla hata fırlatmaz.
   Crack'ler: filtreli noise burst + pitch düşüşü (ASMR). Fanfarlar: pentatonik arpej.
   docs/10: yumuşak zarflar, ses seviyesi sıçraması yok, çan/klakson yok. */
(function () {
  window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  var Y = window.Yuvo;
  Y.audio = Y.audio || {};

  var ctx = null, master = null, noiseBuf = null, failed = false;

  Y.audio.unlock = function () {
    if (failed) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { failed = true; return; }
      if (!ctx) {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.5;
        master.connect(ctx.destination);
        var len = Math.max(1, Math.floor(ctx.sampleRate * 1.2));
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    } catch (e) { ctx = null; master = null; noiseBuf = null; failed = true; }
  };

  /* tek ton: osc + yumuşak zarf; glide ile pitch kayması */
  function tone (t0, dur, f0, o) {
    o = o || {};
    var osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, f0), t0);
    if (o.glide) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.glide), t0 + dur * (o.glideT || 1));
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.16, t0 + (o.att || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }

  /* filtreli noise burst; f0→f1 pitch düşüşü (ASMR çıtırtısı) */
  function burst (t0, dur, o) {
    o = o || {};
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    var f = ctx.createBiquadFilter();
    f.type = o.ftype || 'bandpass';
    f.Q.value = o.q || 1.1;
    f.frequency.setValueAtTime(Math.max(1, o.f0 || 2000), t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.2, t0 + (o.att || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    var maxOff = Math.max(0.01, noiseBuf.duration - dur - 0.05);
    src.start(t0, Math.random() * maxOff, dur + 0.05);
  }

  /* Do-majör pentatonik (C5'ten): sıcak, çocuksu arpej malzemesi */
  var PENT = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];

  var SOUNDS = {
    tap: function (t) {
      tone(t, 0.07, 540, { glide: 470, gain: 0.11 });
    },
    crack1: function (t) {
      burst(t, 0.09, { f0: 2600, f1: 1100, gain: 0.2 });
      tone(t, 0.04, 1700, { type: 'triangle', glide: 1200, gain: 0.06, att: 0.003 });
    },
    crack2: function (t) {
      burst(t, 0.08, { f0: 2200, f1: 900, gain: 0.22 });
      burst(t + 0.07, 0.1, { f0: 1800, f1: 700, gain: 0.19 });
      tone(t, 0.05, 1400, { type: 'triangle', glide: 900, gain: 0.07, att: 0.003 });
    },
    crackBig: function (t) {
      burst(t, 0.12, { f0: 2400, f1: 600, gain: 0.26 });
      burst(t + 0.08, 0.16, { ftype: 'lowpass', f0: 1600, f1: 350, gain: 0.28, q: 0.8 });
      burst(t + 0.18, 0.2, { ftype: 'lowpass', f0: 900, f1: 220, gain: 0.24, q: 0.7 });
      tone(t + 0.05, 0.25, 240, { glide: 130, gain: 0.11 });
    },
    pop: function (t) {
      tone(t, 0.12, 300, { glide: 900, glideT: 0.6, gain: 0.18, att: 0.005 });
      burst(t, 0.03, { f0: 3200, gain: 0.09 });
    },
    chime: function (t) {
      tone(t, 0.6, 880, { gain: 0.11, att: 0.015 });
      tone(t + 0.02, 0.7, 1318.5, { gain: 0.07, att: 0.02 });
    },
    click: function (t) {
      tone(t, 0.035, 900, { type: 'triangle', gain: 0.08, att: 0.002 });
    },
    snap: function (t) { // parça yerine oturdu
      tone(t, 0.05, 620, { type: 'square', glide: 520, gain: 0.1, att: 0.002 });
      burst(t, 0.025, { ftype: 'highpass', f0: 2500, gain: 0.11 });
    },
    fanfare: function (t) { // tier2: kısa pentatonik arpej
      var seq = [PENT[0], PENT[2], PENT[3], PENT[5]];
      for (var i = 0; i < seq.length; i++) {
        tone(t + i * 0.09, 0.32, seq[i], { type: 'triangle', gain: 0.13, att: 0.012 });
      }
      tone(t + 0.32, 0.5, PENT[5], { gain: 0.05, att: 0.02 });
    },
    fanfareBig: function (t) { // tier3: iki oktavlı arpej + akor + parıltı
      var seq = [392.0, PENT[0], PENT[1], PENT[2], PENT[3], PENT[4], PENT[5]];
      for (var i = 0; i < seq.length; i++) {
        tone(t + i * 0.085, 0.3, seq[i], { type: 'triangle', gain: 0.12, att: 0.012 });
      }
      tone(t + 0.62, 0.8, PENT[3], { gain: 0.09, att: 0.02 });
      tone(t + 0.62, 0.8, PENT[5], { gain: 0.07, att: 0.02 });
      tone(t + 0.62, 0.8, 1567.98, { gain: 0.05, att: 0.02 });
      burst(t + 0.6, 0.7, { ftype: 'highpass', f0: 5000, gain: 0.045, att: 0.05, q: 0.7 });
    },
    star: function (t) { // ⭐ kazanımı
      tone(t, 0.16, 1568, { glide: 2093, glideT: 0.7, gain: 0.11, att: 0.006 });
      tone(t + 0.06, 0.18, 2093, { gain: 0.06, att: 0.01 });
    },
    page: function (t) { // albüm sayfası hışırtısı
      burst(t, 0.13, { ftype: 'lowpass', f0: 1000, f1: 300, gain: 0.15, q: 0.5 });
    }
  };

  Y.audio.play = function (name) {
    try {
      if (!ctx || !master || !noiseBuf) return;
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      var fn = SOUNDS[name];
      if (!fn) return;
      fn(ctx.currentTime + 0.01);
    } catch (e) { /* sessiz */ }
  };
})();

/* == js/engine/state.js == */
/* Yuvo — Motor: state, kalıcılık, ekonomi mutasyonları. Sahip: engine ajanı. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.engine = Yuvo.engine || {};

  var STORAGE_KEY = 'yuvo-proto-v1';
  var EXTRA_EGG_COST = 120;
  var EXTRA_EGG_MAX = 2;

  // Kilometre taşları: ownedCount eşiği → { anahtar, Kabuk ödülü }
  var MILESTONES = [
    { at:10, key:'m10', kabuk:15 },
    { at:20, key:'m20', kabuk:30 },
    { at:27, key:'m27', kabuk:60 },
    { at:30, key:'m30', kabuk:100 }
  ];

  function freshSeed () {
    return ((Date.now() ^ (Math.random() * 0xFFFFFFFF)) >>> 0) || 1;
  }

  function defaults () {
    return {
      version: 1,
      stardust: 40, kabuk: 0, day: 1,
      eggsAvailable: 3, extraEggsBought: 0,   // günlük: 3 temel + en çok 2 ek (120⭐/adet)
      eggCounter: 0, pityN: 0, pityD: 0, pityE: 0, copyStreak: 0,
      owned: {},                              // pufiId -> adet
      milestones: [],                         // ör. ['m10','m20','m27','m30']
      weekCrafts: 0, rewardedPlaysToday: 0,
      seed: freshSeed()                       // mulberry32 tohumu (gacha.js kullanır)
    };
  }

  function refresh () { if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (e) {} } }
  function commit () { Yuvo.engine.save(); refresh(); }

  Yuvo.engine.state = defaults();

  Yuvo.engine.load = function () {
    var base = defaults();
    try {
      var raw = window.localStorage && window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        if (saved && typeof saved === 'object') {
          for (var k in base) {
            if (Object.prototype.hasOwnProperty.call(saved, k) && saved[k] !== null && saved[k] !== undefined) {
              base[k] = saved[k];
            }
          }
        }
      }
    } catch (e) { /* bozuk kayıt → temiz başlangıç */ }
    if (!base.owned || typeof base.owned !== 'object') base.owned = {};
    if (!Array.isArray(base.milestones)) base.milestones = [];
    if (!base.seed) base.seed = freshSeed();
    Yuvo.engine.state = base;
    return base;
  };

  Yuvo.engine.save = function () {
    try {
      if (window.localStorage) window.localStorage.setItem(STORAGE_KEY, JSON.stringify(Yuvo.engine.state));
    } catch (e) { /* depolama yoksa sessizce devam */ }
  };

  Yuvo.engine.reset = function (seed) {
    var s = defaults();
    if (seed !== undefined && seed !== null) s.seed = (seed >>> 0) || 1;
    Yuvo.engine.state = s;
    commit();
    return s;
  };

  Yuvo.engine.newDay = function () {
    var s = Yuvo.engine.state;
    s.day += 1;
    s.eggsAvailable = 3;
    s.extraEggsBought = 0;
    s.rewardedPlaysToday = 0;
    if ((s.day - 1) % 7 === 0) s.weekCrafts = 0;  // yeni hafta → Atölye hakkı tazelenir
    commit();
  };

  Yuvo.engine.addStardust = function (n) {
    var s = Yuvo.engine.state;
    s.stardust = Math.max(0, s.stardust + (n | 0));
    commit();
  };

  Yuvo.engine.spendStardust = function (n) {
    var s = Yuvo.engine.state;
    n = n | 0;
    if (n < 0 || s.stardust < n) return false;
    s.stardust -= n;
    commit();
    return true;
  };

  Yuvo.engine.buyExtraEgg = function () {
    var s = Yuvo.engine.state;
    if (s.extraEggsBought >= EXTRA_EGG_MAX) return false;
    if (s.stardust < EXTRA_EGG_COST) return false;
    s.stardust -= EXTRA_EGG_COST;
    s.extraEggsBought += 1;
    s.eggsAvailable += 1;
    commit();
    return true;
  };

  // Gizli HARİÇ sahip olunan farklı parça sayısı (0-30).
  Yuvo.engine.ownedCount = function () {
    var s = Yuvo.engine.state, n = 0;
    for (var id in s.owned) {
      if (!s.owned[id]) continue;
      var p = Yuvo.data.pufiById && Yuvo.data.pufiById(id);
      if (p && p.rarity === 'gizli') continue;
      n += 1;
    }
    return n;
  };

  // Kilometre taşı ödülleri — bir kez, state.milestones ile.
  // Not: burada commit çağrılmaz; yeni parça kazandıran akış (openEgg/craft) zaten commit eder.
  Yuvo.engine.checkMilestones = function () {
    var s = Yuvo.engine.state;
    var count = Yuvo.engine.ownedCount();
    var granted = [];
    for (var i = 0; i < MILESTONES.length; i++) {
      var m = MILESTONES[i];
      if (count >= m.at && s.milestones.indexOf(m.key) === -1) {
        s.milestones.push(m.key);
        s.kabuk += m.kabuk;
        granted.push(m.key);
      }
    }
    return granted;
  };

  // Atölye: Kabuk yeterliyse üret; gizli için ownedCount()==30 şartı.
  Yuvo.engine.craft = function (pufiId) {
    var s = Yuvo.engine.state;
    var pufi = Yuvo.data.pufiById && Yuvo.data.pufiById(pufiId);
    if (!pufi) return { ok:false, reason:'bilinmiyor' };
    if (s.owned[pufiId]) return { ok:false, reason:'sahipli' };
    if (pufi.rarity === 'gizli' && Yuvo.engine.ownedCount() !== 30) {
      return { ok:false, reason:'gizli-kilitli' };
    }
    var cost = (Yuvo.data.RARITIES[pufi.rarity] || {}).uretim || 0;
    if (s.kabuk < cost) return { ok:false, reason:'kabuk-yetersiz' };
    s.kabuk -= cost;
    s.owned[pufiId] = 1;
    s.weekCrafts += 1;
    Yuvo.engine.checkMilestones();
    commit();
    return { ok:true };
  };

  // Test kancaları (motor kısmı) — nesneyi toptan yazma: sahne kancaları korunur.
  Yuvo.test = Yuvo.test || {};
  Yuvo.test.state = function () { return Yuvo.engine.state; };
  Yuvo.test.grantStardust = function (n) { Yuvo.engine.addStardust(n); };
  Yuvo.test.grantEggs = function (n) {
    var s = Yuvo.engine.state;
    s.eggsAvailable += Math.max(0, n | 0);
    commit();
  };
})();

/* Yuvo — Motor: düşüş algoritması (docs/v2/02 §2.2, proto sabitleriyle). Sahip: engine ajanı. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.engine = Yuvo.engine || {};

  // ---------- SABİTLER (Güneş Çayırı onboarding istisnası: E pity 35/50) ----------
  var SOFT_PITY_E = 35;
  var SOFT_ARTIS = 0.06;
  var HARD_PITY_E = 50;
  var PITY_DESTANSI = 40;   // 40 yumurtadır Destansı+ görmediyse
  var PITY_NADIR = 15;      // 15 yumurtadır Nadir+ görmediyse
  var ONBOARDING = 10;      // ilk 10 yumurta: hep eksik; 3.'sü Nadir+ garanti
  var KOPYA_SERI_ESIGI = 6; // 6 ardışık kopya → sıradaki kesin eksik parça
  var W_EKSIK = 4;          // akıllı düşüş: eksik parça ağırlığı
  var W_EKSIK_SON3 = 12;    // ownedCount >= 27 iken eksik ağırlığı

  var TIERS = ['yaygin', 'azbulunur', 'nadir', 'destansi', 'efsanevi', 'gizli'];
  var RANK = { yaygin:0, azbulunur:1, nadir:2, destansi:3, efsanevi:4, gizli:5 };

  // ---------- RNG: mulberry32, tohum state'te kalıcı ----------
  function rand () {
    var s = Yuvo.engine.state;
    s.seed = (s.seed + 0x6D2B79F5) >>> 0;
    var t = s.seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function weightedPick (keys, weights, r) {
    var total = 0, i;
    for (i = 0; i < keys.length; i++) total += weights[i];
    var x = r * total;
    for (i = 0; i < keys.length; i++) {
      x -= weights[i];
      if (x < 0) return keys[i];
    }
    // Kayan-nokta artığı: ağırlığı 0 olan anahtar asla dönmesin — geriye tara
    for (i = keys.length - 1; i >= 0; i--) { if (weights[i] > 0) return keys[i]; }
    return keys[keys.length - 1];
  }

  function poolOf (tier) {
    var out = [], list = Yuvo.data.PUFIS || [];
    for (var i = 0; i < list.length; i++) { if (list[i].rarity === tier) out.push(list[i]); }
    return out;
  }

  function tierEksikVar (s, tier) {
    var havuz = poolOf(tier);
    for (var i = 0; i < havuz.length; i++) { if (!s.owned[havuz[i].id]) return true; }
    return false;
  }

  // ---------- KADEME SEÇİMİ ----------
  function pickTier (s, gizliHavuzda) {
    if (s.pityE >= HARD_PITY_E - 1) return 'efsanevi'; // mutlak tavan

    var base = Yuvo.data.RARITIES;
    var w = {
      yaygin: base.yaygin.oran, azbulunur: base.azbulunur.oran, nadir: base.nadir.oran,
      destansi: base.destansi.oran, efsanevi: base.efsanevi.oran, gizli: base.gizli.oran
    };
    if (!gizliHavuzda) { w.yaygin += w.gizli; w.gizli = 0; } // gizli yalnız 30/30'da havuzda

    if (s.pityE >= SOFT_PITY_E - 1) { // soft pity: Gizli oranına dokunmadan normalize
      w.efsanevi = Math.min(0.95, base.efsanevi.oran + SOFT_ARTIS * (s.pityE - SOFT_PITY_E + 2));
      var rest = 1 - w.efsanevi - w.gizli;
      var restSum = w.yaygin + w.azbulunur + w.nadir + w.destansi;
      if (restSum > 0 && rest > 0) {
        var f = rest / restSum;
        w.yaygin *= f; w.azbulunur *= f; w.nadir *= f; w.destansi *= f;
      } else {
        w.yaygin = Math.max(0, rest); w.azbulunur = 0; w.nadir = 0; w.destansi = 0;
      }
    }

    var tier = weightedPick(TIERS, [w.yaygin, w.azbulunur, w.nadir, w.destansi, w.efsanevi, w.gizli], rand());

    // Taban-yükseltme pity'leri
    if (s.pityD >= PITY_DESTANSI - 1 && RANK[tier] < RANK.destansi) tier = 'destansi';
    else if (s.pityN >= PITY_NADIR - 1 && RANK[tier] < RANK.nadir) tier = 'nadir';
    // Onboarding garantisi: 3. yumurta Nadir+
    if (s.eggCounter === 3 && RANK[tier] < RANK.nadir) tier = 'nadir';
    return tier;
  }

  // ---------- PARÇA SEÇİMİ (akıllı düşüş) ----------
  function pickPufi (s, tier, zorlaEksik) {
    var havuz = poolOf(tier);
    var eksik = [], i;
    for (i = 0; i < havuz.length; i++) { if (!s.owned[havuz[i].id]) eksik.push(havuz[i]); }

    if ((tier === 'efsanevi' || tier === 'gizli') && eksik.length) {
      return eksik[Math.floor(rand() * eksik.length)]; // E/G hep eksik-öncelikli
    }
    if (zorlaEksik && eksik.length) {
      return eksik[Math.floor(rand() * eksik.length)];
    }
    var wEksik = (Yuvo.engine.ownedCount() >= 27) ? W_EKSIK_SON3 : W_EKSIK;
    var weights = [];
    for (i = 0; i < havuz.length; i++) weights.push(s.owned[havuz[i].id] ? 1 : wEksik);
    return weightedPick(havuz, weights, rand());
  }

  // ---------- YUMURTA AÇ ----------
  Yuvo.engine.openEgg = function () {
    var s = Yuvo.engine.state;
    if (!s || s.eggsAvailable <= 0) return { error:'no-egg' };

    s.eggsAvailable -= 1;
    s.eggCounter += 1;

    var zorlaEksik = (s.eggCounter <= ONBOARDING) || (s.copyStreak >= KOPYA_SERI_ESIGI);
    var gizliHavuzda = Yuvo.engine.ownedCount() === 30;

    var tier = pickTier(s, gizliHavuzda);

    // Kesin-eksik garantisi kademeler ARASI da işler: çekilen kademenin havuzu tam
    // sahipliyse, aynı-veya-üstü ranktan eksikli bir kademeye (oranları koruyarak)
    // yükselt. Asla düşürme (pity tavanları bozulmaz); Gizli hariç — docs/v2/02 §2.1.4
    // "Pity YOK (bilinçli)", zorlama onu fiilen pity'ye çevirirdi.
    if (zorlaEksik && !tierEksikVar(s, tier)) {
      var adaylar = [], aw = [], ti;
      for (ti = 0; ti < TIERS.length; ti++) {
        var t2 = TIERS[ti];
        if (t2 === 'gizli' || RANK[t2] < RANK[tier]) continue;
        if (!tierEksikVar(s, t2)) continue;
        adaylar.push(t2); aw.push((Yuvo.data.RARITIES[t2] || {}).oran || 0);
      }
      if (adaylar.length === 1) tier = adaylar[0];
      else if (adaylar.length > 1) tier = weightedPick(adaylar, aw, rand());
      // adaylar boşsa kopya kaçınılmaz (ör. tek Efsanevi zaten sahipli) — olduğu gibi bırak
    }

    var pufi = pickPufi(s, tier, zorlaEksik);
    var rarity = pufi.rarity; // = tier

    var isNew, kabukGained = 0;
    if (s.owned[pufi.id]) {
      isNew = false;
      s.owned[pufi.id] += 1;
      kabukGained = (Yuvo.data.RARITIES[rarity] || {}).kabuk || 0;
      s.kabuk += kabukGained;
      s.copyStreak += 1;
    } else {
      isNew = true;
      s.owned[pufi.id] = 1;
      s.copyStreak = 0;
      if (Yuvo.engine.checkMilestones) Yuvo.engine.checkMilestones();
    }

    // Sayaçlar — asla süreyle/paketle sıfırlanmaz, yalnız düşüşle
    var r = RANK[rarity];
    s.pityN = (r >= RANK.nadir) ? 0 : s.pityN + 1;
    s.pityD = (r >= RANK.destansi) ? 0 : s.pityD + 1;
    s.pityE = (r >= RANK.efsanevi) ? 0 : s.pityE + 1;

    Yuvo.engine.save();
    if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (e) {} }

    var celebrationTier = (r >= RANK.efsanevi) ? 3 : (rarity === 'destansi') ? 2 : (rarity === 'nadir') ? 1 : 0;
    return { pufi:pufi, rarity:rarity, isNew:isNew, kabukGained:kabukGained, celebrationTier:celebrationTier };
  };

  // Test kancası (motor kısmı)
  Yuvo.test = Yuvo.test || {};
  Yuvo.test.openEggRaw = function () { return Yuvo.engine.openEgg(); };
})();

  /* ---------- etkileşim (delege tek dinleyici) ---------- */
  function handleClick (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');

    if (act === 'egg') {
      play('tap');
      if (Yuvo.go) Yuvo.go('ceremony');
    } else if (act === 'album') {
      play('page');
      if (Yuvo.go) Yuvo.go('album');
    } else if (act === 'pufi') {
      play('pop');
      var body = b.querySelector('.home-roamer-body');
      if (body) {
        body.classList.remove('jump');
        void body.offsetWidth; // animasyonu baştan başlat
        body.classList.add('jump');
        later(function () { body.classList.remove('jump'); }, 700);
      }
    } else if (act === 'extra') {
      var ok = !!(Yuvo.engine && Yuvo.engine.buyExtraEgg && Yuvo.engine.buyExtraEgg());
      if (ok) {
        play('star');
        toast('🥚 Ek yumurta yuvaya kondu!');
      } else {
        var s = st();
        if ((s.extraEggsBought | 0) >= 2) toast('Bugünlük ek yumurta hakkı doldu.');
        else toast('⭐ yetersiz — 120⭐ gerekiyor.');
      }
      render();
    } else if (act === 'endday') {
      play('chime');
      if (Yuvo.engine && Yuvo.engine.newDay) Yuvo.engine.newDay();
      toast('🌞 Yeni gün! 3 taze yumurta yuvada.');
      render();
    }
  }

  /* ---------- sahne API ---------- */
  Yuvo.scenes.home = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'home-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      onState = function () { render(); };
      document.addEventListener('yuvo:state', onState);
      render();
    },
    unmount: function () {
      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];
      if (onState) { document.removeEventListener('yuvo:state', onState); onState = null; }
      if (el) {
        el.removeEventListener('click', handleClick);
        if (el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
    }
  };
})();

/* Yuvo — Sahne: Eşle & Bul mini oyunu (6 kart, 3 çift; süre yok, kaybetme yok).
   Sahip: scenes-meta ajanı. Sözleşme: ARCHITECTURE.md — buildDeck/onCardTap/finish/start
   akışı DEĞİŞMEDİ, yalnız markup stringleri.
   Görsel dil: BRAND.md §5 — kart sırtı markalı (şeker gradyan + beyaz Yuvo yumurta
   amblemi + %5 benek), eşleşme çayır-yeşili onay parıltısı. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.scenes = Yuvo.scenes || {};

  var el = null;
  var timers = [];
  var deck = [];        // [{ fid, svg, open, matched }]
  var flippedIdx = [];  // açık bekleyen kart indeksleri (en çok 2)
  var matchedPairs = 0;
  var attempts = 0;     // çift deneme sayısı
  var lock = false;
  var finished = false;

  /* ---------- yardımcılar (savunmacı) ---------- */
  function st () { return (Yuvo.engine && Yuvo.engine.state) || {}; }
  function play (n) { try { if (Yuvo.audio && Yuvo.audio.play) Yuvo.audio.play(n); } catch (e) {} }
  function later (fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }

  // Yuvo.icons güvenli erişim (main.js ico() deseni): ikon yoksa emoji fallback
  function ico (name, fb) {
    try {
      if (Yuvo.icons && Yuvo.icons[name]) { var s = Yuvo.icons[name](); if (s) return s; }
    } catch (e) {}
    return '<span class="ico-fallback">' + fb + '</span>';
  }
  function ic (name, fb, cls) {
    return '<span class="ys-ico' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' +
           ico(name, fb) + '</span>';
  }

  // Dolu yıldız = marka ikonu; boş yıldız = düz dolgulu soluk yıldız (id'siz)
  function starPipSVG (on) {
    if (on) return ico('star', '⭐');
    return '<svg viewBox="0 0 28 28" aria-hidden="true" focusable="false">' +
      '<path d="M14 3.4L17.5 10.2L25 11.4L19.6 16.8L20.8 24.4L14 20.9L7.2 24.4' +
        'L8.4 16.8L3 11.4L10.5 10.2Z" fill="#FFF3D6" stroke="#3E2A1C" stroke-width="2"' +
        ' stroke-linejoin="round" opacity=".5"/>' +
    '</svg>';
  }

  // Düz dolgulu mini çiçek (id'siz) — başlık arması
  function bloomSVG () {
    return '<svg viewBox="0 0 28 28" aria-hidden="true" focusable="false">' +
      '<g stroke="#3E2A1C" stroke-width="1.8" stroke-linejoin="round">' +
        '<circle cx="14" cy="6.6" r="4" fill="#FF8FB0"/>' +
        '<circle cx="21" cy="11.8" r="4" fill="#FF8FB0"/>' +
        '<circle cx="18.4" cy="20" r="4" fill="#FF8FB0"/>' +
        '<circle cx="9.6" cy="20" r="4" fill="#FF8FB0"/>' +
        '<circle cx="7" cy="11.8" r="4" fill="#FF8FB0"/>' +
        '<circle cx="14" cy="13.8" r="4.4" fill="#FFC734"/>' +
      '</g>' +
      '<ellipse cx="12.4" cy="12.2" rx="1.5" ry="1" fill="#FFFFFF" opacity=".75"/>' +
    '</svg>';
  }

  // Düz dolgulu mini ay (id'siz) — "Pufiler dinleniyor" notu
  function moonSVG () {
    return '<svg viewBox="0 0 28 28" aria-hidden="true" focusable="false">' +
      '<path d="M18.6 3.9a11 11 0 1 0 5.6 16.6 9.1 9.1 0 0 1-5.6-16.6Z" fill="#FFC734"' +
        ' stroke="#3E2A1C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<ellipse cx="11.6" cy="9" rx="2.1" ry="1.3" transform="rotate(-22 11.6 9)"' +
        ' fill="#FFFFFF" opacity=".75"/>' +
    '</svg>';

  // Düz dolgulu döngü-ok (id'siz) — "Tekrar" butonu (turuncu zeminde beyaz glif)
  function replaySVG () {

      '<path d="M14 5.2a8.8 8.8 0 1 1-8.3 5.9" fill="none" stroke="#FFFFFF"' +

      '<path d="M5 4.2l.5 7 6.8-1Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.4"' +
        ' stroke-linejoin="round"/>' +
    '</svg>';
  }

  // Kart sırtı amblemi: çatlak çizgili beyaz Yuvo yumurtası (id'siz düz dolgu)
  function emblemSVG () {
    return '<svg class="mg-emblem" viewBox="0 0 96 108" aria-hidden="true" focusable="false">' +
      '<path d="M48 6C29.4 6 15 27.6 15 50.4 15 71 28.9 86 48 86s33-15 33-35.6' +
        'C81 27.6 66.6 6 48 6Z" fill="#FFFFFF" stroke="#3E2A1C" stroke-width="4"' +
        ' stroke-linejoin="round" opacity=".97"/>' +
      '<path d="M27 46l6.8 5.6 6.5-6.2 6.8 5.9 6.5-5.6 6.8 5.4 7-4.8" fill="none"' +
        ' stroke="#E85C1E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<ellipse cx="35" cy="24" rx="7" ry="10" transform="rotate(-20 35 24)"' +
        ' fill="#FFEBD0" opacity=".9"/>' +
      '<ellipse cx="48" cy="78" rx="16" ry="4" fill="#FFE3C2" opacity=".8"/>' +
    '</svg>';
  }

  function shuffle (a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pufiFace (p) {
    if (Yuvo.art && Yuvo.art.pufiSVG) {
      try { var s = Yuvo.art.pufiSVG(p, { mood:'happy' }); if (s) return s; } catch (e) {}
    }
    return '<span class="mg-art-fallback">🐣</span>';
  }
  function eggFace (r) {
    if (Yuvo.art && Yuvo.art.eggSVG) {
      try { var s = Yuvo.art.eggSVG(r, { crack:0 }); if (s) return s; } catch (e) {}
    }
    return '<span class="mg-art-fallback">🥚</span>';
  }

  /* ---------- deste kurulumu ---------- */
  function buildDeck () {
    var s = st(), owned = s.owned || {}, ids = [];
    for (var id in owned) { if (owned[id]) ids.push(id); }
    shuffle(ids);

    var faces = [];
    for (var i = 0; i < ids.length && faces.length < 3; i++) {
      var p = Yuvo.data && Yuvo.data.pufiById && Yuvo.data.pufiById(ids[i]);
      if (p) faces.push({ fid:'pufi-' + p.id, gen:(function (pp) { return function () { return pufiFace(pp); }; })(p) });
    }
    // Sahip olunan Pufi azsa: yumurta desenleriyle tamamla
    var eggR = shuffle(['nadir', 'destansi', 'azbulunur', 'efsanevi', 'yaygin']);
    var k = 0;
    while (faces.length < 3 && k < eggR.length) {
      faces.push({ fid:'egg-' + eggR[k], gen:(function (rr) { return function () { return eggFace(rr); }; })(eggR[k]) });
      k += 1;
    }

    deck = [];
    for (var f = 0; f < faces.length; f++) {
      // Çiftin her kartı için sanat AYRI üretilir — SEQ sayacı yeni gradient id verir
      // (aynı svg stringini iki kez basmak belgede yinelenen id üretiyordu)
      deck.push({ fid:faces[f].fid, svg:faces[f].gen(), open:false, matched:false });
      deck.push({ fid:faces[f].fid, svg:faces[f].gen(), open:false, matched:false });
    }
    shuffle(deck);
  }

  /* ---------- çizim ---------- */
  function render () {
    if (!el) return;
    var s = st();
    var plays = Math.min(5, s.rewardedPlaysToday | 0);
    var left = 5 - plays;
    // Kalan ödüllü hak: dolu/boş mini yıldız SVG dizisi (okuma öncesi yaş)
    var hak = '';
    for (var h = 0; h < 5; h++) {
      hak += '<span class="ys-ico">' + starPipSVG(h < left) + '</span>';
    }
    var html = '';
    html += '<div class="mg-head center">' +
              '<h2 class="mg-title"><span class="ys-ico mg-title-ico" aria-hidden="true">' +
                bloomSVG() + '</span>Eşini Bul</h2>' +
              '<p class="mg-sub">Aynı iki dostu bul!</p>' +
              '<div class="mg-lives" aria-label="Bugün ödüllü oyun hakkı: ' + left + '/5">' +
                hak + '</div>' +
            '</div>';
    html += '<div class="mg-board"><div class="mg-grid">';
    for (var i = 0; i < deck.length; i++) {
      var c = deck[i];
      html += '<button class="mg-card' + (c.open || c.matched ? ' flipped' : '') +
                (c.matched ? ' matched' : '') + '" data-idx="' + i + '" aria-label="Kart ' + (i + 1) + '">' +
                '<span class="mg-inner">' +
                  '<span class="mg-face mg-front" aria-hidden="true">' + emblemSVG() + '</span>' +
                  '<span class="mg-face mg-back">' + c.svg + '</span>' +
                '</span>' +
              '</button>';
