    html += '</div></div>';
    el.innerHTML = html;
  }

  function cardEl (idx) {
    return el ? el.querySelector('.mg-card[data-idx="' + idx + '"]') : null;
  }

  /* ---------- oyun akışı ---------- */
  function onCardTap (btn) {
    if (lock || finished) return;
    var idx = parseInt(btn.getAttribute('data-idx'), 10);
    var c = deck[idx];
    if (!c || c.open || c.matched) return;

    c.open = true;
    btn.classList.add('flipped');
    play('tap');
    flippedIdx.push(idx);
    if (flippedIdx.length < 2) return;

    attempts += 1;
    lock = true;
    var ia = flippedIdx[0], ib = flippedIdx[1];
    var a = deck[ia], b = deck[ib];

    if (a.fid === b.fid) {
      later(function () {
        a.matched = true; b.matched = true;
        a.open = false; b.open = false;
        var ea = cardEl(ia), eb = cardEl(ib);
        if (ea) ea.classList.add('matched');
        if (eb) eb.classList.add('matched');
        play('chime');
        matchedPairs += 1;
        flippedIdx = [];
        lock = false;
        if (matchedPairs >= 3) later(finish, 650);
      }, 380);
    } else {
      later(function () {
        a.open = false; b.open = false;
        var ea = cardEl(ia), eb = cardEl(ib);
        if (ea) ea.classList.remove('flipped');
        if (eb) eb.classList.remove('flipped');
        flippedIdx = [];
        lock = false;
      }, 900);
    }
  }

  function finish () {
    if (finished || !el) return;
    finished = true;

    var stars = attempts <= 4 ? 3 : (attempts <= 6 ? 2 : 1);
    var s = st();
    var rested = (s.rewardedPlaysToday | 0) >= 5;
    var reward = rested ? 5 : (stars === 3 ? 40 : (stars === 2 ? 30 : 20));

    if (!rested) s.rewardedPlaysToday = (s.rewardedPlaysToday | 0) + 1;
    if (Yuvo.engine && Yuvo.engine.addStardust) {
      Yuvo.engine.addStardust(reward); // save + refresh motor tarafında
    } else {
      s.stardust = (s.stardust | 0) + reward;
      if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (e) {} }
    }
    play(stars === 3 ? 'fanfare' : 'star');

    var starsHtml = '';
    for (var i = 0; i < 3; i++) {
      starsHtml += '<span class="mg-star' + (i < stars ? ' on' : '') + '" style="--d:' + (i * 0.18) + 's"' +
                     ' aria-hidden="true">' + starPipSVG(i < stars) + '</span>';
    }
    var panel = document.createElement('div');
    panel.className = 'mg-result';
    panel.innerHTML =
      '<div class="mg-result-card center">' +
        '<div class="mg-stars" role="img" aria-label="' + stars + ' yıldız kazandın">' +
          starsHtml + '</div>' +
        '<h3 class="mg-result-title">' +
          (stars === 3 ? 'Muhteşem hafıza!' : (stars === 2 ? 'Çok iyi!' : 'Aferin sana!')) +
        '</h3>' +
        (rested
          ? '<p class="mg-note"><span class="ys-ico" aria-hidden="true">' + moonSVG() +
              '</span><span>Pufiler dinleniyor — yarın yine oynayalım!</span></p>'

        '<p class="mg-reward">' + ic('star', '⭐') + '<b>+' + reward + '</b></p>' +
        '<div class="mg-btns stack">' +
          '<button class="btn btn-primary" data-mg="again">' +
            '<span class="ys-ico" aria-hidden="true">' + replaySVG() + '</span>Tekrar</button>' +
          '<button class="btn btn-soft" data-mg="home">' + ic('yuva', '🏡') + 'Yuvaya Dön</button>' +
        '</div>' +
      '</div>';

  }

  function start () {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);

    flippedIdx = [];
    matchedPairs = 0;
    attempts = 0;
    lock = false;
    finished = false;
    buildDeck();
    render();
  }

  /* ---------- etkileşim ---------- */
  function handleClick (e) {
    var t = e.target;
    var card = t && t.closest ? t.closest('.mg-card') : null;
    if (card) { onCardTap(card); return; }
    var b = t && t.closest ? t.closest('[data-mg]') : null;
    if (!b) return;
    var act = b.getAttribute('data-mg');
    if (act === 'again') {
      play('click');
      start();
    } else if (act === 'home') {
      play('click');
      if (Yuvo.go) Yuvo.go('home');
    }
  }

  /* ---------- sahne API ---------- */
  Yuvo.scenes.minigame = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'mg-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      start();
    },
    unmount: function () {
      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];
      flippedIdx = [];
      deck = [];
      lock = false;
      finished = false;
      if (el) {
        el.removeEventListener('click', handleClick);
        if (el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
    }
  };
})();

/* == js/scenes/album.js == */
/* Yuvo — Sahne: Albüm ("Güneş Çayırı" hikâye kitabı sayfası: 30 hücre + gizli,
   kilometre taşları, Atölye). Sahip: scenes-meta ajanı. Sözleşme: ARCHITECTURE.md —
   claimMilestones/openDetail/doCraft/handleClick mantığı DEĞİŞMEDİ, yalnız markup.
   Görsel dil: BRAND.md §3 sticker reçetesi + §5 Albüm atmosferi. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.scenes = Yuvo.scenes || {};

  var el = null;
  var timers = [];
  var onState = null;

  // Kilometre taşları — state.js'tekiyle aynı tablo (görsel amaçlı kopya)
  var MILES = [
    { at:10, key:'m10', odul:15 },
    { at:20, key:'m20', odul:30 },
    { at:27, key:'m27', odul:60 },
    { at:30, key:'m30', odul:100 }
  ];

  /* ---------- yardımcılar (savunmacı) ---------- */
  function st () { return (Yuvo.engine && Yuvo.engine.state) || {}; }
  function play (n) { try { if (Yuvo.audio && Yuvo.audio.play) Yuvo.audio.play(n); } catch (e) {} }
  function toast (t) { if (Yuvo.toast) Yuvo.toast(t); }
  function later (fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }

  // Yuvo.icons güvenli erişim (main.js ico() deseni): ikon yoksa emoji fallback
  function ico (name, fb) {
    try {
      if (Yuvo.icons && Yuvo.icons[name]) { var s = Yuvo.icons[name](); if (s) return s; }
    } catch (e) {}
    return '<span class="ico-fallback">' + fb + '</span>';
  }
  function ic (name, fb, cls) {
    return '<span class="ys-ico' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' +
           ico(name, fb) + '</span>';
  }

  // Düz dolgulu mini ay (id'siz) — gizli şerit süsü
  function moonSVG () {
    return '<svg viewBox="0 0 28 28" aria-hidden="true" focusable="false">' +
      '<path d="M18.6 3.9a11 11 0 1 0 5.6 16.6 9.1 9.1 0 0 1-5.6-16.6Z" fill="#FFC734"' +
        ' stroke="#3E2A1C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<ellipse cx="11.6" cy="9" rx="2.1" ry="1.3" transform="rotate(-22 11.6 9)"' +
        ' fill="#FFFFFF" opacity=".75"/>' +
    '</svg>';
  }

  // Düz dolgulu yıldız patlaması (id'siz) — üretim töreni kıvılcımı
  function sparkSVG () {
    return '<svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">' +
      '<path d="M24 4l4.2 9.8L38 18l-9.8 4.2L24 32l-4.2-9.8L10 18l9.8-4.2Z" fill="#FFC734"' +
        ' stroke="#3E2A1C" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<circle cx="38.5" cy="9.5" r="3" fill="#FF8FB0" stroke="#3E2A1C" stroke-width="1.6"/>' +
      '<circle cx="9.5" cy="34.5" r="2.4" fill="#8AD9F7" stroke="#3E2A1C" stroke-width="1.6"/>' +
    '</svg>';
  }

  function pufiList () { return (Yuvo.data && Yuvo.data.PUFIS) || []; }
  function byId (id) { return (Yuvo.data && Yuvo.data.pufiById && Yuvo.data.pufiById(id)) || null; }
  function rarInfo (r) {
    return (Yuvo.data && Yuvo.data.RARITIES && Yuvo.data.RARITIES[r]) ||
           { ad:r || '?', renk:'#9AA5B1', uretim:0, kabuk:0 };
  }

  function ownedCount () {
    if (Yuvo.engine && Yuvo.engine.ownedCount) { try { return Yuvo.engine.ownedCount(); } catch (e) {} }
    var s = st(), n = 0, owned = s.owned || {};
    for (var id in owned) {
      if (!owned[id]) continue;
      var p = byId(id);
      if (p && p.rarity === 'gizli') continue;
      n += 1;
    }
    return n;
  }

  function miniArt (p) {
    if (Yuvo.art && Yuvo.art.pufiSVG) {
      try { var s = Yuvo.art.pufiSVG(p, { mood:'happy' }); if (s) return s; } catch (e) {}
    }
    return '<span class="alb-art-fallback">🐣</span>';
  }
  function silArt (p) {
    if (Yuvo.art && Yuvo.art.pufiSilhouetteSVG) {
      try { var s = Yuvo.art.pufiSilhouetteSVG(p); if (s) return s; } catch (e) {}
    }
    return '<span class="alb-art-fallback dim">🐾</span>';
  }
  function toyArt (p) {
    if (Yuvo.art && Yuvo.art.toyAssembledSVG) {
      try { var s = Yuvo.art.toyAssembledSVG(p); if (s) return s; } catch (e) {}
    }
    return miniArt(p);
  }

  /* ---------- çizim ---------- */
  function render () {
    if (!el) return;
    var s = st();
    var owned = ownedCount();
    var pct = Math.max(0, Math.min(100, Math.round(owned / 30 * 100)));
    var ownedMap = s.owned || {};
    var miles = s.milestones || [];
    var html = '';

    // Hikâye kitabı sayfası: kâğıt dokulu sarmalayıcı (mevcut sınıflar içinde aynen)
    html += '<div class="alb-page">';

    // Üst bilgi: kurdele/arma başlık + Kabuk bakiyesi
    html += '<div class="alb-head">' +
              '<span class="alb-ribbon">' +
                '<span class="alb-ribbon-ico" aria-hidden="true">' + ico('album', '📔') + '</span>' +
                '<h2 class="alb-title">Güneş Çayırı</h2>' +
              '</span>' +
              '<span class="alb-shell" aria-label="Kabuk bakiyesi">' +
                ic('shell', '🐚') + '<b>' + (s.kabuk | 0) + '</b>' +
              '</span>' +
            '</div>';
    html += '<div class="alb-progress">' +
              '<span class="alb-progress-num"><b>' + owned + '</b>/30</span>' +
              '<span class="alb-progress-bar">' +
                '<span class="alb-progress-fill" style="width:' + pct + '%"></span>' +
              '</span>' +
            '</div>';

    // Kilometre taşı çipleri — ödül satırı Kabuk ikonlu
    html += '<div class="alb-chips">';
    for (var m = 0; m < MILES.length; m++) {
      var mi = MILES[m];
      var claimed = miles.indexOf(mi.key) !== -1;
      var ready = !claimed && owned >= mi.at;
      var cls = claimed ? 'done' : (ready ? 'ready' : 'locked');
      html += '<button class="alb-chip ' + cls + '" data-act="mile" data-key="' + mi.key + '">' +
                '<b>' + mi.at + '</b>' +
                (claimed
                  ? '<small>' + ic('check', '✓') + 'alındı</small>'
                  : '<small>+' + mi.odul + ' ' + ic('shell', '🐚') + '</small>') +
              '</button>';
    }
    html += '</div>';

    // 30 hücrelik ızgara (gizli hariç, PUFIS sırasıyla)
    html += '<div class="alb-grid">';
    var list = pufiList();
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (p.rarity === 'gizli') continue;
      var n = ownedMap[p.id] | 0;
      if (n > 0) {
        html += '<button class="alb-cell rf rf-' + p.rarity + '" data-act="cell" data-id="' + p.id + '"' +
                  ' aria-label="' + p.ad + '">' +
                  miniArt(p) +
                  (n > 1 ? '<span class="alb-copy">×' + n + '</span>' : '') +
                '</button>';
      } else {
        html += '<button class="alb-cell missing rf rf-' + p.rarity + '" data-act="cell" data-id="' + p.id + '"' +
                  ' aria-label="Bilinmeyen Pufi">' +
                  silArt(p) +
                  '<span class="alb-q">?</span>' +
                '</button>';
      }
    }
    html += '</div>';

    // Ayrık gizli hücre — pastel gece adası (yıldız benekleri CSS'te, ay süsü burada)
    var gizli = null;
    for (var g = 0; g < list.length; g++) { if (list[g].rarity === 'gizli') { gizli = list[g]; break; } }
    if (gizli) {
      var gn = ownedMap[gizli.id] | 0;
      html += '<div class="alb-secret-row">' +
                '<span class="alb-secret-moon" aria-hidden="true">' + moonSVG() + '</span>' +
                '<button class="alb-cell alb-secret rf rf-gizli' + (gn > 0 ? '' : ' missing') + '"' +
                  ' data-act="cell" data-id="' + gizli.id + '" aria-label="Gizli Pufi">' +
                  (gn > 0 ? miniArt(gizli) + (gn > 1 ? '<span class="alb-copy">×' + gn + '</span>' : '')
                          : '<span class="alb-q big">???</span>') +
                '</button>' +
                '<span class="alb-secret-label">' +
                  (gn > 0 ? gizli.ad + ' aramıza katıldı!' : 'Çayırda bir sır fısıldanıyor…') +
                '</span>' +
              '</div>';
    }

    html += '</div>'; // .alb-page

    el.innerHTML = html;
  }

  /* ---------- kilometre taşı ödülü ---------- */
  function claimMilestones () {
    var s = st();
    var owned = ownedCount();
    var miles = s.milestones = s.milestones || [];
    var total = 0, i;

    if (Yuvo.engine && Yuvo.engine.checkMilestones) {
      var granted = [];
      try { granted = Yuvo.engine.checkMilestones() || []; } catch (e) { granted = []; }
      for (i = 0; i < MILES.length; i++) {
        if (granted.indexOf(MILES[i].key) !== -1) total += MILES[i].odul;
      }
      if (granted.length) {
        if (Yuvo.engine.save) { try { Yuvo.engine.save(); } catch (e2) {} }
        if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (e3) {} }
      }
    } else {
      // Motor yoksa yerel yedek: bir kez ver
      for (i = 0; i < MILES.length; i++) {
        var mi = MILES[i];
        if (owned >= mi.at && miles.indexOf(mi.key) === -1) {
          miles.push(mi.key);
          s.kabuk = (s.kabuk | 0) + mi.odul;
          total += mi.odul;
        }
      }
      if (total > 0 && Yuvo.refresh) { try { Yuvo.refresh(); } catch (e4) {} }
    }

    if (total > 0) {
      play('star');
      toast('🐚 +' + total + ' Kabuk! Kilometre taşı ödülün.');
    }
    render();
  }

  /* ---------- detay modalı / Atölye ---------- */
  function openDetail (id) {
    var p = byId(id);
    if (!p) return;
    var s = st();
    var n = (s.owned || {})[id] | 0;
    var ri = rarInfo(p.rarity);

    if (n > 0) {
      // Sahipli: ad + nadirlik + bio + birleşmiş oyuncak
      play('pop');
      var htmlOwned =
        '<div class="alb-modal center">' +
          '<div class="alb-modal-art rf rf-' + p.rarity + '">' + toyArt(p) + '</div>' +
          '<h3 class="alb-modal-name">' + p.ad + '</h3>' +
          '<p class="alb-modal-tur">' + p.tur + '</p>' +
          '<p class="alb-modal-tags">' +
            '<span class="rarity-tag" style="background:' + ri.renk + '33;border-color:' + ri.renk + '">' +
              (ri.simge ? ri.simge + ' ' : '') + ri.ad + '</span>' +
            (n > 1 ? ' <span class="alb-copy-tag">×' + n + ' kopya</span>' : '') +
          '</p>' +
          '<p class="alb-bio">“' + p.bio + '”</p>' +
        '</div>';
      if (Yuvo.modal) Yuvo.modal(htmlOwned);
      return;
    }

    // Eksik: Atölye
    play('click');
    var cost = ri.uretim | 0;
    var wallet = s.kabuk | 0;
    var gizliLocked = (p.rarity === 'gizli') && ownedCount() < 30;
    var enough = wallet >= cost;
    var body =
      '<div class="alb-modal center">' +
        '<div class="alb-modal-art rf rf-' + p.rarity + ' missing">' +
          (p.rarity === 'gizli' && gizliLocked ? '<span class="alb-q big">???</span>' : silArt(p)) +
        '</div>' +
        '<h3 class="alb-modal-name">???</h3>' +
        '<p class="alb-modal-tags"><span class="rarity-tag" style="background:' + ri.renk + '33;border-color:' + ri.renk + '">' +
          (ri.simge ? ri.simge + ' ' : '') + ri.ad + '</span></p>' +
        '<div class="alb-workshop">' +
          '<p class="alb-workshop-note">' + ic('shell', '🐚') +
            '<span><b>Usta Kabuk</b> atölyesinde bu dostun oyuncağını üretebilir.</span></p>' +
          '<p class="alb-cost">' +
            '<span class="alb-cost-item">Maliyet <b>' + cost + '</b>' + ic('shell', '🐚') + '</span>' +
            '<span class="alb-cost-item">Cüzdanın <b>' + wallet + '</b>' + ic('shell', '🐚') + '</span>' +
          '</p>';
    if (gizliLocked) {
      body += '<p class="alb-locked">Usta Kabuk fısıldar: “Önce 30 dostu yuvaya getir…” (' +
                ownedCount() + '/30)</p>';
    } else {
      body += '<button class="btn btn-primary alb-craft-btn" id="alb-craft-btn"' + (enough ? '' : ' disabled') + '>' +
                ic('shell', '🐢') + 'Usta Kabuk\'a Ürettir</button>';
      if (!enough) body += '<p class="alb-locked">Kabuk yetersiz — kopyalar Kabuk kazandırır!</p>';
    }
    body += '</div></div>';

    var close = Yuvo.modal ? Yuvo.modal(body) : function () {};
    var btn = document.getElementById('alb-craft-btn');
    if (btn) {
      btn.addEventListener('click', function () { doCraft(p, close); });
    }
  }

  function doCraft (p, close) {
    var r = (Yuvo.engine && Yuvo.engine.craft) ? Yuvo.engine.craft(p.id) : { ok:false, reason:'motor-yok' };
    if (r && r.ok) {
      play('fanfare');
      // Minik üretim töreni: modal içinde parıltı + oyuncak
      var box = document.querySelector('#overlay-root .modal');
      if (box) {
        box.innerHTML =
          '<div class="alb-craft-anim center">' +
            '<div class="alb-craft-spark" aria-hidden="true">' + sparkSVG() + '</div>' +
            '<div class="alb-modal-art rf rf-' + p.rarity + ' alb-pop">' + toyArt(p) + '</div>' +
            '<h3 class="alb-modal-name">' + p.ad + '</h3>' +
            '<p class="alb-workshop-note">' + ic('album', '📔') + '<span>Albüme işlendi!</span></p>' +
          '</div>';
      }
      later(function () {
        try { close(); } catch (e) {}
        render();
      }, 1700);
      toast('🎉 ' + p.ad + ' aileye katıldı!');
    } else {
      var reason = r && r.reason;
      if (reason === 'kabuk-yetersiz') toast('🐚 Kabuk yetersiz — kopyalar Kabuk kazandırır!');
      else if (reason === 'gizli-kilitli') toast('🔒 Önce 30 dostu yuvaya getirmelisin.');
      else if (reason === 'sahipli') toast('Bu dost zaten albümde!');
      else toast('Atölye şu an çalışmıyor.');
    }
  }

  /* ---------- etkileşim ---------- */
  function handleClick (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'cell') {
      openDetail(b.getAttribute('data-id'));
    } else if (act === 'mile') {
      var key = b.getAttribute('data-key');
      var mi = null;
      for (var i = 0; i < MILES.length; i++) { if (MILES[i].key === key) { mi = MILES[i]; break; } }
      if (!mi) return;
      var s = st();
      var claimed = (s.milestones || []).indexOf(key) !== -1;
      var owned = ownedCount();
      if (claimed) {
        play('click');
        toast('Bu ödül alındı ✓');
      } else if (owned >= mi.at) {
        claimMilestones();
      } else {
        play('click');
        toast('Daha ' + (mi.at - owned) + ' dost gerek (' + owned + '/' + mi.at + ').');
      }
    }
  }

  /* ---------- sahne API ---------- */
  Yuvo.scenes.album = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'alb-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      onState = function () { render(); };
      document.addEventListener('yuvo:state', onState);
      play('page');
      render();
    },
    unmount: function () {
      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];
      if (onState) { document.removeEventListener('yuvo:state', onState); onState = null; }
      if (el) {
        el.removeEventListener('click', handleClick);
        if (el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
    }
  };
})();

/* == js/scenes/ceremony.js == */
/* Yuvo — Sahne: Çıtlatma Töreni (docs/06 §2 + ARCHITECTURE.md 6 adım). Sahip: scenes-core ajanı. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.scenes = Yuvo.scenes || {};
  Yuvo.test = Yuvo.test || {};

  // ---------- modül durumu ----------
  var mounted = false;
  var rootEl = null, stageEl = null, eggEl = null, eggWrapEl = null;
  var warmthEl = null, ringsEl = null, fxEl = null, hintEl = null;
  var result = null;           // openEgg() sonucu — mount'ta BİR KEZ çekilir, saklanır
  var stage = 'idle';          // arrive | warm | rhythm | burst | card | noegg
  var crack = 0;
  var warmDist = 0, warmTaps = 0, rubbing = false, lastX = 0, lastY = 0;
  var ringStep = 0;
  var lastTap = 0;
  var timers = [];

  var WARM_DIST = 1400;        // px — dairesel ovalama (pointermove) birikimi eşiği
  var WARM_TAPS = 5;           // dokunma fallback: 5 tap
  var DBL_MS = 350;            // çift-tap hızlandırma eşiği

  // ---------- yardımcılar ----------
  function later (fn, ms) {
    var id = setTimeout(function () { if (mounted) fn(); }, ms);
    timers.push(id);
    return id;
  }
  function clearTimers () {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
  }
  function play (name) {
    try { if (Yuvo.audio && Yuvo.audio.play) Yuvo.audio.play(name); } catch (e) {}
  }
  function vibrate (p) {
    try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {}
  }
  function esc (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function rarityInfo (key) {
    return (Yuvo.data && Yuvo.data.RARITIES && Yuvo.data.RARITIES[key]) || { ad: key || '?', renk: '#9AA5B1' };
  }

  // Savunmacı sanat: art modülü henüz yoksa basit yedekler
  function eggSVG () {
    try {
      if (Yuvo.art && Yuvo.art.eggSVG) {
        var s = Yuvo.art.eggSVG(result.rarity, { crack: crack });
        if (s) return s;
      }
    } catch (e) {}
    var renk = rarityInfo(result.rarity).renk;
    var cr = '';
    if (crack >= 1) cr += '<path d="M45 40 l8 9 -6 7 9 8" stroke="#6d5c46" stroke-width="3" fill="none" stroke-linecap="round"/>';
    if (crack >= 2) cr += '<path d="M74 52 l-7 8 8 6 -5 9" stroke="#6d5c46" stroke-width="3" fill="none" stroke-linecap="round"/>';
    if (crack >= 3) cr += '<path d="M40 66 l10 5 -3 9 11 4 M80 42 l-4 10 8 5" stroke="#57452f" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
    return '<svg viewBox="0 0 120 120"><ellipse cx="60" cy="66" rx="34" ry="44" fill="' + renk + '"/>' +
      '<ellipse cx="48" cy="48" rx="10" ry="14" fill="rgba(255,255,255,.5)"/>' + cr + '</svg>';
  }
  function pufiSVG (mood) {
    try {
      if (Yuvo.art && Yuvo.art.pufiSVG) {
        var s = Yuvo.art.pufiSVG(result.pufi, { mood: mood || 'happy' });
        if (s) return s;
      }
    } catch (e) {}
    var renk = rarityInfo(result.rarity).renk;
    return '<svg viewBox="0 0 120 120"><circle cx="60" cy="64" r="38" fill="' + renk + '"/>' +
      '<circle cx="48" cy="56" r="5" fill="#3a2f22"/><circle cx="72" cy="56" r="5" fill="#3a2f22"/>' +
      '<path d="M48 74 q12 10 24 0" stroke="#3a2f22" stroke-width="4" fill="none" stroke-linecap="round"/></svg>';
  }

  function renderEgg () { if (eggEl) eggEl.innerHTML = eggSVG(); }
  function setHint (text) { if (hintEl) hintEl.textContent = text || ''; }

  // ---------- aşama 0: yumurta yoksa nazik mesaj ----------
  function showNoEgg () {
    stage = 'noegg';
    rootEl.innerHTML =
      '<div class="cere-stage cere-noegg">' +
        '<div class="cere-noegg-box card center">' +
          '<div class="cere-noegg-ico">🌙</div>' +
          '<h2>Bugünün yumurtaları bitti</h2>' +

    renderEgg();
    showCard();
    return result;
  };

      piece.style.pointerEvents = 'none';
      piece.style.transition = 'transform .55s ease';
      piece.style.transform = 'translate(' + (sc.x - pc.x) + 'px,' + (sc.y - pc.y) + 'px) scale(1.05)';
      play('tap');
      (function (pid, el2) {
        later(function () {
          el2.style.transition = '';
          placePart(pid, el2);
        }, 560);
      })(target, piece);
    } else {
      placePart(target, piece);
    }
  }

  // ---------- sürükle-bırak ----------
  function slotFor (partId) {
    return boardEl ? boardEl.querySelector('.asm-slot[data-part="' + partId + '"]') : null;
  }
  function centerOf (el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function onShelfDown (e) {
    if (finished || drag) return;
    var piece = e.target && e.target.closest ? e.target.closest('.asm-piece') : null;
    if (!piece || piece.classList.contains('placed')) return;
    e.preventDefault();
    piece.classList.remove('returning');
    piece.style.transition = 'none';
    var c = centerOf(piece);
    drag = {
      el: piece,
      part: piece.getAttribute('data-part'),
      sx: e.clientX, sy: e.clientY,
      cx: c.x, cy: c.y,       // parçanın başlangıç merkezi (ekran koordinatı)
      dx: 0, dy: 0
    };
    piece.classList.add('dragging');
    play('tap');
    scheduleIdle();
  }

  function onDocMove (e) {
    if (!drag) return;
    drag.dx = e.clientX - drag.sx;
    drag.dy = e.clientY - drag.sy;

    var slot = slotFor(drag.part);
    if (slot) {
      var sc = centerOf(slot);
      var px = drag.cx + drag.dx, py = drag.cy + drag.dy;
      var dist = Math.sqrt((sc.x - px) * (sc.x - px) + (sc.y - py) * (sc.y - py));
      if (dist < MAGNET && !placed[drag.part]) {
        drag.dx += (sc.x - px) * PULL;   // mıknatıs çekimi
        drag.dy += (sc.y - py) * PULL;
        slot.classList.add('near');
      } else {
        slot.classList.remove('near');
      }
    }
    drag.el.style.transform = 'translate(' + drag.dx + 'px,' + drag.dy + 'px) scale(1.1)';
  }

  function onDocUp () {
    if (!drag) return;
    var d = drag; drag = null;
    var slot = slotFor(d.part);
    var ok = false;
    if (slot && !placed[d.part]) {
      var sc = centerOf(slot);
      var pc = centerOf(d.el);
      var dist = Math.sqrt((sc.x - pc.x) * (sc.x - pc.x) + (sc.y - pc.y) * (sc.y - pc.y));
      ok = dist < SNAP;
    }
    d.el.classList.remove('dragging');
    if (ok) {
      failCount = 0;
      placePart(d.part, d.el);
    } else {
      // Ceza yok: nazikçe rafa geri süzülür
      if (slot) slot.classList.remove('near');
      d.el.style.transition = '';
      d.el.classList.add('returning');
      d.el.style.transform = '';
      (function (el) {
        later(function () { el.classList.remove('returning'); }, 500);
      })(d.el);
      failCount += 1;
      if (failCount >= FAIL_ESIK) later(function () { assist(); }, 550);
    }
    scheduleIdle();
  }
  function onDocCancel () { onDocUp(); }

  // ---------- oturtma + bitiş ----------
  function placePart (partId, pieceEl) {
    if (placed[partId] || finished) return;
    placed[partId] = true;
    placedCount += 1;

    var slot = slotFor(partId);
    if (slot) {
      slot.classList.remove('near');
      slot.classList.add('filled');
      slot.innerHTML = '<div class="slot-fill">' + partSVG(partId) + '</div><i class="asm-spark">' + sparkSVG() + '</i>';
    }
    var piece = pieceEl || (shelfEl ? shelfEl.querySelector('.asm-piece[data-part="' + partId + '"]') : null);
    if (piece) {
      piece.classList.add('placed');
      piece.style.transform = '';
    }
    play('snap');
    vibrate(20);

    if (placedCount >= parts.length) later(function () { finish(); }, 350);
  }

  function finish () {
    if (finished || !mounted) return;
    finished = true;
    drag = null;
    play('fanfare');
    vibrate([20, 40, 60]);
    if (stageEl) {
      stageEl.innerHTML =
        '<div class="asm-done">' +
          '<div class="asm-confetti" aria-hidden="true">' + confettiHTML(14) + '</div>' +
          '<div class="asm-toy">' + assembledSVG() + '</div>' +
          '<div class="asm-dance">' + pufiHappySVG() + '</div>' +
          '<div class="asm-banner">' + ico('check', '✔') + ' Albüme işlendi!</div>' +
        '</div>';
    }
    later(function () { if (Yuvo.go) Yuvo.go('album'); }, 1000);
  }

  // ---------- sahne API ----------
  Yuvo.scenes.assembly = {
    mount: function (el, params) {
      mounted = true;
      finished = false;
      rootEl = el;
      placed = {}; placedCount = 0; drag = null;
      failCount = 0; idleId = null;

      pufi = findPufi(params && params.pufiId);
      if (!pufi) {
        // Savunmacı: parametre yoksa eldeki ilk Pufi ile devam et, o da yoksa eve dön
        var list = (Yuvo.data && Yuvo.data.PUFIS) || [];
        pufi = list[0] || null;
      }
      if (!pufi) {
        if (Yuvo.toast) Yuvo.toast('Birleştirilecek oyuncak bulunamadı');
        if (Yuvo.go) Yuvo.go('home');
        return;
      }
      parts = getParts();
      render();
    },
    unmount: function () {
      mounted = false;
      clearTimers();
      offDocs();
      drag = null;
      failCount = 0; idleId = null;
      rootEl = null; boardEl = null; shelfEl = null; stageEl = null;
      pufi = null; parts = []; placed = {}; placedCount = 0; finished = false;
    }
  };

  // ---------- test kancası ----------
  // Tüm parçaları anında oturtur ve bitirir; başarı durumunu döndürür.
  Yuvo.test.assemble = function () {
    if (!mounted || finished) return false;
    clearTimers(); // bekleyen 350ms bitiş zamanlayıcıları yerine doğrudan bitir
    for (var i = 0; i < parts.length; i++) {
      if (!placed[parts[i].id]) placePart(parts[i].id);
    }
    finish();
    return true;
  };
})();

/* == js/main.js == */
/* Yuvo Prototip — çekirdek kabuk: router, HUD, nav, modal, toast (SÖZLEŞME: davranış sabit).
   Marka geçişi (BRAND.md): yalnız render markup'ı değişti — HUD artık logo + ikonlu haplar,
   nav Yuvo.icons ile çizilir; Yuvo.go guard'ı, overlay temizliği, modal API'si ve
   tek-seferlik dinleyiciler AYNEN korunur. */
(function () {
  window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };

  var app = document.getElementById('app');
  var hud = document.getElementById('hud');
  var sceneRoot = document.getElementById('scene-root');
  var nav = document.getElementById('bottom-nav');
  var overlayRoot = document.getElementById('overlay-root');
  var toastRoot = document.getElementById('toast-root');

  var FULLSCREEN = { ceremony:true, assembly:true };
  var current = null, currentName = null;

  Yuvo.go = function (name, params) {
    if (name === currentName && !params) return; // aynı sekmeye çift dokunuş oyunu sıfırlamasın
    if (current && current.unmount) { try { current.unmount(); } catch (e) { console.error(e); } }
    sceneRoot.innerHTML = '';
    overlayRoot.innerHTML = ''; // sahne değişince açık modal kalmasın
    sceneRoot.scrollTop = 0;
    currentName = name;
    current = Yuvo.scenes[name];
    if (!current) { console.error('Sahne yok: ' + name); return; }
    app.classList.toggle('fullscreen', !!FULLSCREEN[name]);
    renderNav();
    current.mount(sceneRoot, params || {});
  };

  // Arka plana tıklayınca kapatma: kalıcı overlayRoot'a BİR KEZ bağlanır (dinleyici birikmez)
  overlayRoot.addEventListener('click', function (e) {
    if (e.target === overlayRoot) overlayRoot.innerHTML = '';
  });

  Yuvo.modal = function (html) {
    var wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = '<button class="modal-close" aria-label="Kapat">' + ico('close', '✕') + '</button>' + html;
    overlayRoot.innerHTML = '';
    overlayRoot.appendChild(wrap);
    function close () { overlayRoot.innerHTML = ''; }
    wrap.querySelector('.modal-close').addEventListener('click', close);
    return close;
  };

  Yuvo.toast = function (text) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    toastRoot.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  };

  Yuvo.refresh = function () {
    renderHud();
    document.dispatchEvent(new CustomEvent('yuvo:state'));
  };

  // Yuvo.icons güvenli erişim: ikon yoksa emoji fallback (BRAND.md §4)
  function ico (name, fallback) {
    try {
      if (Yuvo.icons && Yuvo.icons[name]) {
        var s = Yuvo.icons[name]();
        if (s) return s;
      }
    } catch (e) {}
    return '<span class="ico-fallback">' + fallback + '</span>';
  }

  function renderHud () {
    var s = (Yuvo.engine && Yuvo.engine.state) || {};
    hud.innerHTML =
      '<span class="hud-logo">' + ico('logo', 'Yuvo') + '</span>' +
      '<span class="hud-pills">' +
        '<span class="pill pill-star" aria-label="Yıldız Tozu">' +
          '<span class="pill-ico">' + ico('star', '⭐') + '</span><b>' + (s.stardust || 0) + '</b></span>' +
        '<span class="pill pill-shell" aria-label="Kabuk">' +
          '<span class="pill-ico">' + ico('shell', '🐚') + '</span><b>' + (s.kabuk || 0) + '</b></span>' +
        '<span class="pill pill-egg" aria-label="Bugünkü yumurta hakkı">' +
          '<span class="pill-ico">' + ico('egg', '🥚') + '</span><b>' + (s.eggsAvailable || 0) + '</b>' +
          ' <small>bugün</small></span>' +
      '</span>';
  }

  var NAV = [
    { id:'home', icon:'yuva', emoji:'🏡', ad:'Yuva' },
    { id:'album', icon:'album', emoji:'📔', ad:'Albüm' },
    { id:'minigame', icon:'oyna', emoji:'🎮', ad:'Oyna' }
  ];
  function renderNav () {
    nav.innerHTML = NAV.map(function (n) {
      return '<button data-go="' + n.id + '" class="' + (currentName === n.id ? 'active' : '') + '"' +
        ' aria-label="' + n.ad + '">' +
        '<span class="ico">' + ico(n.icon, n.emoji) + '</span>' +
        '<span class="nav-label">' + n.ad + '</span></button>';
    }).join('');
  }
  nav.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-go]');
    if (b) { if (Yuvo.audio.play) Yuvo.audio.play('click'); Yuvo.go(b.getAttribute('data-go')); }
  });

  var unlocked = false;
  document.addEventListener('pointerdown', function () {
    if (!unlocked && Yuvo.audio && Yuvo.audio.unlock) { unlocked = true; Yuvo.audio.unlock(); }
  }, { passive:true });

  // Başlat
  document.addEventListener('DOMContentLoaded', function () {
    if (Yuvo.engine.load) Yuvo.engine.load();
    Yuvo.refresh();
    Yuvo.go('home');
  });
})();


</script>
</body>
