<title>Yuvo Prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* == css/style.css == */
/* ============================================================================
   Yuvo — temel katman: marka tokenları + sticker bileşen dili (BRAND.md v1)
   "Gün doğumu çayırı": sıcak krem zemin, DOYGUN şeker vurgular, kalın yumuşak
   kontur + beyaz sticker halesi + şeker-vinil gradyan. Tek tema (açık).
   Sınıf adları SÖZLEŞMEDİR — sahneler ve testler bunlara bağlı, yeniden adlandırma.
   ========================================================================== */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  /* Zemin & mürekkep */
  --bg:#FFF4DC; --bg2:#FFE9C4; --paper:#FFF9EC; --card:#FFFFFF;
  --line:#3E2A1C; --ink:#4A2E1D; --ink-soft:#8A6B4F;
  /* Gün doğumu şekerleri */
  --sun:#FFC734; --sun-deep:#F2A400;
  --accent:#FF7C33; --accent-light:#FFA94D; --accent-deep:#E85C1E;
  --sky:#8AD9F7; --sky-deep:#3FA9DE;
  --meadow:#8ED94F; --meadow-deep:#55B944;
  --pink:#FF8FB0; --pink-deep:#F26D96;
  /* Nadirlik (KİLİTLİ — Yuvo.data.RARITIES.renk ile birebir) */
  --r-yaygin:#9AA5B1; --r-azbulunur:#58B368; --r-nadir:#4FB8D8;
  --r-destansi:#B266E8; --r-efsanevi:#F2A61B; --r-gizli:#5C4A9E;
  --r-yaygin-soft:#EEF1F5; --r-azbulunur-soft:#E3F5E4; --r-nadir-soft:#E0F4FB;
  --r-destansi-soft:#F3E8FC; --r-efsanevi-soft:#FFF1D4; --r-gizli-soft:#EAE5F8;
  /* Tipografi */
  --font-display:'Baloo 2','Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --font-body:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  /* Sticker reçetesi */
  --radius:26px; --radius-sm:16px;
  --halo:0 0 0 6px rgba(255,255,255,.9);
  --halo-sm:0 0 0 4px rgba(255,255,255,.9);
  --shadow:0 4px 14px rgba(122,74,32,.16);
  --shadow-lift:0 10px 18px rgba(122,74,32,.20);
}

html, body { height:100%; }
body {
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
  font-weight:700; font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
}
h1, h2, h3, h4 { font-family:var(--font-display); font-weight:800; letter-spacing:.2px; }
h1 { font-size:26px; } h2 { font-size:22px; } h3 { font-size:21px; font-weight:700; }
small { font-size:13.5px; color:var(--ink-soft); font-weight:700; }
button { font-family:inherit; color:inherit; }
:focus-visible { outline:3px solid var(--sun); outline-offset:2px; border-radius:8px; }

#app {
  height:100dvh; display:flex; flex-direction:column; max-width:560px; margin:0 auto;
  position:relative; overflow:hidden;
  /* Kabuk zemini: gün doğumu kremi + tepede güneş ışıması */
  background:
    radial-gradient(120% 46% at 50% -6%, rgba(255,214,120,.35), rgba(255,214,120,0) 60%),
    linear-gradient(180deg, #FFF7E6 0%, var(--bg) 46%, #FFEFCB 100%);
}
#scene-root { flex:1; overflow-y:auto; overflow-x:hidden; position:relative; }

/* ============================== HUD ==================================== */
#hud {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 9px;
  background:linear-gradient(180deg, #FFF0D2 0%, var(--bg2) 100%);
  border-bottom:2.5px solid var(--line);
  box-shadow:0 3px 10px rgba(122,74,32,.10);
  position:relative; z-index:5;
}
.hud-logo { display:inline-flex; align-items:center; flex:0 0 auto; }
.hud-logo svg { height:30px; width:auto; display:block;
  filter:drop-shadow(0 2px 0 rgba(122,74,32,.18)); }
.hud-pills { display:flex; align-items:center; gap:6px; flex:0 1 auto; min-width:0; }
#hud .pill {
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF6E6 100%);
  border:2.5px solid var(--line); border-radius:999px;
  padding:4px 12px 4px 7px; min-height:38px;
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--font-display); font-weight:800; font-size:17px;
  font-variant-numeric:tabular-nums;
  box-shadow:0 3px 0 rgba(62,42,28,.16), 0 6px 12px rgba(122,74,32,.12);
}
#hud .pill b { font-weight:800; }
#hud .pill small { font-family:var(--font-body); font-weight:700; font-size:12.5px;
  color:var(--ink-soft); }
.pill-ico { display:inline-flex; width:24px; height:24px; flex:0 0 auto; }
.pill-ico svg { width:24px; height:24px; }
.ico-fallback { font-size:18px; line-height:1; font-style:normal; }
@media (max-width:389px) {
  .hud-logo svg { height:26px; }
  #hud .pill { font-size:15px; padding:3px 9px 3px 6px; }
  #hud .pill small { display:none; }
}

/* =========================== Alt gezinme =============================== */
#bottom-nav {
  display:flex; gap:10px; padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, var(--bg2) 0%, #FFE0AC 100%);
  border-top:2.5px solid var(--line);
  box-shadow:0 -3px 10px rgba(122,74,32,.10);
  position:relative; z-index:5;
}
#bottom-nav button {
  flex:1; min-height:66px; cursor:pointer;
  border:2.5px solid var(--line); border-radius:20px;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF3DF 100%);
  color:var(--ink);
  font-family:var(--font-display); font-weight:700; font-size:15px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  box-shadow:0 4px 0 rgba(62,42,28,.18), 0 8px 14px rgba(122,74,32,.14);
  transition:transform .1s ease, box-shadow .1s ease, background .15s ease;
}
#bottom-nav button .ico { display:inline-flex; width:28px; height:28px; }
#bottom-nav button .ico svg { width:28px; height:28px; }
#bottom-nav button .ico .ico-fallback { font-size:24px; }
.nav-label { line-height:1.1; }
#bottom-nav button:active {
  transform:translateY(3px);
  box-shadow:0 1px 0 rgba(62,42,28,.18), 0 3px 6px rgba(122,74,32,.12);
}
#bottom-nav button.active {
  /* "sticker basılmış": şeker-güneş dolgu + beyaz hale + hafif çökme */
  background:linear-gradient(180deg, #FFDD66 0%, var(--sun) 55%, var(--sun-deep) 100%);
  box-shadow:var(--halo-sm), 0 4px 0 #C98A00, 0 8px 16px rgba(202,138,0,.30),
    inset 0 2px 0 rgba(255,255,255,.6);
  transform:translateY(1px) rotate(-1deg);
}
#bottom-nav button.active:active { transform:translateY(3px) rotate(-1deg); }

/* Tam ekran sahne modu (tören/birleştirme) */
#app.fullscreen #hud, #app.fullscreen #bottom-nav { display:none; }

/* ========================= .btn ailesi ================================= */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:64px; padding:12px 26px; cursor:pointer;
  border:2.5px solid var(--line); border-radius:999px;
  font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.2px;
  color:var(--ink);
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF1DB 100%);
  box-shadow:0 4px 0 rgba(62,42,28,.20), var(--shadow-lift),
    inset 0 2px 0 rgba(255,255,255,.6);
  transition:transform .1s ease, box-shadow .1s ease;
}
.btn:active {
  transform:translateY(3px);
  box-shadow:0 1px 0 rgba(62,42,28,.20), 0 4px 8px rgba(122,74,32,.14),
    inset 0 2px 0 rgba(255,255,255,.4);
}
.btn svg { width:24px; height:24px; flex:0 0 auto; }
.btn-primary {
  background:linear-gradient(180deg, var(--accent-light) 0%, var(--accent) 55%, var(--accent-deep) 100%);
  color:#FFFFFF; text-shadow:0 1.5px 0 rgba(150,54,8,.35);
  box-shadow:0 4px 0 #B54312, 0 10px 18px rgba(232,92,30,.32),
    inset 0 2px 0 rgba(255,255,255,.5);
}
.btn-primary:active {
  transform:translateY(3px);
  box-shadow:0 1px 0 #B54312, 0 4px 8px rgba(232,92,30,.22),
    inset 0 2px 0 rgba(255,255,255,.35);
}
.btn-soft {
  background:linear-gradient(180deg, #FFF3DA 0%, var(--bg2) 100%);
  box-shadow:0 4px 0 rgba(62,42,28,.16), 0 8px 14px rgba(122,74,32,.14),
    inset 0 2px 0 rgba(255,255,255,.7);
}
.btn[disabled] { opacity:.5; pointer-events:none; filter:saturate(.4); }

/* =========================== Sticker kart ============================== */
.card {
  background:var(--card); color:var(--ink);
  border:2.5px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--halo), 0 12px 26px rgba(122,74,32,.20);
  padding:18px;
}

/* ============================== Modal ================================== */
#overlay-root:empty { display:none; }
#overlay-root {
  position:absolute; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  background:rgba(62,42,28,.48); padding:22px;
  backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
}
.modal {
  background:var(--card); color:var(--ink);
  border:2.5px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--halo), 0 18px 40px rgba(40,24,12,.35);
  width:100%; max-width:420px; max-height:82dvh; overflow-y:auto;
  padding:22px; position:relative;
  animation:pop-in .3s cubic-bezier(.34,1.56,.64,1);
}
.modal .modal-close {
  position:absolute; top:10px; right:10px; width:64px; height:64px; z-index:2;
  border:2.5px solid var(--line); border-radius:50%; cursor:pointer;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFEFD6 100%);
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:800; color:var(--ink);
  box-shadow:0 3px 0 rgba(62,42,28,.18), 0 5px 10px rgba(122,74,32,.16);
  transition:transform .1s ease, box-shadow .1s ease;
}
.modal .modal-close svg { width:30px; height:30px; }
.modal .modal-close:active { transform:translateY(2px);
  box-shadow:0 1px 0 rgba(62,42,28,.18); }
@keyframes pop-in {
  from { transform:scale(.7) translateY(14px); opacity:0; }
  to   { transform:scale(1) translateY(0); opacity:1; }
}

/* ============================== Toast ================================== */
#toast-root { position:absolute; left:0; right:0; bottom:110px; display:flex;
  flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none; }
.toast {
  background:linear-gradient(180deg, #5A3A24 0%, var(--line) 100%); color:#FFF7E8;
  border-radius:999px; padding:11px 22px;
  font-family:var(--font-display); font-weight:700; font-size:15.5px;
  box-shadow:var(--halo-sm), 0 8px 18px rgba(40,24,12,.30);
  animation:toast-in .3s cubic-bezier(.34,1.56,.64,1);
  max-width:90%; text-align:center;
}
@keyframes toast-in { from { transform:translateY(14px) scale(.9); opacity:0; }
  to { transform:none; opacity:1; } }

/* ===================== Nadirlik çerçeveleri (.rf) ======================
   Renk körlüğü sözleşmesi: kademe = RENK + DESEN (border-style) + SİMGE (rozet).
   Desenler: düz / kesikli / çift / noktalı / kalın+ışıma / kesikli+ışıma.
   Simgeler ● ▲ ◆ ★ ✹ ☾ — DEĞİŞTİRİLEMEZ (BRAND.md §1.3). */
.rf { position:relative; border:3px solid var(--r-yaygin); border-radius:var(--radius-sm);
  background-color:var(--r-yaygin-soft); }
.rf::after {
  content:'●'; position:absolute; left:-6px; bottom:-6px; z-index:2;
  width:24px; height:24px; border-radius:50%;
  background:#FFFFFF; border:2px solid var(--line); color:var(--ink);
  font-size:11px; line-height:20px; text-align:center;
  font-style:normal; font-weight:800; pointer-events:none;
  box-shadow:0 2px 4px rgba(62,42,28,.25);
}
.rf-yaygin { border-color:var(--r-yaygin); background-color:var(--r-yaygin-soft); }
.rf-azbulunur { border-color:var(--r-azbulunur); border-style:dashed;
  background-color:var(--r-azbulunur-soft); }
.rf-azbulunur::after { content:'▲'; font-size:10px; }
.rf-nadir { border-color:var(--r-nadir); border-width:6px; border-style:double;
  background-color:var(--r-nadir-soft); box-shadow:0 0 0 1px rgba(79,184,216,.25),
  0 0 12px rgba(79,184,216,.45); }
.rf-nadir::after { content:'◆'; }
.rf-destansi { border-color:var(--r-destansi); border-width:4px; border-style:dotted;
  background-color:var(--r-destansi-soft); box-shadow:0 0 14px rgba(178,102,232,.5); }
.rf-destansi::after { content:'★'; }
.rf-efsanevi { border-color:var(--r-efsanevi); border-width:5px;
  background-color:var(--r-efsanevi-soft);
  animation:glow 1.6s ease-in-out infinite alternate; }
.rf-efsanevi::after { content:'✹'; }
.rf-gizli { border-color:var(--r-gizli); border-width:5px; border-style:dashed;
  background-color:var(--r-gizli-soft); box-shadow:0 0 14px rgba(92,74,158,.55); }
.rf-gizli::after { content:'☾'; }
@keyframes glow {
  from { box-shadow:0 0 8px rgba(242,166,27,.4); }
  to   { box-shadow:0 0 22px rgba(242,166,27,.8), 0 0 4px rgba(255,255,255,.8); }
}

/* Nadirlik rozeti: koyu mürekkep + açık zemin (WCAG ≥4.5:1); kademe rengi
   çerçevede, simge JS'ten metnin başına gelir — renk tek başına kod değil. */
.rarity-tag {
  display:inline-block; padding:4px 14px; border-radius:999px;
  color:var(--ink); background:var(--bg2); border:2.5px solid var(--r-yaygin);
  font-family:var(--font-display); font-weight:700; font-size:15px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 2px 4px rgba(122,74,32,.12);
}

/* ============================ Yardımcılar ============================== */
.center { text-align:center; }
.stack { display:flex; flex-direction:column; gap:12px; }
.row { display:flex; align-items:center; gap:10px; }
.grow { flex:1; }
.hidden { display:none !important; }
img, svg { max-width:100%; display:block; }

/* == css/scenes-core.css == */
/* Yuvo — Çekirdek sahne stilleri: Çıtlatma Töreni + Birleştirme Masası.
   Sahip: scenes-core ajanı. Tokenlar css/style.css'ten gelir. */

/* ============================= TÖREN ============================= */

.cere-stage {
  position: relative;
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, var(--sky) 0%, var(--bg) 46%, var(--meadow) 100%);
  touch-action: none;
  cursor: pointer;
}

/* Sepet */
.cere-basket {
  position: absolute;
  bottom: 7%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 64px;
  line-height: 1;
  filter: drop-shadow(0 6px 8px rgba(74, 59, 42, .25));
  transition: opacity .5s ease, transform .5s ease;
  pointer-events: none;
}
.cere-basket.gone { opacity: 0; transform: translateX(-50%) translateY(24px); }

/* Yumurta */
.cere-egg-wrap {
  position: relative;
  width: min(62vw, 250px);
  z-index: 2;
  pointer-events: none; /* dokunuşlar sahnenin tamamında sayılır */
}
.cere-egg svg { width: 100%; height: auto; }
.cere-egg-wrap.arriving { animation: egg-arrive .9s cubic-bezier(.22, 1, .36, 1) both; }
.cere-egg-wrap.warm { animation: egg-rock 1.1s ease-in-out infinite; }
.cere-egg-wrap.warmed { animation: egg-shake .45s ease; }
.cere-egg-wrap.burst { animation: egg-burst .45s ease forwards; }

@keyframes egg-arrive {
  from { transform: translateY(46dvh) scale(.55); opacity: .4; }
  to   { transform: none; opacity: 1; }
}
@keyframes egg-rock {
  0%, 100% { transform: rotate(-3deg); }
  50%      { transform: rotate(3deg); }
}
@keyframes egg-shake {
  0%   { transform: translateX(0); }
  25%  { transform: translateX(-6px) rotate(-2deg); }
  50%  { transform: translateX(6px) rotate(2deg); }
  75%  { transform: translateX(-4px); }
  100% { transform: translateX(0); }
}
@keyframes egg-burst {
  to { transform: scale(1.3); opacity: 0; }
}

/* Isıtma jest gösterimi: yumurta üstünde daire çizen yarı saydam el (okuma gerektirmez) */
.cere-hand {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  margin: -24px 0 0 -24px;
  font-size: 46px;
  line-height: 1;
  opacity: .8;
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 2px 3px rgba(74, 59, 42, .35));
  animation: hand-circle 1.8s linear infinite;
}
.cere-egg-wrap.warm .cere-hand { display: block; }
@keyframes hand-circle {
  from { transform: rotate(0deg) translateX(58px) rotate(0deg); }
  to   { transform: rotate(360deg) translateX(58px) rotate(-360deg); }
}

/* Isınma parıltısı (opaklık JS'ten ilerlemeyle gelir) */
.cere-warmth {
  position: absolute;
  inset: -12%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 122, 140, .75) 0%, rgba(255, 160, 130, .35) 55%, transparent 75%);
  opacity: 0;
  transition: opacity .15s linear;
  pointer-events: none;
  mix-blend-mode: multiply;
}

/* Ritim halkaları — beklerler, kaçırmak imkânsız */
.cere-rings { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.cere-ring {
  position: absolute;
  width: 84px;
  height: 84px;
  border: 5px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 16px rgba(255, 255, 255, .85), inset 0 0 10px rgba(255, 255, 255, .5);
  transform: translate(-50%, -50%);
  animation: ring-pop .35s ease both, ring-pulse 1.1s ease-in-out .35s infinite;
}
.ring-p0 { left: 32%; top: 40%; }
.ring-p1 { left: 68%; top: 46%; }
.ring-p2 { left: 50%; top: 62%; }
/* Halkanın altında zıplayan işaret parmağı: "buraya dokun" jest eşdeğeri */
.cere-ring-finger {
  position: absolute;
  left: 50%;
  top: 96%;
  font-size: 36px;
  line-height: 1;
  animation: finger-bob .8s ease-in-out infinite;
}
@keyframes finger-bob {
  0%, 100% { transform: translateX(-50%) translateY(4px); }
  50%      { transform: translateX(-50%) translateY(-8px); }
}
@keyframes ring-pop {
  from { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
  to   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
@keyframes ring-pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50%      { transform: translate(-50%, -50%) scale(1.14); }
}

/* Efekt katmanı: flaş, konfeti, pufi, kart */
.cere-fx {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.cere-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 45%, #fff 0%, rgba(255, 255, 255, .6) 35%, transparent 70%);
  animation: flash-out .7s ease forwards;
}
@keyframes flash-out { from { opacity: 1; } to { opacity: 0; } }

/* Konfeti (CSS parçacıklar; --dx/--dy/--rot JS'ten) */
.cere-confetti { position: absolute; inset: 0; overflow: hidden; }
.cere-confetti i {
  position: absolute;
  left: 50%;
  top: 45%;
  width: 10px;
  height: 14px;
  border-radius: 3px;
  transform: translate(-50%, -50%);
  animation: confetti-fly 1.15s cubic-bezier(.16, .84, .44, 1) both;
}
@keyframes confetti-fly {
  0%   { transform: translate(-50%, -50%) scale(.6) rotate(0deg); opacity: 1; }
  70%  { opacity: 1; }
  100% {
    transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px) + 60px)) rotate(var(--rot, 180deg));
    opacity: 0;
  }
}

/* Pufi zıplayarak çıkar */
.cere-pufi {
  width: min(54vw, 215px);
  animation: pufi-bounce .9s cubic-bezier(.34, 1.56, .64, 1) both;
  filter: drop-shadow(0 8px 12px rgba(74, 59, 42, .25));
}
.cere-pufi svg { width: 100%; height: auto; }
@keyframes pufi-bounce {
  0%   { transform: translateY(18px) scale(.2); opacity: 0; }
  55%  { transform: translateY(-26px) scale(1.08); opacity: 1; }
  75%  { transform: translateY(6px) scale(.97); }
  100% { transform: none; opacity: 1; }
}

/* Tier 3: ekran ışıması */
.cere-stage.tier3glow::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background: radial-gradient(circle at 50% 38%,
    rgba(255, 244, 200, .95) 0%, rgba(255, 199, 52, .45) 42%, transparent 78%);
  animation: big-glow 1.9s ease forwards;
}
@keyframes big-glow {
  0%   { opacity: 0; }
  25%  { opacity: 1; }
  100% { opacity: 0; }
}

/* İpucu metni */
.cere-hint {
  position: absolute;
  bottom: calc(5% + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  max-width: 88%;
  text-align: center;
  font-size: 19px;
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--ink);
  background: var(--card);
  border: 2.5px solid var(--line);
  border-radius: 999px;
  padding: 10px 20px;
  box-shadow: var(--halo-sm), var(--shadow);
  pointer-events: none;
}
.cere-hint:empty { display: none; }

/* Sonuç kartı */
.cere-stage.show-card .cere-egg-wrap,
.cere-stage.show-card .cere-basket { display: none; }
.cere-card {
  pointer-events: auto;
  width: 86%;
  max-width: 330px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  animation: pop-in .35s ease;
}
.cere-portrait {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2.5px solid var(--line);
  box-shadow: var(--halo-sm);
  background: var(--bg2);
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cere-portrait svg { width: 100%; height: 100%; }
.cere-name { font-size: 26px; }
.cere-tags { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.cere-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: bold;
}
.cere-badge .ys-ico { width: 16px; height: 16px; }
.cere-badge-new { background: var(--sun); color: var(--ink); }
.cere-badge-copy { background: var(--bg2); color: var(--ink); }
.cere-bio { color: var(--ink-soft); font-size: 15px; line-height: 1.45; }
.cere-card .btn { width: 100%; margin-top: 4px; }

/* Yumurta kalmadıysa nazik mesaj */
.cere-noegg { cursor: default; }
.cere-noegg-box {
  width: 86%;
  max-width: 330px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  animation: pop-in .3s ease;
}
.cere-noegg-ico { font-size: 52px; line-height: 1; }
.cere-noegg-box p { color: var(--ink-soft); line-height: 1.5; }
.cere-noegg-box .btn { width: 100%; }

/* ========================= BİRLEŞTİRME ========================= */
/* Atölye masası (BRAND §5): sıcak ahşap-krem zemin + %4–5 benek dokusu.
   Ortam sanatı .asm-bg (Yuvo.art.env.tableWood) — yoksa gradyan tek başına yeter. */

.asm-stage {
  position: relative;
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  background:
    radial-gradient(rgba(122, 74, 32, .05) 1.5px, transparent 1.5px) 0 0 / 26px 26px,
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 62%, #FFE0AC 100%);
  touch-action: none;
}
.asm-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.asm-bg svg { width: 100%; height: 100%; }
.asm-title, .asm-board, .asm-hint, .asm-shelf { position: relative; z-index: 1; }

/* Başlık: sticker hap; sağda 64px Atla düğmesine çarpmasın diye margin-right */
.asm-title {
  align-self: flex-start;
  margin-right: 92px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 21px;
  color: var(--ink);
  background: var(--card);
  border: 2.5px solid var(--line);
  border-radius: 999px;
  padding: 10px 18px;
  box-shadow: var(--halo-sm), 0 3px 0 rgba(62, 42, 28, .16), var(--shadow);
}

/* Takılan çocuk için görünür çıkış: köşede Atla düğmesi */
.asm-skip {
  position: absolute;
  top: calc(10px + env(safe-area-inset-top));
  right: 10px;
  z-index: 6;
  min-height: 64px;
  padding: 10px 16px;
  font-size: 16px;
}
.asm-skip svg { width: 22px; height: 22px; }

/* Hedef silüet tahtası */
.asm-board {
  position: relative;
  width: min(82vw, 330px);
  flex: 1;
  max-height: 52dvh;
  align-self: center;
}
.asm-slot {
  position: absolute;
  border: 3px dashed rgba(62, 42, 28, .32);
  border-radius: 24px;
  background: rgba(255, 255, 255, .55);
  box-shadow: inset 0 3px 9px rgba(122, 74, 32, .16), 0 0 0 4px rgba(255, 255, 255, .45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6%;
  transition: box-shadow .15s ease, border-color .15s ease, background .15s ease;
}
.asm-slot-bas      { width: 38%; aspect-ratio: 1; top: 0;   left: 50%; transform: translateX(-50%); }
.asm-slot-govde    { width: 48%; aspect-ratio: 1; top: 34%; left: 50%; transform: translateX(-50%); }
.asm-slot-aksesuar { width: 32%; aspect-ratio: 1; bottom: 0; right: 4%; }

/* Silüet hayaleti — zarif, krem zeminde yine seçilir */
.slot-ghost { width: 100%; height: 100%; }
.slot-ghost svg { width: 100%; height: 100%; filter: brightness(0) opacity(.32); }

/* Mıknatıs yaklaşınca parıltı — marka renkleri (--sun/--accent ailesi) */
.asm-slot.near {
  border-color: var(--accent);
  border-style: solid;
  background: rgba(255, 199, 52, .3);
  box-shadow: 0 0 0 4px rgba(255, 255, 255, .85), 0 0 22px rgba(255, 199, 52, .8),
    inset 0 0 12px rgba(255, 169, 77, .5);
}
.asm-slot.filled {
  border-color: transparent;
  border-style: solid;
  background: transparent;
  box-shadow: none;
}
.slot-fill { width: 100%; height: 100%; animation: fill-pop .3s ease; }
.slot-fill svg { width: 100%; height: 100%; }
@keyframes fill-pop {
  0%   { transform: scale(1.15); }
  60%  { transform: scale(.96); }
  100% { transform: scale(1); }
}

/* Oturma parıltısı — JS'ten sparkSVG() basılır (emoji yok) */
.asm-spark {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 64px;
  height: 64px;
  transform: translate(-50%, -50%);
  font-style: normal;
  pointer-events: none;
  animation: spark-pop .6s ease forwards;
}
.asm-spark svg { width: 100%; height: 100%; }
@keyframes spark-pop {
  0%   { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
  35%  { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
}

/* Yönerge: sticker hap */
.asm-hint {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  color: var(--ink);
  text-align: center;
  background: var(--card);
  border: 2.5px solid var(--line);
  border-radius: 999px;
  padding: 8px 18px;
  box-shadow: var(--halo-sm), var(--shadow);
}

/* Alt raf: beyaz sticker şerit (BRAND §5) */
.asm-shelf {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: flex-end;
  width: 100%;
  min-height: 118px;
  padding: 10px;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFF6E6 100%);
  border: 2.5px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--halo-sm), 0 4px 0 rgba(62, 42, 28, .16), var(--shadow-lift);
}

/* Parça: sticker çip (kontur + beyaz hale + vinil kenar); 92px ≥ 64px hedef */
.asm-piece {
  width: 92px;
  height: 92px;
  min-width: 64px;
  touch-action: none;
  cursor: grab;
  position: relative;
  padding: 6px;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFF1DB 100%);
  border: 2.5px solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, .9), 0 3px 0 rgba(62, 42, 28, .16),
    0 6px 10px rgba(122, 74, 32, .16);
}
.asm-piece svg { width: 100%; height: 100%; pointer-events: none; }
.asm-piece.dragging {
  z-index: 30;
  cursor: grabbing;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, .9), 0 6px 0 rgba(62, 42, 28, .14),
    0 12px 18px rgba(122, 74, 32, .3);
}
.asm-piece.returning { transition: transform .5s cubic-bezier(.22, 1, .36, 1); }
.asm-piece.placed { opacity: 0; pointer-events: none; }

/* Bitiş: güneş ışıması + konfeti + oyuncak + sevinç dansı */
.asm-done {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  animation: pop-in .3s ease;
}
.asm-done::before {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 50% 42%, rgba(255, 221, 102, .55), transparent 70%);
  animation: asm-glow 1.6s ease-in-out infinite alternate;
}
@keyframes asm-glow {
  from { opacity: .55; }
  to   { opacity: 1; }
}
.asm-confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.asm-confetti i {
  position: absolute;
  left: 50%;
  top: 42%;
  width: 10px;
  height: 14px;
  border-radius: 3px;
  border: 1.5px solid rgba(62, 42, 28, .35);
  transform: translate(-50%, -50%);
  animation: asm-confetti-fly 1.2s cubic-bezier(.16, .84, .44, 1) both;
}
@keyframes asm-confetti-fly {
  0%   { transform: translate(-50%, -50%) scale(.6) rotate(0deg); opacity: 1; }
  70%  { opacity: 1; }
  100% {
    transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px) + 60px)) rotate(var(--rot, 180deg));
    opacity: 0;
  }
}
.asm-toy { position: relative; z-index: 1; width: min(50vw, 200px); animation: fill-pop .5s ease; }
.asm-toy svg { width: 100%; height: auto; }
.asm-dance { position: relative; z-index: 1; width: min(38vw, 150px); animation: joy-dance .55s ease-in-out infinite alternate; }
.asm-dance svg { width: 100%; height: auto; }
@keyframes joy-dance {
  from { transform: translateY(0) rotate(-7deg); }
  to   { transform: translateY(-16px) rotate(7deg); }
}
.asm-banner {
  position: relative;
  z-index: 1;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  color: var(--ink);
  background: linear-gradient(180deg, #FFFFFF 0%, #FFF3DF 100%);
  border: 2.5px solid var(--line);
  border-radius: 999px;
  padding: 12px 26px;
  box-shadow: var(--halo-sm), 0 4px 0 rgba(62, 42, 28, .18), var(--shadow-lift);
  animation: pop-in .4s ease .2s both;
}
.asm-banner svg { width: 26px; height: 26px; vertical-align: -5px; display: inline-block; }

/* ================== GERÇEK YUMURTA RİTÜELİ (docs/v2/06) ==================
   Aşama makinesi katmanları: folyo şeritleri, altın ışık, çikolata, kapsül,
   defter uçuşu. BRAND §3 sticker reçetesi: kontur + beyaz hale + şeker-vinil
   dolgu + vinil kenar + bası hissi. Dokunma hedefleri ≥ 64px. */

/* Sahne ışığı (BRAND §5 Tören): merkezde sıcak radyal parlama + kenarlarda
   hafif vinyet — düz gradyan "boş sayfa" hissi yasak. Tier aurası ayrıca
   #rit-glow katmanından nadirlik rengiyle beslenir (JS). */
.rit-stage::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 44%,
      rgba(255, 233, 168, .75) 0%, rgba(255, 233, 168, .3) 30%, rgba(255, 233, 168, 0) 62%),
    radial-gradient(140% 120% at 50% 46%,
      rgba(122, 74, 32, 0) 60%, rgba(122, 74, 32, .1) 88%, rgba(122, 74, 32, .16) 100%);
}

/* Ritüel sahnesinde nesne dokunulabilir (eski törenin pointer-events:none kuralı kalkar);
   dairesel "ovala" eli folyoda anlamsız — gizlenir (jest: şerit çekme + kulakçık) */
.rit-stage .cere-egg-wrap { pointer-events: auto; }
.rit-stage .cere-egg-wrap .cere-hand { display: none; }
.rit-obj { cursor: pointer; }
.rit-obj svg { width: 100%; height: auto; display: block; }

/* Işık katmanı: altın folyo / nadirlik aurası (arka plan JS'ten boyanır) */
.rit-glow {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  transition: opacity .4s ease;
}
.rit-glow.show { opacity: 1; animation: rit-breathe 1.6s ease-in-out infinite alternate; }
@keyframes rit-breathe {
  from { opacity: .7; }
  to   { opacity: 1; }
}
.rit-flash-gold {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 45%, #FFF7DF 0%, rgba(255, 199, 52, .75) 40%, transparent 72%);
  animation: flash-out .9s ease forwards;
}

/* Folyo kulakçığı — sticker buton, ≥64px hedef, perforasyon üst kenar */
.rit-tab {
  position: relative;
  z-index: 5;
  margin-top: 12px;
  min-width: 118px;
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 19px;
  color: var(--ink);
  background: linear-gradient(180deg, #FFFFFF 0%, #FFF1DB 100%);
  border: 2.5px solid var(--line);
  border-top-style: dashed;
  border-radius: 18px 18px 999px 999px;
  box-shadow: var(--halo-sm), 0 4px 0 rgba(62, 42, 28, .18), var(--shadow);
  cursor: pointer;
  animation: rit-tab-wiggle 1.6s ease-in-out infinite;
}
.rit-tab:active { transform: translateY(3px); box-shadow: var(--halo-sm), 0 1px 0 rgba(62, 42, 28, .18), var(--shadow); }
.rit-tab[hidden] { display: none; }
.rit-tab svg { width: 26px; height: 26px; }
@keyframes rit-tab-wiggle {
  0%, 100% { transform: rotate(0deg); }
  30%      { transform: rotate(-3deg) translateY(2px); }
  60%      { transform: rotate(3deg); }
}

/* Düşen folyo parçaları — CSS fizik: yay eğrisi + dönerek süzülme; itince hışırdar */
.rit-scraps { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.rit-scrap {
  position: absolute;
  left: 50%;
  top: 40%;
  width: 74px;
  pointer-events: auto;
  cursor: pointer;
  filter: drop-shadow(0 5px 6px rgba(74, 59, 42, .28));
  animation: rit-scrap-fall 1.5s cubic-bezier(.25, .7, .35, 1) both;
}
.rit-scrap svg { width: 100%; height: auto; }
@keyframes rit-scrap-fall {
  0%   { transform: translate(-50%, -50%) rotate(0deg) scale(.8); opacity: 0; }
  12%  { opacity: 1; }
  55%  { transform: translate(calc(-50% + var(--mx, 44px)), 6dvh) rotate(var(--mr, 50deg)) scale(1); }
  100% { transform: translate(calc(-50% + var(--dx, 90px)), 32dvh) rotate(var(--rot, 140deg)) scale(1); }
}
.rit-scrap.nudge svg { animation: rit-scrap-nudge .45s ease; }
@keyframes rit-scrap-nudge {
  0%   { transform: none; }
  40%  { transform: translateX(9px) rotate(9deg); }
  100% { transform: none; }
}

/* Çikolata aşaması: iki büyük buton (Filiz modu) — hedef ≥ 64px */
.rit-actions {
  position: relative;
  z-index: 5;
  display: flex;
  gap: 14px;
  margin-top: 14px;
  justify-content: center;
}
.rit-actions:empty { display: none; }
.rit-actions .rit-btn { min-height: 64px; min-width: 132px; font-size: 21px; justify-content: center; }

/* Kumbaraya uçuş (çikolata bütün hâlde kavanoza) */
.cere-egg-wrap.to-jar { animation: rit-to-jar .7s cubic-bezier(.5, -.2, .7, 1) forwards; }
@keyframes rit-to-jar {
  30%  { transform: translateY(-30px) scale(.92) rotate(-6deg); opacity: 1; }
  100% { transform: translate(-36vw, -32dvh) scale(.22) rotate(-22deg); opacity: .15; }
}

/* Yıldız kazanım baloncuğu (glif Yuvo.icons.star — emoji yok) */
.rit-star-float {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 5px;
  left: 58%;
  top: 32%;
  z-index: 6;
  pointer-events: none;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 19px;
  color: var(--ink);
  background: var(--card);
  border: 2.5px solid var(--line);
  border-radius: 999px;
  padding: 5px 14px;
  box-shadow: var(--halo-sm), var(--shadow);
  animation: rit-float-up 1s ease both;
}
@keyframes rit-float-up {
  from { transform: translateY(10px) scale(.8); opacity: 0; }
  25%  { opacity: 1; }
  to   { transform: translateY(-48px) scale(1); opacity: 0; }
}

/* Kapsül jest geri bildirimleri */
.cere-egg-wrap.twist-wobble { animation: rit-twist .45s ease-in-out infinite; }
@keyframes rit-twist {
  0%, 100% { transform: rotate(-4deg); }
  50%      { transform: rotate(4deg); }
}
.cere-egg-wrap.hold-shake { animation: egg-shake .3s linear infinite; }
.cere-egg-wrap.thrown { animation: rit-throw .55s cubic-bezier(.3, .7, .4, 1.2) forwards; }
@keyframes rit-throw {
  0%   { transform: none; }
  45%  { transform: translateY(-30dvh) scale(.9) rotate(10deg); }
  100% { transform: translateY(0) scale(1.05); }
}
.cere-egg-wrap.opened { animation: rit-open-pop .5s ease; }
@keyframes rit-open-pop {
  0%   { transform: scale(.94); }
  55%  { transform: scale(1.12); }
  100% { transform: none; }
}
/* Alt yarım yuva çanağı olur: karşılaşmada küçülüp aşağı iner (çöp değil, sevgi nesnesi) */
.cere-egg-wrap.nest-cup {
  transition: transform .6s cubic-bezier(.22, 1, .36, 1);
  transform: translateY(16dvh) scale(.55);
}

/* Sihirli dokunuş ışığı (ölçek/opaklık JS ilerlemesiyle) */
.rit-magic {
  position: absolute;
  inset: -22%;
  border-radius: 50%;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255, 247, 214, .95) 0%, rgba(255, 199, 52, .55) 45%, transparent 72%);
  transform: scale(.2);
  opacity: 0;
  transition: transform .12s linear, opacity .12s linear;
}

/* Kiki'nin nazik freni — tek satır sticker hap ("Bunu kaçırma!") */
.rit-kiki {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  z-index: 7;
  max-width: 86%;
  pointer-events: none;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  color: var(--ink);
  background: linear-gradient(180deg, #FFFFFF 0%, #FFE9F0 100%);
  border: 2.5px solid var(--line);
  border-radius: 999px;
  padding: 10px 18px;
  box-shadow: var(--halo-sm), 0 3px 0 rgba(62, 42, 28, .16), var(--shadow);
  animation: pop-in .3s ease;
}
.rit-kiki[hidden] { display: none; }

/* Ambalaj Defteri hedefi + koda uçuşu */
.rit-book {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  right: 14px;
  z-index: 6;
  width: 64px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #FFFFFF 0%, #FFF6E6 100%);
  border: 2.5px solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: var(--halo-sm), 0 3px 0 rgba(62, 42, 28, .16), var(--shadow);
  opacity: 0;
  transition: opacity .3s ease;
  pointer-events: none;
}
.rit-book.show { opacity: 1; }
.rit-book.slap { animation: rit-slap .45s ease; }
@keyframes rit-slap {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.28) rotate(-6deg); }
  100% { transform: none; }
}
.rit-book svg { width: 34px; height: 34px; }
.rit-book .ico-fallback { font-size: 30px; line-height: 1; }

.rit-stamp {
  position: absolute;
  left: 50%;
  top: 46%;
  width: 88px;
  z-index: 8;
  pointer-events: none;
  animation: rit-stamp-fly 1.25s cubic-bezier(.45, .05, .55, .95) forwards;
}
.rit-stamp svg { width: 100%; height: auto; filter: drop-shadow(0 6px 8px rgba(74, 59, 42, .3)); }
@keyframes rit-stamp-fly {
  0%   { transform: translate(-50%, -50%) scale(1.05) rotate(-5deg); opacity: 0; }
  16%  { opacity: 1; transform: translate(-50%, -58%) scale(1.12) rotate(4deg); }
  100% { transform: translate(calc(-50% + var(--tx, 120px)), calc(-50% + var(--ty, -240px))) scale(.42) rotate(8deg); opacity: 1; }
}

/* Kopya karşılaşması: Pufi el sallar, parça Kabuk rozetine dönüşür (boş katman hissi yasak) */
.cere-pufi.rit-wave { animation: pufi-bounce .7s cubic-bezier(.34, 1.56, .64, 1) both, rit-wave-tilt .5s ease-in-out .7s 2 alternate; }
@keyframes rit-wave-tilt {
  from { transform: rotate(-5deg); }
  to   { transform: rotate(6deg) translateY(-6px); }
}
.rit-shell-fly {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 6px;
  left: 50%;
  top: 34%;
  transform: translateX(-50%);
  z-index: 6;
  pointer-events: none;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 21px;
  color: var(--ink);
  background: linear-gradient(180deg, #FFFFFF 0%, #FFF1DB 100%);
  border: 2.5px solid var(--line);
  border-radius: 999px;
  padding: 8px 18px;
  box-shadow: var(--halo-sm), 0 3px 0 rgba(62, 42, 28, .16), var(--shadow);
  animation: rit-shell-rise 1.2s ease .35s both;
}
.rit-shell-fly .ys-ico { width: 22px; height: 22px; }
@keyframes rit-shell-rise {
  from { transform: translateX(-50%) translateY(18px) scale(.7); opacity: 0; }
  30%  { opacity: 1; }
  to   { transform: translateX(-50%) translateY(-34px) scale(1); opacity: 1; }
}

/* Altın folyo rozeti (sonuç kartında) — nadirlikten bağımsız statü çipi */
.cere-badge-gold {
  background: linear-gradient(180deg, #FFE9A8 0%, var(--sun) 100%);
  color: var(--ink);
  border: 2px solid var(--line);
}

/* == css/scenes-meta.css == */
/* Yuvo — Meta sahne stilleri: home (Yuva), album (Güneş Çayırı), minigame (Eşle & Bul).
   Sahip: scenes-meta ajanı. BRAND.md v1 sticker reçetesi (§3): 2.5px --line kontur +
   beyaz hale + şeker-vinil degrade + vinil kenar + düşey çökme (:active).
   Dokunma hedefleri ≥64px; 13px altı metin yok; yatay taşma yok; tek açık tema. */

/* --------- Ortak: satır içi ikon kabı (global `svg{display:block}` düzeltmesi) ------ */
.ys-ico { display:inline-flex; align-items:center; justify-content:center;
  flex:0 0 auto; width:1.25em; height:1.25em; }
.ys-ico svg { width:100%; height:100%; }
.ys-ico .ico-fallback { font-size:1em; line-height:1; }

/* ============================== HOME (Yuva) ============================== */
.home-scene {
  min-height:100%; display:flex; flex-direction:column; position:relative; overflow:hidden;
  /* Boyalı son-çare zemin: SVG manzara gelmese de kompozisyon degradesi durur */
  background:linear-gradient(180deg,
    #8AD9F7 0%, #CFF0FE 30%, #FFE9A8 44%, #A5E36B 52%, #8ED94F 68%, #55B944 100%);
}

/* Manzara katmanı (tamamı dekor) */
.home-sky { position:absolute; inset:0; pointer-events:none; z-index:0; }
.home-landscape { position:absolute; inset:0; }
.home-landscape svg { width:100%; height:100%; display:block; }
/* env katmanları ÜST ÜSTE bantlara oturur: gök üstte, tepeler+güneş altta —
   orta kuşak boş gradyan kalmaz (BRAND §5 "boş bant yasak"). Fallback
   landscapeSVG tek parça olduğundan bu sarmalayıcıları kullanmaz. */
.home-env { position:absolute; left:0; right:0; overflow:hidden; }
.home-env svg { width:100%; height:100%; display:block; }
.home-env-sky { top:0; height:60%; }
.home-env-clouds { top:0; height:20%; }
.home-env-meadow { bottom:0; height:46%; }
.home-sun {
  position:absolute; top:18px; right:20px; width:78px; height:78px; border-radius:50%;
  background:radial-gradient(circle at 36% 30%, #FFE79A, var(--sun) 62%, var(--sun-deep));
  border:2.5px solid var(--line);
  box-shadow:0 0 0 5px rgba(255,255,255,.85), 0 0 36px 12px rgba(255,199,52,.5),
    inset 0 3px 0 rgba(255,255,255,.5);
  animation:home-sun-breathe 4s ease-in-out infinite alternate;
}
.home-sun::before {
  content:''; position:absolute; inset:-30px; border-radius:50%;
  background:repeating-conic-gradient(rgba(255,240,180,.5) 0deg 8deg,
    rgba(255,240,180,0) 8deg 30deg);
  animation:home-sun-spin 26s linear infinite;
}
@keyframes home-sun-spin { to { transform:rotate(360deg); } }
@keyframes home-sun-breathe {
  from { box-shadow:0 0 0 5px rgba(255,255,255,.85), 0 0 24px 8px rgba(255,199,52,.4),
    inset 0 3px 0 rgba(255,255,255,.5); }
  to   { box-shadow:0 0 0 5px rgba(255,255,255,.85), 0 0 46px 16px rgba(255,199,52,.62),
    inset 0 3px 0 rgba(255,255,255,.5); }
}
.home-cloud { position:absolute; width:96px;
  filter:drop-shadow(0 4px 0 rgba(122,74,32,.12));
  animation:home-cloud-drift linear infinite; }
.home-cloud svg { width:100%; height:auto; display:block; }
.home-cloud.c1 { top:30px; left:-110px; animation-duration:44s; }
.home-cloud.c2 { top:94px; left:-160px; width:70px; animation-duration:60s; }
@keyframes home-cloud-drift {
  from { transform:translateX(0); }
  to   { transform:translateX(calc(100vw + 220px)); }
}

/* Albüm ilerleme şeridi — sticker çip */
.home-progress {
  position:relative; z-index:2; margin:12px 16px 0; min-height:64px;
  display:flex; align-items:center; gap:10px; padding:10px 16px;
  border:2.5px solid var(--line); border-radius:var(--radius);
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF3DF 100%);
  box-shadow:var(--halo-sm), 0 4px 0 rgba(62,42,28,.18), 0 10px 18px rgba(122,74,32,.2),
    inset 0 2px 0 rgba(255,255,255,.7);
  font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--ink);
  cursor:pointer; text-align:left;
  transition:transform .1s ease, box-shadow .1s ease;
}
.home-progress:active { transform:translateY(3px);
  box-shadow:var(--halo-sm), 0 1px 0 rgba(62,42,28,.18), 0 4px 8px rgba(122,74,32,.14); }
.home-progress-ico { width:30px; height:30px; }
.home-progress-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.home-progress-label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.home-progress-label b { font-size:17px; color:var(--accent-deep);
  font-variant-numeric:tabular-nums; }
.home-progress-bar { display:block; height:13px; border-radius:999px;
  background:#F0E2C8; border:2px solid rgba(62,42,28,.28);
  box-shadow:inset 0 2px 3px rgba(62,42,28,.18); overflow:hidden; }
.home-progress-fill { display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg, var(--sun), var(--accent));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5);
  transition:width .4s ease; }

/* Yuva sepeti + yumurtalar */
.home-nest-wrap { position:relative; z-index:2; padding:16px 14px 0; text-align:center; }
.home-hint {
  display:inline-flex; align-items:center; gap:8px; margin-bottom:10px; max-width:100%;
  padding:8px 18px; border:2.5px solid var(--line); border-radius:999px;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF6E6 100%);
  box-shadow:var(--halo-sm), 0 3px 0 rgba(62,42,28,.16);
  font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--ink);
}
.home-hint .ys-ico { width:22px; height:22px; }
.home-nest { position:relative; width:min(360px, 94%); margin:0 auto; }
.home-eggs {
  position:relative;
  display:flex; justify-content:center; align-items:flex-end;
  gap:0; margin-bottom:-100px; min-height:96px;
}
.home-egg {
  width:84px; height:96px; min-width:64px; min-height:64px;
  margin:0 -6px;
  border:none; background:transparent; padding:0; cursor:pointer;
  rotate:calc((var(--i, 0) - 1) * 3deg);
  animation:home-egg-bob 2.4s ease-in-out infinite;
  animation-delay:calc(var(--i, 0) * .35s);
  filter:drop-shadow(0 4px 4px rgba(74, 59, 42, .3));
}
.home-egg svg { width:100%; height:100%; transition:transform .1s ease; }
.home-egg:active svg { transform:translateY(4px) scale(.97); }
@keyframes home-egg-bob {
  0%, 100% { transform:translateY(0) rotate(-2deg); }
  50%      { transform:translateY(-6px) rotate(2deg); }
}
.home-egg-more {
  align-self:center; position:relative; z-index:3; margin-left:8px; margin-bottom:56px;
  background:linear-gradient(180deg, var(--accent-light), var(--accent) 55%, var(--accent-deep));
  color:#fff; font-family:var(--font-display); font-weight:800; font-size:15px;
  border:2.5px solid var(--line); border-radius:999px; padding:5px 11px;
  box-shadow:var(--halo-sm), 0 3px 0 var(--accent-deep);
}
.home-nest-empty { align-self:center; margin-bottom:56px; width:34px; height:34px;
  opacity:.92; }
.home-nest-empty svg { width:100%; height:100%; }
.home-basket { position:relative; z-index:2; min-height:96px; pointer-events:none;
  margin-top:-34px; }
.home-basket svg { width:100%; height:auto; display:block;
  filter:drop-shadow(0 8px 10px rgba(74,42,20,.28)); }
/* Son çare: SVG hiç gelmezse boyalı örgü sepet */
.home-basket:empty {
  height:78px; border-radius:16px 16px 70px 70px / 12px 12px 54px 54px;
  background:repeating-linear-gradient(45deg, #C98A4B 0 9px, #B4763B 9px 18px);
  border:3px solid var(--line); border-top:8px solid #8E5A2B;
  box-shadow:inset 0 8px 12px rgba(74,42,20,.35), var(--shadow);
}
.home-art-fallback { font-size:44px; line-height:1; display:inline-block; }

/* Gün sonu paneli */
.home-dayend {
  position:relative; z-index:2;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:22px 18px 6px;
}
.home-dayend .btn { width:min(340px, 100%); }
.home-extra { gap:8px; }
.home-extra .ys-ico { width:24px; height:24px; }
.home-extra-cost { display:inline-flex; align-items:center; gap:3px; margin-left:2px;
  background:rgba(255,255,255,.22); border-radius:999px; padding:2px 10px 2px 6px;
  font-size:17px; }
.home-extra-cost .ys-ico { width:20px; height:20px; }
.home-pips { display:inline-flex; gap:5px; margin-left:4px; }
.home-pips .pip { width:11px; height:11px; border-radius:50%;
  background:rgba(255,255,255,.35); border:2px solid rgba(255,255,255,.85); }
.home-pips .pip.on { background:#FFFFFF; }
.home-note {
  display:inline-flex; align-items:center; gap:8px; max-width:100%;
  font-family:var(--font-body); font-size:14px; font-weight:700; color:var(--ink);
  text-align:left;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF6E6 100%);
  border:2.5px solid var(--line); border-radius:999px; padding:8px 16px;
  box-shadow:var(--halo-sm), 0 3px 0 rgba(62,42,28,.14);
}
.home-note .ys-ico { width:20px; height:20px; }
.home-endday .ys-ico { width:24px; height:24px; }

/* Çayır + gezinen Pufiler */
.home-meadow { position:relative; flex:1; min-height:180px; margin-top:10px; z-index:1; }
.home-flowers { position:absolute; left:0; right:0; bottom:34px; height:110px;
  pointer-events:none; }
.home-flowers svg { width:100%; height:100%; display:block; }
.home-grass {
  position:absolute; left:-12px; right:-12px; bottom:-6px; height:52px; pointer-events:none;
  background:
    radial-gradient(circle at 8% 100%, #6DBB40 26%, transparent 27%),
    radial-gradient(circle at 26% 112%, var(--meadow-deep) 30%, transparent 31%),
    radial-gradient(circle at 46% 100%, #6DBB40 26%, transparent 27%),
    radial-gradient(circle at 66% 112%, var(--meadow-deep) 30%, transparent 31%),
    radial-gradient(circle at 88% 100%, #6DBB40 26%, transparent 27%);
  background-size:100% 100%;
}
/* 4-9 yaş ana yönlendirme cümlesi KIRPILMAZ: nowrap/ellipsis yok, hap
   yüksekliği esner, metin gerekirse iki satıra sarar */
.home-meadow-hint {
  position:absolute; left:50%; bottom:64px; transform:translateX(-50%);
  display:inline-flex; align-items:center; gap:8px;
  width:max-content; max-width:calc(100% - 32px);
  font-size:15px; font-weight:700; color:var(--ink); line-height:1.3;
  text-align:left;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF6E6 100%);
  border:2.5px solid var(--line); border-radius:24px; padding:8px 16px;
  box-shadow:var(--halo-sm), 0 3px 0 rgba(62,42,28,.14);
}
.home-meadow-hint .ys-ico { width:20px; height:20px; }
.home-roamer {
  position:absolute; bottom:16px;
  width:76px; height:76px; min-width:64px; min-height:64px;
  border:none; background:transparent; padding:0; cursor:pointer;
  animation-name:home-roam;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
  animation-direction:alternate;
  z-index:2;
}
.home-roamer.alt { animation-direction:alternate-reverse; }
@keyframes home-roam {
  from { transform:translateX(0); }
  to   { transform:translateX(72px); }
}
.home-roamer-body {
  display:block; width:100%; height:100%;
  animation:home-bob 1.3s ease-in-out infinite;
  filter:drop-shadow(0 4px 3px rgba(46, 82, 24, .35));
}
.home-roamer-body svg { width:100%; height:100%; }
@keyframes home-bob {
  0%, 100% { transform:translateY(0); }
  50%      { transform:translateY(-4px); }
}
.home-roamer-body.jump {
  animation:home-jump .65s cubic-bezier(.3, 1.6, .5, 1);
}
@keyframes home-jump {
  0%   { transform:translateY(0) scale(1, 1); }
  25%  { transform:translateY(2px) scale(1.12, .82); }
  55%  { transform:translateY(-30px) scale(.92, 1.1); }
  80%  { transform:translateY(0) scale(1.06, .92); }
  100% { transform:translateY(0) scale(1, 1); }
}

/* ============================== ALBUM (Güneş Çayırı) ============================== */
.alb-scene {
  min-height:100%;
  padding:14px 12px calc(34px + env(safe-area-inset-bottom));
  /* Sıcak masa zemini */
  background:linear-gradient(180deg, #FFE9C4 0%, #FFDFAF 60%, #FFD89E 100%);
}
/* Hikâye kitabı sayfası: kâğıt doku (≤%5) + kontur + hale + iç "dikiş" çizgisi */
.alb-page {
  position:relative;
  background:
    radial-gradient(rgba(122,74,32,.05) 1.4px, transparent 1.6px) 0 0 / 22px 22px,
    linear-gradient(180deg, #FFFDF4 0%, var(--paper) 100%);
  border:2.5px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--halo-sm), 0 5px 0 rgba(62,42,28,.14), 0 14px 24px rgba(122,74,32,.18);
  padding:16px 12px 18px;
}
.alb-page::before {
  content:''; position:absolute; inset:7px; pointer-events:none;
  border:2px dashed rgba(138,107,79,.4); border-radius:calc(var(--radius) - 8px);
}

/* Başlık: güneş-degrade kurdele + beyaz daire arma; Kabuk hapı sticker */
.alb-head { position:relative; z-index:1;
  display:flex; align-items:center; justify-content:space-between; gap:10px; }
.alb-ribbon {
  position:relative; display:inline-flex; align-items:center; gap:8px; min-width:0;
  background:linear-gradient(180deg, #FFDD66 0%, var(--sun) 55%, var(--sun-deep) 100%);
  border:2.5px solid var(--line); border-radius:14px; padding:7px 14px;
  box-shadow:var(--halo-sm), 0 3px 0 #C98A00, inset 0 2px 0 rgba(255,255,255,.55);
}
.alb-ribbon::before, .alb-ribbon::after {
  content:''; position:absolute; top:9px; width:16px; height:70%; z-index:-1;
  background:var(--sun-deep); border:2.5px solid var(--line); border-radius:6px;
}
.alb-ribbon::before { left:-10px; transform:rotate(-8deg); }
.alb-ribbon::after { right:-10px; transform:rotate(8deg); }
.alb-ribbon-ico {
  display:inline-flex; align-items:center; justify-content:center;
  width:32px; height:32px; flex:0 0 auto;
  background:#FFFFFF; border:2px solid var(--line); border-radius:50%;
  box-shadow:0 2px 0 rgba(62,42,28,.18);
}
.alb-ribbon-ico svg { width:22px; height:22px; }
.alb-ribbon-ico .ico-fallback { font-size:17px; }
.alb-title { font-size:21px; color:var(--ink); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.alb-shell {
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF6E6 100%);
  border:2.5px solid var(--line); border-radius:999px; padding:7px 14px 7px 10px;
  font-family:var(--font-display); font-weight:800; font-size:17px;
  font-variant-numeric:tabular-nums;
  box-shadow:0 3px 0 rgba(62,42,28,.16), 0 6px 12px rgba(122,74,32,.12);
}
.alb-shell .ys-ico { width:22px; height:22px; }

.alb-progress { position:relative; z-index:1;
  display:flex; align-items:center; gap:10px; margin:14px 2px 12px; }
.alb-progress-num { font-family:var(--font-display); font-size:16px; color:var(--ink);
  white-space:nowrap; }
.alb-progress-num b { font-size:20px; color:var(--accent-deep);
  font-variant-numeric:tabular-nums; }
.alb-progress-bar {
  flex:1; height:14px; border-radius:999px;
  background:#F3E6CC; border:2px solid rgba(62,42,28,.28);
  box-shadow:inset 0 2px 3px rgba(62,42,28,.16); overflow:hidden;
}
.alb-progress-fill {
  display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg, var(--sun), var(--accent));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5);
  transition:width .4s ease;
}

/* Kilometre taşı çipleri — sticker mini kart */
.alb-chips { position:relative; z-index:1; display:flex; gap:8px; margin-bottom:14px; }
.alb-chip {
  flex:1; min-height:66px; min-width:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border:2.5px solid var(--line); border-radius:var(--radius-sm);
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF3DF 100%);
  color:var(--ink); font-family:var(--font-display); cursor:pointer;
  box-shadow:0 3px 0 rgba(62,42,28,.16), 0 6px 10px rgba(122,74,32,.12),
    inset 0 2px 0 rgba(255,255,255,.7);
  transition:transform .1s ease, box-shadow .1s ease;
}
.alb-chip:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(62,42,28,.16); }
.alb-chip b { font-size:18px; font-weight:800; }
.alb-chip small { display:inline-flex; align-items:center; gap:3px;
  font-family:var(--font-body); font-weight:700; font-size:13.5px;
  color:var(--ink-soft); white-space:nowrap; }
.alb-chip small .ys-ico { width:15px; height:15px; }
/* Kilitli çip: şeker-hap dilinde kalır (soluk bej-gri yasak — BRAND §6.1);
   --sun ailesi ~%60 doygunlukta + gofre iç gölge "henüz değil" der */
.alb-chip.locked {
  background:linear-gradient(180deg, #FFEDB3 0%, #F5D77E 100%);
  border-color:rgba(62,42,28,.45);
  box-shadow:inset 0 3px 6px rgba(122,74,32,.22), inset 0 -2px 0 rgba(255,255,255,.5);
}
.alb-chip.locked small { color:var(--ink); }
.alb-chip.done { background:linear-gradient(180deg, #EDFAD9 0%, #D8F2BC 100%); }
.alb-chip.done small { color:var(--meadow-deep); font-weight:800; }
.alb-chip.ready {
  background:linear-gradient(180deg, #FFDD66 0%, var(--sun) 55%, var(--sun-deep) 100%);
  box-shadow:var(--halo-sm), 0 3px 0 #C98A00, inset 0 2px 0 rgba(255,255,255,.55);
  animation:alb-chip-glow 1.1s ease-in-out infinite alternate;
}
.alb-chip.ready small { color:var(--ink); font-weight:800; }
@keyframes alb-chip-glow {
  from { box-shadow:var(--halo-sm), 0 3px 0 #C98A00, 0 0 4px rgba(242,166,27,.4); }
  to   { box-shadow:var(--halo-sm), 0 3px 0 #C98A00, 0 0 18px rgba(242,166,27,.9); }
}

/* Izgara: 30 hücre — sahipli = sticker yuvası, eksik = gofre çukuru */
.alb-grid { position:relative; z-index:1;
  display:grid; grid-template-columns:repeat(5, 1fr); gap:9px; max-width:100%; }
.alb-cell {
  position:relative; aspect-ratio:1 / 1; min-width:0; min-height:64px;
  border-radius:var(--radius-sm); cursor:pointer; padding:6px;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 3px 6px rgba(122,74,32,.16),
    inset 0 2px 0 rgba(255,255,255,.6);
  transition:transform .1s ease, box-shadow .1s ease;
}
.alb-cell:active { transform:translateY(2px);
  box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 1px 3px rgba(122,74,32,.14); }
.alb-cell svg { width:100%; height:100%; }
.alb-cell.missing {
  box-shadow:0 0 0 3px rgba(255,255,255,.6),
    inset 0 4px 8px rgba(122,74,32,.22), inset 0 -2px 0 rgba(255,255,255,.5);
}
.alb-cell.missing svg { opacity:.45; }
.alb-q {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:24px; font-weight:800; color:var(--ink-soft);
  pointer-events:none;
}
.alb-q.big { position:static; font-size:24px; color:#E4D9FF; }
.alb-copy {
  position:absolute; top:3px; right:3px;
  background:linear-gradient(180deg, var(--accent-light), var(--accent) 60%, var(--accent-deep));
  color:#fff; border:2px solid var(--line);
  border-radius:999px; font-family:var(--font-display); font-size:13px; font-weight:800;
  padding:1px 7px; box-shadow:0 2px 0 rgba(62,42,28,.25);
  pointer-events:none;
}
.alb-art-fallback { font-size:30px; line-height:1; }
.alb-art-fallback.dim { opacity:.4; }

/* Ayrık gizli hücre — pastel gece adası: yıldız benekleri + ay süsü, sticker kontur */
.alb-secret-row {
  position:relative; display:flex; align-items:center; gap:14px;
  margin-top:16px; padding:12px 14px; overflow:hidden;
  background:
    radial-gradient(circle at 82% 22%, rgba(255,255,255,.9) 1.5px, transparent 2.5px),
    radial-gradient(circle at 64% 68%, rgba(255,255,255,.75) 1.2px, transparent 2.2px),
    radial-gradient(circle at 90% 74%, rgba(255,255,255,.7) 1.2px, transparent 2.2px),
    radial-gradient(circle at 48% 26%, rgba(255,255,255,.8) 1.5px, transparent 2.5px),
    linear-gradient(120deg, #574A8E, #7A6BB8);
  border:2.5px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--halo-sm), 0 4px 0 rgba(62,42,28,.2), 0 10px 18px rgba(92,74,158,.35);
}
.alb-secret-moon { position:absolute; top:8px; right:10px; width:26px; height:26px;
  opacity:.95; pointer-events:none; }
.alb-secret-moon svg { width:100%; height:100%; }
.alb-secret {
  flex:0 0 84px; width:84px; height:84px; aspect-ratio:auto;
  background:#241E42;
}
.alb-secret.missing { background:#241E42;
  box-shadow:inset 0 4px 8px rgba(0,0,0,.45), 0 0 0 3px rgba(255,255,255,.25); }
.alb-secret-label { position:relative; z-index:1; padding-right:26px;
  color:#F1EBFF; font-family:var(--font-display); font-size:15px; font-weight:800; }

/* Detay modalı + Atölye */
.alb-modal { display:flex; flex-direction:column; align-items:center; gap:8px; padding-top:8px; }
.alb-modal-art {
  width:150px; height:150px; border-radius:var(--radius);
  background-color:var(--paper); padding:10px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 4px rgba(255,255,255,.9), 0 6px 12px rgba(122,74,32,.18);
}
.alb-modal-art svg { width:100%; height:100%; }
.alb-modal-art.missing svg { opacity:.5; }
.alb-modal-name { font-size:30px; }
.alb-modal-tur { color:var(--ink-soft); font-size:15px; }
.alb-modal-tags { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
.alb-copy-tag {
  background:var(--bg2); border:2px solid var(--line); border-radius:999px;
  padding:3px 12px; font-size:13.5px; font-weight:800; color:var(--ink);
}
.alb-bio { font-size:16px; line-height:1.45; color:var(--ink); font-style:italic;
  max-width:300px; }
.alb-workshop { display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
.alb-workshop-note { display:inline-flex; align-items:flex-start; gap:8px; text-align:left;
  font-size:15px; color:var(--ink); }
.alb-workshop-note .ys-ico { width:22px; height:22px; margin-top:1px; }
.alb-cost {
  display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;
  width:100%; padding:10px 14px; font-size:15px;
  background:var(--bg2); border:2px dashed rgba(62,42,28,.35);
  border-radius:var(--radius-sm);
}
.alb-cost-item { display:inline-flex; align-items:center; gap:4px; }
.alb-cost-item b { font-family:var(--font-display); font-size:17px;
  font-variant-numeric:tabular-nums; }
.alb-cost-item .ys-ico { width:18px; height:18px; }
.alb-craft-btn { width:100%; }
.alb-craft-btn .ys-ico { width:24px; height:24px; }
.alb-locked { font-size:15px; color:var(--ink-soft); text-align:center; }

/* Minik üretim töreni */
.alb-craft-anim {
  position:relative;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:16px 4px 8px;
}
.alb-craft-spark {
  position:absolute; top:0; left:50%; width:46px; height:46px;
  pointer-events:none;
  animation:alb-spark 1.6s ease-out forwards;
}
.alb-craft-spark svg { width:100%; height:100%; }
@keyframes alb-spark {
  0%   { transform:translateX(-50%) scale(.4) rotate(0deg); opacity:0; }
  30%  { transform:translateX(-50%) scale(1.6) rotate(40deg); opacity:1; }
  100% { transform:translateX(-50%) scale(2.4) rotate(160deg); opacity:0; }
}
.alb-pop { animation:alb-pop-in .55s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes alb-pop-in {
  from { transform:scale(.3); opacity:0; }
  to   { transform:scale(1); opacity:1; }
}

/* ============================== MINIGAME (Eşle & Bul) ============================== */
.mg-scene {
  position:relative; min-height:100%;
  padding:16px 14px calc(20px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:12px;
  background:
    radial-gradient(120% 40% at 50% -4%, rgba(255,214,120,.4), rgba(255,214,120,0) 60%),
    linear-gradient(180deg, var(--bg) 0%, #FFE3B4 55%, #FFD794 100%);
}
.mg-title {
  display:inline-flex; align-items:center; gap:8px;
  font-size:22px; color:var(--ink);
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF3DF 100%);
  border:2.5px solid var(--line); border-radius:999px; padding:7px 20px;
  box-shadow:var(--halo-sm), 0 3px 0 rgba(62,42,28,.16);
}
.mg-title-ico { width:26px; height:26px; }
.mg-sub { font-size:16px; color:var(--ink-soft); margin-top:8px; }
.mg-lives { display:flex; justify-content:center; gap:5px; margin-top:6px; }
.mg-lives .ys-ico { width:22px; height:22px; }

/* Oyun matı: sıcak masa yüzeyi (doku ≤%5) */
.mg-board {
  width:100%; max-width:440px; margin:0 auto; padding:12px; position:relative;
  background:
    radial-gradient(rgba(122,74,32,.05) 1.4px, transparent 1.6px) 0 0 / 20px 20px,
    linear-gradient(180deg, #FFEFD1 0%, #FFE2AE 100%);
  border:2.5px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--halo-sm), 0 5px 0 rgba(62,42,28,.14), 0 12px 20px rgba(122,74,32,.16),
    inset 0 2px 0 rgba(255,255,255,.6);
}
.mg-grid {
  display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
  perspective:900px;
}
.mg-card {
  position:relative; aspect-ratio:3 / 4; min-width:0; min-height:64px;
  border:none; background:transparent; padding:0; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.mg-inner {
  position:absolute; inset:0;
  transform-style:preserve-3d;
  transition:transform .38s cubic-bezier(.4, .2, .2, 1);
}
.mg-card.flipped .mg-inner { transform:rotateY(180deg); }
.mg-card:not(.flipped):active .mg-inner { transform:translateY(3px); }
.mg-face {
  position:absolute; inset:0;
  border-radius:var(--radius-sm);
  display:flex; align-items:center; justify-content:center;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border:2.5px solid var(--line);
  overflow:hidden;
}
/* Kart sırtı: şeker degrade + %5 beyaz benek + beyaz yumurta amblemi + vinil kenar */
.mg-front {
  background:
    radial-gradient(rgba(255,255,255,.5) 1.6px, transparent 1.8px) 0 0 / 16px 16px,
    linear-gradient(180deg, var(--accent-light) 0%, var(--accent) 55%, var(--accent-deep) 100%);
  box-shadow:0 4px 0 var(--accent-deep), 0 8px 14px rgba(232,92,30,.28),
    inset 0 2px 0 rgba(255,255,255,.5);
}
.mg-emblem { width:56%; height:auto;
  filter:drop-shadow(0 3px 0 rgba(180,60,10,.35)); }
/* Kart önü: beyaz sticker */
.mg-back {
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF8EC 100%); padding:8px;
  transform:rotateY(180deg);
  box-shadow:0 4px 0 rgba(62,42,28,.16), inset 0 2px 0 rgba(255,255,255,.8);
}
.mg-back svg { width:100%; height:100%; }
.mg-art-fallback { font-size:38px; line-height:1; }
.mg-card.matched { pointer-events:none; }
.mg-card.matched .mg-back {
  animation:mg-sparkle .9s ease;
  border-color:var(--meadow-deep);
  box-shadow:0 0 0 4px rgba(255,255,255,.9), 0 0 20px rgba(142,217,79,.95);
}
@keyframes mg-sparkle {
  0%   { transform:rotateY(180deg) scale(1); filter:brightness(1); }
  35%  { transform:rotateY(180deg) scale(1.12); filter:brightness(1.5); }
  100% { transform:rotateY(180deg) scale(1); filter:brightness(1); }
}

/* Sonuç paneli — dönen güneş-ışını + sticker kart */
.mg-result {
  position:absolute; inset:0; z-index:10;
  display:flex; align-items:center; justify-content:center;
  background:rgba(62, 42, 28, .45);
  padding:20px;
  animation:mg-fade-in .3s ease;
}
@keyframes mg-fade-in { from { opacity:0; } to { opacity:1; } }
.mg-result-card {
  position:relative; overflow:hidden;
  background:var(--card); border:2.5px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--halo), 0 18px 40px rgba(40,24,12,.35);
  width:100%; max-width:340px; padding:26px 20px 22px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  animation:alb-pop-in .4s cubic-bezier(.3, 1.6, .5, 1);
}
.mg-result-card::before {
  content:''; position:absolute; left:50%; top:56px;
  width:420px; height:420px; margin-left:-210px; margin-top:-210px;
  border-radius:50%; pointer-events:none;
  background:repeating-conic-gradient(rgba(255,199,52,.22) 0deg 11deg,
    rgba(255,199,52,0) 11deg 30deg);
  animation:mg-ray-spin 16s linear infinite;
}
@keyframes mg-ray-spin { to { transform:rotate(360deg); } }
.mg-result-card > * { position:relative; z-index:1; }
.mg-stars { display:flex; gap:8px; }
.mg-star { width:46px; height:46px; display:inline-block;
  opacity:.4; transform:scale(.75); }
.mg-star svg { width:100%; height:100%; }
.mg-star.on {
  opacity:1;
  animation:mg-star-pop .5s cubic-bezier(.3, 1.8, .5, 1) forwards;
  animation-delay:var(--d, 0s);
  transform:scale(.2);
  filter:drop-shadow(0 3px 0 rgba(201,138,0,.35));
}
@keyframes mg-star-pop {
  from { transform:scale(.2) rotate(-30deg); }
  to   { transform:scale(1) rotate(0deg); }
}
.mg-result-title { font-size:21px; }
.mg-note { display:inline-flex; align-items:center; gap:8px;
  font-size:15px; color:var(--ink-soft); }
.mg-note .ys-ico { width:20px; height:20px; }
.mg-reward {
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-display); font-size:24px; font-weight:800; color:var(--accent-deep);
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF1D4 100%);
  border:2.5px solid var(--line); border-radius:999px; padding:6px 20px;
  box-shadow:0 3px 0 rgba(62,42,28,.16), inset 0 2px 0 rgba(255,255,255,.7);
}
.mg-reward .ys-ico { width:26px; height:26px; }
.mg-btns { width:100%; }
.mg-btns .btn { width:100%; }
.mg-btns .ys-ico { width:24px; height:24px; }

/* ============================== Hareket azaltma ============================== */
@media (prefers-reduced-motion: reduce) {
  .home-sun, .home-sun::before, .home-cloud, .home-egg, .home-roamer, .home-roamer-body,
  .alb-chip.ready, .alb-craft-spark, .alb-pop,
  .mg-star.on, .mg-result, .mg-result-card, .mg-result-card::before,
  .mg-card.matched .mg-back { animation:none; }
  .mg-star.on { transform:scale(1); }
  .mg-inner { transition-duration:.01s; }
  .home-progress-fill, .alb-progress-fill { transition:none; }
}

/* =====================================================================
   V2 RİTÜEL EKLERİ (docs/v2/06 §5.5) — Balon Postanesi tezgâhı, el-de
   yumurta, Çikolata Kumbarası, Ambalaj Defteri, Araç Rafı, 4'lü nav.
   BRAND.md §3 sticker reçetesi; dokunma hedefleri ≥64px; 390px taşmasız.
   ===================================================================== */

/* --------- 4'lü nav: etiketler 390px'te sığar (Yuva·Albüm·Defter·Oyna) ------ */
#bottom-nav button { min-width:0; padding-left:2px; padding-right:2px; }
#bottom-nav .nav-label { white-space:nowrap; font-size:14px; }

/* --------- HOME: Balon Postanesi tezgâhı ------------------------------------ */
.home-counter-zone { position:relative; }
/* Ambalajlı yumurtalar bant ÜSTÜNDE durur (sepet-içi gömme görünümü tezgâhta yok) */
.home-eggs { margin-bottom:-46px; z-index:3; }
.home-egg-more { margin-bottom:30px; }
.home-nest-empty { margin-bottom:26px; }
/* bant üstü nokta şeridi hafifçe kayar (§2.a "minik bant") */
.home-belt-dots { animation:home-belt-move 2.8s linear infinite; }
@keyframes home-belt-move { to { stroke-dashoffset:-38; } }
/* Rüzgâr Postası balonu — dekor, tezgâhın yanına inmiş (hint hapına dokunmaz) */
.home-balloon {
  position:absolute; right:-4px; top:-24px; width:46px; z-index:1; pointer-events:none;
  filter:drop-shadow(0 5px 5px rgba(74,42,20,.25));
  animation:home-balloon-float 3.6s ease-in-out infinite alternate;
}
.home-balloon svg { width:100%; height:auto; display:block; }
@keyframes home-balloon-float {
  from { transform:translateY(0) rotate(-2deg); }
  to   { transform:translateY(-10px) rotate(3deg); }
}

/* Ambalajlı yumurta: iç sanat sargısı (salla animasyonu ayrı katmanda oynar) */
.home-egg-art { display:block; width:100%; height:100%; }
/* İlk tap: eline al — büyütme + hafif eğim; diğerleri soluklaşır */
.home-eggs.holding { margin-top:22px; }
.home-egg.held {
  animation:home-held-pop .26s cubic-bezier(.3, 1.5, .5, 1);
  rotate:0deg; z-index:7; transform-origin:center bottom;
  transform:translateY(-4px) scale(1.42) rotate(-5deg);
  filter:drop-shadow(0 10px 10px rgba(74, 59, 42, .38));
}
@keyframes home-held-pop {
  from { transform:translateY(0) scale(1) rotate(0deg); }
  to   { transform:translateY(-4px) scale(1.42) rotate(-5deg); }
}
.home-egg.faded { opacity:.38; filter:saturate(.5) drop-shadow(0 3px 3px rgba(74,59,42,.2)); }
/* 400ms basılı tut (veya Salla! butonu): çıngırtı sallaması */
.home-egg-art.shake { animation:home-egg-shake .6s ease; }
@keyframes home-egg-shake {
  0%, 100% { transform:rotate(0deg); }
  15% { transform:rotate(-11deg) translateX(-2px); }
  30% { transform:rotate(10deg) translateX(2px); }
  45% { transform:rotate(-9deg); }
  60% { transform:rotate(8deg); }
  75% { transform:rotate(-5deg); }
  88% { transform:rotate(3deg); }
}
/* Şölen/ek yumurta: vitrine yukarıdan düşer */
.home-egg.drop { animation:home-egg-drop .7s cubic-bezier(.34, 1.4, .56, 1); }
@keyframes home-egg-drop {
  0%   { transform:translateY(-150px) scale(.8); opacity:0; }
  55%  { transform:translateY(6px) scale(1.06, .9); opacity:1; }
  75%  { transform:translateY(-8px) scale(.98, 1.04); }
  100% { transform:translateY(0) scale(1); }
}

/* Eldeyken eylem çubuğu: Salla! (basılı-tut fallback'i) + Geri Koy — ≥64px */
.home-held-actions {
  position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
  display:flex; gap:10px; z-index:8; white-space:nowrap;
}
.home-held-btn { min-height:64px; padding:10px 18px; font-size:17px; }
.home-held-btn .ys-ico { width:24px; height:24px; }

/* Çikolata Kumbarası — tezgâh köşesinde kavanoz (doluluk okumasız görülür) */
.home-jar {
  position:absolute; left:-4px; bottom:0; z-index:6;
  width:76px; min-width:64px; min-height:88px;
  display:flex; flex-direction:column; align-items:center; gap:0;
  border:none; background:transparent; padding:0; cursor:pointer;
  filter:drop-shadow(0 4px 4px rgba(74,42,20,.28));
  transition:transform .1s ease;
}
.home-jar:active { transform:translateY(3px); }
.home-jar svg { width:66px; height:auto; display:block; }
.home-jar-count {
  margin-top:-8px;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF3DF 100%);
  border:2px solid var(--line); border-radius:999px; padding:1px 9px;
  font-family:var(--font-display); font-weight:800; font-size:13.5px; color:var(--ink);
  font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 2px 0 rgba(62,42,28,.18);
}
/* Şölen hazır: altın nefes */
.home-jar.ready svg { animation:home-jar-glow 1.1s ease-in-out infinite alternate; }
.home-jar.ready .home-jar-count {
  background:linear-gradient(180deg, #FFDD66 0%, var(--sun) 60%, var(--sun-deep) 100%);
}
@keyframes home-jar-glow {
  from { filter:drop-shadow(0 0 3px rgba(242,166,27,.4)); }
  to   { filter:drop-shadow(0 0 12px rgba(242,166,27,.95)); }
}
.home-counter-zone.holding .home-jar { opacity:.35; pointer-events:none; }

/* --------- FOILBOOK (Ambalaj Defteri) --------------------------------------- */
.fb-scene {
  min-height:100%;
  padding:14px 12px calc(34px + env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 34% at 50% -4%, rgba(255,214,120,.4), rgba(255,214,120,0) 60%),
    linear-gradient(180deg, #FFEFD1 0%, #FFE2AE 60%, #FFD89E 100%);
}
.fb-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.fb-ribbon {
  position:relative; display:inline-flex; align-items:center; gap:8px; min-width:0;
  background:linear-gradient(180deg, #FFDD66 0%, var(--sun) 55%, var(--sun-deep) 100%);
  border:2.5px solid var(--line); border-radius:14px; padding:7px 14px;
  box-shadow:var(--halo-sm), 0 3px 0 #C98A00, inset 0 2px 0 rgba(255,255,255,.55);
}
.fb-ribbon::before, .fb-ribbon::after {
  content:''; position:absolute; top:9px; width:16px; height:70%; z-index:-1;
  background:var(--sun-deep); border:2.5px solid var(--line); border-radius:6px;
}
.fb-ribbon::before { left:-10px; transform:rotate(-8deg); }
.fb-ribbon::after { right:-10px; transform:rotate(8deg); }
.fb-ribbon-ico {
  display:inline-flex; align-items:center; justify-content:center;
  width:32px; height:32px; flex:0 0 auto;
  background:#FFFFFF; border:2px solid var(--line); border-radius:50%;
  box-shadow:0 2px 0 rgba(62,42,28,.18);
}
.fb-ribbon-ico svg { width:22px; height:22px; }
.fb-ribbon-ico .ico-fallback { font-size:17px; }
.fb-title { font-size:21px; color:var(--ink); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.fb-shell {
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF6E6 100%);
  border:2.5px solid var(--line); border-radius:999px; padding:7px 14px 7px 10px;
  font-family:var(--font-display); font-weight:800; font-size:17px;
  font-variant-numeric:tabular-nums;
  box-shadow:0 3px 0 rgba(62,42,28,.16), 0 6px 12px rgba(122,74,32,.12);
}
.fb-shell .ys-ico { width:22px; height:22px; }

/* Seri sekmeleri: yatay kaydırmalı şerit (sayfa gövdesi asla yatay taşmaz) */
.fb-tabs {
  display:flex; gap:8px; overflow-x:auto; overflow-y:hidden;
  padding:12px 2px 10px; margin:0 -2px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.fb-tabs::-webkit-scrollbar { display:none; }
.fb-tab {
  flex:0 0 auto; min-height:64px; min-width:106px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border:2.5px solid var(--line); border-radius:var(--radius-sm);
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF3DF 100%);
  color:var(--ink); font-family:var(--font-display); cursor:pointer; padding:6px 12px;
  box-shadow:0 3px 0 rgba(62,42,28,.16), 0 6px 10px rgba(122,74,32,.12),
    inset 0 2px 0 rgba(255,255,255,.7);
  transition:transform .1s ease, box-shadow .1s ease;
}
.fb-tab:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(62,42,28,.16); }
.fb-tab.active {
  background:linear-gradient(180deg, #FFDD66 0%, var(--sun) 55%, var(--sun-deep) 100%);
  box-shadow:var(--halo-sm), 0 3px 0 #C98A00, inset 0 2px 0 rgba(255,255,255,.55);
  transform:translateY(1px);
}
.fb-tab-dot { width:18px; height:18px; border-radius:50%;
  border:2px solid var(--line); box-shadow:inset 0 2px 0 rgba(255,255,255,.5); }
.fb-tab-name { font-size:14px; font-weight:700; white-space:nowrap; }
.fb-tab-count { font-family:var(--font-body); font-weight:700; font-size:13.5px;
  color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.fb-tab.active .fb-tab-count { color:var(--ink); font-weight:800; }

/* Defter sayfası — kâğıt sticker (alb-page reçetesi) */
.fb-page {
  position:relative;
  background:
    radial-gradient(rgba(122,74,32,.05) 1.4px, transparent 1.6px) 0 0 / 22px 22px,
    linear-gradient(180deg, #FFFDF4 0%, var(--paper) 100%);
  border:2.5px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--halo-sm), 0 5px 0 rgba(62,42,28,.14), 0 14px 24px rgba(122,74,32,.18);
  padding:14px 12px 14px;
}
.fb-page::before {
  content:''; position:absolute; inset:7px; pointer-events:none;
  border:2px dashed rgba(138,107,79,.4); border-radius:calc(var(--radius) - 8px);
}
.fb-page-head { position:relative; z-index:1;
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  margin:0 2px 8px; }
.fb-page-name { font-family:var(--font-display); font-weight:800; font-size:21px;
  color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.fb-progress-num { font-family:var(--font-display); font-size:16px; color:var(--ink);
  white-space:nowrap; }
.fb-progress-num b { font-size:20px; color:var(--accent-deep);
  font-variant-numeric:tabular-nums; }
.fb-progress-bar {
  position:relative; z-index:1; height:14px; border-radius:999px; margin:0 2px 12px;
  background:#F3E6CC; border:2px solid rgba(62,42,28,.28);
  box-shadow:inset 0 2px 3px rgba(62,42,28,.16); overflow:hidden;
}
.fb-progress-fill {
  display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg, var(--sun), var(--accent));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5);
  transition:width .4s ease;
}

/* Tamamlama ödül çipleri (4/8 · 8/8) */
.fb-chips { position:relative; z-index:1; display:flex; gap:8px; margin-bottom:12px; }
.fb-chip {
  flex:1; min-height:66px; min-width:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border:2.5px solid var(--line); border-radius:var(--radius-sm);
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF3DF 100%);
  color:var(--ink); font-family:var(--font-display); cursor:pointer;
  box-shadow:0 3px 0 rgba(62,42,28,.16), 0 6px 10px rgba(122,74,32,.12),
    inset 0 2px 0 rgba(255,255,255,.7);
  transition:transform .1s ease, box-shadow .1s ease;
}
.fb-chip:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(62,42,28,.16); }
.fb-chip b { font-size:18px; font-weight:800; }
.fb-chip small { display:inline-flex; align-items:center; gap:3px;
  font-family:var(--font-body); font-weight:700; font-size:13.5px;
  color:var(--ink-soft); white-space:nowrap; }
.fb-chip small .ys-ico { width:15px; height:15px; }
/* Kilitli ödül çipi: şeker-hap (--sun ~%60 doygunluk) + gofre — bej-gri yasak */
.fb-chip.locked {
  background:linear-gradient(180deg, #FFEDB3 0%, #F5D77E 100%);
  border-color:rgba(62,42,28,.45);
  box-shadow:inset 0 3px 6px rgba(122,74,32,.22), inset 0 -2px 0 rgba(255,255,255,.5);
}
.fb-chip.locked small { color:var(--ink); }
.fb-chip.done { background:linear-gradient(180deg, #EDFAD9 0%, #D8F2BC 100%); }
.fb-chip.done small { color:var(--meadow-deep); font-weight:800; }
.fb-chip.ready {
  background:linear-gradient(180deg, #FFDD66 0%, var(--sun) 55%, var(--sun-deep) 100%);
  box-shadow:var(--halo-sm), 0 3px 0 #C98A00, inset 0 2px 0 rgba(255,255,255,.55);
  animation:fb-chip-glow 1.1s ease-in-out infinite alternate;
}
