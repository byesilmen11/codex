  // =======================================================================
  // AŞAMALAR — her aşama { enter, input, complete, skip } (docs/v2/06 §5.4)
  // =======================================================================
  var stages = {};

  // ---------- b. FOLYO YIRTMA ----------
  stages.folyo = {
    enter: function () {
      var R = rc();
      needStrips = fast ? R.HIZLI_SERIT : R.SERIT;
      torn = 0; dragging = false; dragAcc = 0;
      if (eggWrapEl) eggWrapEl.className = 'cere-egg-wrap arriving';
      renderWrapper();
      slater(function () { // smoke-uyum: .cere-egg-wrap.warm (sallanma) folyo boyunca kalır
        if (eggWrapEl) eggWrapEl.className = 'cere-egg-wrap warm';
      }, 700);
      if (tabEl) tabEl.hidden = false;
      setHint(fast ? 'Folyoyu çek!' : 'Folyoyu sıyır! Şeridi çek'); // el jesti cere-hand illüstrasyonundadır
      play('pop');
    },
    input: function (e) {
      if (e.type === 'pointerdown') {
        var sc = e.target && e.target.closest && e.target.closest('.rit-scrap');
        if (sc) { // düşen parça: itince hışırdar
          play('crinkle');
          sc.classList.add('nudge');
          later(function () { sc.classList.remove('nudge'); }, 450);
          return;
        }
        dragging = true; dragLastX = e.clientX; dragAcc = 0;
        crinkleStart(); // sürekli doku başlar; hız gain'i modüle eder
      } else if (e.type === 'pointermove' && dragging) {
        var step = Math.abs(e.clientX - dragLastX);
        dragAcc += step;
        dragLastX = e.clientX;
        crinkleLevel(Math.min(1, step / 24));
        var w = (stageEl && stageEl.clientWidth) || 360;
        if (dragAcc >= w * 0.30) { dragAcc = 0; tearOne(); } // sürükleme ≥ %30 genişlik = 1 şerit
      } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        dragging = false;
        crinkleStop();
        var wasTap = e.type === 'pointerup' &&
          downT && moved < TAP_SLOP && (Date.now() - downT) < TAP_MS;
        if (wasTap && downOnObj) tearOne(); // ambalaja tap = kulakçık fallback'i (cancel sayılmaz)
      }
    },
    complete: function () { // kalan şeritler tek harekette soyulur (~1 sn)
      if (advancing) return;
      if (torn >= needStrips) return;
      advancing = true;
      (function step () {
        if (!mounted) return;
        if (torn < needStrips) { tearCore(); slater(step, 140); }
        else finishFolyo();
      })();
    },
    skip: function () {
      if (torn < needStrips) {
        var wasGolden = torn === 0 && wrapper && wrapper.golden;
        torn = needStrips;
        renderWrapper();
        if (wasGolden) goldenReveal();
      }
      dragging = false;
      crinkleStop();
      if (tabEl) tabEl.hidden = true;
      setHint('');
      next();
    }
  };
  function visTornOf () {
    if (torn <= 0) return 0;
    if (torn >= needStrips) return 3;
    return Math.min(3, Math.ceil(3 * torn / needStrips));
  }
  function renderWrapper () { if (objEl) objEl.innerHTML = artWrapper(visTornOf()); }
  function goldenReveal () { // §2.f: ilk şeritte altın parlar + özel fanfar + altın ışık
    if (stageEl) stageEl.classList.add('golden');
    if (glowEl) {
      glowEl.style.background =
        'radial-gradient(circle at 50% 42%, rgba(255,231,150,.9), rgba(255,199,52,.5) 40%, rgba(255,199,52,0) 75%)';
      glowEl.classList.add('show');
    }
    if (burstEl) burstEl.innerHTML = '<div class="rit-flash-gold"></div>';
    play('goldenFanfare');
    vibrate([30, 40, 90]);
    setHint('ALTIN FOLYO!');
    toast('Altın folyo buldun!');
  }
  function tearCore () { // tek şerit: görsel + parça + ses (bitiş kontrolü çağıranda)
    torn += 1;
    renderWrapper();
    play('foilTear');
    vibrate(12);
    if (wrapper && wrapper.golden && torn === 1) goldenReveal();
    if (scrapsEl) {
      var d = document.createElement('div');
      d.className = 'rit-scrap';
      var dir = (torn % 2 === 0) ? 1 : -1;
      // parça yumurta silüetinin (ve E bandındaki seri adının) üstüne binmeden
      // yana savrulur: yatay ofsetler yumurta yarı genişliğinin dışına taşar
      d.style.setProperty('--mx', (dir * (85 + Math.random() * 45)).toFixed(0) + 'px');
      d.style.setProperty('--dx', (dir * (115 + Math.random() * 60)).toFixed(0) + 'px');
      d.style.setProperty('--mr', (dir * (40 + Math.random() * 40)).toFixed(0) + 'deg');
      d.style.setProperty('--rot', (dir * (110 + Math.random() * 90)).toFixed(0) + 'deg');
      d.innerHTML = artScrap();
      scrapsEl.appendChild(d);
      later(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 4200);
    }
  }
  function tearOne () {
    if (advancing || torn >= needStrips) return;
    tearCore();
    if (torn >= needStrips) { advancing = true; finishFolyo(); }
  }
  function finishFolyo () {
    advancing = true;
    dragging = false;
    crinkleStop();
    if (tabEl) tabEl.hidden = true;
    setHint('');
    play('chime'); // kısa parlak "reveal" tınısı
    slater(next, 480);
  }

  // ---------- c. ÇİKOLATA ----------
  stages.cikolata = {
    enter: function () {
      var R = rc();
      needBites = R.ISIRIK; bites = 0; chocoDone = false;
      if (eggWrapEl) eggWrapEl.className = 'cere-egg-wrap';
      if (scrapsEl) scrapsEl.innerHTML = '';
      if (objEl) objEl.innerHTML = artChocolate(0);
      if (fast) { // hızlı mod: son tercihe göre otomatik (§3)
        advancing = true;
        setHint('');
        slater(function () {
          if (fastChoice === 'biriktir') bankNow(true);
          else { // tek ısırıkta ham
            engineEat();
            bites = needBites; chocoDone = true;
            if (objEl) objEl.innerHTML = artChocolate(4);
            play('bite'); play('mmm');
            slater(next, 450);
          }
        }, 380);
        return;
      }
      setHint('Isır ya da biriktir!');
      if (actionsEl) {
        actionsEl.innerHTML =
          '<button class="btn btn-primary rit-btn" id="rit-eat">Ye!</button>' +
          '<button class="btn btn-soft rit-btn" id="rit-bank">Biriktir!</button>';
        var be = actionsEl.querySelector('#rit-eat');
        var bb = actionsEl.querySelector('#rit-bank');
        if (be) be.addEventListener('click', function () { play('click'); biteOne(); });
        if (bb) bb.addEventListener('click', function () { play('click'); bankNow(false); });
      }
    },
    input: function (e) {
      if (e.type === 'pointerdown' && !chocoDone) {
        if (e.target && e.target.closest && e.target.closest('#rit-obj')) biteOne();
      }
    },
    complete: function () { // kalan ısırıklar tek lokmada: "Ham!"
      if (advancing || chocoDone) return;
      advancing = true; chocoDone = true;
      while (bites < needBites) { bites += 1; engineEat(); }
      if (objEl) objEl.innerHTML = artChocolate(4);
      if (actionsEl) actionsEl.innerHTML = '';
      setHint('Ham! Mmm…');
      play('bite'); play('mmm');
      vibrate(12);
      slater(next, 550);
    },
    skip: function () {
      if (!chocoDone) { // çikolata kaybolmaz: son tercih sessizce uygulanır
        chocoDone = true;
        if (fastChoice === 'biriktir') engineBank();
        else engineEat();
      }
      if (actionsEl) actionsEl.innerHTML = '';
      setHint('');
      next();
    }
  };
  function biteOne () {
    if (advancing || chocoDone || bites >= needBites) return;
    bites += 1;
    var gain = engineEat();
    play('bite');
    if (bites % 2 === 1) play('mmm'); // abartısız: tat mizahı, iştah reklamı değil (§2.c)
    vibrate(8);
    if (objEl) objEl.innerHTML = artChocolate(Math.min(4, Math.ceil(4 * bites / needBites)));
    if (gain > 0) { play('star'); starFloat('+' + gain); }
    if (bites >= needBites) {
      chocoDone = true; advancing = true;
      if (actionsEl) actionsEl.innerHTML = '';
      setHint('');
      slater(next, 550);
    }
  }
  function bankNow (fastMode) {
    if (chocoDone) return;
    chocoDone = true; advancing = true;
    var n = engineBank();
    play('jarClink');
    if (eggWrapEl) eggWrapEl.classList.add('to-jar');
    if (actionsEl) actionsEl.innerHTML = '';
    setHint('');
    if (!fastMode) toast('Kumbarada ' + n + ' çikolata');
    slater(function () {
      if (eggWrapEl) eggWrapEl.classList.remove('to-jar');
      next();
    }, fastMode ? 420 : 700);
  }
  function starFloat (text) {
    if (!stageEl) return;
    // hızlı ardışık ısırıkta iki pill üst üste binip "çift basım" gibi
    // okunmasın: yenisi gelmeden eskisi kaldırılır + küçük x kayması
    var old = stageEl.querySelector('.rit-star-float');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var f = document.createElement('div');
    f.className = 'rit-star-float';
    f.style.left = (52 + Math.random() * 14).toFixed(0) + '%';
    f.innerHTML = esc(text) + iw(icoStar());
    stageEl.appendChild(f);
    later(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 1100);
  }

  // ---------- d. KAPSÜL AÇMA ----------
  stages.kapsul = {
    enter: function () {
      capStage = 0; capOpened = false;
      twisting = false; twistAcc = 0; twistTaps = 0; holdT0 = 0; holdTapCount = 0; ringStep = 0;
      method = resolveMethod();
      // çekiçte tüm sahne ritim hedefidir (kaçırmak imkânsız) → hedef-dışı tap complete sayılmaz
      stages.kapsul.allTaps = (method === 'cekic');
      if (eggWrapEl) eggWrapEl.className = 'cere-egg-wrap capsule';
      renderCapsule();
      // nadirlik aurası (iç ışıma halkasının sahne yansıması; ipucu merdiveni 3. basamak)
      var tier = tierOf();
      if (glowEl && tier >= 1 && !(wrapper && wrapper.golden)) {
        var renk = rarityInfo(result.rarity).renk;
        glowEl.style.background =
          'radial-gradient(circle at 50% 46%, ' + renk + '44 0%, ' + renk + '22 40%, transparent 72%)';
        glowEl.classList.add('show');
      }
      if (tier >= 2 && kikiEl) { // nazik fren: Kiki tek satır (atlama yine serbest — §2.d)
        kikiEl.textContent = 'Kiki: "Bunu kaçırma!"';
        kikiEl.hidden = false;
        slater(function () { if (kikiEl) kikiEl.hidden = true; }, 2600);
      }
      if (method === 'cekic') {
        setHint(fast ? 'Tık… KIRT!' : 'Halkaya dokun: tık, tık, KIRT! 👆');
        showRing(0);
      } else if (method === 'firlat') {
        setHint(fast ? 'Bas, salla, bırak!' : 'Basılı tut, salla… bırak! 🚀');
      } else if (method === 'sihir') {
        setHint(fast ? 'Parmağını bas ve tut ✨' : 'Parmağını bas ve tut… ışık büyüsün ✨');
      } else {
        setHint(fast ? 'Çevir!' : 'Yaprak sapını çevir! 🌀');
      }
    },
    input: function (e) { capsuleInput(e); },
    allTaps: false, // enter'da yönteme göre ayarlanır (çekiç: true)
    complete: function () { openCapsule(false); }, // tek/çift tap = anında POP (§2.d)
    skip: function () { openCapsule(true); }
  };
  function resolveMethod () {
    if (tierOf() >= 2) return 'sihir'; // Destansı+ kapsülde otomatik teklif; satılmaz
    var tool = st().activeTool;
    if (tool === 'sedefburgu') return 'burgu'; // kozmetik varyant aynı jest ailesi
    if (tool === 'burgu' || tool === 'cekic' || tool === 'firlat' || tool === 'sihir') return tool;
    return 'burgu';
  }
  function renderCapsule () { if (objEl) objEl.innerHTML = artCapsule(); }
  function crackTo1 () {
    if (capStage >= 1) return;
    capStage = 1;
    renderCapsule();
    play('capsuleTwist');
    vibrate(18);
  }
  function showRing (i) {
    ringStep = i;
    if (ringsEl) {
      ringsEl.innerHTML = '<div class="cere-ring ring-p' + i + '">' +
        '<span class="cere-ring-finger" aria-hidden="true">👆</span></div>';
    }
  }
  function capsuleInput (e) {
    var onObj = downOnObj; // jest başladığı yere göre (pointerup hedefi güvenilmez)
    // pointercancel tap fallback sayacına İŞLEMEZ (iptal edilen dokunuş jest değildir)
    var wasTap = e.type !== 'pointercancel' &&
      downT && moved < TAP_SLOP && (Date.now() - downT) < TAP_MS;

    if (method === 'cekic') { // MEVCUT ritim halkası kodu — kaçırmak imkânsız, her tap sayılır
      if (e.type !== 'pointerdown') return;
      var need = fast ? 1 : 3;
      if (ringStep >= need - 1) {
        play('hammerKirt');
        openCapsule(false);
      } else {
        play('hammerTik');
        vibrate(14);
        if (ringStep === 0) crackTo1();
        showRing(ringStep + 1);
      }
      return;
    }

    if (method === 'burgu') {
      var NEED = fast ? 240 : 880; // dairesel sürtme birikimi (px)
      if (e.type === 'pointerdown') {
        twisting = true; twLastX = e.clientX; twLastY = e.clientY;
        if (eggWrapEl) eggWrapEl.classList.add('twist-wobble');
      } else if (e.type === 'pointermove' && twisting) {
        var dx = e.clientX - twLastX, dy = e.clientY - twLastY;
        twLastX = e.clientX; twLastY = e.clientY;
        twistAcc += Math.sqrt(dx * dx + dy * dy);
        var now = Date.now();
        if (now - lastTwistSnd > 150) { lastTwistSnd = now; play('capsuleTwist'); }
        var p = Math.max(twistAcc / NEED, twistTaps / TWIST_TAPS);
        if (p >= 0.5) crackTo1();
        if (p >= 1) openCapsule(false);
      } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        twisting = false;
        if (eggWrapEl) eggWrapEl.classList.remove('twist-wobble');
        if (wasTap && onObj) { // tap fallback: art arda dokunuşlar da çevirir
          twistTaps += 1;
          play('capsuleTwist');
          var p2 = Math.max(twistAcc / NEED, twistTaps / (fast ? 1 : TWIST_TAPS));
          if (p2 >= 0.5) crackTo1();
          if (p2 >= 1) openCapsule(false);
        }
      }
      return;
    }

    if (method === 'firlat') {
      var HOLD = fast ? 250 : 400;
      if (e.type === 'pointerdown' && onObj) {
        holdT0 = Date.now();
        if (eggWrapEl) eggWrapEl.classList.add('hold-shake');
        play('shakeRattle');
        vibrate(10);
        (function rattle () { // basılı tutuldukça çıkırtı
          if (holdT0 && !capOpened) { play('shakeRattle'); slater(rattle, 340); }
        })();
      } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        var held = holdT0 ? (Date.now() - holdT0) : 0;
        holdT0 = 0;
        if (eggWrapEl) eggWrapEl.classList.remove('hold-shake');
        if (held >= HOLD) doThrow();
        else if (wasTap && onObj) { // tap fallback: 3 dokunuş = fırlat
          holdTapCount += 1;
          play('tap');
          if (holdTapCount >= (fast ? 1 : 3)) doThrow();
        }
      }
      return;
    }

    if (method === 'sihir') {
      var MAGIC = fast ? 700 : 2000;
      if (e.type === 'pointerdown' && onObj) {
        holdT0 = Date.now();
        play('magicRise');
        if (!magicEl && eggWrapEl) {
          magicEl = document.createElement('div');
          magicEl.className = 'rit-magic';
          eggWrapEl.appendChild(magicEl);
        }
        (function grow () { // ışık büyür; süre dolunca çiçek gibi kendiliğinden açılır
          if (!holdT0 || capOpened || !mounted) return;
          var p = Math.min(1, (Date.now() - holdT0) / MAGIC);
          if (magicEl) {
            magicEl.style.opacity = String(0.35 + p * 0.65);
            magicEl.style.transform = 'scale(' + (0.3 + p * 1.1).toFixed(2) + ')';
          }
          if (p >= 0.6) crackTo1();
          if (p >= 1) { holdT0 = 0; openCapsule(false); return; }
          slater(grow, 90);
        })();
      } else if (e.type === 'pointerup' || e.type === 'pointercancel') {
        var fired = capOpened;
        holdT0 = 0;
        if (!fired) {
          if (magicEl) { magicEl.style.opacity = '0'; magicEl.style.transform = 'scale(.2)'; }
          if (wasTap && onObj) { // tap fallback
            holdTapCount += 1;
            play('magicRise');
            if (holdTapCount >= (fast ? 1 : TWIST_TAPS)) openCapsule(false);
          }
        }
      }
    }
  }
  function doThrow () {
    if (capOpened || advancing) return;
    advancing = true;
    if (eggWrapEl) eggWrapEl.classList.add('thrown');
    play('shakeRattle');
    slater(function () {
      if (eggWrapEl) eggWrapEl.classList.remove('thrown');
      advancing = false;
      openCapsule(false); // zıplar, PAT!
    }, 560);
  }
  // "Ne çıkacak?" anı (unboxing duraklaması): POP'tan hemen önce ~420ms TAM sessizlik +
  // vinyet + hafif zoom. Sync (test) yolu duraklamayı atlar — duman testi senkron kalır.
  var hushing = false;
  function openCapsule (sync) {
    if (capOpened || hushing || !mounted) return;
    if (sync) { popNow(true); return; }
    hushing = true;
    advancing = true;                 // girişler kilitlenir; çift tetik yok
    holdT0 = 0; twisting = false;
    if (eggWrapEl) eggWrapEl.classList.remove('twist-wobble', 'hold-shake', 'thrown');
    if (ringsEl) ringsEl.innerHTML = '';
    if (kikiEl) kikiEl.hidden = true;
    setHint('');
    if (stageEl) stageEl.classList.add('hush');
    slater(function () {
      hushing = false;
      if (stageEl) stageEl.classList.remove('hush');
      popNow(false);
    }, 420);
  }
  function popNow (sync) {
    if (capOpened || !mounted) return;
    capOpened = true; advancing = true;
    holdT0 = 0; twisting = false;
    capStage = 2;
    if (magicEl && magicEl.parentNode) { magicEl.parentNode.removeChild(magicEl); magicEl = null; }
    if (eggWrapEl) {
      eggWrapEl.classList.remove('twist-wobble', 'hold-shake', 'thrown');
      eggWrapEl.classList.add('opened');
    }
    if (ringsEl) ringsEl.innerHTML = '';
    if (kikiEl) kikiEl.hidden = true;
    setHint('');
    renderCapsule();
    play('capsulePop'); // "POP!" + konfeti + tier fanfarı (mevcut kutlama aynen)
    celebrate();
    // Nadirlikte uzayan reveal: doruk anı kademeyle orantılı nefes alır
    var t = tierOf();
    if (sync) next();
    else slater(next, t >= 3 ? 2600 : t === 2 ? 2200 : t === 1 ? 1300 : 900);
  }

  // ---------- e1. KARŞILAŞMA (mevcut mantık: Pufi zıplayarak çıkar; kopyada kısaltılmış) ----------
  stages.karsilasma = {
    enter: function () {
      if (eggWrapEl) eggWrapEl.classList.add('nest-cup'); // alt yarım yuva çanağı olarak kalır
      var kopya = !(result && result.isNew);
      var html = '<div class="cere-pufi' + (kopya ? ' rit-wave' : '') + '">' + pufiSVG('happy') + '</div>';
      if (kopya) { // "boş katman" hissi yasak: Pufi el sallar, parça Kabuk'a dönüşür (§2.e)
        html += '<div class="rit-shell-fly">+' + ((result && result.kabukGained) | 0) +
                iw(icoShell()) + '</div>';
      }
      if (fxEl) fxEl.innerHTML = html;
      play('pop');
      // Her Pufi'nin KENDİ sesi — karşılaşmada ilk kez duyulur (albüm soundboard'la aynı imza)
      if (result && result.pufi) slater(function () { play2('pufiChirp', { id: result.pufi.id }); }, 320);
      var tier = tierOf();
      var dur = kopya ? 1300 : (tier >= 3 ? 2300 : (fast ? 800 : 1800));
      slater(next, dur);
    },
    input: function () {},
    complete: function () { next(); },
    skip: function () { next(); }
  };

  // ---------- e2. KART (mevcut sticker kart aynen; #cere-next korunur) ----------
  stages.kart = {
    enter: function () {
      if (stageEl) stageEl.classList.add('show-card');
      if (ringsEl) ringsEl.innerHTML = '';
      if (scrapsEl) scrapsEl.innerHTML = '';
      setHint('');
      var p = (result && result.pufi) || { ad: '?', bio: '' };
      var ri = rarityInfo(result && result.rarity);
      var badge = (result && result.isNew)
        ? '<span class="cere-badge cere-badge-new">' + iw(icoStar()) + 'Yeni!</span>'
        : '<span class="cere-badge cere-badge-copy">' + iw(icoShell()) + '+' +
          ((result && result.kabukGained) | 0) + '</span>';
      var goldTag = (wrapper && wrapper.golden)
        ? '<span class="cere-badge cere-badge-gold">' + iw(icoStar()) + 'Altın Folyo</span>' : '';
      var btn = (result && result.isNew)
        ? '<button class="btn btn-primary" id="cere-next">Oyuncağını Birleştir!</button>'
        : '<button class="btn btn-primary" id="cere-next">Devam ▶</button>';
      // Seri numarası satırı ("Güneş Çayırı · 7/30") — sonraki merakı doğurur
      var seriSatir = '';
      try {
        var pb = (p.biome || 'cayir'), listP = (Yuvo.data && Yuvo.data.PUFIS) || [];
        var no = 0, tot = 0, ii, q;
        for (ii = 0; ii < listP.length; ii++) {
          q = listP[ii];
          if ((q.biome || 'cayir') !== pb || q.rarity === 'gizli') continue;
          tot += 1;
          if (q.id === p.id) no = tot;
        }
        var bioAd = (Yuvo.data && Yuvo.data.BIOMES && Yuvo.data.BIOMES[pb] && Yuvo.data.BIOMES[pb].ad) ||
                    'Güneş Çayırı';
        if (no > 0) seriSatir = '<p class="cere-serino">' + esc(bioAd) + ' · ' + no + '/' + tot + '</p>';
        else if (p.rarity === 'gizli') seriSatir = '<p class="cere-serino">' + esc(bioAd) + ' · ☾ Gizli Dost</p>';
      } catch (eSer) {}
      if (fxEl) {
        fxEl.innerHTML =
          '<div class="cere-card card">' +
            '<div class="cere-card-rays" aria-hidden="true"></div>' +
            '<div class="cere-portrait rf rf-' + esc(result && result.rarity) + '">' + pufiSVG('happy') + '</div>' +
            '<h2 class="cere-name">' + esc(p.ad) + '</h2>' +
            seriSatir +
            '<div class="cere-tags">' +

    if (placed[partId] || finished) return;
    placed[partId] = true;
    placedCount += 1;

    var slot = slotFor(partId);
    if (slot) {
      slot.classList.remove('near');
      slot.classList.add('filled');
      slot.innerHTML = '<div class="slot-fill">' + partSVG(partId) + '</div><i class="asm-spark">' + sparkSVG() + '</i>';
    }
    var piece = pieceEl || (shelfEl ? shelfEl.querySelector('.asm-piece[data-part="' + partId + '"]') : null);
    if (piece) {
      piece.classList.add('placed');
      piece.style.transform = '';
    }
    play('snap');
    vibrate(20);

    if (placedCount >= parts.length) later(function () { finish(); }, 350);
  }

  function finish () {
    if (finished || !mounted) return;
    finished = true;
    drag = null;
    play('fanfare');
    vibrate([20, 40, 60]);
    if (stageEl) {
      stageEl.innerHTML =
        '<div class="asm-done">' +
          '<div class="asm-confetti" aria-hidden="true">' + confettiHTML(14) + '</div>' +
          '<div class="asm-toy">' + assembledSVG() + '</div>' +
          '<div class="asm-dance">' + pufiHappySVG() + '</div>' +
          '<div class="asm-banner">' + ico('check', '✔') + ' Albüme işlendi!</div>' +
        '</div>';
    }
    later(function () { if (Yuvo.go) Yuvo.go('album'); }, 1000);
  }

  // ---------- sahne API ----------
  Yuvo.scenes.assembly = {
    mount: function (el, params) {
      mounted = true;
      finished = false;
      rootEl = el;
      placed = {}; placedCount = 0; drag = null;
      failCount = 0; idleId = null;

      pufi = findPufi(params && params.pufiId);
      if (!pufi) {
        // Savunmacı: parametre yoksa eldeki ilk Pufi ile devam et, o da yoksa eve dön
        var list = (Yuvo.data && Yuvo.data.PUFIS) || [];
        pufi = list[0] || null;
      }
      if (!pufi) {
        if (Yuvo.toast) Yuvo.toast('Birleştirilecek oyuncak bulunamadı');
        if (Yuvo.go) Yuvo.go('home');
        return;
      }
      parts = getParts();
      render();
    },
    unmount: function () {
      mounted = false;
      clearTimers();
      offDocs();
      drag = null;
      failCount = 0; idleId = null;
      rootEl = null; boardEl = null; shelfEl = null; stageEl = null;
      pufi = null; parts = []; placed = {}; placedCount = 0; finished = false;
    }
  };

  // ---------- test kancası ----------
  // Tüm parçaları anında oturtur ve bitirir; başarı durumunu döndürür.
  Yuvo.test.assemble = function () {
    if (!mounted || finished) return false;
    clearTimers(); // bekleyen 350ms bitiş zamanlayıcıları yerine doğrudan bitir
    for (var i = 0; i < parts.length; i++) {
      if (!placed[parts[i].id]) placePart(parts[i].id);
    }
    finish();
    return true;
  };
})();

/* =====================================================================
   YUVO — FTUE açılışı (docs/v2/04 §1, 0:00–0:55 dilimi) + Luna gün sonu

                2 cümle söyler (Yuvo.dialog)
     isit     : çimende üşüyen yumurta — 3 ovalama/dokunuş ısıtır,
                kabuk ışık sızdırır → introDone=true → ceremony {eggIdx:0}
   Sonrası: ilk albüm ziyaretinde Kiki albümü hediye eder (album.js,
   introGiftShown bayrağı). Yuvo.scenes.intro.playDusk(onDone): Luna'nın
   günbatımı ritüeli (home.js "Günü Bitir" çağırır).

(function () {

  Y.scenes = Y.scenes || {};

  function play (n, o) { try { if (Y.audio && Y.audio.play) Y.audio.play(n, o); } catch (e) {} }
  function later (fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
  function dlg () { return (Y.data && Y.data.DIALOG) || {}; }

  function eggArt () {

      '<ellipse cx="60" cy="64" rx="34" ry="42" fill="#FFF6E3" stroke="#3E2A1C" stroke-width="3.5"/>' +
      '<ellipse cx="48" cy="46" rx="10" ry="6" fill="#FFFFFF" opacity="0.6"/></svg>';
  }

  function starSVG () {
    // Minik yüz: ilk 60 saniyede karakter tanıma — "yüzü olan şey dost" (araştırma: ikon/yüz)
    return '<svg viewBox="0 0 90 90" aria-hidden="true">' +
      '<path d="M45 8 L54 33 L80 35 L60 51 L67 77 L45 62 L23 77 L30 51 L10 35 L36 33 Z"' +
      ' fill="#FFD34D" stroke="#3E2A1C" stroke-width="4" stroke-linejoin="round"/>' +
      '<circle cx="38" cy="30" r="4" fill="#FFFFFF" opacity="0.85"/>' +
      '<circle cx="38.5" cy="42" r="3.1" fill="#3E2A1C"/>' +
      '<circle cx="52.5" cy="42" r="3.1" fill="#3E2A1C"/>' +
      '<circle cx="37.4" cy="41" r="1" fill="#FFFFFF"/>' +
      '<circle cx="51.4" cy="41" r="1" fill="#FFFFFF"/>' +
      '<path d="M39 50 Q 45.5 56 52 50" fill="none" stroke="#3E2A1C" stroke-width="2.6"' +
      ' stroke-linecap="round"/>' +
      '<circle cx="33" cy="47" r="2.6" fill="#FF8FB0" opacity="0.75"/>' +
      '<circle cx="58" cy="47" r="2.6" fill="#FF8FB0" opacity="0.75"/></svg>';
  }

  // Yıldız serpintili gök (dekor) — boş mor bant yerine canlı kompozisyon
  function starfield () {
    var out = '<div class="intro-starfield" aria-hidden="true">';
    for (var i = 0; i < 14; i++) {
      out += '<span class="if-star" style="left:' + (4 + (i * 29) % 92) + '%;top:' +
             (3 + (i * 17) % 52) + '%;animation-delay:' + ((i % 5) * 0.4).toFixed(1) +
             's;font-size:' + (9 + (i * 7) % 12) + 'px">✦</span>';
    }
    return out + '</div>';
  }

  /* ---------- aşamalar ---------- */

  function showKaranlik () {
    phase = 'karanlik';
    el.innerHTML =
      '<div class="intro-stage intro-dark">' +
        '<div class="intro-glow-egg beat" aria-hidden="true">' + eggArt() + '</div>' +
      '</div>';
    play('chime');
    later(showYildiz, 1800);                    // hedef: ilk çıtlamaya ≤25 sn
  }

  function showYildiz () {
    phase = 'yildiz';
    el.innerHTML =
      '<div class="intro-stage intro-dusk">' +
        starfield() +
        '<div class="intro-hills" aria-hidden="true"></div>' +
        '<button class="intro-star" aria-label="Yıldıza dokun">' +
          '<span class="intro-star-tail" aria-hidden="true"></span>' +
          '<span class="intro-star-ring" aria-hidden="true"></span>' +
          '<span class="intro-star-body">' + starSVG() + '</span>' +
        '</button>' +
      '</div>';
    var btn = el.querySelector('.intro-star');
    btn.addEventListener('click', function onStar () {
      btn.removeEventListener('click', onStar);
      btn.classList.add('caught');
      play('magicRise');
      play('star');
      var D = dlg();
      var lines = (D.anlatici && D.anlatici.giris) || [];
      if (Y.dialog && lines.length) {
        // Balonlar OTOMATİK akar (dokunuş atlatır) — okuma beklemeden ritim
        Y.dialog.say({ kim: null, metin: lines[0], sure: 2400 });
        Y.dialog.say({ kim: null, metin: lines[1] || '', sure: 2400, cb: function () { showIsit(); } });
      } else {
        later(showIsit, 900);
      }
    });
  }

  function showIsit () {
    phase = 'isit';
    warmth = 0; rubAcc = 0; lastXY = null;
    el.innerHTML =
      '<div class="intro-stage intro-dawn">' +
        '<div class="intro-hills lit" aria-hidden="true"></div>' +
        '<p class="intro-hint">Üşümüş… ısıtır mısın?</p>' +
        '<button class="intro-egg shiver" aria-label="Yumurtayı ovarak ısıt">' +

        '</button>' +
        '<div class="intro-hand" aria-hidden="true">🖐</div>' +
      '</div>';
    var egg = el.querySelector('.intro-egg');
    // Ovalama: parmak yumurta üstünde gezindikçe ısınır; tap da sayılır
    egg.addEventListener('pointermove', function (e) {
      if (e.buttons === 0 && e.pointerType !== 'touch') return;
      if (lastXY) {
        rubAcc += Math.abs(e.clientX - lastXY[0]) + Math.abs(e.clientY - lastXY[1]);
        if (rubAcc > 90) { rubAcc = 0; warmUp(); }
      }
      lastXY = [e.clientX, e.clientY];

    egg.addEventListener('click', function () { warmUp(); });
  }

  function warmUp () {
    if (phase !== 'isit' || warmth >= 3) return;
    warmth += 1;
    play(warmth >= 3 ? 'crack' : 'pop');
    var egg = el.querySelector('.intro-egg');
    if (egg) {
      egg.classList.remove('shiver');
      egg.classList.add('warm-' + warmth);
      egg.classList.remove('pulse'); void egg.offsetWidth; egg.classList.add('pulse');
    }
    if (warmth >= 3) {
      var hint = el.querySelector('.intro-hint');
      if (hint) hint.textContent = 'Isındı! Kabuk ışıldıyor…';
      later(finishIntro, 700);
    }

  function finishIntro () {
    var s = st();
    s.introDone = true;
    if (Y.engine && Y.engine.save) Y.engine.save();
    if (Y.dialog) Y.dialog.clear();
    if (Y.go) Y.go('ceremony', { eggIdx: 0 });

  // Sahneden bağımsız tam ekran örtü; onDone en sonda çağrılır (newDay orada).
  function playDusk (onDone) {
    var app = document.getElementById('app') || document.body;
    var wrap = document.createElement('div');
    wrap.className = 'dusk-layer';
    var stars = '';
    for (var i = 0; i < 9; i++) {
      stars += '<span class="dusk-star" style="left:' + (8 + (i * 37) % 84) + '%;top:' +
               (6 + (i * 23) % 38) + '%;animation-delay:' + (i * 0.35) + 's">✦</span>';
    }
    var lunaArt = '';
    if (Y.art && Y.art.story && Y.art.story.portre) {
      try { lunaArt = Y.art.story.portre('luna', { mood: 'sleep' }) || ''; } catch (e) {}
    }
    wrap.innerHTML =
      '<div class="dusk-sky" aria-hidden="true">' + stars + '</div>' +
      (lunaArt ? '<div class="dusk-luna" aria-hidden="true">' + lunaArt + '</div>' : '');
    app.appendChild(wrap);
    void wrap.offsetWidth;
    wrap.classList.add('on');
    play('chime');

    function bitir () {
      wrap.classList.remove('on');
      setTimeout(function () {
        if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
        if (typeof onDone === 'function') { try { onDone(); } catch (e) {} }
      }, 650);
    }
    var D = dlg();
    var ninni = (D.luna && D.luna.ninni) || [];
    if (Y.dialog && ninni.length) {
      // Sakin otomatik akış (dokunuş atlatır) — kapanış ritmi çocuğu bekletmez
      Y.dialog.say({ kim: 'luna', mood: 'sleep', metin: ninni[0], sure: 2600 });
      Y.dialog.say({ kim: 'luna', mood: 'sleep', metin: ninni[1] || '', sure: 2600, cb: bitir });
    } else {
      setTimeout(bitir, 1400);
    }
  }

  /* ---------- sahne API ---------- */
  Y.scenes.intro = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'intro-scene';
      rootEl.appendChild(el);
      showKaranlik();
    },
    unmount: function () {
      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];

      if (el && el.parentNode) el.parentNode.removeChild(el);
      el = null;
    },
    playDusk: playDusk
  };

  /* ---------- test kancaları ---------- */
  Y.test = Y.test || {};
  Y.test.skipIntro = function () {
    var s = st();
    s.introDone = true;
    if (Y.engine && Y.engine.save) Y.engine.save();

    if (Y.engine && Y.engine.save) Y.engine.save();
    if (Y.go) Y.go('intro');
    return true;
  };
  Y.test.introWarm = function () { warmUp(); return warmth; };
})();

        b.setAttribute('data-key', 'del');
      } else if (k === 'ok') {
        b.className = 'par-key par-key-ok';
        b.setAttribute('aria-label', 'Onayla');
        b.textContent = '✓';
        b.setAttribute('data-key', 'ok');
      } else {
        b.textContent = k;
        b.setAttribute('data-key', k);
      }
      pad.appendChild(b);
    }
    wrap.appendChild(pad);

    var hint = el('p', 'par-gate-hint', 'DEMO — varsayılan PIN: 1234');
    wrap.appendChild(hint);

    var back = el('button', 'par-btn par-btn-ghost par-gate-back', 'Oyuna dön');
    back.type = 'button';
    wrap.appendChild(back);

    root.appendChild(wrap);

    function paintDots() {
      var ds = dots.querySelectorAll('.par-dot');
      for (var j = 0; j < ds.length; j++) {
        if (j < pinBuf.length) ds[j].classList.add('is-on');
        else ds[j].classList.remove('is-on');
      }
    }

    function setMsg(t, kind) {
      live.textContent = t || '';
      live.className = 'par-gate-msg' + (kind ? ' par-msg-' + kind : '');
    }

    function locked() { return Date.now() < lockUntil; }

    function setKeysDisabled(v) {
      var bs = pad.querySelectorAll('.par-key');
      for (var j = 0; j < bs.length; j++) bs[j].disabled = !!v;
    }

    function startLockCountdown() {
      setKeysDisabled(true);
      wrap.classList.add('is-locked');
      var tick = function () {
        var left = Math.ceil((lockUntil - Date.now()) / 1000);
        if (left <= 0) {
          setKeysDisabled(false);
          wrap.classList.remove('is-locked');
          tries = 0;
          setMsg('Tekrar deneyebilirsiniz.', null);
          return;
        }
        setMsg(left + ' saniye sonra tekrar deneyebilirsiniz.', 'err');
        later(tick, 1000);
      };
      tick();
    }

    function submit() {
      if (locked()) return;
      if (pinBuf.length !== 4) {
        setMsg('4 hane girin.', 'warn');
        return;
      }
      if (pinBuf === currentPin()) {
        unlocked = true;
        pinBuf = '';
        tries = 0;
        renderPanel();
        return;
      }
      tries++;
      pinBuf = '';
      paintDots();
      if (tries >= MAX_TRIES) {
        lockUntil = Date.now() + LOCK_SECONDS * 1000;
        startLockCountdown();
      } else {
        setMsg('PIN yanlış. Kalan deneme: ' + (MAX_TRIES - tries), 'err');
      }
    }

    on(pad, 'click', function (ev) {
      var t = ev.target;
      while (t && t !== pad && !t.getAttribute) t = t.parentNode;
      if (!t || t === pad) return;
      var key = t.getAttribute('data-key');
      if (!key) return;
      if (locked()) return;
      if (key === 'del') {
        pinBuf = pinBuf.slice(0, -1);
        paintDots();
        setMsg('', null);
        return;
      }
      if (key === 'ok') { submit(); return; }
      if (pinBuf.length < 4) {
        pinBuf += key;
        paintDots();
        setMsg('', null);
        if (pinBuf.length === 4) later(submit, 120);
      }
    });

    on(back, 'click', function () { goHome(); });

    if (locked()) startLockCountdown();
    paintDots();
  }

   * ------------------------------------------------------------------- */
  function wishAgeDays(w) {
    var ts = Number(w && w.ts) || 0;
    if (!ts) return 0;
    return Math.max(0, Math.floor((Date.now() - ts) / 86400000));
  }

  // Ücretsiz yumurtalarla kaba varış tahmini (goal-gradient kaygı söndürücü):
  // beklenen yumurta ≈ havuz / oran; günde 3 ücretsiz hak. Akıllı düşüş eksik
  // parçayı kayırdığından bu ÜST sınıra yakın bir tahmindir — abartı değil.
  function freeEtaDays(p) {
    var ORAN = { yaygin: 0.55, azbulunur: 0.25, nadir: 0.14, destansi: 0.046, efsanevi: 0.009 };
    var HAVUZ = { yaygin: 12, azbulunur: 9, nadir: 6, destansi: 2, efsanevi: 1 };
    var r = String((p && p.rarity) || '');
    if (!ORAN[r]) return 0;                       // gizli vb. → tahmin verilmez
    var rInfo = null;
    try { rInfo = Yuvo.data && Yuvo.data.RARITIES && Yuvo.data.RARITIES[r]; } catch (e) {}
    var oran = (rInfo && typeof rInfo.oran === 'number') ? rInfo.oran : ORAN[r];
    var beklenen = Math.ceil(HAVUZ[r] / oran);
    if (r === 'efsanevi') beklenen = Math.min(beklenen, 50);  // kötü şans koruması tavanı
    return Math.max(1, Math.ceil(beklenen / 3));
  }

  function findWish(id) {
    var arr = state().wishes || [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] && String(arr[i].pufiId) === String(id)) return arr[i];
    }
    return null;
  }

  function renderWishJar() {
    var s = state();
    var card = el('section', 'par-card par-wish');
    card.appendChild(el('h2', 'par-card-title', 'Dilek Kavanozu'));
    card.appendChild(el('p', 'par-card-sub', 'Çocuğunuzun oyundan işaretlediği Pufi’ler. Satın alma zorunluluğu yoktur; “Şimdi değil” demeniz çocuğun ekranında hiçbir iz bırakmaz.'));

    var wishes = s.wishes || [];
    if (!wishes.length) {
      card.appendChild(el('p', 'par-empty', 'Henüz dilek yok'));
      return card;
    }

    var list = el('ul', 'par-wish-list');
    var bigSeen = false;

    for (var i = 0; i < wishes.length; i++) {
      var w = wishes[i] || {};
      var pid = w.pufiId;
      var p = pufiById(pid) || { id: pid, ad: String(pid || 'Pufi'), rarity: '—' };
      var big = isBigRarity(p.rarity);
      if (big) bigSeen = true;

      var li = el('li', 'par-wish-row' + (w.durum === 'sonra' ? ' is-later' : ''));
      var art = el('span', 'par-wish-art', pufiSVG(p));
      art.setAttribute('aria-hidden', 'true');
      li.appendChild(art);

      var meta = el('span', 'par-wish-meta');
      var nameRow = el('span', 'par-wish-name', esc(p.ad || pid));
      if (w.not === 'dogumgunu') nameRow.innerHTML += ' <span class="par-wish-chip">🎂 doğum günü</span>';
      if (w.durum === 'sonra') nameRow.innerHTML += ' <span class="par-wish-chip par-chip-mute">şimdi değil</span>';
      meta.appendChild(nameRow);
      var rInfo = (window.Yuvo && Yuvo.data && Yuvo.data.RARITIES && Yuvo.data.RARITIES[p.rarity]) || null;
      meta.appendChild(el('span', 'par-wish-rarity', esc((rInfo && rInfo.ad) || p.rarity || '—')));
      // Kart+ satırı: yaş + ücretsiz varış tahmini — satın alma tek yol DEĞİL mesajı
      var age = wishAgeDays(w);
      var eta = freeEtaDays(p);
      var satir = (age === 0 ? 'Bugün eklendi' : age + ' gündür kavanozda');
      if (big) satir += ' · oyunla gelir (vaat olarak satılmaz)';
      else if (eta > 0) satir += ' · ücretsiz yumurtalarla ~' + eta + ' günde gelebilir';
      meta.appendChild(el('span', 'par-wish-eta', esc(satir)));
      li.appendChild(meta);

      var acts = el('span', 'par-wish-acts');
      if (!big) {
        var git = el('button', 'par-btn par-btn-quiet par-wish-act', 'Kiler’e ekle');
        git.type = 'button';
        git.setAttribute('data-wishgo', String(pid));
        git.setAttribute('aria-label', (p.ad || pid) + ' için paketlere bak');
        acts.appendChild(git);
      }
      var sonra = el('button', 'par-btn par-btn-quiet par-wish-act', w.durum === 'sonra' ? 'Geri al' : 'Şimdi değil');
      sonra.type = 'button';
      sonra.setAttribute('data-wishlater', String(pid));
      acts.appendChild(sonra);
      var dg = el('button', 'par-btn par-btn-quiet par-wish-act', w.not === 'dogumgunu' ? '🎂 Notu sil' : '🎂 Not');
      dg.type = 'button';
      dg.setAttribute('data-wishnot', String(pid));
      dg.setAttribute('aria-label', 'Doğum günü notu');
      acts.appendChild(dg);
      var rm = el('button', 'par-btn par-btn-quiet par-wish-rm', 'Kaldır');
      rm.type = 'button';
      rm.setAttribute('data-wish', String(pid));
      rm.setAttribute('aria-label', (p.ad || pid) + ' dileğini kaldır');
      acts.appendChild(rm);
      li.appendChild(acts);

      list.appendChild(li);
    }
    card.appendChild(list);

    if (bigSeen) {
      card.appendChild(el('p', 'par-note par-note-warn',
        'Efsanevi vaat olarak satılmaz — oyunla gelir. Bu dilekler için paket önerilmez.'));
    }

    on(list, 'click', function (ev) {
      var t = ev.target;
      while (t && t !== list && !(t.getAttribute &&
        (t.getAttribute('data-wish') || t.getAttribute('data-wishnot') ||
         t.getAttribute('data-wishlater') || t.getAttribute('data-wishgo')))) t = t.parentNode;
      if (!t || t === list) return;
      var id, w;
      if ((id = t.getAttribute('data-wishgo'))) {
        var pk = root && root.querySelector('.par-packs-card');
        if (pk && pk.scrollIntoView) { try { pk.scrollIntoView({ behavior: 'smooth' }); } catch (e) { pk.scrollIntoView(); } }
        return;
      }
      if ((id = t.getAttribute('data-wishlater'))) {
        w = findWish(id);
        if (w) {
          if (w.durum === 'sonra') delete w.durum; else w.durum = 'sonra';
          save();
          toast(w.durum === 'sonra' ? 'Not edildi — çocuğun ekranında hiçbir şey değişmez.' : 'İşaret kaldırıldı.');
          renderPanel();
        }
        return;
      }
      if ((id = t.getAttribute('data-wishnot'))) {
        w = findWish(id);
        if (w) {
          if (w.not === 'dogumgunu') delete w.not; else w.not = 'dogumgunu';
          save();
          toast(w.not === 'dogumgunu' ? 'Doğum günü notu eklendi.' : 'Doğum günü notu kaldırıldı.');
          renderPanel();
        }
        return;
      }
      id = t.getAttribute('data-wish');
      var done = engineCall('clearWish', id, null);
      if (done === null) {
        var st = state();
        var arr = st.wishes || [];
        for (var j = arr.length - 1; j >= 0; j--) {
          if (arr[j] && String(arr[j].pufiId) === String(id)) arr.splice(j, 1);
        }
        st.wishes = arr;
        save();
      }
      toast('Dilek kaldırıldı');
      renderPanel();
    });

    return card;
  }

      openFor(t.getAttribute('data-pack'));

      openFor(t.getAttribute('data-pack'));

  function doPurchase(p) {
    var res = engineCall('buyPack', p.id, null);
    if (res === null || typeof res !== 'object') {
      // Motor yoksa yerel demo davranışı
      var s = state();
      var sl = spentAndLimit();
      if (sl.limit > 0 && sl.spent + (Number(p.tl) || 0) > sl.limit) {
        res = { ok: false, reason: 'limit' };
      } else if (sl.limit === 0) {
        res = { ok: false, reason: 'limit' };
      } else {
        s.parent.spentTL = sl.spent + (Number(p.tl) || 0);
        s.kiler.adet = (Number(s.kiler.adet) || 0) + (Number(p.adet) || 0);
        save();
        res = { ok: true };
      }
    }

    if (res.ok) {
      closeModal();
      toast('Kilere ' + p.adet + ' yumurta eklendi — DEMO, ödeme alınmadı');
      refreshGame();
      renderPanel();
      return;
    }

    if (res.reason === 'limit') {
      showModal('Alım tamamlanmadı',
        '<p class="par-msg-err">Bu ayın sınırına ulaşıldı. Sınırı Ayarlar’dan değiştirebilirsiniz.</p>',
        [
          { label: 'Kapat', kind: 'quiet', act: closeModal },
          { label: 'Ayarlar’a git', kind: 'primary', act: function () { closeModal(); activeTab = 'ayarlar'; renderPanel(); } }
        ]);
      return;
    }

    showModal('Alım tamamlanmadı',
      '<p class="par-msg-err">İşlem tamamlanamadı (bilinmiyor). Lütfen tekrar deneyin.</p>',
      [{ label: 'Kapat', kind: 'primary', act: closeModal }]);
  }

  function applyLimit(v) {
    var res = engineCall('setLimit', v, null);
    if (res === null || typeof res !== 'object') {
      var s = state();
      var old = Number(s.parent.limitTL);
      if (!isFinite(old)) old = limits().varsayilanAylik;
      s.parent.limitTL = v;
      if (v > old) {
        s.parent.limitRaiseTs = Date.now();
        save();
        toast('Yeni sınır 24 saat sonra etkin olur.');
        renderPanel();
        return;
      }
      save();
      toast('Aylık sınır ' + tlInt(v) + ' olarak güncellendi.');
      renderPanel();
      return;
    }
    if (res.ok) {
      toast('Aylık sınır ' + tlInt(v) + ' olarak güncellendi.');
    } else if (res.reason === 'soguma' || res.reason === 'cooldown') {
      toast('Sınır artırımı ' + (limits().sogumaSaat || 24) + ' saat sonra etkin olur.');
    } else {
      toast('Sınır değiştirilemedi (' + esc(res.reason || 'bilinmiyor') + ').');

    renderPanel();

    var s = state();

    var group = el('div', 'par-choices');
    group.setAttribute('role', 'group');
    group.setAttribute('aria-label', 'Aylık sınır seçenekleri');
    for (var i = 0; i < opts.length; i++) {
      var v = opts[i];
      var b = el('button', 'par-choice' + (v === cur ? ' is-active' : ''), v === 0 ? 'Kapalı' : esc(tlInt(v)));
      b.type = 'button';
      b.setAttribute('data-limit', String(v));

    var raiseTs = Number(s.parent && s.parent.limitRaiseTs) || 0;
    if (raiseTs > 0) {
      var hrs = Number(lim.sogumaSaat) || 24;
      var left = raiseTs + hrs * 3600000 - Date.now();
      if (left > 0) {
        var h = Math.ceil(left / 3600000);
        card.appendChild(el('p', 'par-note par-note-warn', 'Bekleyen artırım: yaklaşık ' + esc(h) + ' saat sonra etkin olur.'));
      }
    }

    on(group, 'click', function (ev) {
      var t = ev.target;
      while (t && t !== group && !(t.getAttribute && t.getAttribute('data-limit'))) t = t.parentNode;
      if (!t || t === group) return;
      var v = Number(t.getAttribute('data-limit'));
      if (v === cur) return;
      if (v >= 750) {
        showModal('Emin misiniz?',
          '<p>Bu, ayda 3+ büyük pakete denk. Emin misiniz?</p><p class="par-note">Seçilen sınır: <strong class="par-num">' + esc(tlInt(v)) + '</strong></p>',

            { label: 'Vazgeç', kind: 'quiet', act: closeModal },
            { label: 'Evet, ayarla', kind: 'primary', act: function () { closeModal(); applyLimit(v); } }

      applyLimit(v);
    });

    return card;

  function buildReport() {
    var r = engineCall('spendReport', undefined, null);
    if (r && typeof r === 'object') return r;

    var s = state();
    var sl = spentAndLimit();
    var out = {
      ay: (s.parent && s.parent.ay) || '',
      spentTL: sl.spent,
      limitTL: sl.limit,
      paketler: [],
      yumurta: 0,
      pufi: 0
    };

    var purchases = s.purchases;
    if (Object.prototype.toString.call(purchases) === '[object Array]') {
      var byId = {};
      var all = packs();
      var map = {};
      for (var k = 0; k < all.length; k++) map[String(all[k].id)] = all[k];
      var total = 0;
      for (var i = 0; i < purchases.length; i++) {
        var pu = purchases[i] || {};
        var id = String(pu.packId || pu.id || pu.paketId || '');
        var def = map[id] || { ad: id || 'Paket', tl: Number(pu.tl) || 0, adet: Number(pu.adet) || 0 };
        if (!byId[id]) byId[id] = { ad: def.ad, adet: 0, tutar: 0 };
        byId[id].adet += 1;
        byId[id].tutar += Number(pu.tl != null ? pu.tl : def.tl) || 0;
        total += Number(pu.tl != null ? pu.tl : def.tl) || 0;
      }
      for (var key in byId) {
        if (Object.prototype.hasOwnProperty.call(byId, key)) out.paketler.push(byId[key]);
      }
      if (!out.spentTL && total) out.spentTL = total;
    }

    if (s.acilanYumurta != null) out.yumurta = Number(s.acilanYumurta) || 0;
    if (s.collection && typeof s.collection === 'object') {
      var n = 0;
      for (var c in s.collection) { if (Object.prototype.hasOwnProperty.call(s.collection, c)) n++; }
      out.pufi = n;
    }
    return out;
  }

  function renderReportTab(host) {
    var r = buildReport();

    var card = el('section', 'par-card');
    card.appendChild(el('h2', 'par-card-title', 'Harcama raporu'));

    var kpis = el('div', 'par-kpis');

    kpis.appendChild(kpi('Toplam harcama', tlInt(r.spentTL)));

    // Kümülatif yıl toplamı — büyük resim gizlenmez (güven belgesi ilkesi)
    var yil = new Date().getFullYear();
    var yilToplam = 0;
    var alims = state().purchases || [];

    kpis.appendChild(kpi('Bu yıl toplam', tl(yilToplam)));
    card.appendChild(kpis);

    var pk = (r.paketler && r.paketler.length) ? r.paketler : [];
    if (pk.length) {
      var html = '<table class="par-table"><thead><tr><th scope="col">Paket</th><th scope="col">Adet</th><th scope="col">Tutar</th></tr></thead><tbody>';

      html += '</tbody></table>';
      var wrap = el('div', 'par-table-wrap', html);
      card.appendChild(wrap);
    } else {
      card.appendChild(el('p', 'par-empty', 'Bu dönemde alım yok'));
    }

    card.appendChild(el('p', 'par-note', 'Bu rapor bir güven belgesidir; içinde satış teklifi yoktur.'));
    host.appendChild(card);
  }

  function closeModal() {
    if (!openModal) return;
    try { if (openModal.parentNode) openModal.parentNode.removeChild(openModal); } catch (e) {}
    openModal = null;
    if (root) root.classList.remove('par-modal-open');

  function showModal(title, bodyHTML, buttons) {
    closeModal();
    if (!root) return;

    var back = el('div', 'par-modal-back');
    var box = el('div', 'par-modal');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-label', String(title || ''));

    var head = el('div', 'par-modal-head');
    head.appendChild(el('h2', 'par-modal-title', esc(title || '')));
    var x = el('button', 'par-modal-x', '×');
    x.type = 'button';
    x.setAttribute('aria-label', 'Kapat');
    head.appendChild(x);
    box.appendChild(head);

    box.appendChild(el('div', 'par-modal-body', bodyHTML || ''));

    var foot = el('div', 'par-modal-foot');
    var btns = buttons || [{ label: 'Kapat', kind: 'primary', act: closeModal }];
    for (var i = 0; i < btns.length; i++) {
      (function (def) {
        var cls = 'par-btn ';
        if (def.kind === 'primary') cls += 'par-btn-primary';
        else if (def.kind === 'danger') cls += 'par-btn-danger';
        else if (def.kind === 'quiet') cls += 'par-btn-quiet';
        else cls += 'par-btn-outline';
        var b = el('button', cls, esc(def.label));
        b.type = 'button';
        on(b, 'click', function () { if (typeof def.act === 'function') def.act(); });
        foot.appendChild(b);
      })(btns[i]);
    }
    box.appendChild(foot);

    on(x, 'click', closeModal);
    on(back, 'click', function (ev) { if (ev.target === back) closeModal(); });

    back.appendChild(box);
    root.appendChild(back);
    root.classList.add('par-modal-open');
    openModal = back;

    later(function () {
      var f = box.querySelector('button');
      if (f && typeof f.focus === 'function') { try { f.focus(); } catch (e) {} }
    }, 20);
  }

  }

  function sparkleSVG () {
    return '<svg viewBox="0 0 60 60" aria-hidden="true">' +
      '<path d="M30 6 L36 24 L54 30 L36 36 L30 54 L24 36 L6 30 L24 24 Z" fill="#FFD34D"' +
        ' stroke="#3E2A1C" stroke-width="3" stroke-linejoin="round"/>' +
      '<circle cx="25" cy="22" r="3.4" fill="#FFFFFF" opacity="0.9"/></svg>';
  }

  function hiddenPufi () {
    var s = st();
    if (!s.sakoHidden) return null;
    return (Y.data && Y.data.pufiById && Y.data.pufiById(s.sakoHidden)) || null;
  }

  function render (line, revealAt) {
    if (!el) return;
    var gizliP = hiddenPufi();
    var html = '';
    html += '<div class="sk-stage">';
    html += '<button class="sk-back" data-act="back" aria-label="Yuvaya dön">↩ Yuva</button>';
    html += '<div class="sk-sako" aria-hidden="true">' + sakoArt(phase === 'sonuc-kayip' ? 'happy' : 'think') + '</div>';
    html += '<p class="sk-line">' + line + '</p>';
    if (gizliP && phase === 'goster') {
      html += '<p class="sk-note">🪶 Şako <b>' + gizliP.ad + '</b>\'i saklamış — bul, geri gelsin!</p>';
    }
    html += '<div class="sk-bushes' + (phase === 'karistir' ? ' mixing' : '') + '">';
    for (var i = 0; i < 3; i++) {
      var reveal = (revealAt === i);
      html += '<button class="sk-bush" data-act="bush" data-idx="' + i + '"' +
                (phase === 'sec' ? '' : ' disabled') +
                ' aria-label="Çalı ' + (i + 1) + '">' +
                (reveal ? '<span class="sk-spark">' + sparkleSVG() + '</span>' : '') +
                bushSVG(i) +
              '</button>';
    }
    html += '</div>';
    if (phase === 'sec') {
      html += '<p class="sk-hint">Hangi çalıda? Hakkın: <b>' + hak + '</b></p>';
    }
    if (phase === 'sonuc-kazandi' || phase === 'sonuc-kayip') {
      html += '<div class="sk-actions">' +
                '<button class="btn btn-primary" data-act="again">Bir Daha!</button>' +
                '<button class="btn btn-soft" data-act="back">Yuvaya Dön</button>' +
              '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  }

  function start () {
    kilit = false;
    hak = 2;
    dogru = Math.floor(Math.random() * 3);
    phase = 'goster';
    var L = dlg().saklambac || [];
    render(L[0] || 'Parlak şeyler saklanır. Bulabilir misin?', dogru);
    play('crinkle');
    later(function () {
      phase = 'karistir';
      render('Karışıyor… gözünü ayırma!', -1);
      play('shakeRattle');
      later(function () {
        phase = 'sec';
        render('Şimdi… hangisinde?', -1);
      }, 1200);
    }, 1400);
  }

  function pick (idx) {
    if (phase !== 'sec' || kilit) return;
    if (idx === dogru) {
      kilit = true;
      phase = 'sonuc-kazandi';
      play('fanfare');
      var geri = !!(Y.engine && Y.engine.sakoRecover && Y.engine.sakoRecover());
      if (geri) {
        render('Buldun! …Şans. Kesinlikle şans.', dogru);
        toast('Saklanan dost geri döndü! 🪶');
      } else {
        if (Y.engine && Y.engine.addStardust) Y.engine.addStardust(10);
        render('Buldun! …Şans. Kesinlikle şans.', dogru);
        toast('+10 Yıldız Tozu!');
      }
    } else {
      hak -= 1;
      play('click');
      if (hak > 0) {
        render('Orada değil! Son hakkın…', -1);
      } else {
        kilit = true;
        phase = 'sonuc-kayip';
        render('Hihihi! Buradaydı. Saksağanlar açıklama yapmaz. Bir daha?', dogru);
        play('pop');
      }
    }
  }

  function handleClick (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'back') {
      play('click');
      if (Y.go) Y.go('home');
    } else if (act === 'again') {
      play('click');
      start();
    } else if (act === 'bush') {
      pick(parseInt(b.getAttribute('data-idx'), 10) | 0);
    }
  }

  Y.scenes.sako = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'sk-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      start();
    },
    unmount: function () {
      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];
      phase = null;
      if (el) {
        el.removeEventListener('click', handleClick);
        if (el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
    }
  };

  // Test kancası: doğru çalıyı seç (duman testi kazanma yolunu doğrular)
  Y.test = Y.test || {};
  Y.test.sakoWin = function () {
    if (phase !== 'sec') return false;
    pick(dogru);
    return true;
  };
})();

/* == js/main.js == */
/* Yuvo Prototip — çekirdek kabuk: router, HUD, nav, modal, toast (SÖZLEŞME: davranış sabit).
   Marka geçişi (BRAND.md): yalnız render markup'ı değişti — HUD artık logo + ikonlu haplar,
   nav Yuvo.icons ile çizilir; Yuvo.go guard'ı, overlay temizliği, modal API'si ve
   tek-seferlik dinleyiciler AYNEN korunur. */
(function () {
  window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };

  var app = document.getElementById('app');
  var hud = document.getElementById('hud');
  var sceneRoot = document.getElementById('scene-root');
  var nav = document.getElementById('bottom-nav');
  var overlayRoot = document.getElementById('overlay-root');
  var toastRoot = document.getElementById('toast-root');

  var FULLSCREEN = { ceremony:true, assembly:true, intro:true, parent:true, sako:true };
  var current = null, currentName = null;

  Yuvo.go = function (name, params) {
    if (name === currentName && !params) return; // aynı sekmeye çift dokunuş oyunu sıfırlamasın
    if (current && current.unmount) { try { current.unmount(); } catch (e) { console.error(e); } }
    sceneRoot.innerHTML = '';
    overlayRoot.innerHTML = ''; // sahne değişince açık modal kalmasın
    sceneRoot.scrollTop = 0;
    currentName = name;
    current = Yuvo.scenes[name];
    if (!current) { console.error('Sahne yok: ' + name); return; }
    app.classList.toggle('fullscreen', !!FULLSCREEN[name]);
    renderNav();
    current.mount(sceneRoot, params || {});
    // Yumuşak sahne girişi (180ms) — mount SENKRON kalır (test kancaları/akış bozulmaz)
    sceneRoot.classList.remove('scene-fade');
    void sceneRoot.offsetWidth;
    sceneRoot.classList.add('scene-fade');
  };

  // Arka plana tıklayınca kapatma: kalıcı overlayRoot'a BİR KEZ bağlanır (dinleyici birikmez)
  overlayRoot.addEventListener('click', function (e) {
    if (e.target === overlayRoot) overlayRoot.innerHTML = '';
  });

  Yuvo.modal = function (html) {
    var wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = '<button class="modal-close" aria-label="Kapat">' + ico('close', '✕') + '</button>' + html;
    overlayRoot.innerHTML = '';
    overlayRoot.appendChild(wrap);
    function close () { overlayRoot.innerHTML = ''; }
    wrap.querySelector('.modal-close').addEventListener('click', close);
    return close;
  };

  Yuvo.toast = function (text) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    toastRoot.appendChild(t);
    setTimeout(function () { t.remove(); }, 2200);
  };

  Yuvo.refresh = function () {
    renderHud();
    document.dispatchEvent(new CustomEvent('yuvo:state'));
  };

  // Yuvo.icons güvenli erişim: ikon yoksa emoji fallback (BRAND.md §4)
  function ico (name, fallback) {
    try {
      if (Yuvo.icons && Yuvo.icons[name]) {
        var s = Yuvo.icons[name]();
        if (s) return s;
      }
    } catch (e) {}
    return '<span class="ico-fallback">' + fallback + '</span>';
  }

  function renderHud () {
    var s = (Yuvo.engine && Yuvo.engine.state) || {};
    hud.innerHTML =
      '<span class="hud-logo">' + ico('logo', 'Yuvo') + '</span>' +
      '<span class="hud-pills">' +
        '<span class="pill pill-star" aria-label="Yıldız Tozu">' +
          '<span class="pill-ico">' + ico('star', '⭐') + '</span><b>' + (s.stardust || 0) + '</b></span>' +
        '<span class="pill pill-shell" aria-label="Kabuk">' +
          '<span class="pill-ico">' + ico('shell', '🐚') + '</span><b>' + (s.kabuk || 0) + '</b></span>' +
        '<span class="pill pill-egg" aria-label="Bugünkü yumurta hakkı">' +
          '<span class="pill-ico">' + ico('egg', '🥚') + '</span><b>' + (s.eggsAvailable || 0) + '</b>' +
          ' <small>bugün</small></span>' +
      '</span>';
  }

  var NAV = [
    { id:'home', icon:'yuva', emoji:'🏡', ad:'Yuva' },
    { id:'album', icon:'album', emoji:'📔', ad:'Albüm' },
    { id:'foilbook', icon:'shell', emoji:'📔', ad:'Defter' },
    { id:'minigame', icon:'oyna', emoji:'🎮', ad:'Oyna' }
  ];
  function renderNav () {
    nav.innerHTML = NAV.map(function (n) {
      return '<button data-go="' + n.id + '" class="' + (currentName === n.id ? 'active' : '') + '"' +
        ' aria-label="' + n.ad + '">' +
        '<span class="ico">' + ico(n.icon, n.emoji) + '</span>' +
        '<span class="nav-label">' + n.ad + '</span></button>';
    }).join('');
  }
  nav.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-go]');
    if (b) { if (Yuvo.audio.play) Yuvo.audio.play('click'); Yuvo.go(b.getAttribute('data-go')); }
  });

  var unlocked = false;
  document.addEventListener('pointerdown', function () {
    if (!unlocked && Yuvo.audio && Yuvo.audio.unlock) { unlocked = true; Yuvo.audio.unlock(); }
  }, { passive:true });

  // Başlat — ilk açılış FTUE'ye (intro), sonrası yuvaya (docs/v2/04 §1)
  document.addEventListener('DOMContentLoaded', function () {
    if (Yuvo.engine.load) Yuvo.engine.load();
    Yuvo.refresh();
    var s = (Yuvo.engine && Yuvo.engine.state) || {};
    Yuvo.go((!s.introDone && Yuvo.scenes.intro) ? 'intro' : 'home');
  });
})();


</script>
