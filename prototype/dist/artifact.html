<title>Yuvo Prototip</title>
<style>
/* == css/style.css == */
/* Yuvo Prototip — temel stil ve tasarım tokenları (docs/10 görsel dili) */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#FFF6E3; --bg2:#FFEFD0; --card:#FFFFFF; --ink:#4A3B2A; --ink-soft:#6E5F49;
  --meadow:#A8E06E; --meadow-deep:#7BC94C; --sky:#BDE8FF; --sun:#FFD34D;
  --accent:#FF8A5C; --accent-deep:#F0703E;
  --r-yaygin:#9AA5B1; --r-azbulunur:#58B368; --r-nadir:#4FB8D8;
  --r-destansi:#B266E8; --r-efsanevi:#F2A61B; --r-gizli:#5C4A9E;
  --radius:22px; --radius-sm:14px;
  --shadow:0 4px 14px rgba(74,59,42,.14);
}
html, body { height:100%; }
body {
  background:var(--bg); color:var(--ink);
  font-family:"Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
}
#app { height:100dvh; display:flex; flex-direction:column; max-width:560px; margin:0 auto;
  position:relative; overflow:hidden; }
#scene-root { flex:1; overflow-y:auto; overflow-x:hidden; position:relative; }

/* HUD */
#hud { display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:var(--bg2);
  border-bottom:2px solid rgba(74,59,42,.08); z-index:5; }
#hud .pill { background:var(--card); border-radius:999px; padding:7px 14px; font-weight:bold;
  font-size:16px; box-shadow:var(--shadow); display:inline-flex; align-items:center; gap:6px;
  min-height:38px; }
#hud .pill small { font-weight:normal; color:var(--ink-soft); }

/* Alt gezinme */
#bottom-nav { display:flex; gap:8px; padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg2); border-top:2px solid rgba(74,59,42,.08); z-index:5; }
#bottom-nav button { flex:1; min-height:64px; border:none; border-radius:var(--radius-sm);
  background:var(--card); color:var(--ink); font-size:16px; font-weight:bold;
  box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; cursor:pointer; }
#bottom-nav button .ico { font-size:24px; line-height:1; }
#bottom-nav button.active { background:var(--sun); }
#bottom-nav button:active { transform:scale(.96); }

/* Tam ekran sahne modu (tören/birleştirme) */
#app.fullscreen #hud, #app.fullscreen #bottom-nav { display:none; }

/* Ortak bileşenler */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:64px; padding:12px 22px; border:none; border-radius:var(--radius);
  font-size:18px; font-weight:bold; font-family:inherit; cursor:pointer;
  background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
.btn:active { transform:scale(.96); }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:active { background:var(--accent-deep); }
.btn-soft { background:var(--bg2); }
.btn[disabled] { opacity:.55; pointer-events:none; }

.card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:16px; }

/* Modal */
#overlay-root:empty { display:none; }
#overlay-root { position:absolute; inset:0; z-index:50; display:flex; align-items:center;
  justify-content:center; background:rgba(74,59,42,.45); padding:20px; }
.modal { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  width:100%; max-width:420px; max-height:82dvh; overflow-y:auto; padding:20px;
  position:relative; animation:pop-in .25s ease; }
.modal .modal-close { position:absolute; top:8px; right:8px; width:64px; height:64px;
  border:none; border-radius:50%; background:var(--bg2); font-size:26px; cursor:pointer; }
@keyframes pop-in { from { transform:scale(.8); opacity:0; } to { transform:scale(1); opacity:1; } }

/* Toast */
#toast-root { position:absolute; left:0; right:0; bottom:110px; display:flex;
  flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none; }
.toast { background:var(--ink); color:#fff; border-radius:999px; padding:10px 20px;
  font-size:15px; font-weight:bold; box-shadow:var(--shadow); animation:toast-in .25s ease;
  max-width:90%; text-align:center; }
@keyframes toast-in { from { transform:translateY(12px); opacity:0; } to { transform:none; opacity:1; } }

/* Nadirlik çerçeveleri (albüm + kartlar)
   Renk körlüğü için renk DIŞI kodlama: her kademede farklı çerçeve deseni
   (düz/kesikli/çift/noktalı/kalın) + köşe simge rozeti (● ▲ ◆ ★ ✹ ☾). */
.rf { position:relative; border:3px solid var(--r-yaygin); }
.rf::after { content:'●'; position:absolute; left:3px; bottom:3px; z-index:2;
  width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,.92);
  color:var(--ink); font-size:12px; line-height:20px; text-align:center;
  font-style:normal; font-weight:bold; pointer-events:none;
  box-shadow:0 1px 3px rgba(74,59,42,.25); }
.rf-yaygin { border-color:var(--r-yaygin); }
.rf-azbulunur { border-color:var(--r-azbulunur); border-style:dashed; }
.rf-azbulunur::after { content:'▲'; }
.rf-nadir { border-color:var(--r-nadir); border-width:6px; border-style:double;
  box-shadow:0 0 10px rgba(79,184,216,.4); }
.rf-nadir::after { content:'◆'; }
.rf-destansi { border-color:var(--r-destansi); border-width:4px; border-style:dotted;
  box-shadow:0 0 12px rgba(178,102,232,.45); }
.rf-destansi::after { content:'★'; }
.rf-efsanevi { border-color:var(--r-efsanevi); border-width:5px;
  box-shadow:0 0 16px rgba(242,166,27,.55);
  animation:glow 1.6s ease-in-out infinite alternate; }
.rf-efsanevi::after { content:'✹'; }
.rf-gizli { border-color:var(--r-gizli); border-width:5px; border-style:dashed;
  box-shadow:0 0 14px rgba(92,74,158,.55); }
.rf-gizli::after { content:'☾'; }
@keyframes glow { from { box-shadow:0 0 8px rgba(242,166,27,.35); }
  to { box-shadow:0 0 20px rgba(242,166,27,.75); } }

/* Rozet: koyu mürekkep + açık pastel zemin (WCAG ≥4.5:1); kademe rengi çerçevede,
   simge (● ▲ ◆ …) JS'ten metnin başına eklenir — renk tek başına kod değil. */
.rarity-tag { display:inline-block; padding:4px 12px; border-radius:999px;
  color:var(--ink); background:var(--bg2); border:2px solid var(--r-yaygin);
  font-size:15px; font-weight:bold; }

/* Yardımcılar */
.center { text-align:center; }
.stack { display:flex; flex-direction:column; gap:12px; }
.row { display:flex; align-items:center; gap:10px; }
.grow { flex:1; }
.hidden { display:none !important; }
img, svg { max-width:100%; display:block; }

/* == css/scenes-core.css == */
/* Yuvo — Çekirdek sahne stilleri: Çıtlatma Töreni + Birleştirme Masası.
   Sahip: scenes-core ajanı. Tokenlar css/style.css'ten gelir. */

/* ============================= TÖREN ============================= */

.cere-stage {
  position: relative;
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, var(--sky) 0%, var(--bg) 46%, var(--meadow) 100%);
  touch-action: none;
  cursor: pointer;
}

/* Sepet */
.cere-basket {
  position: absolute;
  bottom: 7%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 64px;
  line-height: 1;
  filter: drop-shadow(0 6px 8px rgba(74, 59, 42, .25));
  transition: opacity .5s ease, transform .5s ease;
  pointer-events: none;
}
.cere-basket.gone { opacity: 0; transform: translateX(-50%) translateY(24px); }

/* Yumurta */
.cere-egg-wrap {
  position: relative;
  width: min(62vw, 250px);
  z-index: 2;
  pointer-events: none; /* dokunuşlar sahnenin tamamında sayılır */
}
.cere-egg svg { width: 100%; height: auto; }
.cere-egg-wrap.arriving { animation: egg-arrive .9s cubic-bezier(.22, 1, .36, 1) both; }
.cere-egg-wrap.warm { animation: egg-rock 1.1s ease-in-out infinite; }
.cere-egg-wrap.warmed { animation: egg-shake .45s ease; }
.cere-egg-wrap.burst { animation: egg-burst .45s ease forwards; }

@keyframes egg-arrive {
  from { transform: translateY(46dvh) scale(.55); opacity: .4; }
  to   { transform: none; opacity: 1; }
}
@keyframes egg-rock {
  0%, 100% { transform: rotate(-3deg); }
  50%      { transform: rotate(3deg); }
}
@keyframes egg-shake {
  0%   { transform: translateX(0); }
  25%  { transform: translateX(-6px) rotate(-2deg); }
  50%  { transform: translateX(6px) rotate(2deg); }
  75%  { transform: translateX(-4px); }
  100% { transform: translateX(0); }
}
@keyframes egg-burst {
  to { transform: scale(1.3); opacity: 0; }
}

/* Isıtma jest gösterimi: yumurta üstünde daire çizen yarı saydam el (okuma gerektirmez) */
.cere-hand {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  margin: -24px 0 0 -24px;
  font-size: 46px;
  line-height: 1;
  opacity: .8;
  pointer-events: none;
  z-index: 3;
  filter: drop-shadow(0 2px 3px rgba(74, 59, 42, .35));
  animation: hand-circle 1.8s linear infinite;
}
.cere-egg-wrap.warm .cere-hand { display: block; }
@keyframes hand-circle {
  from { transform: rotate(0deg) translateX(58px) rotate(0deg); }
  to   { transform: rotate(360deg) translateX(58px) rotate(-360deg); }
}

/* Isınma parıltısı (opaklık JS'ten ilerlemeyle gelir) */
.cere-warmth {
  position: absolute;
  inset: -12%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 122, 140, .75) 0%, rgba(255, 160, 130, .35) 55%, transparent 75%);
  opacity: 0;
  transition: opacity .15s linear;
  pointer-events: none;
  mix-blend-mode: multiply;
}

/* Ritim halkaları — beklerler, kaçırmak imkânsız */
.cere-rings { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.cere-ring {
  position: absolute;
  width: 84px;
  height: 84px;
  border: 5px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 16px rgba(255, 255, 255, .85), inset 0 0 10px rgba(255, 255, 255, .5);
  transform: translate(-50%, -50%);
  animation: ring-pop .35s ease both, ring-pulse 1.1s ease-in-out .35s infinite;
}
.ring-p0 { left: 32%; top: 40%; }
.ring-p1 { left: 68%; top: 46%; }
.ring-p2 { left: 50%; top: 62%; }
/* Halkanın altında zıplayan işaret parmağı: "buraya dokun" jest eşdeğeri */
.cere-ring-finger {
  position: absolute;
  left: 50%;
  top: 96%;
  font-size: 36px;
  line-height: 1;
  animation: finger-bob .8s ease-in-out infinite;
}
@keyframes finger-bob {
  0%, 100% { transform: translateX(-50%) translateY(4px); }
  50%      { transform: translateX(-50%) translateY(-8px); }
}
@keyframes ring-pop {
  from { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
  to   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
@keyframes ring-pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50%      { transform: translate(-50%, -50%) scale(1.14); }
}

/* Efekt katmanı: flaş, konfeti, pufi, kart */
.cere-fx {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.cere-flash {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 45%, #fff 0%, rgba(255, 255, 255, .6) 35%, transparent 70%);
  animation: flash-out .7s ease forwards;
}
@keyframes flash-out { from { opacity: 1; } to { opacity: 0; } }

/* Konfeti (CSS parçacıklar; --dx/--dy/--rot JS'ten) */
.cere-confetti { position: absolute; inset: 0; overflow: hidden; }
.cere-confetti i {
  position: absolute;
  left: 50%;
  top: 45%;
  width: 10px;
  height: 14px;
  border-radius: 3px;
  transform: translate(-50%, -50%);
  animation: confetti-fly 1.15s cubic-bezier(.16, .84, .44, 1) both;
}
@keyframes confetti-fly {
  0%   { transform: translate(-50%, -50%) scale(.6) rotate(0deg); opacity: 1; }
  70%  { opacity: 1; }
  100% {
    transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px) + 60px)) rotate(var(--rot, 180deg));
    opacity: 0;
  }
}

/* Pufi zıplayarak çıkar */
.cere-pufi {
  width: min(54vw, 215px);
  animation: pufi-bounce .9s cubic-bezier(.34, 1.56, .64, 1) both;
  filter: drop-shadow(0 8px 12px rgba(74, 59, 42, .25));
}
.cere-pufi svg { width: 100%; height: auto; }
@keyframes pufi-bounce {
  0%   { transform: translateY(18px) scale(.2); opacity: 0; }
  55%  { transform: translateY(-26px) scale(1.08); opacity: 1; }
  75%  { transform: translateY(6px) scale(.97); }
  100% { transform: none; opacity: 1; }
}

/* Tier 3: ekran ışıması */
.cere-stage.tier3glow::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background: radial-gradient(circle at 50% 38%,
    rgba(255, 244, 200, .95) 0%, rgba(255, 211, 77, .45) 42%, transparent 78%);
  animation: big-glow 1.9s ease forwards;
}
@keyframes big-glow {
  0%   { opacity: 0; }
  25%  { opacity: 1; }
  100% { opacity: 0; }
}

/* İpucu metni */
.cere-hint {
  position: absolute;
  bottom: calc(5% + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  max-width: 88%;
  text-align: center;
  font-size: 19px;
  font-weight: bold;
  color: var(--ink);
  background: rgba(255, 255, 255, .78);
  border-radius: 999px;
  padding: 10px 20px;
  box-shadow: var(--shadow);
  pointer-events: none;
}
.cere-hint:empty { display: none; }

/* Sonuç kartı */
.cere-stage.show-card .cere-egg-wrap,
.cere-stage.show-card .cere-basket { display: none; }
.cere-card {
  pointer-events: auto;
  width: 86%;
  max-width: 330px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  animation: pop-in .35s ease;
}
.cere-portrait {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: var(--bg2);
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cere-portrait svg { width: 100%; height: 100%; }
.cere-name { font-size: 26px; }
.cere-tags { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.cere-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: bold;
}
.cere-badge-new { background: var(--sun); color: var(--ink); }
.cere-badge-copy { background: var(--bg2); color: var(--ink); }
.cere-bio { color: var(--ink-soft); font-size: 15px; line-height: 1.45; }
.cere-card .btn { width: 100%; margin-top: 4px; }

/* Yumurta kalmadıysa nazik mesaj */
.cere-noegg { cursor: default; }
.cere-noegg-box {
  width: 86%;
  max-width: 330px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  animation: pop-in .3s ease;
}
.cere-noegg-ico { font-size: 52px; line-height: 1; }
.cere-noegg-box p { color: var(--ink-soft); line-height: 1.5; }
.cere-noegg-box .btn { width: 100%; }

/* ========================= BİRLEŞTİRME ========================= */

.asm-stage {
  position: relative;
  height: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  touch-action: none;
}
.asm-title { font-size: 20px; text-align: center; padding: 0 76px; }

/* Takılan çocuk için görünür çıkış: köşede Atla düğmesi */
.asm-skip {
  position: absolute;
  top: calc(10px + env(safe-area-inset-top));
  right: 10px;
  z-index: 6;
  min-height: 64px;
  padding: 10px 16px;
  font-size: 16px;
}

/* Hedef silüet tahtası */
.asm-board {
  position: relative;
  width: min(82vw, 330px);
  flex: 1;
  max-height: 52dvh;
  align-self: center;
}
.asm-slot {
  position: absolute;
  border: 3px dashed rgba(74, 59, 42, .28);
  border-radius: 26px;
  background: rgba(255, 255, 255, .35);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6%;
  transition: box-shadow .15s ease, border-color .15s ease, background .15s ease;
}
.asm-slot-bas      { width: 38%; aspect-ratio: 1; top: 0;   left: 50%; transform: translateX(-50%); }
.asm-slot-govde    { width: 48%; aspect-ratio: 1; top: 34%; left: 50%; transform: translateX(-50%); }
.asm-slot-aksesuar { width: 32%; aspect-ratio: 1; bottom: 0; right: 4%; }

/* Silüet hayaleti — ince parçalar krem zeminde de seçilsin diye .4 opaklık */
.slot-ghost { width: 100%; height: 100%; }
.slot-ghost svg { width: 100%; height: 100%; filter: brightness(0) opacity(.4); }

/* Mıknatıs yaklaşınca parıltı */
.asm-slot.near {
  border-color: var(--accent);
  background: rgba(255, 211, 77, .3);
  box-shadow: 0 0 18px rgba(255, 138, 92, .65);
}
.asm-slot.filled {
  border-color: transparent;
  border-style: solid;
  background: transparent;
}
.slot-fill { width: 100%; height: 100%; animation: fill-pop .3s ease; }
.slot-fill svg { width: 100%; height: 100%; }
@keyframes fill-pop {
  0%   { transform: scale(1.15); }
  60%  { transform: scale(.96); }
  100% { transform: scale(1); }
}

/* Oturma parıltısı */
.asm-spark {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-style: normal;
  pointer-events: none;
  animation: spark-pop .6s ease forwards;
}
.asm-spark::before { content: '✨'; font-size: 42px; }
@keyframes spark-pop {
  0%   { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
  35%  { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
}

.asm-hint {
  font-size: 15px;
  font-weight: bold;
  color: var(--ink-soft);
  text-align: center;
}

/* Alt raf */
.asm-shelf {
  display: flex;
  gap: 14px;
  justify-content: center;
  align-items: flex-end;
  width: 100%;
  min-height: 116px;
  padding: 10px;
  background: rgba(255, 255, 255, .55);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.asm-piece {
  width: 92px;
  height: 92px;
  min-width: 64px;
  touch-action: none;
  cursor: grab;
  position: relative;
  padding: 4px;
  background: rgba(255, 255, 255, .9);   /* tutamaç plakası: minik parça da kutu gibi tutulur */
  border: 3px dashed rgba(74, 59, 42, .22);
  border-radius: 18px;
  filter: drop-shadow(0 4px 6px rgba(74, 59, 42, .2));
}
.asm-piece svg { width: 100%; height: 100%; pointer-events: none; }
.asm-piece.dragging { z-index: 30; cursor: grabbing; filter: drop-shadow(0 10px 14px rgba(74, 59, 42, .3)); }
.asm-piece.returning { transition: transform .5s cubic-bezier(.22, 1, .36, 1); }
.asm-piece.placed { opacity: 0; pointer-events: none; }

/* Bitiş: oyuncak + sevinç dansı */
.asm-done {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  animation: pop-in .3s ease;
}
.asm-toy { width: min(50vw, 200px); animation: fill-pop .5s ease; }
.asm-toy svg { width: 100%; height: auto; }
.asm-dance { width: min(38vw, 150px); animation: joy-dance .55s ease-in-out infinite alternate; }
.asm-dance svg { width: 100%; height: auto; }
@keyframes joy-dance {
  from { transform: translateY(0) rotate(-7deg); }
  to   { transform: translateY(-16px) rotate(7deg); }
}
.asm-banner {
  font-size: 24px;
  font-weight: bold;
  background: var(--card);
  border-radius: 999px;
  padding: 12px 26px;
  box-shadow: var(--shadow);
  animation: pop-in .4s ease .2s both;
}

/* == css/scenes-meta.css == */
/* Yuvo — Meta sahne stilleri: home (Yuva), album (Güneş Çayırı), minigame (Eşle & Bul).
   Sahip: scenes-meta ajanı. Dokunma hedefleri ≥64px (docs/10 §2); yatay taşma yok. */

/* ============================== HOME (Yuva) ============================== */
.home-scene {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: linear-gradient(to bottom,

    } else if (rarity === 'destansi') { // hareketli desen hissi (dalga + elmas)
      tex += E('path', { d: 'M22 56 Q34 48 46 56 Q58 64 70 56 Q82 48 98 56', stroke: P.motif, 'stroke-width': 3,
                         fill: 'none', opacity: 0.35, 'stroke-linecap': 'round' });
      tex += E('path', { d: 'M22 72 Q34 64 46 72 Q58 80 70 72 Q82 64 98 72', stroke: P.motif, 'stroke-width': 3,
                         fill: 'none', opacity: 0.3, 'stroke-linecap': 'round' });
      for (i = 0; i < 6; i++) {
        x = 34 + rnd() * 52; y = 30 + rnd() * 60;
        tex += E('rect', { x: N(x - 2), y: N(y - 2), width: 4, height: 4, rx: 1.2, fill: P.motif, opacity: 0.35,
                           transform: 'rotate(45 ' + N(x) + ' ' + N(y) + ')' });
      }
    } else if (rarity === 'efsanevi') { // altın ışıma + parıltı
      tex += E('ellipse', { cx: 52, cy: 48, rx: 26, ry: 16, fill: '#FFF6D8', opacity: 0.5 });
      tex += sparkle(46, 44, 5, '#FFF0B8', 0.95) + sparkle(72, 60, 4, '#FFF0B8', 0.85) +
             sparkle(54, 82, 3.4, '#FFF0B8', 0.8) + sparkle(78, 36, 2.6, '#FFFFFF', 0.9);
    } else if (rarity === 'gizli') { // karanlık mor: hilal + yıldız
      tex += E('circle', { cx: 70, cy: 46, r: 10, fill: '#C9BFEF', opacity: 0.8 });
      tex += E('circle', { cx: 74, cy: 43, r: 9, fill: P.md });
      tex += E('circle', { cx: 44, cy: 62, r: 1.6, fill: '#C9BFEF', opacity: 0.9 });
      tex += E('circle', { cx: 56, cy: 76, r: 1.2, fill: '#C9BFEF', opacity: 0.7 });
      tex += E('circle', { cx: 40, cy: 82, r: 1.4, fill: '#C9BFEF', opacity: 0.8 });
      tex += sparkle(46, 38, 3, '#C9BFEF', 0.85);
    }
    if (tex) inner += E('g', { 'clip-path': 'url(#' + uid + '-c)' }, tex);

    // parlama noktası
    inner += E('ellipse', { cx: 47, cy: 38, rx: 9, ry: 13, fill: '#FFFFFF', opacity: rarity === 'gizli' ? 0.25 : 0.5, transform: 'rotate(18 47 38)' });

    // çatlaklar (0-3, birikimli)
    if (crack > 0) {
      var cg = '';
      if (crack >= 3) { // içeriden ışık sızıntısı
        for (i = 0; i < crack; i++) {
          cg += E('path', { d: CRACKS[i], stroke: '#FFF3B0', 'stroke-width': 5, fill: 'none',
                            'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.55 });
        }
      }
      for (i = 0; i < crack; i++) {
        cg += E('path', { d: CRACKS[i], stroke: P.crackCol, 'stroke-width': 2.4, fill: 'none',
                          'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0.8 });
      }
      inner += E('g', { 'clip-path': 'url(#' + uid + '-c)' }, cg);
    }

    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true"><defs>' +
           defs.join('') + '</defs>' + inner + '</svg>';
  };
})();

/* == js/audio.js == */
/* Yuvo — audio.js (art-audio ajanı)
   WebAudio sentez, dosyasız. Ses yoksa / başlatılamazsa SESSİZCE çalışır, asla hata fırlatmaz.
   Crack'ler: filtreli noise burst + pitch düşüşü (ASMR). Fanfarlar: pentatonik arpej.
   docs/10: yumuşak zarflar, ses seviyesi sıçraması yok, çan/klakson yok. */
(function () {
  window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  var Y = window.Yuvo;
  Y.audio = Y.audio || {};

  var ctx = null, master = null, noiseBuf = null, failed = false;

  Y.audio.unlock = function () {
    if (failed) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { failed = true; return; }
      if (!ctx) {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.5;
        master.connect(ctx.destination);
        var len = Math.max(1, Math.floor(ctx.sampleRate * 1.2));
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    } catch (e) { ctx = null; master = null; noiseBuf = null; failed = true; }
  };

  /* tek ton: osc + yumuşak zarf; glide ile pitch kayması */
  function tone (t0, dur, f0, o) {
    o = o || {};
    var osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, f0), t0);
    if (o.glide) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.glide), t0 + dur * (o.glideT || 1));
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.16, t0 + (o.att || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }

  /* filtreli noise burst; f0→f1 pitch düşüşü (ASMR çıtırtısı) */
  function burst (t0, dur, o) {
    o = o || {};
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    var f = ctx.createBiquadFilter();
    f.type = o.ftype || 'bandpass';
    f.Q.value = o.q || 1.1;
    f.frequency.setValueAtTime(Math.max(1, o.f0 || 2000), t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.2, t0 + (o.att || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    var maxOff = Math.max(0.01, noiseBuf.duration - dur - 0.05);
    src.start(t0, Math.random() * maxOff, dur + 0.05);
  }

  /* Do-majör pentatonik (C5'ten): sıcak, çocuksu arpej malzemesi */
  var PENT = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];

  var SOUNDS = {
    tap: function (t) {
      tone(t, 0.07, 540, { glide: 470, gain: 0.11 });
    },
    crack1: function (t) {
      burst(t, 0.09, { f0: 2600, f1: 1100, gain: 0.2 });
      tone(t, 0.04, 1700, { type: 'triangle', glide: 1200, gain: 0.06, att: 0.003 });
    },
    crack2: function (t) {
      burst(t, 0.08, { f0: 2200, f1: 900, gain: 0.22 });
      burst(t + 0.07, 0.1, { f0: 1800, f1: 700, gain: 0.19 });
      tone(t, 0.05, 1400, { type: 'triangle', glide: 900, gain: 0.07, att: 0.003 });
    },
    crackBig: function (t) {
      burst(t, 0.12, { f0: 2400, f1: 600, gain: 0.26 });
      burst(t + 0.08, 0.16, { ftype: 'lowpass', f0: 1600, f1: 350, gain: 0.28, q: 0.8 });
      burst(t + 0.18, 0.2, { ftype: 'lowpass', f0: 900, f1: 220, gain: 0.24, q: 0.7 });
      tone(t + 0.05, 0.25, 240, { glide: 130, gain: 0.11 });
    },
    pop: function (t) {
      tone(t, 0.12, 300, { glide: 900, glideT: 0.6, gain: 0.18, att: 0.005 });
      burst(t, 0.03, { f0: 3200, gain: 0.09 });
    },
    chime: function (t) {
      tone(t, 0.6, 880, { gain: 0.11, att: 0.015 });
      tone(t + 0.02, 0.7, 1318.5, { gain: 0.07, att: 0.02 });
    },
    click: function (t) {
      tone(t, 0.035, 900, { type: 'triangle', gain: 0.08, att: 0.002 });
    },
    snap: function (t) { // parça yerine oturdu
      tone(t, 0.05, 620, { type: 'square', glide: 520, gain: 0.1, att: 0.002 });
      burst(t, 0.025, { ftype: 'highpass', f0: 2500, gain: 0.11 });
    },
    fanfare: function (t) { // tier2: kısa pentatonik arpej
      var seq = [PENT[0], PENT[2], PENT[3], PENT[5]];
      for (var i = 0; i < seq.length; i++) {
        tone(t + i * 0.09, 0.32, seq[i], { type: 'triangle', gain: 0.13, att: 0.012 });
      }
      tone(t + 0.32, 0.5, PENT[5], { gain: 0.05, att: 0.02 });
    },
    fanfareBig: function (t) { // tier3: iki oktavlı arpej + akor + parıltı
      var seq = [392.0, PENT[0], PENT[1], PENT[2], PENT[3], PENT[4], PENT[5]];
      for (var i = 0; i < seq.length; i++) {
        tone(t + i * 0.085, 0.3, seq[i], { type: 'triangle', gain: 0.12, att: 0.012 });
      }
      tone(t + 0.62, 0.8, PENT[3], { gain: 0.09, att: 0.02 });
      tone(t + 0.62, 0.8, PENT[5], { gain: 0.07, att: 0.02 });
      tone(t + 0.62, 0.8, 1567.98, { gain: 0.05, att: 0.02 });
      burst(t + 0.6, 0.7, { ftype: 'highpass', f0: 5000, gain: 0.045, att: 0.05, q: 0.7 });
    },
    star: function (t) { // ⭐ kazanımı
      tone(t, 0.16, 1568, { glide: 2093, glideT: 0.7, gain: 0.11, att: 0.006 });
      tone(t + 0.06, 0.18, 2093, { gain: 0.06, att: 0.01 });
    },
    page: function (t) { // albüm sayfası hışırtısı
      burst(t, 0.13, { ftype: 'lowpass', f0: 1000, f1: 300, gain: 0.15, q: 0.5 });
    }
  };

  Y.audio.play = function (name) {
    try {
      if (!ctx || !master || !noiseBuf) return;
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      var fn = SOUNDS[name];
      if (!fn) return;
      fn(ctx.currentTime + 0.01);
    } catch (e) { /* sessiz */ }
  };
})();

/* == js/engine/state.js == */
/* Yuvo — Motor: state, kalıcılık, ekonomi mutasyonları. Sahip: engine ajanı. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.engine = Yuvo.engine || {};

  var STORAGE_KEY = 'yuvo-proto-v1';
  var EXTRA_EGG_COST = 120;
  var EXTRA_EGG_MAX = 2;

  // Kilometre taşları: ownedCount eşiği → { anahtar, Kabuk ödülü }
  var MILESTONES = [
    { at:10, key:'m10', kabuk:15 },
    { at:20, key:'m20', kabuk:30 },
    { at:27, key:'m27', kabuk:60 },
    { at:30, key:'m30', kabuk:100 }
  ];

  function freshSeed () {
    return ((Date.now() ^ (Math.random() * 0xFFFFFFFF)) >>> 0) || 1;
  }

  function defaults () {
    return {
      version: 1,
      stardust: 40, kabuk: 0, day: 1,
      eggsAvailable: 3, extraEggsBought: 0,   // günlük: 3 temel + en çok 2 ek (120⭐/adet)
      eggCounter: 0, pityN: 0, pityD: 0, pityE: 0, copyStreak: 0,
      owned: {},                              // pufiId -> adet
      milestones: [],                         // ör. ['m10','m20','m27','m30']
      weekCrafts: 0, rewardedPlaysToday: 0,
      seed: freshSeed()                       // mulberry32 tohumu (gacha.js kullanır)
    };
  }

  function refresh () { if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (e) {} } }
  function commit () { Yuvo.engine.save(); refresh(); }

  Yuvo.engine.state = defaults();

  Yuvo.engine.load = function () {
    var base = defaults();
    try {
      var raw = window.localStorage && window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        if (saved && typeof saved === 'object') {
          for (var k in base) {
            if (Object.prototype.hasOwnProperty.call(saved, k) && saved[k] !== null && saved[k] !== undefined) {
              base[k] = saved[k];
            }
          }
        }
      }
    } catch (e) { /* bozuk kayıt → temiz başlangıç */ }
    if (!base.owned || typeof base.owned !== 'object') base.owned = {};
    if (!Array.isArray(base.milestones)) base.milestones = [];
    if (!base.seed) base.seed = freshSeed();
    Yuvo.engine.state = base;
    return base;
  };

  Yuvo.engine.save = function () {
    try {
      if (window.localStorage) window.localStorage.setItem(STORAGE_KEY, JSON.stringify(Yuvo.engine.state));
    } catch (e) { /* depolama yoksa sessizce devam */ }
  };

  Yuvo.engine.reset = function (seed) {
    var s = defaults();
    if (seed !== undefined && seed !== null) s.seed = (seed >>> 0) || 1;
    Yuvo.engine.state = s;
    commit();
    return s;
  };

  Yuvo.engine.newDay = function () {
    var s = Yuvo.engine.state;
    s.day += 1;
    s.eggsAvailable = 3;
    s.extraEggsBought = 0;
    s.rewardedPlaysToday = 0;
    if ((s.day - 1) % 7 === 0) s.weekCrafts = 0;  // yeni hafta → Atölye hakkı tazelenir
    commit();
  };

  Yuvo.engine.addStardust = function (n) {
    var s = Yuvo.engine.state;
    s.stardust = Math.max(0, s.stardust + (n | 0));
    commit();
  };

  Yuvo.engine.spendStardust = function (n) {
    var s = Yuvo.engine.state;
    n = n | 0;
    if (n < 0 || s.stardust < n) return false;
    s.stardust -= n;
    commit();
    return true;
  };

  Yuvo.engine.buyExtraEgg = function () {
    var s = Yuvo.engine.state;
    if (s.extraEggsBought >= EXTRA_EGG_MAX) return false;
    if (s.stardust < EXTRA_EGG_COST) return false;
    s.stardust -= EXTRA_EGG_COST;
    s.extraEggsBought += 1;
    s.eggsAvailable += 1;
    commit();
    return true;
  };

  // Gizli HARİÇ sahip olunan farklı parça sayısı (0-30).
  Yuvo.engine.ownedCount = function () {
    var s = Yuvo.engine.state, n = 0;
    for (var id in s.owned) {
      if (!s.owned[id]) continue;
      var p = Yuvo.data.pufiById && Yuvo.data.pufiById(id);
      if (p && p.rarity === 'gizli') continue;
      n += 1;
    }
    return n;
  };

  // Kilometre taşı ödülleri — bir kez, state.milestones ile.
  // Not: burada commit çağrılmaz; yeni parça kazandıran akış (openEgg/craft) zaten commit eder.
  Yuvo.engine.checkMilestones = function () {
    var s = Yuvo.engine.state;
    var count = Yuvo.engine.ownedCount();
    var granted = [];
    for (var i = 0; i < MILESTONES.length; i++) {
      var m = MILESTONES[i];
      if (count >= m.at && s.milestones.indexOf(m.key) === -1) {
        s.milestones.push(m.key);
        s.kabuk += m.kabuk;
        granted.push(m.key);
      }
    }
    return granted;
  };

  // Atölye: Kabuk yeterliyse üret; gizli için ownedCount()==30 şartı.
  Yuvo.engine.craft = function (pufiId) {
    var s = Yuvo.engine.state;
    var pufi = Yuvo.data.pufiById && Yuvo.data.pufiById(pufiId);
    if (!pufi) return { ok:false, reason:'bilinmiyor' };
    if (s.owned[pufiId]) return { ok:false, reason:'sahipli' };
    if (pufi.rarity === 'gizli' && Yuvo.engine.ownedCount() !== 30) {
      return { ok:false, reason:'gizli-kilitli' };
    }
    var cost = (Yuvo.data.RARITIES[pufi.rarity] || {}).uretim || 0;
    if (s.kabuk < cost) return { ok:false, reason:'kabuk-yetersiz' };
    s.kabuk -= cost;
    s.owned[pufiId] = 1;
    s.weekCrafts += 1;
    Yuvo.engine.checkMilestones();
    commit();
    return { ok:true };
  };

  // Test kancaları (motor kısmı) — nesneyi toptan yazma: sahne kancaları korunur.
  Yuvo.test = Yuvo.test || {};
  Yuvo.test.state = function () { return Yuvo.engine.state; };
  Yuvo.test.grantStardust = function (n) { Yuvo.engine.addStardust(n); };
  Yuvo.test.grantEggs = function (n) {
    var s = Yuvo.engine.state;
    s.eggsAvailable += Math.max(0, n | 0);
    commit();
  };
})();

/* == js/engine/gacha.js == */
/* Yuvo — Motor: düşüş algoritması (docs/v2/02 §2.2, proto sabitleriyle). Sahip: engine ajanı. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.engine = Yuvo.engine || {};

  // ---------- SABİTLER (Güneş Çayırı onboarding istisnası: E pity 35/50) ----------
  var SOFT_PITY_E = 35;
  var SOFT_ARTIS = 0.06;
  var HARD_PITY_E = 50;
  var PITY_DESTANSI = 40;   // 40 yumurtadır Destansı+ görmediyse
  var PITY_NADIR = 15;      // 15 yumurtadır Nadir+ görmediyse
  var ONBOARDING = 10;      // ilk 10 yumurta: hep eksik; 3.'sü Nadir+ garanti
  var KOPYA_SERI_ESIGI = 6; // 6 ardışık kopya → sıradaki kesin eksik parça
  var W_EKSIK = 4;          // akıllı düşüş: eksik parça ağırlığı
  var W_EKSIK_SON3 = 12;    // ownedCount >= 27 iken eksik ağırlığı

  var TIERS = ['yaygin', 'azbulunur', 'nadir', 'destansi', 'efsanevi', 'gizli'];
  var RANK = { yaygin:0, azbulunur:1, nadir:2, destansi:3, efsanevi:4, gizli:5 };

  // ---------- RNG: mulberry32, tohum state'te kalıcı ----------
  function rand () {
    var s = Yuvo.engine.state;
    s.seed = (s.seed + 0x6D2B79F5) >>> 0;
    var t = s.seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function weightedPick (keys, weights, r) {
    var total = 0, i;
    for (i = 0; i < keys.length; i++) total += weights[i];
    var x = r * total;
    for (i = 0; i < keys.length; i++) {
      x -= weights[i];
      if (x < 0) return keys[i];
    }
    // Kayan-nokta artığı: ağırlığı 0 olan anahtar asla dönmesin — geriye tara
    for (i = keys.length - 1; i >= 0; i--) { if (weights[i] > 0) return keys[i]; }
    return keys[keys.length - 1];
  }

  function poolOf (tier) {
    var out = [], list = Yuvo.data.PUFIS || [];
    for (var i = 0; i < list.length; i++) { if (list[i].rarity === tier) out.push(list[i]); }
    return out;
  }

  function tierEksikVar (s, tier) {
    var havuz = poolOf(tier);
    for (var i = 0; i < havuz.length; i++) { if (!s.owned[havuz[i].id]) return true; }
    return false;
  }

  // ---------- KADEME SEÇİMİ ----------
  function pickTier (s, gizliHavuzda) {
    if (s.pityE >= HARD_PITY_E - 1) return 'efsanevi'; // mutlak tavan

    var base = Yuvo.data.RARITIES;
    var w = {
      yaygin: base.yaygin.oran, azbulunur: base.azbulunur.oran, nadir: base.nadir.oran,
      destansi: base.destansi.oran, efsanevi: base.efsanevi.oran, gizli: base.gizli.oran
    };
    if (!gizliHavuzda) { w.yaygin += w.gizli; w.gizli = 0; } // gizli yalnız 30/30'da havuzda

    if (s.pityE >= SOFT_PITY_E - 1) { // soft pity: Gizli oranına dokunmadan normalize
      w.efsanevi = Math.min(0.95, base.efsanevi.oran + SOFT_ARTIS * (s.pityE - SOFT_PITY_E + 2));
      var rest = 1 - w.efsanevi - w.gizli;
      var restSum = w.yaygin + w.azbulunur + w.nadir + w.destansi;
      if (restSum > 0 && rest > 0) {
        var f = rest / restSum;
        w.yaygin *= f; w.azbulunur *= f; w.nadir *= f; w.destansi *= f;
      } else {
        w.yaygin = Math.max(0, rest); w.azbulunur = 0; w.nadir = 0; w.destansi = 0;
      }
    }

    var tier = weightedPick(TIERS, [w.yaygin, w.azbulunur, w.nadir, w.destansi, w.efsanevi, w.gizli], rand());

    // Taban-yükseltme pity'leri
    if (s.pityD >= PITY_DESTANSI - 1 && RANK[tier] < RANK.destansi) tier = 'destansi';
    else if (s.pityN >= PITY_NADIR - 1 && RANK[tier] < RANK.nadir) tier = 'nadir';
    // Onboarding garantisi: 3. yumurta Nadir+
    if (s.eggCounter === 3 && RANK[tier] < RANK.nadir) tier = 'nadir';
    return tier;
  }

  // ---------- PARÇA SEÇİMİ (akıllı düşüş) ----------
  function pickPufi (s, tier, zorlaEksik) {
    var havuz = poolOf(tier);
    var eksik = [], i;
    for (i = 0; i < havuz.length; i++) { if (!s.owned[havuz[i].id]) eksik.push(havuz[i]); }

    if ((tier === 'efsanevi' || tier === 'gizli') && eksik.length) {
      return eksik[Math.floor(rand() * eksik.length)]; // E/G hep eksik-öncelikli
    }
    if (zorlaEksik && eksik.length) {
      return eksik[Math.floor(rand() * eksik.length)];
    }
    var wEksik = (Yuvo.engine.ownedCount() >= 27) ? W_EKSIK_SON3 : W_EKSIK;
    var weights = [];
    for (i = 0; i < havuz.length; i++) weights.push(s.owned[havuz[i].id] ? 1 : wEksik);
    return weightedPick(havuz, weights, rand());
  }

  // ---------- YUMURTA AÇ ----------
  Yuvo.engine.openEgg = function () {
    var s = Yuvo.engine.state;
    if (!s || s.eggsAvailable <= 0) return { error:'no-egg' };

    s.eggsAvailable -= 1;
    s.eggCounter += 1;

    var zorlaEksik = (s.eggCounter <= ONBOARDING) || (s.copyStreak >= KOPYA_SERI_ESIGI);
    var gizliHavuzda = Yuvo.engine.ownedCount() === 30;

    var tier = pickTier(s, gizliHavuzda);

    // Kesin-eksik garantisi kademeler ARASI da işler: çekilen kademenin havuzu tam
    // sahipliyse, aynı-veya-üstü ranktan eksikli bir kademeye (oranları koruyarak)
    // yükselt. Asla düşürme (pity tavanları bozulmaz); Gizli hariç — docs/v2/02 §2.1.4
    // "Pity YOK (bilinçli)", zorlama onu fiilen pity'ye çevirirdi.
    if (zorlaEksik && !tierEksikVar(s, tier)) {
      var adaylar = [], aw = [], ti;
      for (ti = 0; ti < TIERS.length; ti++) {
        var t2 = TIERS[ti];
        if (t2 === 'gizli' || RANK[t2] < RANK[tier]) continue;
        if (!tierEksikVar(s, t2)) continue;
        adaylar.push(t2); aw.push((Yuvo.data.RARITIES[t2] || {}).oran || 0);
      }
      if (adaylar.length === 1) tier = adaylar[0];
      else if (adaylar.length > 1) tier = weightedPick(adaylar, aw, rand());
      // adaylar boşsa kopya kaçınılmaz (ör. tek Efsanevi zaten sahipli) — olduğu gibi bırak
    }

    var pufi = pickPufi(s, tier, zorlaEksik);
    var rarity = pufi.rarity; // = tier

    var isNew, kabukGained = 0;
    if (s.owned[pufi.id]) {
      isNew = false;
      s.owned[pufi.id] += 1;
      kabukGained = (Yuvo.data.RARITIES[rarity] || {}).kabuk || 0;
      s.kabuk += kabukGained;
      s.copyStreak += 1;
    } else {
      isNew = true;
      s.owned[pufi.id] = 1;
      s.copyStreak = 0;
      if (Yuvo.engine.checkMilestones) Yuvo.engine.checkMilestones();
    }

    // Sayaçlar — asla süreyle/paketle sıfırlanmaz, yalnız düşüşle
    var r = RANK[rarity];
    s.pityN = (r >= RANK.nadir) ? 0 : s.pityN + 1;
    s.pityD = (r >= RANK.destansi) ? 0 : s.pityD + 1;
    s.pityE = (r >= RANK.efsanevi) ? 0 : s.pityE + 1;

    Yuvo.engine.save();
    if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (e) {} }

    var celebrationTier = (r >= RANK.efsanevi) ? 3 : (rarity === 'destansi') ? 2 : (rarity === 'nadir') ? 1 : 0;
    return { pufi:pufi, rarity:rarity, isNew:isNew, kabukGained:kabukGained, celebrationTier:celebrationTier };
  };

  // Test kancası (motor kısmı)
  Yuvo.test = Yuvo.test || {};
  Yuvo.test.openEggRaw = function () { return Yuvo.engine.openEgg(); };
})();

/* Yuvo — Sahne: Yuva (çayır fonu, yuva sepeti, gezinen Pufiler, gün sonu).
   Sahip: scenes-meta ajanı. Sözleşme: ARCHITECTURE.md */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.scenes = Yuvo.scenes || {};

  var el = null;        // sahne kök konteyneri
  var timers = [];
  var onState = null;

  /* ---------- yardımcılar (savunmacı) ---------- */
  function st () { return (Yuvo.engine && Yuvo.engine.state) || {}; }
  function play (n) { try { if (Yuvo.audio && Yuvo.audio.play) Yuvo.audio.play(n); } catch (e) {} }
  function toast (t) { if (Yuvo.toast) Yuvo.toast(t); }
  function later (fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }

  function ownedCount () {
    if (Yuvo.engine && Yuvo.engine.ownedCount) { try { return Yuvo.engine.ownedCount(); } catch (e) {} }
    var s = st(), n = 0, owned = s.owned || {};
    for (var id in owned) {
      if (!owned[id]) continue;
      var p = Yuvo.data && Yuvo.data.pufiById && Yuvo.data.pufiById(id);
      if (p && p.rarity === 'gizli') continue;
      n += 1;
    }
    return n;
  }

  function eggArt () {
    if (Yuvo.art && Yuvo.art.eggSVG) {
      try { var s = Yuvo.art.eggSVG('yaygin', { crack:0 }); if (s) return s; } catch (e) {}
    }
    return '<span class="home-art-fallback">🥚</span>';
  }

  function pufiArt (p) {
    if (Yuvo.art && Yuvo.art.pufiSVG) {
      try { var s = Yuvo.art.pufiSVG(p, { mood:'happy' }); if (s) return s; } catch (e) {}
    }
    return '<span class="home-art-fallback">🐣</span>';
  }

  // Sahip olunan son 3-5 Pufi (ekleme sırasına göre sondakiler)
  function lastOwnedPufis () {
    var s = st(), owned = s.owned || {}, ids = [];
    for (var id in owned) { if (owned[id]) ids.push(id); }
    ids = ids.slice(-5);
    var out = [];
    for (var i = 0; i < ids.length; i++) {
      var p = Yuvo.data && Yuvo.data.pufiById && Yuvo.data.pufiById(ids[i]);
      if (p) out.push(p);
    }
    return out;
  }

  /* ---------- çizim ---------- */
  function render () {
    if (!el) return;
    var s = st();
    var eggs = Math.max(0, s.eggsAvailable | 0);
    var owned = ownedCount();
    var pct = Math.max(0, Math.min(100, Math.round(owned / 30 * 100)));
    var html = '';

    // Gök dekoru: güneş + bulutlar
    html += '<div class="home-sky" aria-hidden="true">' +
              '<div class="home-sun"></div>' +
              '<div class="home-cloud c1"></div>' +
              '<div class="home-cloud c2"></div>' +
            '</div>';

    // Albüm ilerleme şeridi
    html += '<button class="home-progress" data-act="album" aria-label="Albümü aç">' +
              '<span class="home-progress-label">📔 Güneş Çayırı · <b>' + owned + '/30</b></span>' +
              '<span class="home-progress-bar"><span class="home-progress-fill" style="width:' + pct + '%"></span></span>' +
            '</button>';

    // Yuva sepeti + yumurtalar
    html += '<div class="home-nest-wrap">';
    if (eggs > 0) {
      html += '<p class="home-hint">Bir yumurta seç, birlikte çıtlatalım! 🐣</p>';
    } else {
      html += '<p class="home-hint">Bugünkü yumurtalar çıtlatıldı 🌙</p>';
    }
    html += '<div class="home-nest">';
    html += '<div class="home-eggs">';
    if (eggs > 0) {
      var shown = Math.min(eggs, 5);
      for (var i = 0; i < shown; i++) {
        html += '<button class="home-egg" style="--i:' + i + '" data-act="egg" aria-label="Yumurtayı çıtlat">' +
                  eggArt() + '</button>';
      }
      if (eggs > shown) html += '<span class="home-egg-more">+' + (eggs - shown) + '</span>';
    } else {
      html += '<span class="home-nest-empty" aria-hidden="true">💤</span>';
    }
    html += '</div>';
    html += '<div class="home-basket" aria-hidden="true"></div>';
    html += '</div></div>';

    // Gün sonu paneli (yumurta bitince)
    if (eggs === 0) {
      var extraLeft = Math.max(0, 2 - (s.extraEggsBought | 0));
      var canAfford = (s.stardust | 0) >= 120;
      html += '<div class="home-dayend">';
      if (extraLeft > 0) {
        // İkon ağırlıklı: kalan hak iki nokta ile (dolu = kalan), ekonomi cümlesi yok
        html += '<button class="btn btn-primary home-extra" data-act="extra"' + (canAfford ? '' : ' disabled') + '>' +
                  '🥚 +1 · ⭐120 <small>' + (extraLeft === 2 ? '●●' : '●○') + '</small></button>';
        if (!canAfford) {
          html += '<p class="home-note">⭐ yetersiz — Eşle &amp; Bul oynayıp yıldız toplayabilirsin!</p>';
        }
      } else {
        html += '<p class="home-note">Bugünlük ek yumurta hakkın doldu (2/2).</p>';
      }
      html += '<button class="btn btn-soft home-endday" data-act="endday">🌙 Günü Bitir</button>';
      html += '</div>';
    }

    // Çayır: gezinen Pufiler
    var roam = lastOwnedPufis();
    html += '<div class="home-meadow">';
    for (var j = 0; j < roam.length; j++) {
      var left = 6 + ((j * 19) % 68);
      var dur = (7 + (j % 3) * 2.5).toFixed(1);
      var delay = (-(j * 1.7)).toFixed(1);
      html += '<button class="home-roamer' + (j % 2 === 1 ? ' alt' : '') + '"' +
                ' data-act="pufi" data-id="' + roam[j].id + '"' +
                ' style="left:' + left + '%;animation-duration:' + dur + 's;animation-delay:' + delay + 's"' +
                ' aria-label="' + roam[j].ad + '">' +
                '<span class="home-roamer-body">' + pufiArt(roam[j]) + '</span>' +
              '</button>';
    }
    if (roam.length === 0) {
      html += '<p class="home-meadow-hint">Çayır henüz sessiz… İlk Pufi\'ni bekliyor 🌼</p>';
    }
    html += '<div class="home-grass" aria-hidden="true"></div>';
    html += '</div>';

    el.innerHTML = html;
  }

  /* ---------- etkileşim (delege tek dinleyici) ---------- */
  function handleClick (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');

    if (act === 'egg') {
      play('tap');
      if (Yuvo.go) Yuvo.go('ceremony');
    } else if (act === 'album') {
      play('page');
      if (Yuvo.go) Yuvo.go('album');
    } else if (act === 'pufi') {
      play('pop');
      var body = b.querySelector('.home-roamer-body');
      if (body) {
        body.classList.remove('jump');
        void body.offsetWidth; // animasyonu baştan başlat
        body.classList.add('jump');
        later(function () { body.classList.remove('jump'); }, 700);
      }
    } else if (act === 'extra') {
      var ok = !!(Yuvo.engine && Yuvo.engine.buyExtraEgg && Yuvo.engine.buyExtraEgg());
      if (ok) {
        play('star');
        toast('🥚 Ek yumurta yuvaya kondu!');
      } else {
        var s = st();
        if ((s.extraEggsBought | 0) >= 2) toast('Bugünlük ek yumurta hakkı doldu.');
        else toast('⭐ yetersiz — 120⭐ gerekiyor.');
      }
      render();
    } else if (act === 'endday') {
      play('chime');
      if (Yuvo.engine && Yuvo.engine.newDay) Yuvo.engine.newDay();
      toast('🌞 Yeni gün! 3 taze yumurta yuvada.');
      render();
    }
  }

  /* ---------- sahne API ---------- */
  Yuvo.scenes.home = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'home-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      onState = function () { render(); };
      document.addEventListener('yuvo:state', onState);
      render();
    },
    unmount: function () {
      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];
      if (onState) { document.removeEventListener('yuvo:state', onState); onState = null; }
      if (el) {
        el.removeEventListener('click', handleClick);
        if (el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
    }
  };
})();

/* == js/scenes/minigame.js == */
/* Yuvo — Sahne: Eşle & Bul mini oyunu (6 kart, 3 çift; süre yok, kaybetme yok).
   Sahip: scenes-meta ajanı. Sözleşme: ARCHITECTURE.md */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.scenes = Yuvo.scenes || {};

  var el = null;
  var timers = [];
  var deck = [];        // [{ fid, svg, open, matched }]
  var flippedIdx = [];  // açık bekleyen kart indeksleri (en çok 2)
  var matchedPairs = 0;
  var attempts = 0;     // çift deneme sayısı
  var lock = false;
  var finished = false;

  /* ---------- yardımcılar (savunmacı) ---------- */
  function st () { return (Yuvo.engine && Yuvo.engine.state) || {}; }
  function play (n) { try { if (Yuvo.audio && Yuvo.audio.play) Yuvo.audio.play(n); } catch (e) {} }
  function later (fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }

  function shuffle (a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pufiFace (p) {
    if (Yuvo.art && Yuvo.art.pufiSVG) {
      try { var s = Yuvo.art.pufiSVG(p, { mood:'happy' }); if (s) return s; } catch (e) {}
    }
    return '<span class="mg-art-fallback">🐣</span>';
  }
  function eggFace (r) {
    if (Yuvo.art && Yuvo.art.eggSVG) {
      try { var s = Yuvo.art.eggSVG(r, { crack:0 }); if (s) return s; } catch (e) {}
    }
    return '<span class="mg-art-fallback">🥚</span>';
  }

  /* ---------- deste kurulumu ---------- */
  function buildDeck () {
    var s = st(), owned = s.owned || {}, ids = [];
    for (var id in owned) { if (owned[id]) ids.push(id); }
    shuffle(ids);

    var faces = [];
    for (var i = 0; i < ids.length && faces.length < 3; i++) {
      var p = Yuvo.data && Yuvo.data.pufiById && Yuvo.data.pufiById(ids[i]);
      if (p) faces.push({ fid:'pufi-' + p.id, svg:pufiFace(p) });
    }
    // Sahip olunan Pufi azsa: yumurta desenleriyle tamamla
    var eggR = shuffle(['nadir', 'destansi', 'azbulunur', 'efsanevi', 'yaygin']);
    var k = 0;
    while (faces.length < 3 && k < eggR.length) {
      faces.push({ fid:'egg-' + eggR[k], svg:eggFace(eggR[k]) });
      k += 1;
    }

    deck = [];
    for (var f = 0; f < faces.length; f++) {
      deck.push({ fid:faces[f].fid, svg:faces[f].svg, open:false, matched:false });
      deck.push({ fid:faces[f].fid, svg:faces[f].svg, open:false, matched:false });
    }
    shuffle(deck);
  }

  /* ---------- çizim ---------- */
  function render () {
    if (!el) return;
    var s = st();
    var plays = Math.min(5, s.rewardedPlaysToday | 0);
    // Kalan ödüllü hak: sayı yerine yıldız ikonları (okuma öncesi yaş)
    var hak = '';
    for (var h = 0; h < 5; h++) hak += h < (5 - plays) ? '⭐' : '☆';
    var html = '';
    html += '<div class="mg-head center">' +
              '<h2 class="mg-title">🌼 Eşini Bul</h2>' +
              '<p class="mg-sub">Aynı iki dostu bul! · ' + hak + '</p>' +
            '</div>';
    html += '<div class="mg-grid">';
    for (var i = 0; i < deck.length; i++) {
      var c = deck[i];
      html += '<button class="mg-card' + (c.open || c.matched ? ' flipped' : '') +
                (c.matched ? ' matched' : '') + '" data-idx="' + i + '" aria-label="Kart ' + (i + 1) + '">' +
                '<span class="mg-inner">' +
                  '<span class="mg-face mg-front" aria-hidden="true">🌼</span>' +
                  '<span class="mg-face mg-back">' + c.svg + '</span>' +
                '</span>' +
              '</button>';
    }
    html += '</div>';
    el.innerHTML = html;
  }

  function cardEl (idx) {
    return el ? el.querySelector('.mg-card[data-idx="' + idx + '"]') : null;
  }

  /* ---------- oyun akışı ---------- */
  function onCardTap (btn) {
    if (lock || finished) return;
    var idx = parseInt(btn.getAttribute('data-idx'), 10);
    var c = deck[idx];
    if (!c || c.open || c.matched) return;

    c.open = true;
    btn.classList.add('flipped');
    play('tap');
    flippedIdx.push(idx);
    if (flippedIdx.length < 2) return;

    attempts += 1;
    lock = true;
    var ia = flippedIdx[0], ib = flippedIdx[1];
    var a = deck[ia], b = deck[ib];

    if (a.fid === b.fid) {
      later(function () {
        a.matched = true; b.matched = true;
        a.open = false; b.open = false;
        var ea = cardEl(ia), eb = cardEl(ib);
        if (ea) ea.classList.add('matched');
        if (eb) eb.classList.add('matched');
        play('chime');
        matchedPairs += 1;
        flippedIdx = [];
        lock = false;
        if (matchedPairs >= 3) later(finish, 650);
      }, 380);
    } else {
      later(function () {
        a.open = false; b.open = false;
        var ea = cardEl(ia), eb = cardEl(ib);
        if (ea) ea.classList.remove('flipped');
        if (eb) eb.classList.remove('flipped');
        flippedIdx = [];
        lock = false;
      }, 900);
    }
  }

  function finish () {
    if (finished || !el) return;
    finished = true;

    var stars = attempts <= 4 ? 3 : (attempts <= 6 ? 2 : 1);
    var s = st();
    var rested = (s.rewardedPlaysToday | 0) >= 5;
    var reward = rested ? 5 : (stars === 3 ? 40 : (stars === 2 ? 30 : 20));

    if (!rested) s.rewardedPlaysToday = (s.rewardedPlaysToday | 0) + 1;
    if (Yuvo.engine && Yuvo.engine.addStardust) {
      Yuvo.engine.addStardust(reward); // save + refresh motor tarafında
    } else {
      s.stardust = (s.stardust | 0) + reward;
      if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (e) {} }
    }
    play(stars === 3 ? 'fanfare' : 'star');

    var starsHtml = '';
    for (var i = 0; i < 3; i++) {
      starsHtml += '<span class="mg-star' + (i < stars ? ' on' : '') + '" style="--d:' + (i * 0.18) + 's">' +
                     (i < stars ? '⭐' : '☆') + '</span>';
    }
    var panel = document.createElement('div');
    panel.className = 'mg-result';
    panel.innerHTML =
      '<div class="mg-result-card center">' +
        '<div class="mg-stars">' + starsHtml + '</div>' +
        '<h3 class="mg-result-title">' +
          (stars === 3 ? 'Muhteşem hafıza!' : (stars === 2 ? 'Çok iyi!' : 'Aferin sana!')) +
        '</h3>' +
        (rested
          ? '<p class="mg-note">Pufiler dinleniyor 💤 Yarın yine oynayalım!</p>'
          : '<p class="mg-note">Yıldız tozun hazır:</p>') +
        '<p class="mg-reward">+' + reward + ' ⭐</p>' +
        '<div class="mg-btns stack">' +
          '<button class="btn btn-primary" data-mg="again">🔁 Tekrar</button>' +
          '<button class="btn btn-soft" data-mg="home">🏡 Yuvaya Dön</button>' +
        '</div>' +
      '</div>';
    el.appendChild(panel);
  }

  function start () {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
    flippedIdx = [];
    matchedPairs = 0;
    attempts = 0;
    lock = false;
    finished = false;
    buildDeck();
    render();
  }

  /* ---------- etkileşim ---------- */
  function handleClick (e) {
    var t = e.target;
    var card = t && t.closest ? t.closest('.mg-card') : null;
    if (card) { onCardTap(card); return; }
    var b = t && t.closest ? t.closest('[data-mg]') : null;
    if (!b) return;
    var act = b.getAttribute('data-mg');
    if (act === 'again') {
      play('click');
      start();
    } else if (act === 'home') {
      play('click');
      if (Yuvo.go) Yuvo.go('home');
    }
  }

  /* ---------- sahne API ---------- */
  Yuvo.scenes.minigame = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'mg-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      start();
    },
    unmount: function () {
      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];
      flippedIdx = [];
      deck = [];
      lock = false;
      finished = false;
      if (el) {
        el.removeEventListener('click', handleClick);
        if (el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
    }
  };
})();

  function toast (t) { if (Yuvo.toast) Yuvo.toast(t); }

  function miniArt (p) {

      try { var s = Yuvo.art.pufiSVG(p, { mood:'happy' }); if (s) return s; } catch (e) {}
    }
    return '<span class="alb-art-fallback">🐣</span>';
  }
  function silArt (p) {
    if (Yuvo.art && Yuvo.art.pufiSilhouetteSVG) {
      try { var s = Yuvo.art.pufiSilhouetteSVG(p); if (s) return s; } catch (e) {}
    }
    return '<span class="alb-art-fallback dim">🐾</span>';
  }
  function toyArt (p) {
    if (Yuvo.art && Yuvo.art.toyAssembledSVG) {

    }
    return miniArt(p);
  }

  /* ---------- çizim ---------- */
  function render () {
    if (!el) return;
    var s = st();
    var owned = ownedCount();
    var pct = Math.max(0, Math.min(100, Math.round(owned / 30 * 100)));
    var ownedMap = s.owned || {};
    var miles = s.milestones || [];
    var html = '';

    // Üst bilgi: başlık + Kabuk bakiyesi + ilerleme
    html += '<div class="alb-head">' +
              '<h2 class="alb-title">📔 Güneş Çayırı</h2>' +
              '<span class="alb-shell">🐚 ' + (s.kabuk | 0) + '</span>' +
            '</div>';
    html += '<div class="alb-progress">' +
              '<span class="alb-progress-num"><b>' + owned + '</b>/30</span>' +
              '<span class="alb-progress-bar"><span class="alb-progress-fill" style="width:' + pct + '%"></span></span>' +
            '</div>';

    // Kilometre taşı çipleri
    html += '<div class="alb-chips">';
    for (var m = 0; m < MILES.length; m++) {
      var mi = MILES[m];
      var claimed = miles.indexOf(mi.key) !== -1;
      var ready = !claimed && owned >= mi.at;
      var cls = claimed ? 'done' : (ready ? 'ready' : 'locked');
      html += '<button class="alb-chip ' + cls + '" data-act="mile" data-key="' + mi.key + '">' +
                '<b>' + mi.at + '</b>' +
                '<small>' + (claimed ? '✓ alındı' : '+' + mi.odul + ' 🐚') + '</small>' +
              '</button>';
    }
    html += '</div>';

    // 30 hücrelik ızgara (gizli hariç, PUFIS sırasıyla)
    html += '<div class="alb-grid">';
    var list = pufiList();
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (p.rarity === 'gizli') continue;
      var n = ownedMap[p.id] | 0;
      if (n > 0) {
        html += '<button class="alb-cell rf rf-' + p.rarity + '" data-act="cell" data-id="' + p.id + '"' +
                  ' aria-label="' + p.ad + '">' +
                  miniArt(p) +
                  (n > 1 ? '<span class="alb-copy">×' + n + '</span>' : '') +
                '</button>';
      } else {
        html += '<button class="alb-cell missing rf rf-' + p.rarity + '" data-act="cell" data-id="' + p.id + '"' +
                  ' aria-label="Bilinmeyen Pufi">' +
                  silArt(p) +
                  '<span class="alb-q">?</span>' +
                '</button>';
      }
    }
    html += '</div>';

    // Ayrık gizli hücre
    var gizli = null;
    for (var g = 0; g < list.length; g++) { if (list[g].rarity === 'gizli') { gizli = list[g]; break; } }
    if (gizli) {
      var gn = ownedMap[gizli.id] | 0;
      html += '<div class="alb-secret-row">' +
                '<button class="alb-cell alb-secret rf rf-gizli' + (gn > 0 ? '' : ' missing') + '"' +
                  ' data-act="cell" data-id="' + gizli.id + '" aria-label="Gizli Pufi">' +
                  (gn > 0 ? miniArt(gizli) + (gn > 1 ? '<span class="alb-copy">×' + gn + '</span>' : '')
                          : '<span class="alb-q big">???</span>') +
                '</button>' +
                '<span class="alb-secret-label">' +
                  (gn > 0 ? gizli.ad + ' aramıza katıldı! 🌙' : 'Çayırda bir sır fısıldanıyor…') +
                '</span>' +
              '</div>';
    }

    el.innerHTML = html;
  }

  /* ---------- kilometre taşı ödülü ---------- */
  function claimMilestones () {
    var s = st();
    var owned = ownedCount();
    var miles = s.milestones = s.milestones || [];
    var total = 0, i;

    if (Yuvo.engine && Yuvo.engine.checkMilestones) {
      var granted = [];
      try { granted = Yuvo.engine.checkMilestones() || []; } catch (e) { granted = []; }
      for (i = 0; i < MILES.length; i++) {
        if (granted.indexOf(MILES[i].key) !== -1) total += MILES[i].odul;
      }
      if (granted.length) {
        if (Yuvo.engine.save) { try { Yuvo.engine.save(); } catch (e2) {} }
        if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (e3) {} }
      }
    } else {
      // Motor yoksa yerel yedek: bir kez ver
      for (i = 0; i < MILES.length; i++) {
        var mi = MILES[i];
        if (owned >= mi.at && miles.indexOf(mi.key) === -1) {
          miles.push(mi.key);
          s.kabuk = (s.kabuk | 0) + mi.odul;
          total += mi.odul;
        }
      }
      if (total > 0 && Yuvo.refresh) { try { Yuvo.refresh(); } catch (e4) {} }
    }

    if (total > 0) {
      play('star');
      toast('🐚 +' + total + ' Kabuk! Kilometre taşı ödülün.');
    }
    render();
  }

  /* ---------- detay modalı / Atölye ---------- */
  function openDetail (id) {
    var p = byId(id);
    if (!p) return;
    var s = st();
    var n = (s.owned || {})[id] | 0;
    var ri = rarInfo(p.rarity);

    if (n > 0) {
      // Sahipli: ad + nadirlik + bio + birleşmiş oyuncak
      play('pop');
      var htmlOwned =
        '<div class="alb-modal center">' +
          '<div class="alb-modal-art rf rf-' + p.rarity + '">' + toyArt(p) + '</div>' +
          '<h3 class="alb-modal-name">' + p.ad + '</h3>' +
          '<p class="alb-modal-tur">' + p.tur + '</p>' +
          '<p class="alb-modal-tags">' +
            '<span class="rarity-tag" style="background:' + ri.renk + '33;border-color:' + ri.renk + '">' +
              (ri.simge ? ri.simge + ' ' : '') + ri.ad + '</span>' +
            (n > 1 ? ' <span class="alb-copy-tag">×' + n + ' kopya</span>' : '') +
          '</p>' +
          '<p class="alb-bio">“' + p.bio + '”</p>' +
        '</div>';
      if (Yuvo.modal) Yuvo.modal(htmlOwned);
      return;
    }

    // Eksik: Atölye
    play('click');
    var cost = ri.uretim | 0;
    var wallet = s.kabuk | 0;
    var gizliLocked = (p.rarity === 'gizli') && ownedCount() < 30;
    var enough = wallet >= cost;
    var body =
      '<div class="alb-modal center">' +
        '<div class="alb-modal-art rf rf-' + p.rarity + ' missing">' +
          (p.rarity === 'gizli' && gizliLocked ? '<span class="alb-q big">???</span>' : silArt(p)) +
        '</div>' +
        '<h3 class="alb-modal-name">???</h3>' +
        '<p class="alb-modal-tags"><span class="rarity-tag" style="background:' + ri.renk + '33;border-color:' + ri.renk + '">' +
          (ri.simge ? ri.simge + ' ' : '') + ri.ad + '</span></p>' +
        '<div class="alb-workshop">' +
          '<p class="alb-workshop-note">🐢 Usta Kabuk atölyesinde bu dostun oyuncağını üretebilir.</p>' +
          '<p class="alb-cost">Maliyet: <b>' + cost + ' 🐚</b> · Cüzdanın: <b>' + wallet + ' 🐚</b></p>';
    if (gizliLocked) {
      body += '<p class="alb-locked">🔒 Usta Kabuk fısıldar: “Önce 30 dostu yuvaya getir…” (' +
                ownedCount() + '/30)</p>';
    } else {
      body += '<button class="btn btn-primary alb-craft-btn" id="alb-craft-btn"' + (enough ? '' : ' disabled') + '>' +
                '🐢 Usta Kabuk\'a Ürettir</button>';
      if (!enough) body += '<p class="alb-locked">🐚 Kabuk yetersiz — kopyalar Kabuk kazandırır!</p>';
    }
    body += '</div></div>';

    var close = Yuvo.modal ? Yuvo.modal(body) : function () {};
    var btn = document.getElementById('alb-craft-btn');
    if (btn) {
      btn.addEventListener('click', function () { doCraft(p, close); });
    }
  }

  function doCraft (p, close) {
    var r = (Yuvo.engine && Yuvo.engine.craft) ? Yuvo.engine.craft(p.id) : { ok:false, reason:'motor-yok' };
    if (r && r.ok) {
      play('fanfare');
      // Minik üretim töreni: modal içinde parıltı + oyuncak
      var box = document.querySelector('#overlay-root .modal');
      if (box) {
        box.innerHTML =
          '<div class="alb-craft-anim center">' +
            '<div class="alb-craft-spark" aria-hidden="true">✨</div>' +
            '<div class="alb-modal-art rf rf-' + p.rarity + ' alb-pop">' + toyArt(p) + '</div>' +
            '<h3 class="alb-modal-name">' + p.ad + '</h3>' +
            '<p class="alb-workshop-note">Albüme işlendi! 📔</p>' +
          '</div>';
      }
      later(function () {
        try { close(); } catch (e) {}
        render();
      }, 1700);
      toast('🎉 ' + p.ad + ' aileye katıldı!');
    } else {
      var reason = r && r.reason;
      if (reason === 'kabuk-yetersiz') toast('🐚 Kabuk yetersiz — kopyalar Kabuk kazandırır!');
      else if (reason === 'gizli-kilitli') toast('🔒 Önce 30 dostu yuvaya getirmelisin.');
      else if (reason === 'sahipli') toast('Bu dost zaten albümde!');
      else toast('Atölye şu an çalışmıyor.');
    }
  }

  /* ---------- etkileşim ---------- */
  function handleClick (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'cell') {
      openDetail(b.getAttribute('data-id'));
    } else if (act === 'mile') {
      var key = b.getAttribute('data-key');
      var mi = null;
      for (var i = 0; i < MILES.length; i++) { if (MILES[i].key === key) { mi = MILES[i]; break; } }
      if (!mi) return;
      var s = st();
      var claimed = (s.milestones || []).indexOf(key) !== -1;
      var owned = ownedCount();
      if (claimed) {
        play('click');
        toast('Bu ödül alındı ✓');
      } else if (owned >= mi.at) {
        claimMilestones();
      } else {
        play('click');
        toast('Daha ' + (mi.at - owned) + ' dost gerek (' + owned + '/' + mi.at + ').');
      }
    }
  }

  /* ---------- sahne API ---------- */
  Yuvo.scenes.album = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'alb-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      onState = function () { render(); };
      document.addEventListener('yuvo:state', onState);
      play('page');
      render();
    },
    unmount: function () {
      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];
      if (onState) { document.removeEventListener('yuvo:state', onState); onState = null; }
      if (el) {
        el.removeEventListener('click', handleClick);
        if (el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
    }
  };
})();

/* == js/scenes/ceremony.js == */
/* Yuvo — Sahne: Çıtlatma Töreni (docs/06 §2 + ARCHITECTURE.md 6 adım). Sahip: scenes-core ajanı. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.scenes = Yuvo.scenes || {};
  Yuvo.test = Yuvo.test || {};

  // ---------- modül durumu ----------
  var mounted = false;
  var rootEl = null, stageEl = null, eggEl = null, eggWrapEl = null;
  var warmthEl = null, ringsEl = null, fxEl = null, hintEl = null;
  var result = null;           // openEgg() sonucu — mount'ta BİR KEZ çekilir, saklanır
  var stage = 'idle';          // arrive | warm | rhythm | burst | card | noegg
  var crack = 0;
  var warmDist = 0, warmTaps = 0, rubbing = false, lastX = 0, lastY = 0;
  var ringStep = 0;
  var lastTap = 0;
  var timers = [];

  var WARM_DIST = 1400;        // px — dairesel ovalama (pointermove) birikimi eşiği
  var WARM_TAPS = 5;           // dokunma fallback: 5 tap
  var DBL_MS = 350;            // çift-tap hızlandırma eşiği

  // ---------- yardımcılar ----------
  function later (fn, ms) {
    var id = setTimeout(function () { if (mounted) fn(); }, ms);
    timers.push(id);
    return id;
  }
  function clearTimers () {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
  }
  function play (name) {
    try { if (Yuvo.audio && Yuvo.audio.play) Yuvo.audio.play(name); } catch (e) {}
  }
  function vibrate (p) {
    try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {}
  }
  function esc (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function rarityInfo (key) {
    return (Yuvo.data && Yuvo.data.RARITIES && Yuvo.data.RARITIES[key]) || { ad: key || '?', renk: '#9AA5B1' };
  }

  // Savunmacı sanat: art modülü henüz yoksa basit yedekler
  function eggSVG () {
    try {
      if (Yuvo.art && Yuvo.art.eggSVG) {
        var s = Yuvo.art.eggSVG(result.rarity, { crack: crack });
        if (s) return s;
      }
    } catch (e) {}
    var renk = rarityInfo(result.rarity).renk;
    var cr = '';
    if (crack >= 1) cr += '<path d="M45 40 l8 9 -6 7 9 8" stroke="#6d5c46" stroke-width="3" fill="none" stroke-linecap="round"/>';
    if (crack >= 2) cr += '<path d="M74 52 l-7 8 8 6 -5 9" stroke="#6d5c46" stroke-width="3" fill="none" stroke-linecap="round"/>';
    if (crack >= 3) cr += '<path d="M40 66 l10 5 -3 9 11 4 M80 42 l-4 10 8 5" stroke="#57452f" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
    return '<svg viewBox="0 0 120 120"><ellipse cx="60" cy="66" rx="34" ry="44" fill="' + renk + '"/>' +
      '<ellipse cx="48" cy="48" rx="10" ry="14" fill="rgba(255,255,255,.5)"/>' + cr + '</svg>';
  }
  function pufiSVG (mood) {
    try {
      if (Yuvo.art && Yuvo.art.pufiSVG) {
        var s = Yuvo.art.pufiSVG(result.pufi, { mood: mood || 'happy' });
        if (s) return s;
      }
    } catch (e) {}
    var renk = rarityInfo(result.rarity).renk;
    return '<svg viewBox="0 0 120 120"><circle cx="60" cy="64" r="38" fill="' + renk + '"/>' +
      '<circle cx="48" cy="56" r="5" fill="#3a2f22"/><circle cx="72" cy="56" r="5" fill="#3a2f22"/>' +
      '<path d="M48 74 q12 10 24 0" stroke="#3a2f22" stroke-width="4" fill="none" stroke-linecap="round"/></svg>';
  }

  function renderEgg () { if (eggEl) eggEl.innerHTML = eggSVG(); }
  function setHint (text) { if (hintEl) hintEl.textContent = text || ''; }

  // ---------- aşama 0: yumurta yoksa nazik mesaj ----------
  function showNoEgg () {
    stage = 'noegg';
    rootEl.innerHTML =
      '<div class="cere-stage cere-noegg">' +
        '<div class="cere-noegg-box card center">' +
          '<div class="cere-noegg-ico">🌙</div>' +
          '<h2>Bugünün yumurtaları bitti</h2>' +
          '<p>Pufiler tatlı tatlı uyuyor… Yarın sepette yeni sürprizler olacak!</p>' +
          '<button class="btn btn-primary" id="cere-home">Yuvaya Dön 🏡</button>' +
        '</div>' +
      '</div>';
    var b = rootEl.querySelector('#cere-home');
    if (b) b.addEventListener('click', function () { if (Yuvo.go) Yuvo.go('home'); });
    later(function () { if (stage === 'noegg' && Yuvo.go) Yuvo.go('home'); }, 3000);
  }

  // ---------- sahne iskeleti ----------
  function buildStage () {
    rootEl.innerHTML =
      '<div class="cere-stage" id="cere-stage">' +
        '<div class="cere-basket" id="cere-basket">🧺</div>' +
        '<div class="cere-egg-wrap arriving" id="cere-egg-wrap">' +
          '<div class="cere-egg" id="cere-egg"></div>' +
          '<div class="cere-warmth" id="cere-warmth"></div>' +
          '<div class="cere-hand" aria-hidden="true">🖐️</div>' +
        '</div>' +
        '<div class="cere-rings" id="cere-rings"></div>' +
        '<div class="cere-fx" id="cere-fx"></div>' +
        '<p class="cere-hint" id="cere-hint"></p>' +
      '</div>';
    stageEl = rootEl.querySelector('#cere-stage');
    eggWrapEl = rootEl.querySelector('#cere-egg-wrap');
    eggEl = rootEl.querySelector('#cere-egg');
    warmthEl = rootEl.querySelector('#cere-warmth');
    ringsEl = rootEl.querySelector('#cere-rings');
    fxEl = rootEl.querySelector('#cere-fx');
    hintEl = rootEl.querySelector('#cere-hint');

    stageEl.addEventListener('pointerdown', onPointerDown);
    stageEl.addEventListener('pointermove', onPointerMove);
    stageEl.addEventListener('pointerup', onPointerEnd);
    stageEl.addEventListener('pointercancel', onPointerEnd);
    renderEgg();
  }

  // ---------- işaretçi olayları ----------
  function onPointerDown (e) {
    var now = Date.now();
    var isDbl = (now - lastTap) < DBL_MS;
    lastTap = now;
    if (isDbl) { accelerate(); return; }

    if (stage === 'warm') {
      rubbing = true;
      lastX = e.clientX; lastY = e.clientY;
      warmTaps += 1;
      play('tap');
      vibrate(8);
      checkWarm();
    } else if (stage === 'rhythm') {
      onRingTap();
    }
  }
  function onPointerMove (e) {
    if (stage !== 'warm' || !rubbing) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    warmDist += Math.sqrt(dx * dx + dy * dy);
    checkWarm();
  }
  function onPointerEnd () { rubbing = false; }

  // Çift-tap: her aşamayı hızlandır
  function accelerate () {
    if (stage === 'arrive') { clearTimers(); startWarm(); }
    else if (stage === 'warm') { finishWarm(); }
    else if (stage === 'rhythm') {
      clearTimers();
      crack = 3; renderEgg();
      play('crackBig'); vibrate([20, 30, 80]);
      doBurst();
    } else if (stage === 'burst') { clearTimers(); showCard(); }
  }

  // ---------- aşama 1: sepetten geliş ----------
  function showArrive () {
    stage = 'arrive';
    setHint('Yumurta geliyor! 🥚');
    play('pop');
    later(function () { startWarm(); }, 950);
  }

  // ---------- aşama 2: ısıtma ----------
  function startWarm () {
    if (stage === 'warm') return;
    stage = 'warm';
    warmDist = 0; warmTaps = 0;
    if (eggWrapEl) { eggWrapEl.classList.remove('arriving'); eggWrapEl.classList.add('warm'); }
    var basket = rootEl && rootEl.querySelector('#cere-basket');
    if (basket) basket.classList.add('gone');
    // Jest gösterimi: yumurta üstünde daire çizen el animasyonu (.cere-hand) — metin kısa kalır
    setHint('Ovala! 🖐️');
  }
  function checkWarm () {
    if (stage !== 'warm') return;
    var progress = Math.max(warmDist / WARM_DIST, warmTaps / WARM_TAPS);
    if (warmthEl) warmthEl.style.opacity = String(Math.min(1, progress) * 0.65);
    if (progress >= 1) finishWarm();
  }
  function finishWarm () {
    if (stage !== 'warm') return;
    stage = 'warming-done';
    rubbing = false;
    crack = 1;
    renderEgg();
    if (warmthEl) warmthEl.style.opacity = '0.65';
    if (eggWrapEl) { eggWrapEl.classList.remove('warm'); eggWrapEl.classList.add('warmed'); }
    play('crack1');
    vibrate(40);
    setHint('Çıtladı! ✨');
    later(function () { startRhythm(); }, 500);
  }

  // ---------- aşama 3: ritim halkaları ----------
  function startRhythm () {
    stage = 'rhythm';

    setHint('Halkaya dokun! 👆');
    showRing(0);
  }
  function showRing (i) {
    ringStep = i;

  function onRingTap () {

    } else if (ringStep === 1) {

      play('crack2'); vibrate(30);

    } else {

    }
  }

  // ---------- aşama 4: patlama + kutlama ----------
  function doBurst () {

    if (eggWrapEl) eggWrapEl.classList.add('burst');

    var tier = (result && result.celebrationTier) || 0;
    play('pop');

    else if (tier === 2) play('fanfare');

      fxEl.innerHTML = '<div class="cere-flash"></div>';

      if (tier >= 2) later(function () { spawnConfetti(24); }, 350);
      var pw = document.createElement('div');
      pw.className = 'cere-pufi';
