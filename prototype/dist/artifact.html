  /* ---------- çizim ---------- */
  function render () {
    if (!el) return;
    var s = st();
    var list = eggsList();
    var eggs = list.length;
    if (heldIdx !== null && (heldIdx < 0 || heldIdx >= eggs)) heldIdx = null;
    var holding = heldIdx !== null;
    var biome = s.activeBiome === 'orman' ? 'orman' : 'cayir';
    el.classList.toggle('orman', biome === 'orman');
    var BIO = (Yuvo.data && Yuvo.data.BIOMES) || {};
    var bioAd = (BIO[biome] && BIO[biome].ad) || 'Güneş Çayırı';
    var owned = ownedCount(biome);
    var pct = Math.max(0, Math.min(100, Math.round(owned / 30 * 100)));
    var R = ritual();
    var choc = Math.max(0, s.chocolates | 0);
    var jarReady = choc >= R.ESIK && (s.kumbaraToday | 0) < R.GUNLUK;
    // Kiler: bekleyen sürpriz + günlük hak (çocuk dili — fiyat/mağaza dili YOK)
    var kilerTavan = ((Yuvo.data.STORE_LIMITS && Yuvo.data.STORE_LIMITS.kilerGunluk) || 5) +
      (s.parent && s.parent.clubActive ? ((Yuvo.data.CLUB && Yuvo.data.CLUB.kilerEk) || 1) : 0);
    var kilerHak = s.kiler && (s.kiler.adet | 0) > 0 && (s.kiler.bugunAcilan | 0) < kilerTavan;

    // Hedef parça ("Arıyorum!") — bulunduysa BİR KEZ kutla, çip yıldıza döner
    var hedefP = (s.hedefPufi && Yuvo.data && Yuvo.data.pufiById) ? Yuvo.data.pufiById(s.hedefPufi) : null;
    var hedefBulundu = null;
    if (hedefP && (s.owned || {})[hedefP.id]) {
      hedefBulundu = hedefP;
      s.hedefPufi = null;
      if (Yuvo.engine && Yuvo.engine.save) { try { Yuvo.engine.save(); } catch (e) {} }
      play('fanfare');
      toast('🎯 Aradığın dost geldi: ' + hedefP.ad + '! 🌟');
      hedefP = null;
    }
    // Görev bonusu düştüyse yuva BİR KEZ kutlar (bayrak düşer)
    if (s.gorevBonusYeni) {
      s.gorevBonusYeni = false;
      if (Yuvo.engine && Yuvo.engine.save) { try { Yuvo.engine.save(); } catch (e) {} }
      play('fanfare');
      toast('🎁 Günün zinciri tamam — bonus yumurta yuvada!');
    }
    var g = s.gorevler || { ac: 0, oyun: 0, albumZiyaret: false, bonusVerildi: false };
    var gh = (Yuvo.engine && Yuvo.engine.gorevHedef) ? Yuvo.engine.gorevHedef() : { ac: 3, oyun: 1 };
    var html = '';

    // Manzara katmanı: gök + tepeler + güneş + sticker bulutlar (tamamı dekor;
    // güneş env meadow katmanında, fallback'te skyline() CSS güneşini basar)
    html += '<div class="home-sky" aria-hidden="true">' +
              '<div class="home-landscape">' + skyline() + '</div>' +
              '<div class="home-cloud c1">' + cloudSVG() + '</div>' +
              '<div class="home-cloud c2">' + cloudSVG() + '</div>' +
            '</div>';

    // Albüm ilerleme şeridi — sticker çip (aktif biyomun sayacı)
    html += '<button class="home-progress" data-act="album"' +
              ' aria-label="Albümü aç — ' + bioAd + ' ' + owned + '/30">' +
              ic('album', '📔', 'home-progress-ico') +
              '<span class="home-progress-main">' +
                '<span class="home-progress-label">' + bioAd + ' <b>' + owned + '/30</b></span>' +
                '<span class="home-progress-bar">' +
                  '<span class="home-progress-fill" style="width:' + pct + '%"></span>' +
                '</span>' +
              '</span>' +
            '</button>';

    // Günlük görev zinciri çipleri (baskı dili YOK — "kaybettin" asla; 3'ü de → +1 bonus)
    var gAcOk = (g.ac | 0) >= gh.ac, gOyunOk = (g.oyun | 0) >= gh.oyun, gAlbOk = g.albumZiyaret === true;
    html += '<div class="home-gorev' + (g.bonusVerildi ? ' done' : '') + '"' +
              ' role="group" aria-label="Günün küçük görevleri">' +
              '<span class="gorev-chip' + (gAcOk ? ' ok' : '') + '" aria-label="Yumurta aç: ' +
                Math.min(g.ac | 0, gh.ac) + '/' + gh.ac + '">🥚<b>' +
                Math.min(g.ac | 0, gh.ac) + '/' + gh.ac + '</b></span>' +
              '<button class="gorev-chip' + (gOyunOk ? ' ok' : '') + '" data-act="gorev-oyun"' +
                ' aria-label="Bir oyun oyna">🎮<b>' + (gOyunOk ? '✓' : '0/1') + '</b></button>' +
              '<button class="gorev-chip' + (gAlbOk ? ' ok' : '') + '" data-act="album"' +
                ' aria-label="Albüme bak">📔<b>' + (gAlbOk ? '✓' : '·') + '</b></button>' +
              '<span class="gorev-odul' + (g.bonusVerildi ? ' ok' : '') + '" aria-hidden="true">' +
                (g.bonusVerildi ? '🎁✓' : '→🎁') + '</span>' +
            '</div>';

    // Hedef çipi ("Arıyorum!") — çocuğun kendi seçtiği parça; fiyat dili YOK
    if (hedefBulundu) {
      html += '<button class="home-hedef found" data-act="album" aria-label="Albümü aç">' +
                '<span class="hedef-star" aria-hidden="true">🌟</span>' +
                '<span>' + hedefBulundu.ad + ' yuvana katıldı!</span></button>';
    } else if (hedefP) {
      var hedefSil = '';
      try {
        hedefSil = (Yuvo.art && Yuvo.art.pufiSilhouetteSVG && Yuvo.art.pufiSilhouetteSVG(hedefP)) || '';
      } catch (e) {}
      html += '<button class="home-hedef" data-act="album"' +
                ' aria-label="Hedefin: ' + hedefP.ad + ' — albümü aç">' +
                '<span aria-hidden="true">🎯</span>' +
                (hedefSil ? '<span class="hedef-sil" aria-hidden="true">' + hedefSil + '</span>' : '') +
                '<span>Arıyorum: <b>' + hedefP.ad + '</b></span></button>';
    }

    // Kenar düğmeleri: Ebeveyn (gri, göze batmaz) + biyom kapısı + Şako Saklambaç
    html += '<div class="home-side">';
    html += '<button class="home-side-btn home-parent-btn" data-act="parent"' +
              ' aria-label="Ebeveyn paneli"><span aria-hidden="true">👨‍👩‍👧</span>' +
              '<small>Ebeveyn</small></button>';
    if (s.ormanAcik) {
      var hedefAd = biome === 'orman' ? 'Güneş Çayırı' : 'Fısıltı Ormanı';
      html += '<button class="home-side-btn home-biome-btn" data-act="biome"' +
                ' aria-label="' + hedefAd + '\'na geç">' +
                '<span aria-hidden="true">' + (biome === 'orman' ? '🌻' : '🌲') + '</span>' +
                '<small>' + (biome === 'orman' ? 'Çayır' : 'Orman') + '</small></button>';
      if (biome === 'orman') {
        html += '<button class="home-side-btn home-sako-btn' + (s.sakoHidden ? ' alert' : '') + '"' +
                  ' data-act="sako" aria-label="Şako Saklambaç">' +
                  '<span aria-hidden="true">🪶</span><small>Şako</small></button>';
      }
    }
    html += '</div>';

    // Balon Postanesi tezgâhı + ambalajlı yumurtalar + kumbara
    html += '<div class="home-nest-wrap">';
    if (holding) {
      html += '<p class="home-hint"><span class="ys-ico" aria-hidden="true">' + bellSVG() +
              '</span><span>Bir daha dokun — töreni başlat!</span></p>';
    } else if (eggs > 0) {
      html += '<p class="home-hint">' + ic('egg', '🥚') +
              '<span>Postan geldi! Bir yumurta seç bakalım…</span></p>';
    } else {
      html += '<p class="home-hint"><span class="ys-ico" aria-hidden="true">' + moonSVG() +
              '</span><span>Bugünkü yumurtalar açıldı</span></p>';
    }
    html += '<div class="home-nest home-counter-zone' + (holding ? ' holding' : '') + '">';
    html += '<div class="home-balloon" aria-hidden="true">' + balloonSVG() + '</div>';
    html += '<div class="home-eggs' + (holding ? ' holding' : '') + '">';
    if (eggs > 0) {
      var shown = Math.min(eggs, 5);
      for (var i = 0; i < shown; i++) {
        var cls = 'home-egg';
        if (heldIdx === i) cls += ' held';
        else if (holding) cls += ' faded';
        if (dropNew && i === shown - 1) cls += ' drop';
        if (list[i] && list[i].kulucka) cls += ' kulucka';
        var lbl = (heldIdx === i) ? 'Yumurtayı aç — töreni başlat'
          : (list[i] && list[i].kulucka) ? 'Kuluçka yumurtası hazır — eline al'
          : 'Yumurtayı eline al';
        html += '<button class="' + cls + '" style="--i:' + i + '" data-act="egg"' +
                  ' data-idx="' + i + '" aria-label="' + lbl + '">' +
                  '<span class="home-egg-art">' + wrapperArt(list[i]) + '</span>' +
                  (list[i] && list[i].kulucka
                    ? '<b class="home-egg-badge" aria-hidden="true">☀️ Hazır!</b>' : '') +
                '</button>';
      }
      if (eggs > shown) html += '<span class="home-egg-more">+' + (eggs - shown) + '</span>';
      // İlk oturum el ipucu: hiç yumurta açılmadıysa dokunuşu göster (metin okumadan)
      if ((s.eggCounter | 0) === 0 && !holding) {
        html += '<div class="home-hand" aria-hidden="true">👆</div>';
      }
    } else {
      html += '<span class="home-nest-empty" aria-hidden="true">' + moonSVG() + '</span>';
    }
    html += '</div>';
    html += '<div class="home-basket home-counter" aria-hidden="true">' + counterSVG() + '</div>';
    // Kumbara kavanozu — tezgâh köşesi (doluluk okumasız görülür)
    html += '<button class="home-jar' + (jarReady ? ' ready' : '') + '" data-act="jar"' +
              ' aria-label="Çikolata Kumbarası — ' + choc + '/' + R.ESIK + '">' +
              jarSVG(choc / R.ESIK) +
              '<b class="home-jar-count">' + choc + '/' + R.ESIK + '</b>' +
            '</button>';
    // Kiler sürprizi — çocuk dilinde "posta" (fiyat/mağaza dili YOK; v2·04 kural d)
    if (kilerHak) {
      html += '<button class="home-kiler" data-act="kiler"' +
                ' aria-label="Sürpriz yumurtayı sepete al">' +
                ic('egg', '🥚') + '<span>Sürpriz posta!</span></button>';
    }
    // Eldeyken: Salla! (basılı-tut jestinin tap fallback'i) + Geri Koy
    if (holding) {
      html += '<div class="home-held-actions">' +
                '<button class="btn btn-soft home-held-btn" data-act="shake"' +
                  ' aria-label="Yumurtayı salla ve dinle">' +
                  '<span class="ys-ico" aria-hidden="true">' + bellSVG() + '</span>Salla!</button>' +
                '<button class="btn btn-soft home-held-btn" data-act="putback"' +
                  ' aria-label="Yumurtayı geri koy">' +
                  ic('back', '↩') + 'Geri Koy</button>' +
              '</div>';
    }
    html += '</div></div>';
    dropNew = false;

    // Gün sonu paneli (yumurta bitince) — kapanış ritüeli: özet + yarının vaadi
    // (araştırma: geri sayım sayacı YOK; "yarın sebebi" hikâye kapısıyla verilir)
    if (eggs === 0) {
      var extraLeft = Math.max(0, 2 - (s.extraEggsBought | 0));
      var canAfford = (s.stardust | 0) >= 120;
      html += '<div class="home-dayend">';

      // Bugünün Dostları — bugün açılan portreler (tekrarsız, en çok 6)
      var acilan = Array.isArray(s.bugunAcilanlar) ? s.bugunAcilanlar : [];
      var gorulen = {}, dostlar = [], ai, ap;
      for (ai = 0; ai < acilan.length && dostlar.length < 6; ai++) {
        if (gorulen[acilan[ai]]) continue;
        gorulen[acilan[ai]] = true;
        ap = Yuvo.data && Yuvo.data.pufiById && Yuvo.data.pufiById(acilan[ai]);
        if (ap) dostlar.push(ap);
      }
      if (dostlar.length) {
        html += '<div class="dayend-dostlar" aria-label="Bugünün dostları">' +
                  '<span class="dayend-baslik">Bugünün Dostları</span>' +
                  '<span class="dayend-dost-row">';
        for (ai = 0; ai < dostlar.length; ai++) {
          html += '<span class="dayend-dost" style="--d:' + (ai * 0.12).toFixed(2) + 's"' +
                    ' title="' + dostlar[ai].ad + '">' + pufiArt(dostlar[ai]) + '</span>';
        }
        html += '</span></div>';
      }

      // Yarının vaadi: seri silueti — SAYAÇ YOK ("Rüzgâr Postası yarın geliyor")
      var ySeri = (Yuvo.engine && Yuvo.engine.yarinSeri) ? Yuvo.engine.yarinSeri() : null;
      var ySeriAd = (ySeri && Yuvo.data.WRAPPER_SERIES && Yuvo.data.WRAPPER_SERIES[ySeri] &&
                     Yuvo.data.WRAPPER_SERIES[ySeri].ad) || '';
      if (ySeriAd) {
        html += '<div class="dayend-yarin" aria-label="Yarın: ' + ySeriAd + '">' +
                  '<span class="dayend-yarin-egg" aria-hidden="true">' +
                    wrapperArt({ seri: ySeri, variant: 0 }) + '</span>' +
                  '<span>Yarın: <b>' + ySeriAd + '</b> deseni geliyor…</span>' +
                '</div>';
      }

      // Bekçi Takvimi — CEZASIZ 7 yıldız (kaçan gün zinciri KIRMAZ; "kaybettin" dili yok)
      var stI = (Yuvo.engine && Yuvo.engine.streakInfo) ? Yuvo.engine.streakInfo()
                : { hedef: 7, kabuk: 25 };
      var yFilled = Math.min(stI.hedef, (s.streak && s.streak.yildiz) | 0);
      var bugunYildiz = (g.ac | 0) > 0;
      html += '<div class="dayend-takvim" aria-label="Bekçi Takvimi: ' + yFilled +
                ' yıldız, hedef ' + stI.hedef + '">' +
                '<span class="dayend-baslik">Bekçi Takvimi</span>' +
                '<span class="takvim-stars" aria-hidden="true">';
      for (ai = 0; ai < stI.hedef; ai++) {
        var stCls = ai < yFilled ? ' on' : (bugunYildiz && ai === yFilled ? ' today' : '');
        html += '<i class="takvim-star' + stCls + '">★</i>';
      }
      html += '</span><small>' + stI.hedef + ' yıldız olunca +' + stI.kabuk + ' Kabuk!' +
              ((s.streak && (s.streak.rozet | 0) > 0) ? ' · 🏅×' + (s.streak.rozet | 0) : '') +
              '</small></div>';
      if (extraLeft > 0) {
        html += '<button class="btn btn-primary home-extra" data-act="extra"' +
                  (canAfford ? '' : ' disabled') +
                  ' aria-label="120 yıldız tozuna 1 ek yumurta — kalan hak ' + extraLeft + '/2">' +
                  ic('egg', '🥚') + '<span>+1 Yumurta</span>' +
                  '<span class="home-extra-cost">' + ic('star', '⭐') + '120</span>' +
                  '<span class="home-pips" aria-hidden="true">' +
                    '<i class="pip on"></i><i class="pip' + (extraLeft === 2 ? ' on' : '') + '"></i>' +
                  '</span>' +
                '</button>';
        if (!canAfford) {
          html += '<p class="home-note">' + ic('star', '⭐') +
                  '<span>Yıldız tozu yetersiz — Eşle &amp; Bul oynayıp yıldız toplayabilirsin!</span></p>';
        }
      } else {
        html += '<p class="home-note">' + ic('egg', '🥚') +
                '<span>Bugünlük ek yumurta hakkın doldu (2/2).</span></p>';
      }
      html += '<button class="btn btn-soft home-endday" data-act="endday">' +
                '<span class="ys-ico" aria-hidden="true">' + moonSVG() + '</span>Günü Bitir</button>';
      html += '</div>';
    }

    // Çayır: süs çiçekleri + gezinen Pufiler
    var roam = lastOwnedPufis();
    html += '<div class="home-meadow">';
    html += '<div class="home-flowers" aria-hidden="true">' + meadowDecorSVG() + '</div>';
    for (var j = 0; j < roam.length; j++) {
      var left = 6 + ((j * 19) % 68);
      var dur = (7 + (j % 3) * 2.5).toFixed(1);
      var delay = (-(j * 1.7)).toFixed(1);
      html += '<button class="home-roamer' + (j % 2 === 1 ? ' alt' : '') + '"' +
                ' data-act="pufi" data-id="' + roam[j].id + '"' +
                ' style="left:' + left + '%;animation-duration:' + dur + 's;animation-delay:' + delay + 's"' +
                ' aria-label="' + roam[j].ad + '">' +
                '<span class="home-roamer-body">' + pufiArt(roam[j]) + '</span>' +
              '</button>';
    }
    if (roam.length === 0) {
      html += '<p class="home-meadow-hint"><span class="ys-ico" aria-hidden="true">' + bloomSVG() +
              '</span><span>Çayır henüz sessiz… İlk Pufi\'ni bekliyor</span></p>';
    }
    html += '<div class="home-grass" aria-hidden="true"></div>';
    html += '</div>';

    el.innerHTML = html;
    if (el.querySelector('.home-egg.drop')) {
      later(function () {
        var d = el && el.querySelector('.home-egg.drop');
        if (d) d.classList.remove('drop');
      }, 800);
    }
  }

  /* ---------- vitrin jestleri ---------- */
  function clearHold () {
    if (holdTimer !== null) { clearTimeout(holdTimer); holdTimer = null; }
  }

  function putBack (silent) {
    if (heldIdx === null) return;
    heldIdx = null;
    if (!silent) { play('click'); render(); }
  }

  // Salla: eldeki yumurta çıngırdar — ses aileyi fısıldar, nadirliği asla (§1.3)
  function doShake () {
    var s0 = st();
    play('shakeRattle', { family: s0.activeBiome === 'orman' ? 'orman' : 'cayir' });
    var art = el && el.querySelector('.home-egg.held .home-egg-art');
    if (art) {
      art.classList.remove('shake');
      void art.offsetWidth; // animasyonu baştan başlat
      art.classList.add('shake');
      later(function () {
        var a = el && el.querySelector('.home-egg.held .home-egg-art');
        if (a) a.classList.remove('shake');
      }, 700);
    }
    shakeHints();
  }

  // Olabilirlik karuseli (POP MART "shake for hints" esinli, DÜRÜST hâli): sallayınca
  // aktif biyomun EKSİK dostlarından 3 silüet belirir — sonuç henüz çekilmediği için
  // hepsi gerçekten olası; merak boşluğunu daraltmadan besler. Nadirlik ASLA sızmaz.
  function shakeHints () {
    if (!el) return;
    var held = el.querySelector('.home-egg.held');
    if (!held) return;
    var s = st(), biome = s.activeBiome === 'orman' ? 'orman' : 'cayir';
    var list = (Yuvo.data && Yuvo.data.PUFIS) || [], eksik = [], i, p;
    for (i = 0; i < list.length; i++) {
      p = list[i];
      if ((p.biome || 'cayir') !== biome || p.rarity === 'gizli') continue;
      if (!(s.owned || {})[p.id]) eksik.push(p);
    }
    if (!eksik.length) return;
    var secim = [];
    for (i = 0; i < 3 && eksik.length; i++) {
      secim.push(eksik.splice(Math.floor(Math.random() * eksik.length), 1)[0]);
    }
    var old = el.querySelector('.home-shake-hints');
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var box = document.createElement('span');
    box.className = 'home-shake-hints';
    box.setAttribute('aria-hidden', 'true');
    var html = '';
    for (i = 0; i < secim.length; i++) {
      var sil = '';
      try { sil = (Yuvo.art && Yuvo.art.pufiSilhouetteSVG && Yuvo.art.pufiSilhouetteSVG(secim[i])) || ''; }
      catch (e) {}
      html += '<span class="hint-p" style="--d:' + (i * 0.22).toFixed(2) + 's">' + sil + '</span>';
    }
    html += '<b class="hint-q">?</b>';
    box.innerHTML = html;
    held.appendChild(box);
    later(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 2000);
  }

  // Şako gece uçuşu (gün kapanışı): silüet süzülür, kuluçka yumurtasını bırakır.
  // Sonuç/nadirlik SIZMAZ — yalnız "yarın sürprizi var" vaadi (ekranda duran kanca).
  function sakoFlybySVG () {
    return '<svg viewBox="0 0 120 70" aria-hidden="true" focusable="false">' +
      '<g fill="#1E2A4A">' +
        '<ellipse cx="58" cy="40" rx="26" ry="13"/>' +
        '<circle cx="84" cy="30" r="10"/>' +
        '<path d="M92 28l14 3-13 5Z"/>' +                          // gaga
        '<path d="M46 34C30 18 14 16 4 22c12 2 20 8 28 20Z"/>' +    // kanat (yukarı)
        '<path d="M34 44l-26 14 28-4Z"/>' +                         // kuyruk
      '</g>' +
      '<circle cx="86" cy="28" r="1.8" fill="#FFC734"/>' +          // göz parıltısı
    '</svg>';
  }

  function sakoFlyby (onDone) {
    var eski = document.querySelector('.home-sako-flyby');
    if (eski && eski.parentNode) eski.parentNode.removeChild(eski);
    var ov = document.createElement('div');
    ov.className = 'home-sako-flyby';
    ov.setAttribute('aria-hidden', 'true');
    ov.innerHTML =
      '<span class="flyby-kus">' + sakoFlybySVG() + '</span>' +
      '<span class="flyby-egg">🥚<i>🌙</i></span>' +
      '<p class="flyby-metin">Şako geçti… yuvaya bir şey bıraktı!</p>';
    document.body.appendChild(ov);
    play('chime');
    later(function () {
      if (ov.parentNode) ov.parentNode.removeChild(ov);
      if (onDone) onDone();
    }, 2300);
  }

  // Kargo balonu teslimatı: kilerden çekilen yumurta adaya süzülen balonla iner
  // (ticaret dili SIFIR — "Rüzgâr Postası" kurgusu; drawFromKiler commit'i vitrini
  // zaten doldurdu, bu katman yalnız hikâyeyi anlatır)
  function kargoBalon () {
    if (!el) return;
    var ov = document.createElement('div');
    ov.className = 'home-kargo';
    ov.setAttribute('aria-hidden', 'true');
    ov.innerHTML =
      '<span class="kargo-balon">' + balloonSVG() + '</span>' +
      '<span class="kargo-egg">🥚</span>';
    el.appendChild(ov);
    play('chime');
    later(function () {
      if (ov.parentNode) ov.parentNode.removeChild(ov);
      dropNew = true;
      toast('Rüzgâr Postası bir sürpriz getirdi!');
      render();
    }, 1600);
  }

  // Yuva çağrısı: rastgele bir yumurta ara ara "hop" yapar + parıltı saçar (dokunulası)
  function liveliness () {
    later(function tick () {
      if (el && heldIdx === null) {
        var adaylar = el.querySelectorAll('.home-egg');
        if (adaylar.length) {
          var secilen = adaylar[Math.floor(Math.random() * adaylar.length)];
          var art = secilen.querySelector('.home-egg-art');
          if (art) {
            art.classList.add('hop');
            var spark = document.createElement('b');
            spark.className = 'home-egg-spark';
            spark.setAttribute('aria-hidden', 'true');
            spark.textContent = '✨';
            secilen.appendChild(spark);
            later(function () {
              art.classList.remove('hop');
              if (spark.parentNode) spark.parentNode.removeChild(spark);
            }, 950);
          }
        }
      }
      later(tick, 4200 + Math.random() * 2600);
    }, 3200);
  }

  // 400ms basılı tut = salla (jest; tap fallback'i eldeki "Salla!" butonu)
  function handleDown (e) {
    suppressClick = false;
    clearHold();
    var b = e.target && e.target.closest ? e.target.closest('.home-egg[data-idx]') : null;
    if (!b) return;
    var idx = parseInt(b.getAttribute('data-idx'), 10);
    if (isNaN(idx)) return;
    holdTimer = setTimeout(function () {
      holdTimer = null;
      suppressClick = true; // basılı-tut sonrası click "aç" sayılmasın
      if (heldIdx !== idx) { heldIdx = idx; play('crinkle'); render(); }
      doShake();
    }, 400);
  }
  function handleUp () { clearHold(); }

  /* ---------- etkileşim (delege tek dinleyici) ---------- */
  function handleClick (e) {
    if (suppressClick) { suppressClick = false; return; }
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) {
      // Dışarı tap: eldeki yumurta geri konur
      if (heldIdx !== null) putBack();
      return;
    }
    var act = b.getAttribute('data-act');

    if (act === 'egg') {
      var idx = parseInt(b.getAttribute('data-idx'), 10);
      if (isNaN(idx)) idx = 0;
      if (heldIdx === idx) {
        // İkinci tap: tören başlar (eggIdx ile — vitrindeki O yumurta açılır)
        heldIdx = null;
        play('tap');
        if (Yuvo.go) Yuvo.go('ceremony', { eggIdx: idx });
      } else {
        // İlk tap: eline al (crinkle — elde çevirme hissi); başka yumurta eldeyse değiştirir
        heldIdx = idx;
        play('crinkle');
        render();
      }
    } else if (act === 'shake') {
      doShake();
    } else if (act === 'putback') {
      putBack();
    } else if (act === 'jar') {
      putBack(true);
      var R = ritual();
      var ok = !!(Yuvo.engine && Yuvo.engine.redeemChocolates && Yuvo.engine.redeemChocolates());
      if (ok) {
        play('jarClink');
        play('fanfare');
        dropNew = true; // şölen yumurtası vitrine düşer animasyonu
        toast('Çikolata Şöleni! Tezgâha yeni bir yumurta kondu!');
      } else {
        play('jarClink');
        var s2 = st();
        if ((s2.chocolates | 0) >= R.ESIK && (s2.kumbaraToday | 0) >= R.GUNLUK) {
          toast('Bugünkü şölen yapıldı — kumbara yarını bekliyor.');
        } else {
          toast('Kumbarada ' + Math.max(0, s2.chocolates | 0) + ' çikolata var — ' +
                R.ESIK + ' olunca şölen!');
        }
      }
      render();
    } else if (act === 'album') {
      putBack(true);
      play('page');
      if (Yuvo.go) Yuvo.go('album');
    } else if (act === 'pufi') {
      // Her Pufi KENDİ cıvıltısıyla selamlar + minik konuşma balonu (yuva canlı hissettirir)
      var pid = b.getAttribute('data-id');
      play('pufiChirp', { id: pid || 'pufi' });
      var body = b.querySelector('.home-roamer-body');
      if (body) {
        body.classList.remove('jump');
        void body.offsetWidth; // animasyonu baştan başlat
        body.classList.add('jump');
        later(function () { body.classList.remove('jump'); }, 700);
      }
      var eskiBalon = b.querySelector('.roamer-bubble');
      if (eskiBalon && eskiBalon.parentNode) eskiBalon.parentNode.removeChild(eskiBalon);
      var SELAM = (Yuvo.data && Yuvo.data.DIALOG && Yuvo.data.DIALOG.pufiSelam) ||
        ['Merhaba!', 'Cik cik!', 'Bugün ne güzel!', 'Beraber oynayalım mı?'];
      var balon = document.createElement('span');
      balon.className = 'roamer-bubble';
      balon.textContent = SELAM[Math.floor(Math.random() * SELAM.length)];
      b.appendChild(balon);
      later(function () { if (balon.parentNode) balon.parentNode.removeChild(balon); }, 1500);
    } else if (act === 'extra') {
      putBack(true);
      var ok2 = !!(Yuvo.engine && Yuvo.engine.buyExtraEgg && Yuvo.engine.buyExtraEgg());
      if (ok2) {
        play('star');
        dropNew = true;
        toast('Ek yumurta tezgâha kondu!');
      } else {
        var s3 = st();
        if ((s3.extraEggsBought | 0) >= 2) toast('Bugünlük ek yumurta hakkı doldu.');
        else toast('Yıldız tozu yetersiz — 120 yıldız gerekiyor.');
      }
      render();
    } else if (act === 'endday') {
      putBack(true);
      play('chime');
      var geceSonu = function () {
        // Şako gece uçuşu: yarının kuluçka sürprizini bırakır (sayaç değil, hikâye kapısı)
        if (Yuvo.engine && Yuvo.engine.kuluckaBirak) Yuvo.engine.kuluckaBirak();
        sakoFlyby(function () {
          if (Yuvo.engine && Yuvo.engine.newDay) Yuvo.engine.newDay();
          var s5 = st();
          var kulHazir = !!(s5.todayEggs && s5.todayEggs[0] && s5.todayEggs[0].kulucka);
          toast(kulHazir
            ? 'Yeni gün! Şako\'nun bıraktığı kuluçka yumurtası hazır! ☀️'
            : 'Yeni gün! Rüzgâr Postası yumurtaları bıraktı.');
          render();
        });
      };
      // Luna'nın günbatımı ritüeli (docs/v2/04 §1 14:30) — yoksa doğrudan gece sonu
      if (Yuvo.scenes.intro && Yuvo.scenes.intro.playDusk) Yuvo.scenes.intro.playDusk(geceSonu);
      else geceSonu();
    } else if (act === 'gorev-oyun') {
      putBack(true);
      play('click');
      if (Yuvo.go) Yuvo.go('minigame');
    } else if (act === 'kiler') {
      putBack(true);
      var okK = !!(Yuvo.engine && Yuvo.engine.drawFromKiler && Yuvo.engine.drawFromKiler());
      if (okK) {
        play('pop');
        kargoBalon();                         // ticaret dili sıfır: balon süzülür, yumurta iner
      } else {
        toast('Bugünlük sürprizler tamam — yarın devam!');
        render();
      }
    } else if (act === 'parent') {
      putBack(true);
      play('click');
      if (Yuvo.go) Yuvo.go('parent');
    } else if (act === 'biome') {
      putBack(true);
      var s4 = st();
      var hedef = (s4.activeBiome === 'orman') ? 'cayir' : 'orman';
      if (Yuvo.engine && Yuvo.engine.setBiome && Yuvo.engine.setBiome(hedef)) {
        play('page');
        var B2 = (Yuvo.data && Yuvo.data.BIOMES) || {};
        toast(((B2[hedef] && B2[hedef].ad) || hedef) + '\'na hoş geldin!');
      }
      render();
    } else if (act === 'sako') {
      putBack(true);
      play('click');
      if (Yuvo.go) Yuvo.go('sako');
    }
  }

  /* ---------- sahne API ---------- */
  Yuvo.scenes.home = {
    mount: function (rootEl) {
      heldIdx = null;
      suppressClick = false;
      dropNew = false;
      el = document.createElement('div');
      el.className = 'home-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      el.addEventListener('pointerdown', handleDown);
      window.addEventListener('pointerup', handleUp);
      window.addEventListener('pointercancel', handleUp);
      onState = function () { render(); };
      document.addEventListener('yuvo:state', onState);

  function render () {
    if (!el) return;
    if (mode === 'citcit') { renderCitcit(); return; }
    var s = st();
    var plays = Math.min(5, s.rewardedPlaysToday | 0);
    var left = 5 - plays;
    // Kalan ödüllü hak: dolu/boş mini yıldız SVG dizisi (okuma öncesi yaş)
    var hak = '';
    for (var h = 0; h < 5; h++) {
      hak += '<span class="ys-ico">' + starPipSVG(h < left) + '</span>';
    }
    var html = '';
    html += '<div class="mg-head center">' +
              '<h2 class="mg-title"><span class="ys-ico mg-title-ico" aria-hidden="true">' +

              '<p class="mg-sub">Aynı iki dostu bul!</p>' +
              '<div class="mg-lives" aria-label="Bugün ödüllü oyun hakkı: ' + left + '/5">' +

    var stars = attempts <= 4 ? 3 : (attempts <= 6 ? 2 : 1);
    var s = st();

    var reward = rested ? 5 : (stars === 3 ? 40 : (stars === 2 ? 30 : 20));

    if (!rested) s.rewardedPlaysToday = (s.rewardedPlaysToday | 0) + 1;

    for (var i = 0; i < 3; i++) {

    }

    panel.className = 'mg-result';
    panel.innerHTML =
      '<div class="mg-result-card center">' +
        '<div class="mg-stars" role="img" aria-label="' + stars + ' yıldız kazandın">' +
          starsHtml + '</div>' +
        '<h3 class="mg-result-title">' +
          (stars === 3 ? 'Muhteşem hafıza!' : (stars === 2 ? 'Çok iyi!' : 'Aferin sana!')) +
        '</h3>' +
        (rested
          ? '<p class="mg-note"><span class="ys-ico" aria-hidden="true">' + moonSVG() +
              '</span><span>Pufiler dinleniyor — yarın yine oynayalım!</span></p>'
          : '<p class="mg-note">Yıldız tozun hazır:</p>') +
        '<p class="mg-reward">' + ic('star', '⭐') + '<b>+' + reward + '</b></p>' +
        '<div class="mg-btns stack">' +
          '<button class="btn btn-primary" data-mg="again">' +
            '<span class="ys-ico" aria-hidden="true">' + replaySVG() + '</span>Tekrar</button>' +
          '<button class="btn btn-soft" data-mg="home">' + ic('yuva', '🏡') + 'Yuvaya Dön</button>' +
        '</div>' +
      '</div>';
    el.appendChild(panel);
  }

  function start () {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
    flippedIdx = [];
    matchedPairs = 0;
    attempts = 0;
    lock = false;
    finished = false;
    buildDeck();
    render();
  }

  /* ---------- etkileşim ---------- */
  function handleClick (e) {
    var t = e.target;
    var card = t && t.closest ? t.closest('.mg-card') : null;
    if (card) { onCardTap(card); return; }
    var b = t && t.closest ? t.closest('[data-mg]') : null;
    if (!b) return;
    var act = b.getAttribute('data-mg');
    if (act === 'again') {
      play('click');
      start();
    } else if (act === 'home') {
      play('click');
      if (Yuvo.go) Yuvo.go('home');
    } else if (act === 'citcit') {
      play('click');
      mode = 'citcit';
      citCrack = 0;
      citRarity = CIT_RARITIES[Math.floor(Math.random() * CIT_RARITIES.length)];
      render();
    } else if (act === 'match') {
      play('click');
      mode = 'match';
      start();
    } else if (act === 'crack') {
      citCrack += 1;
      if (citCrack > 3) {
        play('pop');                          // kabuk açıldı → taze yumurta gelir
        citCrack = 0;
        citRarity = CIT_RARITIES[Math.floor(Math.random() * CIT_RARITIES.length)];
      } else {
        play('crack');
      }
      render();
    }
  }

  Yuvo.scenes.minigame = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'mg-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      mode = 'match';
      citCrack = 0;
      start();

      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];
      flippedIdx = [];
      deck = [];
      lock = false;
      finished = false;
      if (el) {
        el.removeEventListener('click', handleClick);
        if (el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
    }
  };
})();

  function miniArt (p) {
    if (Yuvo.art && Yuvo.art.pufiSVG) {
      try { var s = Yuvo.art.pufiSVG(p, { mood:'happy' }); if (s) return s; } catch (e) {}
    }
    return '<span class="alb-art-fallback">🐣</span>';
  }
  function silArt (p) {
    if (Yuvo.art && Yuvo.art.pufiSilhouetteSVG) {
      try { var s = Yuvo.art.pufiSilhouetteSVG(p); if (s) return s; } catch (e) {}
    }
    return '<span class="alb-art-fallback dim">🐾</span>';
  }
  function toyArt (p) {
    if (Yuvo.art && Yuvo.art.toyAssembledSVG) {
      try { var s = Yuvo.art.toyAssembledSVG(p); if (s) return s; } catch (e) {}
    }
    return miniArt(p);
  }

  /* ---------- çizim ---------- */
  function render () {
    if (!el) return;
    var s = st();
    if (viewBiome === 'orman' && !s.ormanAcik) viewBiome = 'cayir';
    var BIO = (Yuvo.data && Yuvo.data.BIOMES) || {};
    var bioAd = (BIO[viewBiome] && BIO[viewBiome].ad) ||
                (viewBiome === 'orman' ? 'Fısıltı Ormanı' : 'Güneş Çayırı');
    var owned = ownedCount(viewBiome);
    var pct = Math.max(0, Math.min(100, Math.round(owned / 30 * 100)));
    var ownedMap = s.owned || {};
    var miles = s.milestones || [];
    var html = '';

    // Hikâye kitabı sayfası: kâğıt dokulu sarmalayıcı (mevcut sınıflar içinde aynen)
    html += '<div class="alb-page">';

    // Üst bilgi: kurdele/arma başlık + Kabuk bakiyesi
    html += '<div class="alb-head">' +
              '<span class="alb-ribbon">' +
                '<span class="alb-ribbon-ico" aria-hidden="true">' + ico('album', '📔') + '</span>' +
                '<h2 class="alb-title">' + bioAd + '</h2>' +
              '</span>' +
              '<span class="alb-shell" aria-label="Kabuk bakiyesi">' +
                ic('shell', '🐚') + '<b>' + (s.kabuk | 0) + '</b>' +
              '</span>' +
            '</div>';

    // Biyom sekmeleri — orman açılana dek kilitli görünür (fiyat/mağaza dili YOK)
    var ormanVar = false, bi;
    var tumListe = pufiList();
    for (bi = 0; bi < tumListe.length; bi++) {
      if ((tumListe[bi].biome || 'cayir') === 'orman') { ormanVar = true; break; }
    }
    if (ormanVar) {
      html += '<div class="alb-biomes">' +
                '<button class="alb-biome-tab' + (viewBiome === 'cayir' ? ' active' : '') + '"' +
                  ' data-act="biome" data-biome="cayir">🌻 Çayır</button>' +
                (s.ormanAcik
                  ? '<button class="alb-biome-tab' + (viewBiome === 'orman' ? ' active' : '') + '"' +
                      ' data-act="biome" data-biome="orman">🌲 Orman</button>'
                  : '<button class="alb-biome-tab locked" data-act="biome-locked">🌫 ???</button>') +
              '</div>';
    }
    var kalan = 30 - owned;
    html += '<div class="alb-progress">' +
              '<span class="alb-progress-num"><b>' + owned + '</b>/30</span>' +
              '<span class="alb-progress-bar' + (kalan > 0 && kalan <= 3 ? ' yakin' : '') + '">' +
                '<span class="alb-progress-fill" style="width:' + pct + '%"></span>' +
              '</span>' +
            '</div>';
    // Yaklaşma vurgusu (goal-gradient) + önceden görünen büyük ödül — baskı dili YOK
    if (kalan > 0 && kalan <= 3) {
      html += '<p class="alb-yakin">🎉 Son ' + kalan + ' dost kaldı!</p>';
    }
    html += '<button class="alb-gold-teaser' + (owned >= 30 ? ' ready' : '') + '" data-act="gold-teaser">' +
              '<span class="agt-ico" aria-hidden="true">🥇</span>' +
              '<span>' + (owned >= 30
                ? '<b>Altın Yumurta</b> — aile tamam! 🎊'
                : '30 dost bir araya gelince: <b>Altın Yumurta</b>') + '</span>' +
            '</button>';

    // Kilometre taşı çipleri — Çayır Sezon-1 rozetleri (orman sayfasında gösterilmez)
    if (viewBiome === 'cayir') {
      html += '<div class="alb-chips">';
      for (var m = 0; m < MILES.length; m++) {
        var mi = MILES[m];
        var claimed = miles.indexOf(mi.key) !== -1;
        var ready = !claimed && owned >= mi.at;
        var cls = claimed ? 'done' : (ready ? 'ready' : 'locked');
        html += '<button class="alb-chip ' + cls + '" data-act="mile" data-key="' + mi.key + '">' +
                  '<b>' + mi.at + '</b>' +
                  (claimed
                    ? '<small>' + ic('check', '✓') + 'alındı</small>'
                    : '<small>+' + mi.odul + ' ' + ic('shell', '🐚') + '</small>') +
                '</button>';
      }
      html += '</div>';
    }

    // 30 hücrelik ızgara (gizli hariç, bakılan biyomun ailesi, PUFIS sırasıyla)
    html += '<div class="alb-grid">';
    var list = [];
    for (var li = 0; li < tumListe.length; li++) {
      if ((tumListe[li].biome || 'cayir') === viewBiome) list.push(tumListe[li]);
    }
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (p.rarity === 'gizli') continue;
      var n = ownedMap[p.id] | 0;
      if (n > 0 && s.sakoHidden === p.id) {
        // Şako sakladı: parça yok olmaz, iz bırakır (tüy) — Saklambaç'la geri gelir
        html += '<button class="alb-cell sako-izi rf rf-' + p.rarity + '" data-act="sako-izi"' +
                  ' data-id="' + p.id + '" aria-label="Şako sakladı — Saklambaç oyna">' +
                  silArt(p) +
                  '<span class="alb-feather" aria-hidden="true">🪶</span>' +
                '</button>';
      } else if (n > 0) {
        html += '<button class="alb-cell rf rf-' + p.rarity + '" data-act="cell" data-id="' + p.id + '"' +
                  ' aria-label="' + p.ad + '">' +
                  miniArt(p) +
                  (n > 1 ? '<span class="alb-copy">×' + n + '</span>' : '') +
                '</button>';
      } else {
        html += '<button class="alb-cell missing rf rf-' + p.rarity + '" data-act="cell" data-id="' + p.id + '"' +
                  ' aria-label="Bilinmeyen Pufi">' +
                  silArt(p) +
                  '<span class="alb-q">?</span>' +
                '</button>';
      }
    }
    html += '</div>';

    // Ayrık gizli hücre — pastel gece adası (yıldız benekleri CSS'te, ay süsü burada)
    var gizli = null;
    for (var g = 0; g < list.length; g++) { if (list[g].rarity === 'gizli') { gizli = list[g]; break; } }
    if (gizli) {
      var gn = ownedMap[gizli.id] | 0;
      html += '<div class="alb-secret-row">' +
                '<span class="alb-secret-moon" aria-hidden="true">' + moonSVG() + '</span>' +
                '<button class="alb-cell alb-secret rf rf-gizli' + (gn > 0 ? '' : ' missing') + '"' +
                  ' data-act="cell" data-id="' + gizli.id + '" aria-label="Gizli Pufi">' +
                  (gn > 0 ? miniArt(gizli) + (gn > 1 ? '<span class="alb-copy">×' + gn + '</span>' : '')
                          : '<span class="alb-q big">???</span>') +
                '</button>' +
                '<span class="alb-secret-label">' +
                  (gn > 0 ? gizli.ad + ' aramıza katıldı!' : 'Çayırda bir sır fısıldanıyor…') +
                '</span>' +
              '</div>';
    }

    html += '</div>'; // .alb-page

    el.innerHTML = html;
  }

  /* ---------- kilometre taşı ödülü ---------- */
  function claimMilestones () {
    var s = st();
    var owned = ownedCount();
    var miles = s.milestones = s.milestones || [];
    var total = 0, i;

    if (Yuvo.engine && Yuvo.engine.checkMilestones) {
      var granted = [];
      try { granted = Yuvo.engine.checkMilestones() || []; } catch (e) { granted = []; }
      for (i = 0; i < MILES.length; i++) {
        if (granted.indexOf(MILES[i].key) !== -1) total += MILES[i].odul;
      }
      if (granted.length) {
        if (Yuvo.engine.save) { try { Yuvo.engine.save(); } catch (e2) {} }
        if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (e3) {} }
      }
    } else {
      // Motor yoksa yerel yedek: bir kez ver
      for (i = 0; i < MILES.length; i++) {
        var mi = MILES[i];
        if (owned >= mi.at && miles.indexOf(mi.key) === -1) {
          miles.push(mi.key);
          s.kabuk = (s.kabuk | 0) + mi.odul;
          total += mi.odul;
        }
      }
      if (total > 0 && Yuvo.refresh) { try { Yuvo.refresh(); } catch (e4) {} }
    }

    if (total > 0) {
      play('star');
      toast('🐚 +' + total + ' Kabuk! Kilometre taşı ödülün.');
    }
    render();
  }

  /* ---------- detay modalı / Atölye ---------- */
  function openDetail (id) {
    var p = byId(id);
    if (!p) return;
    var s = st();
    var n = (s.owned || {})[id] | 0;
    var ri = rarInfo(p.rarity);

    if (n > 0) {
      // Sahipli: albüm bir oyuncak sandığı — dokununca Pufi KENDİ sesiyle selam verir
      try { if (Yuvo.audio && Yuvo.audio.play) Yuvo.audio.play('pufiChirp', { id: p.id }); } catch (eCh) {}
      var htmlOwned =
        '<div class="alb-modal center">' +
          '<div class="alb-modal-art rf rf-' + p.rarity + '">' + toyArt(p) + '</div>' +
          '<h3 class="alb-modal-name">' + p.ad + '</h3>' +
          '<p class="alb-modal-tur">' + p.tur + '</p>' +
          '<p class="alb-modal-tags">' +
            '<span class="rarity-tag" style="background:' + ri.renk + '33;border-color:' + ri.renk + '">' +
              (ri.simge ? ri.simge + ' ' : '') + ri.ad + '</span>' +
            (n > 1 ? ' <span class="alb-copy-tag">×' + n + ' kopya</span>' : '') +
          '</p>' +
          '<p class="alb-bio">“' + p.bio + '”</p>' +
        '</div>';
      if (Yuvo.modal) Yuvo.modal(htmlOwned);
      return;
    }

    // Eksik: Atölye + Dilek Kavanozu (fiyat dili YOK — v2·05 §3)
    play('click');
    var cost = ri.uretim | 0;
    var wallet = s.kabuk | 0;
    var pBiome = p.biome || 'cayir';
    var gizliLocked = (p.rarity === 'gizli') && ownedCount(pBiome) < 30;
    var enough = wallet >= cost;
    var dilekte = false;
    if (Array.isArray(s.wishes)) {
      for (var wi = 0; wi < s.wishes.length; wi++) {
        if (s.wishes[wi] && s.wishes[wi].pufiId === p.id) { dilekte = true; break; }
      }
    }
    var body =
      '<div class="alb-modal center">' +
        '<div class="alb-modal-art rf rf-' + p.rarity + ' missing">' +
          (p.rarity === 'gizli' && gizliLocked ? '<span class="alb-q big">???</span>' : silArt(p)) +
        '</div>' +
        '<h3 class="alb-modal-name">???</h3>' +
        '<p class="alb-modal-tags"><span class="rarity-tag" style="background:' + ri.renk + '33;border-color:' + ri.renk + '">' +
          (ri.simge ? ri.simge + ' ' : '') + ri.ad + '</span></p>' +
        '<div class="alb-workshop">' +
          '<p class="alb-workshop-note">' + ic('shell', '🐚') +
            '<span><b>Usta Kabuk</b> atölyesinde bu dostun oyuncağını üretebilir.</span></p>' +
          '<p class="alb-cost">' +
            '<span class="alb-cost-item">Maliyet <b>' + cost + '</b>' + ic('shell', '🐚') + '</span>' +
            '<span class="alb-cost-item">Cüzdanın <b>' + wallet + '</b>' + ic('shell', '🐚') + '</span>' +
          '</p>';
    if (gizliLocked) {
      body += '<p class="alb-locked">Usta Kabuk fısıldar: “Önce 30 dostu yuvaya getir…” (' +
                ownedCount(pBiome) + '/30)</p>';
    } else {
      body += '<button class="btn btn-primary alb-craft-btn" id="alb-craft-btn"' + (enough ? '' : ' disabled') + '>' +
                ic('shell', '🐢') + 'Usta Kabuk\'a Ürettir</button>';
      if (!enough) body += '<p class="alb-locked">Kabuk yetersiz — kopyalar Kabuk kazandırır!</p>';
    }
    // Dilek Kavanozu: çocuk yalnız "dilek fısıldar" — fiyat/mağaza dili YOK
    if (p.rarity !== 'gizli') {
      if (dilekte) {
        body += '<p class="alb-wish-note">' + ic('star', '💫') +
                '<span>Bu dilek kavanozda bekliyor…</span></p>';
      } else {
        body += '<button class="btn btn-soft alb-wish-btn" id="alb-wish-btn">' +
                  ic('star', '💫') + 'Dilek Kavanozu\'na Fısılda</button>';
      }
      // Hedef parça ("Arıyorum!"): çocuğun KENDİ oyun-içi hedefi — fiyatla ilgisi yok
      if (s.hedefPufi === p.id) {
        body += '<p class="alb-wish-note">🎯 <span>Şu an hedefin bu dost!</span></p>';
      } else {
        body += '<button class="btn btn-soft alb-hedef-btn" id="alb-hedef-btn">🎯 Hedefim Bu!</button>';
      }
    }
    body += '</div></div>';

    var close = Yuvo.modal ? Yuvo.modal(body) : function () {};
    var btn = document.getElementById('alb-craft-btn');
    if (btn) {
      btn.addEventListener('click', function () { doCraft(p, close); });
    }
    var wbtn = document.getElementById('alb-wish-btn');
    if (wbtn) {
      wbtn.addEventListener('click', function () {
        var ok = !!(Yuvo.engine && Yuvo.engine.addWish && Yuvo.engine.addWish(p.id));
        if (ok) {
          play('star');
          toast('Dileğin kavanoza fısıldandı 💫');
          try { close(); } catch (e) {}
        } else {
          toast('Kavanoz dolu — bir dilek gerçekleşince yenisi sığar.');
        }
      });
    }
    var hbtn = document.getElementById('alb-hedef-btn');
    if (hbtn) {
      hbtn.addEventListener('click', function () {
        var s2 = st();
        s2.hedefPufi = p.id;
        try { if (Yuvo.engine && Yuvo.engine.save) Yuvo.engine.save(); } catch (eH) {}
        play('star');
        toast('Yeni hedefin: ' + p.ad + '! Yuvada seni bekliyor 🎯');
        if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (eR) {} }
        try { close(); } catch (e2) {}
      });
    }
  }

  function doCraft (p, close) {
    var r = (Yuvo.engine && Yuvo.engine.craft) ? Yuvo.engine.craft(p.id) : { ok:false, reason:'motor-yok' };
    if (r && r.ok) {
      play('fanfare');
      // Minik üretim töreni: modal içinde parıltı + oyuncak
      var box = document.querySelector('#overlay-root .modal');
      if (box) {
        box.innerHTML =
          '<div class="alb-craft-anim center">' +
            '<div class="alb-craft-spark" aria-hidden="true">' + sparkSVG() + '</div>' +
            '<div class="alb-modal-art rf rf-' + p.rarity + ' alb-pop">' + toyArt(p) + '</div>' +
            '<h3 class="alb-modal-name">' + p.ad + '</h3>' +
            '<p class="alb-workshop-note">' + ic('album', '📔') + '<span>Albüme işlendi!</span></p>' +
          '</div>';
      }
      later(function () {
        try { close(); } catch (e) {}
        render();
      }, 1700);
      toast(p.ad + ' aileye katıldı!');
    } else {
      var reason = r && r.reason;
      if (reason === 'kabuk-yetersiz') toast('Kabuk yetersiz — kopyalar Kabuk kazandırır!');
      else if (reason === 'gizli-kilitli') toast('Önce 30 dostu yuvaya getirmelisin.');
      else if (reason === 'sahipli') toast('Bu dost zaten albümde!');
      else toast('Atölye şu an çalışmıyor.');
    }
  }

  /* ---------- etkileşim ---------- */
  function handleClick (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'cell') {
      // Soundboard hissi: sahipli hücre zıplar (roamer jump deseni)
      if (!b.classList.contains('missing')) {
        b.classList.remove('cell-jump');
        void b.offsetWidth;
        b.classList.add('cell-jump');
        later(function () { b.classList.remove('cell-jump'); }, 650);
      }
      openDetail(b.getAttribute('data-id'));
    } else if (act === 'biome') {
      var nb = b.getAttribute('data-biome');
      if (nb && nb !== viewBiome) { viewBiome = nb; play('page'); render(); }
    } else if (act === 'gold-teaser') {
      var sG = st();
      var ownedG = ownedCount(viewBiome);
      if (ownedG >= 30) {
        play('fanfare');
        toast('🥇 Altın Yumurta ailenin! Bütün ada seninle gurur duyuyor!');
      } else {
        play('click');
        toast('Aile tamamlanınca Altın Yumurta açılır — acele yok, dostlar kaçmaz!');
      }
    } else if (act === 'biome-locked') {
      play('click');
      toast('Sisin ardında bir yer var… Çayırda 10 dost topla!');
    } else if (act === 'sako-izi') {
      play('click');
      toast('Şako bu dostu saklamış! Saklambaç\'ta bul, geri gelsin.');
    } else if (act === 'mile') {
      var key = b.getAttribute('data-key');
      var mi = null;
      for (var i = 0; i < MILES.length; i++) { if (MILES[i].key === key) { mi = MILES[i]; break; } }
      if (!mi) return;
      var s = st();
      var claimed = (s.milestones || []).indexOf(key) !== -1;
      var owned = ownedCount();
      if (claimed) {
        play('click');
        toast('Bu ödül alındı ✓');
      } else if (owned >= mi.at) {
        claimMilestones();
      } else {
        play('click');
        toast('Daha ' + (mi.at - owned) + ' dost gerek (' + owned + '/' + mi.at + ').');
      }
    }
  }

  /* ---------- sahne API ---------- */
  Yuvo.scenes.album = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'alb-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      onState = function () { render(); };
      document.addEventListener('yuvo:state', onState);
      play('page');
      var s = st();
      viewBiome = (s.activeBiome === 'orman' && s.ormanAcik) ? 'orman' : 'cayir';
      render();
      // Günlük görev zinciri: albüme bakmak da bir halka (bonus tamamlandıysa kutla)
      if (Yuvo.engine.gorevIlerle && Yuvo.engine.gorevIlerle('album') === true) {
        toast('🎁 Günün zinciri tamamlandı — yuvaya bonus yumurta kondu!');
      }
      // Kiki'nin albüm hediyesi — FTUE sonrası İLK albüm ziyaretinde bir kez (v2·04 §1 5:30)
      if (s.introDone && !s.introGiftShown && Yuvo.dialog && Yuvo.data && Yuvo.data.DIALOG) {
        s.introGiftShown = true;
        if (Yuvo.engine && Yuvo.engine.save) { try { Yuvo.engine.save(); } catch (e) {} }
        var K = Yuvo.data.DIALOG.kiki || {};
        var hediye = K.albumHediye || [];
        for (var hi = 0; hi < hediye.length; hi++) {
          Yuvo.dialog.say({ kim: 'kiki', metin: hediye[hi] });
        }
      }
    },
    unmount: function () {
      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];
      if (onState) { document.removeEventListener('yuvo:state', onState); onState = null; }
      if (el) {
        el.removeEventListener('click', handleClick);
        if (el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
    }
  };
})();

/* == js/scenes/foilbook.js == */
/* Yuvo — Sahne: Ambalaj Defteri (docs/v2/06 §2.f + §5.5). Sahip: scenes-meta ajanı.
   Sayfa = seri (6 seri sekmesi); her sayfada 8 varyant yuvası + Altın Şeref Yuvası.
   Eksik = soluk desen silüeti; sahipli = foilStampSVG (+×n rozeti SVG içinde).
   Seri tamamlama ödül çipleri: 4/8 → 20 Kabuk, 8/8 → 40 Kabuk (state.milestones ile
   yerel bir-kez mantığı — engine'de foilbook yardımcısı yok). Araç Rafı: TOOLS listesi,
   sahipliler seçilebilir (setTool), kilitliler silüet + kilit açıklaması.
   Defter saf kozmetiktir: oran/pity'ye asla dokunmaz. Görsel dil: BRAND.md §3. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.scenes = Yuvo.scenes || {};

  var el = null;
  var timers = [];
  var onState = null;
  var curSeri = null;   // açık sayfa (seri id)

  // Ödül çipleri (proto değerleri §5.5: 4/8 → 20 Kabuk, 8/8 → 40 Kabuk)
  var REWARDS = [
    { at:4, kabuk:20 },
    { at:8, kabuk:40 }
  ];

  /* ---------- yardımcılar (savunmacı) ---------- */
  function st () { return (Yuvo.engine && Yuvo.engine.state) || {}; }
  function play (n, o) { try { if (Yuvo.audio && Yuvo.audio.play) Yuvo.audio.play(n, o); } catch (e) {} }
  function toast (t) { if (Yuvo.toast) Yuvo.toast(t); }
  function later (fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
  function esc (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Yuvo.icons güvenli erişim (main.js ico() deseni): ikon yoksa emoji fallback
  function ico (name, fb) {
    try {
      if (Yuvo.icons && Yuvo.icons[name]) { var s = Yuvo.icons[name](); if (s) return s; }
    } catch (e) {}
    return '<span class="ico-fallback">' + fb + '</span>';
  }
  function ic (name, fb, cls) {
    return '<span class="ys-ico' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' +
           ico(name, fb) + '</span>';
  }

  function seriesMap () {
    var d = Yuvo.data && Yuvo.data.WRAPPER_SERIES;
    if (d && typeof d === 'object') {
      for (var k in d) return d; // en az bir seri varsa kullan
    }
    return { gunesbahcesi: { ad:'Güneş Bahçesi', renk1:'#F6B93B', renk2:'#F8E3A1', desen:'papatya' } };
  }
  function seriesIds () {
    var out = [], d = seriesMap();
    for (var k in d) out.push(k);
    return out;
  }
  function variantCount () {
    var n = Yuvo.data && Yuvo.data.WRAPPER_VARIANTS;
    return (typeof n === 'number' && n > 0) ? n : 8;
  }

  // Defter kaydı (normalize edilmiş): { variants:{v:count}, golden:count }
  function bookRec (seri) {
    var fb = st().foilBook;
    var rec = (fb && typeof fb === 'object') ? fb[seri] : null;
    if (!rec || typeof rec !== 'object') return { variants:{}, golden:0 };
    return {
      variants: (rec.variants && typeof rec.variants === 'object') ? rec.variants : {},
      golden: Math.max(0, rec.golden | 0)
    };
  }
  function variantOwnedCount (seri) {
    var rec = bookRec(seri), n = 0, V = variantCount();
    for (var v = 0; v < V; v++) { if ((rec.variants[v] | 0) > 0) n += 1; }
    return n;
  }

  function stampArt (seri, v, opts) {
    if (Yuvo.art && Yuvo.art.foilStampSVG) {
      try { var s = Yuvo.art.foilStampSVG(seri, v, opts || {}); if (s) return s; } catch (e) {}
    }
    return '<span class="fb-art-fallback">🥚</span>';
  }
  function toolArt (id) {
    if (Yuvo.art && Yuvo.art.toolSVG) {
      try { var s = Yuvo.art.toolSVG(id); if (s) return s; } catch (e) {}
    }
    return '<span class="fb-art-fallback">🔨</span>';
  }

  // Mini kilit glifi (id'siz; kilitli araç rozeti)
  function lockSVG () {
    return '<svg viewBox="0 0 28 28" aria-hidden="true" focusable="false">' +
      '<rect x="6" y="12" width="16" height="12" rx="4" fill="#FFC734"' +
        ' stroke="#3E2A1C" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="M9.5 12V9.4a4.5 4.5 0 0 1 9 0V12" fill="none" stroke="#3E2A1C"' +
        ' stroke-width="2.4" stroke-linecap="round"/>' +
      '<circle cx="14" cy="17.6" r="2" fill="#3E2A1C"/>' +
    '</svg>';
  }

  // Altın Şeref Yuvası boş silüeti (id'siz; nazik parıltı)
  function goldEmptySVG () {
    return '<svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">' +
      '<rect x="26" y="12" width="68" height="94" rx="8" fill="#FFF6E0"' +
        ' stroke="#F2A61B" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>' +
      '<path d="M60 38l5.4 12.4 13.4 1.2-10.2 8.9 3.1 13.2L60 66.6l-11.7 7.1 3.1-13.2-10.2-8.9' +
        ' 13.4-1.2Z" fill="#F8DFA6" stroke="#E0B45C" stroke-width="2.4"' +
        ' stroke-linejoin="round"/>' +
      '<path d="M84 24l1.7 3.9 3.9 1.7-3.9 1.7-1.7 3.9-1.7-3.9-3.9-1.7 3.9-1.7Z"' +
        ' fill="#F2C14E" opacity=".8"/>' +
      '<path d="M36 88l1.4 3.2 3.2 1.4-3.2 1.4-1.4 3.2-1.4-3.2-3.2-1.4 3.2-1.4Z"' +
        ' fill="#F2C14E" opacity=".7"/>' +
    '</svg>';
  }

  /* ---------- ödül çipleri: yerel bir-kez mantığı (state.milestones dili) ---------- */
  function rewardKey (seri, at) { return 'fb-' + seri + '-' + at; }
  function rewardClaimed (seri, at) {
    var m = st().milestones;
    return Array.isArray(m) && m.indexOf(rewardKey(seri, at)) !== -1;
  }
  function claimReward (seri, at, kabuk) {
    var s = st();
    if (!s || typeof s !== 'object') return false;
    if (!Array.isArray(s.milestones)) s.milestones = [];
    var key = rewardKey(seri, at);
    if (s.milestones.indexOf(key) !== -1) return false;      // bir kez
    if (variantOwnedCount(seri) < at) return false;
    s.milestones.push(key);
    s.kabuk = Math.max(0, (s.kabuk | 0) + (kabuk | 0));
    try { if (Yuvo.engine && Yuvo.engine.save) Yuvo.engine.save(); } catch (e) {}
    try { if (Yuvo.refresh) Yuvo.refresh(); } catch (e) {}
    return true;
  }

  /* ---------- araç rafı metinleri ---------- */
  function toolMeta (id) {
    var T = (Yuvo.data && Yuvo.data.TOOLS) || {};
    return T[id] || null;
  }
  function toolLockNote (id) {
    var m = toolMeta(id) || {};
    if (m.kabuk) return (m.ad || id) + ', ' + m.kabuk + ' Kabuk biriktirince kazanılır.';
    if (m.otomatik) return (m.ad || id) + ' Destansı kapsüllerde kendiliğinden gelir — satılmaz!';
    return (m.ad || id) + ' henüz kilitli.';
  }
  function toolTagText (id, ownedTool) {
    var m = toolMeta(id) || {};
    if (ownedTool) return 'Hazır';
    if (m.kabuk) return m.kabuk + ' Kabuk';
    if (m.otomatik) return 'Destansı+';
    return 'Kilitli';
  }

  /* ---------- çizim ---------- */
  function render () {
    if (!el) return;
    var s = st();
    var ids = seriesIds();
    var map = seriesMap();
    if (!curSeri || ids.indexOf(curSeri) === -1) {
      curSeri = null;
      try {
        if (Yuvo.engine && Yuvo.engine.activeSeries) {
          var a = Yuvo.engine.activeSeries();
          if (a && ids.indexOf(a) !== -1) curSeri = a;
        }
      } catch (e) {}
      if (!curSeri) curSeri = ids[0];
    }
    var seri = map[curSeri] || {};
    var seriAd = seri.ad || curSeri;
    var rec = bookRec(curSeri);
    var V = variantCount();
    var ownedV = variantOwnedCount(curSeri);
    var pct = Math.max(0, Math.min(100, Math.round(ownedV / V * 100)));
    var html = '';
    var i, v;

    /* Başlık: kurdele + Kabuk hapı */
    html += '<div class="fb-head">' +
              '<span class="fb-ribbon">' +
                '<span class="fb-ribbon-ico" aria-hidden="true">' + ico('shell', '📔') + '</span>' +
                '<h1 class="fb-title">Ambalaj Defteri</h1>' +
              '</span>' +
              '<span class="fb-shell" aria-label="Kabuk bakiyesi">' +
                ic('shell', '🐚') + '<b>' + Math.max(0, s.kabuk | 0) + '</b>' +
              '</span>' +
            '</div>';

    /* Seri sekmeleri (yatay kaydırmalı şerit; her sekme ≥64px hedef) */
    html += '<div class="fb-tabs" role="tablist" aria-label="Ambalaj serileri">';
    for (i = 0; i < ids.length; i++) {
      var sid = ids[i], sm = map[sid] || {};
      var cnt = variantOwnedCount(sid);
      var goldTik = bookRec(sid).golden > 0;
      html += '<button class="fb-tab' + (sid === curSeri ? ' active' : '') + '"' +
                ' data-act="tab" data-seri="' + esc(sid) + '" role="tab"' +
                ' aria-selected="' + (sid === curSeri ? 'true' : 'false') + '"' +
                ' aria-label="' + esc(sm.ad || sid) + ' — ' + cnt + '/' + V + '">' +
                '<span class="fb-tab-dot" aria-hidden="true" style="background:' +
                  'linear-gradient(135deg,' + esc(sm.renk1 || '#F6B93B') + ',' +
                  esc(sm.renk2 || '#F8E3A1') + ')"></span>' +
                '<span class="fb-tab-name">' + esc(sm.ad || sid) + '</span>' +
                '<span class="fb-tab-count">' + cnt + '/' + V + (goldTik ? ' ✦' : '') + '</span>' +
              '</button>';
    }
    html += '</div>';

    /* Defter sayfası */
    html += '<div class="fb-page">';
    html += '<div class="fb-page-head">' +
              '<span class="fb-page-name">' + esc(seriAd) + '</span>' +
              '<span class="fb-progress-num"><b>' + ownedV + '</b>/' + V + '</span>' +
            '</div>';
    html += '<div class="fb-progress-bar" aria-hidden="true">' +
              '<span class="fb-progress-fill" style="width:' + pct + '%"></span>' +
            '</div>';

    /* Tamamlama ödül çipleri (bir kez; kilitli → hazır → alındı) */
    html += '<div class="fb-chips">';
    for (i = 0; i < REWARDS.length; i++) {
      var rw = REWARDS[i];
      var done = rewardClaimed(curSeri, rw.at);
      var ready = !done && ownedV >= rw.at;
      var cls = done ? ' done' : (ready ? ' ready' : ' locked');
      var albl = seriAd + ' ' + rw.at + '/' + V + ' ödülü: ' + rw.kabuk + ' Kabuk — ' +
                 (done ? 'alındı' : (ready ? 'hazır, almak için dokun' : 'henüz kilitli'));
      html += '<button class="fb-chip' + cls + '" data-act="chip" data-at="' + rw.at + '"' +
                ' data-kabuk="' + rw.kabuk + '" aria-label="' + esc(albl) + '">' +
                '<b>' + rw.at + '/' + V + '</b>' +
                '<small>' + ic('shell', '🐚') + (done ? 'Alındı' : rw.kabuk + ' Kabuk') + '</small>' +
              '</button>';
    }
    html += '</div>';

    /* 8 varyant yuvası + Altın Şeref Yuvası */
    html += '<div class="fb-grid">';
    for (v = 0; v < V; v++) {
      var n = rec.variants[v] | 0;
      if (n > 0) {
        html += '<button class="fb-cell owned" data-act="cell" data-v="' + v + '"' +
                  ' aria-label="' + esc(seriAd) + ' desen ' + (v + 1) +
                  (n > 1 ? ' — ' + n + ' adet' : '') + '">' +
                  stampArt(curSeri, v, { count:n }) +
                '</button>';
      } else {
        // eksik = soluk desen silüeti (nadirlik sızdırmaz — desen zaten seri bilgisi)
        html += '<button class="fb-cell missing" data-act="cell" data-v="' + v + '"' +
                  ' aria-label="' + esc(seriAd) + ' desen ' + (v + 1) + ' — henüz yok">' +
                  stampArt(curSeri, v, {}) +
                '</button>';
      }
    }
    var gN = rec.golden | 0;
    if (gN > 0) {
      html += '<button class="fb-cell gold owned" data-act="cell" data-v="gold"' +
                ' aria-label="Altın Şeref Yuvası — ' + gN + ' altın folyo">' +
                stampArt(curSeri, 0, { golden:true, count:gN }) +
              '</button>';
    } else {
      html += '<button class="fb-cell gold missing" data-act="cell" data-v="gold"' +
                ' aria-label="Altın Şeref Yuvası — henüz boş">' +
                goldEmptySVG() +
              '</button>';
    }
    html += '</div>';

    html += '<p class="fb-note">Açtığın her folyo kendiliğinden buraya yapışır — ' +
            'hiçbir şey kaybolmaz.</p>';
    html += '</div>'; // /fb-page

    /* Araç Rafı */
    var T = (Yuvo.data && Yuvo.data.TOOLS) || {};
    var toolIds = [];
    for (var tid in T) toolIds.push(tid);
    if (toolIds.length) {
      var ownedTools = Array.isArray(s.tools) ? s.tools : [];
      html += '<div class="fb-shelf">';
      html += '<div class="fb-shelf-head"><h3 class="fb-shelf-title">Araç Rafı</h3>' +
              '<span class="fb-shelf-sub">Araçlar yalnız görünümü değiştirir</span></div>';
      html += '<div class="fb-tools">';
      for (i = 0; i < toolIds.length; i++) {
        var id2 = toolIds[i];
        var meta = T[id2] || {};
        var has = ownedTools.indexOf(id2) !== -1;
        var active = has && s.activeTool === id2;
        var cls2 = has ? ' owned' + (active ? ' active' : '') : ' locked';
        var lbl2 = (meta.ad || id2) + (active ? ' — seçili araç'
                    : (has ? ' — seçmek için dokun' : ' — kilitli: ' + toolLockNote(id2)));
        html += '<button class="fb-tool' + cls2 + '" data-act="tool" data-id="' + esc(id2) + '"' +
                  ' aria-label="' + esc(lbl2) + '">' +
                  (active ? '<span class="fb-tool-check" aria-hidden="true">' +
                    ico('check', '✓') + '</span>' : '') +
                  (!has ? '<span class="fb-tool-lock" aria-hidden="true">' + lockSVG() +
                    '</span>' : '') +
                  '<span class="fb-tool-art' + (has ? '' : ' sil') + '" aria-hidden="true">' +
                    toolArt(id2) + '</span>' +
                  '<span class="fb-tool-name">' + esc(meta.ad || id2) + '</span>' +
                  '<span class="fb-tool-tag' + (active ? ' on' : '') + '">' +
                    (active ? 'Seçili' : esc(toolTagText(id2, has))) + '</span>' +
                '</button>';
      }
      html += '</div></div>';
    }

    el.innerHTML = html;
  }

  /* ---------- etkileşim (delege tek dinleyici) ---------- */
  function handleClick (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var act = b.getAttribute('data-act');
    var map = seriesMap();
    var seri = map[curSeri] || {};
    var seriAd = seri.ad || curSeri;

    if (act === 'tab') {
      var sid = b.getAttribute('data-seri');
      if (sid && sid !== curSeri) {
        curSeri = sid;
        play('page');
        render();
      }
    } else if (act === 'chip') {
      var at = parseInt(b.getAttribute('data-at'), 10) || 0;
      var kabuk = parseInt(b.getAttribute('data-kabuk'), 10) || 0;
      if (rewardClaimed(curSeri, at)) {
        toast('Bu ödül alındı — mühür defterde!');
      } else if (variantOwnedCount(curSeri) >= at) {
        if (claimReward(curSeri, at, kabuk)) {
          play('fanfare');
          toast('+' + kabuk + ' Kabuk — ' + seriAd + ' ödülü!');
          render();
        }
      } else {
        play('click');
        var kalan = at - variantOwnedCount(curSeri);
        toast(kalan + ' desen daha — sonra ' + kabuk + ' Kabuk senin!');
      }
    } else if (act === 'cell') {
      var vAttr = b.getAttribute('data-v');
      var rec = bookRec(curSeri);
      if (vAttr === 'gold') {
        if ((rec.golden | 0) > 0) {
          play('stampSlap');
          if (Yuvo.modal) {
            Yuvo.modal('<div class="fb-modal">' +
              '<div class="fb-modal-art">' + stampArt(curSeri, 0, { golden:true, count:rec.golden | 0 }) + '</div>' +
              '<h2 class="fb-modal-name">Altın Şeref Yuvası</h2>' +
              '<p class="fb-modal-sub">' + esc(seriAd) + ' · ×' + (rec.golden | 0) + '</p>' +
              '<p class="fb-modal-txt">Altın folyo bulduğun gün bütün ada ışıdı!</p>' +
            '</div>');
          }
        } else {
          play('click');
          toast('Altın folyo çok nadir — ama her Bekçi bir gün bulur!');
        }
      } else {
        var v = parseInt(vAttr, 10) || 0;
        var n = rec.variants[v] | 0;
        if (n > 0) {
          play('stampSlap');
          if (Yuvo.modal) {
            Yuvo.modal('<div class="fb-modal">' +
              '<div class="fb-modal-art">' + stampArt(curSeri, v, { count:n }) + '</div>' +
              '<h2 class="fb-modal-name">' + esc(seriAd) + '</h2>' +
              '<p class="fb-modal-sub">Desen ' + (v + 1) + ' / ' + variantCount() +
                (n > 1 ? ' · ×' + n : '') + '</p>' +
              '<p class="fb-modal-txt">Bu folyoyu sen açtın, deftere sen kazandırdın!</p>' +
            '</div>');
          }
        } else {
          play('click');
          toast('Bu desen henüz defterde yok — yumurta açmaya devam!');
        }
      }
    } else if (act === 'tool') {
      var id = b.getAttribute('data-id');
      var s = st();
      var ownedTools = Array.isArray(s.tools) ? s.tools : [];
      if (ownedTools.indexOf(id) !== -1) {
        if (s.activeTool === id) {
          toast('Bu araç zaten elinde!');
        } else {
          var ok = !!(Yuvo.engine && Yuvo.engine.setTool && Yuvo.engine.setTool(id));
          if (ok) {
            play('click');
            var meta = toolMeta(id) || {};
            toast('Araç seçildi: ' + (meta.ad || id));
          }
          render();
        }
      } else {
        play('click');
        toast(toolLockNote(id));
      }
    }
  }

  /* ---------- sahne API ---------- */
  Yuvo.scenes.foilbook = {
    mount: function (rootEl) {
      el = document.createElement('div');
      el.className = 'fb-scene';
      rootEl.appendChild(el);
      el.addEventListener('click', handleClick);
      onState = function () { render(); };
      document.addEventListener('yuvo:state', onState);
      render();
    },
    unmount: function () {
      for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
      timers = [];
      if (onState) { document.removeEventListener('yuvo:state', onState); onState = null; }
      if (el) {
        el.removeEventListener('click', handleClick);
        if (el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
    }
  };
})();

/* Yuvo — Sahne: Gerçek Yumurta Ritüeli (docs/v2/06 §2, §5.4 aşama makinesi).
   Sahip: scenes-core ajanı.
   AKIS: folyo → cikolata → kapsul → karsilasma → kart → defterKoda.
   Kurallar: openEgg(eggIdx) mount'ta BİR KEZ çekilir ve saklanır (§1.3 dürüstlük);
   tek tap (hedef dışı) = aşamayı anında tamamla, çift tap = sonraki aşama;
   fast mod (firstRitualDoneToday) kısa varyantlar; nazik fren (tier>=2 veya yeni parça)
   fast'ı tam ritüele yükseltir. Tüm sanat/ses çağrıları savunmacı (modül yoksa çökme yok).
   Geriye uyumluluk: #cere-stage, .cere-egg-wrap.warm, .cere-card, #cere-next,
   Yuvo.test.ceremonySkip() korunur. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.scenes = Yuvo.scenes || {};

  var scrapsEl = null, ringsEl = null, fxEl = null, burstEl = null;
  var hintEl = null, tabEl = null, actionsEl = null, kikiEl = null, glowEl = null, bookEl = null;

  var result = null;            // openEgg() sonucu — mount'ta BİR KEZ çekilir, saklanır (§1.3)
  var wrapper = null;           // { seri, variant, golden }
  var fast = false;             // etkin hızlı mod (nazik frenden geçmiş)
  var nazikFren = false;        // tier>=2 || isNew → fast olsa bile tam akış
  var fastChoice = 'ye';        // hızlı mod çikolata varsayılanı (mount'ta yakalanır)

  var stageIdx = -1, stageName = '', stageToken = 0;
  var advancing = false, navigated = false, viaTestSkip = false;
  var lastTap = 0, tapGuardUntil = 0, pendingComplete = false;
  var downX = 0, downY = 0, downT = 0, moved = 0, downOnTarget = false, downOnObj = false;
  var timers = [];
  var SEQ = 0;                  // benzersiz SVG id sayacı (önek: yc- ; yi-/yv-/ysh- başkasının)

  // folyo
  var torn = 0, needStrips = 3, dragging = false, dragLastX = 0, dragAcc = 0;
  // cikolata
  var bites = 0, needBites = 4, chocoDone = false;
  // kapsul
  var method = 'burgu', capStage = 0, capOpened = false;
  var twisting = false, twistAcc = 0, twistTaps = 0, twLastX = 0, twLastY = 0, lastTwistSnd = 0;
  var holdT0 = 0, holdTapCount = 0, magicEl = null, ringStep = 0;

  var DBL_MS = 320;             // çift-tap eşiği

  // ---------- yardımcılar ----------

  }
  function clearTimers () {

    timers = [];
  }
  function play (name) {

  }
  function play2 (name, opts) { // parametreli ses (pufiChirp gibi)

  }
  function crinkleLevel (v) {

  }

  function toast (t) { try { if (Yuvo.toast) Yuvo.toast(t); } catch (e) {} }
  function esc (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')

  }
  function uid (n) { return 'yc-' + n + '-' + (SEQ++); }
  function st () { return (Yuvo.engine && Yuvo.engine.state) || {}; }
  function rarityInfo (key) {
    return (Yuvo.data && Yuvo.data.RARITIES && Yuvo.data.RARITIES[key]) || { ad: key || '?', renk: '#9AA5B1' };
  }
  function seriesInfo () {

  // ---------- ortak jest grameri ----------
  function isTargetEl (t) {
    return !!(t && t.closest && t.closest('[data-rt]'));
  }
  function dispatch (e) {
    var s = stages[stageName];
    if (s && s.input) { try { s.input(e); } catch (err) {} }
  }
  function onPointerDown (e) {
    if (!mounted || advancing) return;
    if (e.target && e.target.closest && e.target.closest('button')) return; // butonlar kendini yönetir
    // Fare sahne dışında bırakılırsa pointerup kaçmasın (sürekli crinkle takılı kalıyordu)
    try { if (stageEl && stageEl.setPointerCapture) stageEl.setPointerCapture(e.pointerId); } catch (ec) {}
    var now = Date.now();
    var dbl = (now - lastTap) < DBL_MS;
    lastTap = now;
    downX = e.clientX; downY = e.clientY; downT = now; moved = 0;
    downOnTarget = isTargetEl(e.target);
    downOnObj = !!(e.target && e.target.closest && e.target.closest('#rit-obj'));
    if (dbl && !downOnTarget) { // çift tap (hedef dışı) = sonraki aşama
      if (now >= tapGuardUntil) { pendingComplete = false; doSkip(); }
      return;
    }
    dispatch(e);
  }
  function onPointerMove (e) {
    if (!mounted || advancing) return;
    // tap/sürükleme ayrımı için kaba yol farkı (jest birikimlerini aşama kodları kendisi izler)
    if (downT) moved = Math.max(moved, Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY));
    dispatch(e);
  }
  function onPointerUp (e) {
    if (!mounted) return;
    // pointercancel tap SAYILMAZ: tarayıcı jesti çaldıysa (sistem jesti,
    // bildirim çekmecesi) iptal edilen dokunuş aşamayı kendiliğinden bitirmesin
    var wasTap = e.type !== 'pointercancel' &&
      downT && moved < TAP_SLOP && (Date.now() - downT) < TAP_MS;
    dispatch(e);
    if (!advancing && wasTap && !downOnTarget) {
      var s = stages[stageName];
      if (s && !s.allTaps && Date.now() >= tapGuardUntil) {
        // tek tap (hedef dışı) = aşamayı bitir; ama çift tapın ikinci vuruşunu
        // DBL_MS kadar bekle — gelirse complete yerine skip çalışır
        pendingComplete = true;
        slater(function () {
          if (pendingComplete) { pendingComplete = false; doComplete(); }
        }, DBL_MS + 40);
      }
    }
    downT = 0; moved = 0; downOnTarget = false;
  }
  function doComplete () {
    var s = stages[stageName];
    if (s && s.complete) { try { s.complete(); } catch (e) {} }
  }
  function doSkip () {
    if (advancing) return;
    var s = stages[stageName];
    if (s && s.skip) { try { s.skip(); } catch (e) {} }
  }

  function next () {
    if (!mounted) return;
    stageToken += 1;
    advancing = false;
    pendingComplete = false;
    tapGuardUntil = Math.max(tapGuardUntil, Date.now() + 300);
    stageIdx += 1;
    if (stageIdx >= AKIS.length) return;
    stageName = AKIS[stageIdx];
    var s = stages[stageName];
    if (s && s.enter) { try { s.enter(); } catch (e) {} }
  }
  function jumpTo (name) {
    var idx = -1;
    for (var i = 0; i < AKIS.length; i++) { if (AKIS[i] === name) { idx = i; break; } }
    if (idx < 0 || !mounted) return;
    stageIdx = idx - 1;
    if (ringsEl) ringsEl.innerHTML = '';
    if (actionsEl) actionsEl.innerHTML = '';
    if (tabEl) tabEl.hidden = true;
    next();
  }

  // ---------- ortak kutlama (kapsül POP — mevcut konfeti/tier kodu) ----------
  function spawnConfetti (n) {
    if (!burstEl) return;
    var colors = ['#FFD34D', '#FF8A5C', '#A8E06E', '#BDE8FF', '#B266E8', rarityInfo(result && result.rarity).renk];
    if (wrapper && wrapper.golden) colors = ['#FFC734', '#F2A400', '#FFF1D4', '#FFD34D', '#F2C14E', '#FFFFFF'];
    var box = document.createElement('div');
    box.className = 'cere-confetti';
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var r = 90 + Math.random() * 190;
      var p = document.createElement('i');
      p.style.setProperty('--dx', Math.round(Math.cos(a) * r) + 'px');
      p.style.setProperty('--dy', Math.round(Math.sin(a) * r - 50) + 'px');
      p.style.setProperty('--rot', Math.round(Math.random() * 720 - 360) + 'deg');
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random() * 0.15) + 's';
      box.appendChild(p);
    }
    burstEl.appendChild(box);
    later(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 1600);
  }
  function celebrate () {
    var tier = tierOf();
    if (burstEl) burstEl.innerHTML = '<div class="cere-flash"></div>';
    spawnConfetti([18, 26, 38, 60][tier] || 18);
    if (tier >= 2) slater(function () { spawnConfetti(24); }, 350);
    if (tier >= 3) { if (stageEl) stageEl.classList.add('tier3glow'); play('fanfareBig'); }
    else if (tier === 2) play('fanfare');
    else if (tier === 1) play('chime');
    else play('pop'); // capsulePop henüz sentezlenmediyse de doruk duyulur
    vibrate(tier >= 3 ? [40, 60, 120] : [20, 30, 80]);
    // Nadirlik SPLASH'i: renk + simge + BÜYÜK yazı — okuma bilmeyene simge/renk yeter
    if (tier >= 1 && stageEl) {
      var ri = rarityInfo(result && result.rarity);
      var sp = document.createElement('div');
      sp.className = 'rit-rarity-splash t' + tier;
      sp.style.setProperty('--rc', ri.renk);
      sp.textContent = (ri.simge ? ri.simge + ' ' : '') + String(ri.ad).toLocaleUpperCase('tr') + '!';
      stageEl.appendChild(sp);
      later(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 2000);
    }
    // Kiki'nin hayranlık balonu (kutlama dili — baskı/aciliyet değil), kendiliğinden kapanır
    if (tier >= 2 && Yuvo.dialog) {
      Yuvo.dialog.say({
        kim: 'kiki',
        metin: tier >= 3 ? 'VAAAY! Gözlerime inanamıyorum — bu bir EFSANE!' : 'Vaay! Bu ÇOK nadir bir dost!',
