  /* =====================================================================

     Ayırt edici: iri pembe burunlu ağız (muzzle), tomurcuk boynuzlar,

  Y.art.registerKind('buzagi', {

  /* =====================================================================
     4) TAVUK — Gıdak: "Sürpriz yumurta görünce heyecandan gıdaklar"
     Ayırt edici: üç lobluk yuvarlak ibik + sarkık gerdan (wattle),
     yelpaze kuyruk, çilli göğüs; ayağının dibinde onu heyecanlandıran
     kurdeleli sürpriz yumurta, kanatlar havada.
     ===================================================================== */

  function tavukBits (c) {
    var LT = '#FFFAF0', DK = '#E8CBA8', COMB = '#FF6752';
    var b = {}, i;
    var BD = c.vinyl('bd', LT, DK);
    var HD = c.vinyl('hd', LT, DK);
    var TL = c.vinyl('tl', '#FFF3E0', '#E0BE94');
    var CB = c.vinyl('cb', '#FF8A73', '#E04432');
    var WG = c.vinyl('wg', '#FFEBD0', '#E0BE94');
    var EG = c.vinyl('eg', '#FFFFFF', '#D9E8F2');

    // yelpaze kuyruk (üç katlı)
    b.tail = c.drop(85, 68, 4.4, 12, TL, { rot: 35 }) +
             c.drop(89, 76, 5, 14, TL, { rot: 65 }) +
             c.drop(87, 85, 5.6, 16, TL, { rot: 100 });

    b.feet = c.caps(48, 99, 13, 8, '#FF9F3D', {}) + c.caps(72, 99, 13, 8, '#FF9F3D', {});

    var SPK = [[52,73],[61,70],[68,75],[56,80],[64,83]], spots = '';
    for (i = 0; i < SPK.length; i++) {
      spots += c.blob(SPK[i][0], SPK[i][1], 1.9, 1.6, '#DFC09A', { line: false, op: 0.55 });
    }
    b.body = c.blob(60, 81, 25, 20.5, BD, {}) +
             c.blob(60, 87, 13.5, 10, '#FFF6E8', { line: false, op: 0.95 }) +
             spots +
             c.gloss(47.5, 68, 9.4, 5.4) +
             c.bounce(60, 96, 16, 4.5, '#F5EBDA', 0.22);

    // heyecandan havaya kalkmış kanatlar
    b.wings = c.drop(35, 79, 6.8, 14, WG, { rot: -140 }) +
              c.drop(85, 79, 6.8, 14, WG, { rot: 140 });

    b.head = c.ball(60, 43, 21.5, HD, {}) + c.gloss(50, 33, 8, 4.5);

    // yuvarlak üç loblu ibik (civcivin sivri sorgucundan ayrışır)
    b.comb = c.ball(51.5, 25.5, 4.8, CB, {}) +
             c.ball(60, 22.5, 5.8, CB, {}) +
             c.ball(68.5, 25.5, 4.8, CB, {});

    // gaganın altında sarkan çifte gerdan
    b.wattle = c.drop(56.5, 63, 2.6, 7, COMB, { rot: -8, lw: c.LW2 }) +
               c.drop(63.5, 63, 2.6, 7, COMB, { rot: 8, lw: c.LW2 });

    b.face = c.eyes(60, 42, { dx: 8.6, r: 4.9 }) +
             c.cheeks(60, 49, 14.8, {}) +
             c.beak(60, 52.5, 9.5, '#FF9F3D', { open: true, dk: '#E8842B' });

    // gıdaklatan sürpriz yumurta (zikzak kuşaklı)
    b.egg = c.blob(29, 91, 6.5, 8, EG, {}) +
            c.line('M23.5 91 L26 88.8 L28.5 91 L31 88.8 L33.5 91', 1.8,
                   c.sil ? c.SIL : '#8AD9F7', { op: 0.9 }) +
            c.dot(26.5, 86, 1.3, 0.8) +
            c.sparkle(38, 81, 3, '#FFD76B', 0.9);
    return b;
  }

  Y.art.registerKind('tavuk', {

  });

  /* =====================================================================

    b.tuft = c.drop(63, 23, 3.4, 9, WG, { rot: 16 }) +

    b.bill = c.blob(60, 52.5, 10.8, 4.8, BL, { lw: c.LW2 }) +

  /* =====================================================================

    b.feet = c.caps(49, 99.5, 12, 7.5, '#8FD45E', {}) + c.caps(71, 99.5, 12, 7.5, '#8FD45E', {});

    b.body = c.blob(60, 81, 23.5, 19.5, BD, {}) +
             c.blob(60, 86.5, 13, 10, '#F4FBDF', { line: false, op: 0.95 }) +

  /* =====================================================================
     5) KİRPİ — Dikenik: "Sarılmayı çok ister; herkes uzaktan sarılır"
     Ayırt edici: yumuşak uçlu diken tacı (iki ton), iki yana açık
     "sarıl bana" kolları; diken uçlarında süzülen minik kalpler.
     ===================================================================== */

  function kirpiBits (c) {
    var LT = '#FFF3DC', DK = '#E8C08E';      // krem yüz-karın
    var b = {}, i;
    var BD = c.vinyl('bd', LT, DK);
    var HD = c.vinyl('hd', LT, DK);

    // yumuşatılmış diken tacı: baş+sırt yayı, iki ton kahve
    var QS = [
      [32, 72, -62], [34, 59, -50], [42, 47, -32], [52, 39, -14],
      [63, 37, 4], [74, 42, 24], [83, 52, 44], [86, 63, 58]
    ];
    var quills = '';
    for (i = 0; i < QS.length; i++) {
      quills += c.drop(QS[i][0], QS[i][1], 5.4, 13.5,
                c.vinyl('q' + i, (i % 2 ? '#B97F46' : '#C9935E'), (i % 2 ? '#7A5230' : '#8A5A30')),
                { rot: QS[i][2] });
    }
    b.quills = quills;

    // uzaktan sarılanların kalpleri
    b.hearts = heart(c, 25, 60, 1) + heart(c, 60, 21.5, 1.15) + heart(c, 93, 52, 1);

    b.feet = c.caps(48, 99.5, 13, 8, '#D9A868', {}) + c.caps(72, 99.5, 13, 8, '#D9A868', {});

    // "sarıl bana" kolları: iki yana açık
    b.arms = c.caps(34, 77, 16, 8, BD, { rot: -34, rx: 4 }) +
             c.caps(86, 77, 16, 8, BD, { rot: 34, rx: 4 });

    b.body = c.blob(60, 80, 23.5, 19.5, BD, {}) +
             c.blob(60, 86, 13, 10, '#FFF9EC', { line: false, op: 0.95 }) +
             c.gloss(48.5, 68, 8.8, 5) +
             c.bounce(60, 95.5, 15, 4.3, '#F5E7CE', 0.2);

    b.head = c.ball(60, 46, 19.5, HD, {}) + c.gloss(51, 37.5, 7.4, 4.2);

    b.face = c.eyes(60, 44, { dx: 8, r: 4.7 }) +
             c.cheeks(60, 50.5, 14, {}) +
             c.ball(60, 52.5, 2.5, '#8A5A30', { lw: 1.6 }) +
             c.mouth(60, 56, 'smile', { w: 10 });
    return b;
  }

  Y.art.registerKind('kirpi', {

             c.blob(82.5, 41, 8.2, 5.2, BD, { rot: 16 }) +
             c.blob(82.5, 41.5, 4.2, 2.4, '#FFC4D9', { line: false, op: 0.8, rot: 16 });

    b.head = c.ball(60, 45, 20.5, HD, {}) + c.gloss(50, 35.5, 7.8, 4.4);

    b.lock = c.drop(56, 33, 3.5, 7.5, c.vinyl('fl', '#EFE2CC', '#C9AE8C'), { rot: -158 }) +

/* Yuvo — Sürpriz Yumurta Adası
 * story-svg.js — hikâye karakterlerinin SVG çizim modülü
 * Vanilla JS / IIFE / dış kaynak yok / deterministik.

(function () {
  'use strict';

  var Y = window.Yuvo = window.Yuvo || { data: {}, art: {}, audio: {}, engine: {}, scenes: {}, test: {} };
  Y.art = Y.art || {};

  var SEQ = 0;                    // id çakışma önleyici
  var INK = '#3E2A1C';            // kontur (marka mürekkebi)

  var PAL = {
    sun: '#FFC734',
    sunDeep: '#F2A400',
    accent: '#FF7C33',
    sky: '#8AD9F7',
    meadow: '#8ED94F',
    pink: '#FF8FB0',
    night: '#5C4A9E',
    silver: '#D9DEEA',
    cream: '#FFF3DC',
    white: '#FFFFFF'
  };

  /* ---------------------------------------------------------------- yardımcılar */

  function uid(name) {
    return 'ys2-' + name + '-' + (SEQ++);
  }

  function esc(v) {
    return String(v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // el('circle', {cx:1}, inner) -> '<circle cx="1"/>' | '<g ...>inner</g>'
  function el(tag, attrs, inner) {
    var s = '<' + tag;
    if (attrs) {
      for (var k in attrs) {
        if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
        var v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        s += ' ' + k + '="' + esc(v) + '"';
      }
    }
    if (inner === null || inner === undefined || inner === '') return s + '/>';
    return s + '>' + inner + '</' + tag + '>';
  }

  function stroke(w) {
    return {
      fill: 'none',
      stroke: INK,
      'stroke-width': w || 3.5,
      'stroke-linejoin': 'round',
      'stroke-linecap': 'round'
    };
  }

  function filled(fill, w) {
    return {
      fill: fill,
      stroke: INK,
      'stroke-width': w || 3.5,
      'stroke-linejoin': 'round',
      'stroke-linecap': 'round'
    };
  }

  // "Şeker-vinil" dolgu: açık -> koyu radyal gradyan
  function vinyl(id, lt, dk) {
    return el('radialGradient', { id: id, cx: '0.36', cy: '0.28', r: '1.05' },
      el('stop', { offset: '0', 'stop-color': lt }) +
      el('stop', { offset: '0.55', 'stop-color': lt }) +
      el('stop', { offset: '1', 'stop-color': dk })
    );
  }

  // Yarı saydam beyaz gradyan (kanat / cam vb.)
  function veil(id, a, b) {
    return el('linearGradient', { id: id, x1: '0', y1: '0', x2: '0.9', y2: '1' },
      el('stop', { offset: '0', 'stop-color': a, 'stop-opacity': '0.95' }) +
      el('stop', { offset: '1', 'stop-color': b, 'stop-opacity': '0.55' })
    );
  }

  // Üst-sol parlama: büyük elips (.55) + küçük ikinci nokta (.32)
  function gloss(cx, cy, rx, ry) {
    return el('g', { 'pointer-events': 'none' },
      el('ellipse', {
        cx: cx, cy: cy, rx: rx, ry: ry,
        fill: '#FFFFFF', opacity: '0.55',
        transform: 'rotate(-18 ' + cx + ' ' + cy + ')'
      }) +
      el('ellipse', {
        cx: (cx + rx * 0.95), cy: (cy + ry * 1.35), rx: rx * 0.36, ry: ry * 0.36,
        fill: '#FFFFFF', opacity: '0.32'
      })
    );
  }

  // Zemin gölgesi
  function shadow(cx, cy, rx, ry) {
    return el('ellipse', {
      cx: cx, cy: (cy === undefined ? 104 : cy), rx: rx || 30, ry: ry || 6.5,
      fill: INK, opacity: '0.14'
    });
  }

  function cheeks(lx, rx, cy, r) {
    var ry = (r || 4) * 0.72;
    return el('g', { 'pointer-events': 'none' },
      el('ellipse', { cx: lx, cy: cy, rx: r || 4, ry: ry, fill: PAL.pink, opacity: '0.55' }) +
      el('ellipse', { cx: rx, cy: cy, rx: r || 4, ry: ry, fill: PAL.pink, opacity: '0.55' })
    );
  }

  function normMood(m) {
    return (m === 'think' || m === 'sleep' || m === 'sad') ? m : 'happy';
  }

  /* İri gözler.
   * opts: { mood, r, gap, wink (tek göz kısık), browColor, brows (bool) }
   */
  function eyes(cx, cy, opts) {

      var y = cy + (yOff || 0);

      s += el('circle', { cx: x + r * 0.42 + (look || 0), cy: y + r * 0.36, r: r * 0.17, fill: '#FFFFFF', opacity: '0.85' });
      return s;
    }

    function lashLid(x) {
      var s = el('path', {
        d: 'M' + (x - r * 1.1) + ' ' + cy + ' q ' + (r * 1.1) + ' ' + (r * 1.25) + ' ' + (r * 2.2) + ' 0'

      s += el('path', Object.assign({
        d: 'M' + (x + r * 1.15) + ' ' + (cy - 0.3) + ' l ' + (r * 0.5) + ' ' + (-r * 0.42)
      }, stroke(2.0)));
      return s;
    }

    if (mood === 'sleep') {
      out += lashLid(lx) + lashLid(rx);
      return el('g', null, out);
    }

    if (mood === 'think') {
      out += ball(lx, 0, r * 0.28) + ball(rx, 0, r * 0.28);
      if (brows) {
        out += el('path', Object.assign({
          d: 'M' + (lx - r * 1.1) + ' ' + (cy - r * 2.25) + ' q ' + (r * 1.1) + ' ' + (-r * 0.95) + ' ' + (r * 2.2) + ' ' + (-r * 0.15)
        }, stroke(2.4)));
        out += el('path', Object.assign({
          d: 'M' + (rx - r * 1.05) + ' ' + (cy - r * 1.5) + ' q ' + (r * 1.05) + ' ' + (-r * 0.35) + ' ' + (r * 2.1) + ' ' + (r * 0.1)
        }, stroke(2.4)));

      return el('g', null, out);

      out += ball(lx, r * 0.34, -r * 0.1) + ball(rx, r * 0.34, r * 0.1);
      if (brows) {
        out += el('path', Object.assign({
          d: 'M' + (lx - r * 1.15) + ' ' + (cy - r * 1.5) + ' q ' + (r * 1.15) + ' ' + (-r * 0.15) + ' ' + (r * 2.15) + ' ' + (r * 0.85)
        }, stroke(2.4)));
        out += el('path', Object.assign({
          d: 'M' + (rx + r * 1.15) + ' ' + (cy - r * 1.5) + ' q ' + (-r * 1.15) + ' ' + (-r * 0.15) + ' ' + (-r * 2.15) + ' ' + (r * 0.85)
        }, stroke(2.4)));
      }
      return el('g', null, out);

    out += ball(lx, 0, 0) + ball(rx, 0, 0);
    if (opts.wink) {
      out = ball(lx, 0, 0);
      out += el('path', Object.assign({
        d: 'M' + (rx - r * 1.1) + ' ' + (cy + 0.4) + ' q ' + (r * 1.1) + ' ' + (-r * 1.15) + ' ' + (r * 2.2) + ' 0'
      }, stroke(2.8)));
    }
    if (brows && opts.brows === true) {
      out += el('path', Object.assign({
        d: 'M' + (lx - r * 1.0) + ' ' + (cy - r * 1.9) + ' q ' + (r * 1.0) + ' ' + (-r * 0.5) + ' ' + (r * 2.0) + ' 0'
      }, stroke(2.4)));
      out += el('path', Object.assign({
        d: 'M' + (rx - r * 1.0) + ' ' + (cy - r * 1.9) + ' q ' + (r * 1.0) + ' ' + (-r * 0.5) + ' ' + (r * 2.0) + ' 0'
      }, stroke(2.4)));
    }
    return el('g', null, out);
  }

  function mouth(cx, cy, w, mood) {
    mood = normMood(mood);
    var h = w * 0.55;

      ' L' + (cx - r * 0.28) + ' ' + (cy + r * 0.28) +
      ' L' + (cx - r) + ' ' + cy +
      ' L' + (cx - r * 0.28) + ' ' + (cy - r * 0.28) + ' Z';

  function placeholderBody(mood, cx, cy, r) {
    var g = uid('phold'), f = uid('halo');

    s += el('circle', Object.assign({ cx: cx, cy: cy, r: r }, filled('url(#' + g + ')')));

      d: 'M' + (cx - r * 0.72) + ' ' + (cy - r * 0.9) + ' l ' + (-r * 0.28) + ' ' + (-r * 0.5) +
         ' M' + (cx + r * 0.72) + ' ' + (cy - r * 0.9) + ' l ' + (r * 0.28) + ' ' + (-r * 0.5)

    s += eyes(cx, cy - r * 0.12, { mood: mood, r: r * 0.22, gap: r * 0.44 });
    s += mouth(cx, cy + r * 0.5, r * 0.24, mood);
    s += cheeks(cx - r * 0.66, cx + r * 0.66, cy + r * 0.3, r * 0.18);

  function placeholder(opts) {
    opts = opts || {};
    var p = placeholderBody(normMood(opts.mood), 60, 60, 30);
    return wrap(p.body, p.defs, '0 0 120 120');
  }

  /* ---------------------------------------------------------------- PORTRE */

  /* Tam gövde çizimini baş-omuz kırpmasına dönüştürür.
   * Her karakter için baş merkezini (40,42)'ye taşıyan ölçek/öteleme.
   */
  var PORTRAIT_XF = {
    pofu:      { hx: 60, hy: 58, k: 0.95 },
    kiki:      { hx: 63, hy: 50, k: 1.05 },
    ustakabuk: { hx: 70, hy: 44, k: 1.05 },
    luna:      { hx: 60, hy: 44, k: 1.00 },
    sako:      { hx: 61, hy: 45, k: 1.05 }
  };

  var BUILD = {
    pofu: pofuBody,
    kiki: kikiBody,
    ustakabuk: ustaBody,
    luna: lunaBody,
    sako: sakoBody
  };

  function portre(id, opts) {
    opts = opts || {};
    var mood = normMood(opts.mood);
    var key = (typeof id === 'string') ? id.toLowerCase() : '';
    var build = BUILD[key];

    if (!build) {
      var ph = placeholderBody(mood, 40, 40, 22);
      return wrap(ph.body, ph.defs, '0 0 80 80');
    }

    var p;
    try {
      p = build(mood);
    } catch (e) {
      var ph2 = placeholderBody(mood, 40, 40, 22);
      return wrap(ph2.body, ph2.defs, '0 0 80 80');
    }

    var xf = PORTRAIT_XF[key] || { hx: 60, hy: 50, k: 1.0 };
    // baş merkezi (hx,hy) -> (40,42), r ~= 26 olacak ölçek
    var k = xf.k;
    var tx = (40 - xf.hx * k).toFixed(3);
    var ty = (42 - xf.hy * k).toFixed(3);

    var clip = uid('pclip');
    var defs = p.defs + el('clipPath', { id: clip },
      el('rect', { x: 0, y: 0, width: 80, height: 80, rx: 12 })
    );

    var inner = el('g', { 'clip-path': 'url(#' + clip + ')' },
      el('g', { transform: 'translate(' + tx + ' ' + ty + ') scale(' + k + ')' }, p.body)
    );

    return wrap(inner, defs, '0 0 80 80');
  }

  /* ---------------------------------------------------------------- dışa açım */

  function safe(fn) {
    return function (opts) {
      try {
        return fn(opts || {});
      } catch (e) {
        return placeholder(opts);
      }
    };
  }

  Y.art.story = {
    pofu: safe(pofu),
    kiki: safe(kiki),
    ustakabuk: safe(ustakabuk),
    luna: safe(luna),
    sako: safe(sako),
    portre: portre,
    _ink: INK,
    _palette: PAL
  };
})();

/* == js/audio.js == */
/* Yuvo — audio.js (art-audio ajanı)
   WebAudio sentez, dosyasız. Ses yoksa / başlatılamazsa SESSİZCE çalışır, asla hata fırlatmaz.
   Crack'ler: filtreli noise burst + pitch düşüşü (ASMR). Fanfarlar: pentatonik arpej.
   docs/10: yumuşak zarflar, ses seviyesi sıçraması yok, çan/klakson yok. */
(function () {
  window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  var Y = window.Yuvo;
  Y.audio = Y.audio || {};

  var ctx = null, master = null, noiseBuf = null, failed = false;

  Y.audio.unlock = function () {
    if (failed) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { failed = true; return; }
      if (!ctx) {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.5;
        master.connect(ctx.destination);
        var len = Math.max(1, Math.floor(ctx.sampleRate * 1.2));
        noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    } catch (e) { ctx = null; master = null; noiseBuf = null; failed = true; }
  };

  /* tek ton: osc + yumuşak zarf; glide ile pitch kayması */
  function tone (t0, dur, f0, o) {
    o = o || {};
    var osc = ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(Math.max(1, f0), t0);
    if (o.glide) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.glide), t0 + dur * (o.glideT || 1));
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.16, t0 + (o.att || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }

  /* filtreli noise burst; f0→f1 pitch düşüşü (ASMR çıtırtısı) */
  function burst (t0, dur, o) {
    o = o || {};
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    var f = ctx.createBiquadFilter();
    f.type = o.ftype || 'bandpass';
    f.Q.value = o.q || 1.1;
    f.frequency.setValueAtTime(Math.max(1, o.f0 || 2000), t0);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain || 0.2, t0 + (o.att || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    var maxOff = Math.max(0.01, noiseBuf.duration - dur - 0.05);
    src.start(t0, Math.random() * maxOff, dur + 0.05);
  }

  /* Do-majör pentatonik (C5'ten): sıcak, çocuksu arpej malzemesi */
  var PENT = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];

  var SOUNDS = {
    tap: function (t) {
      tone(t, 0.07, 540, { glide: 470, gain: 0.11 });
    },
    crack1: function (t) {
      burst(t, 0.09, { f0: 2600, f1: 1100, gain: 0.2 });
      tone(t, 0.04, 1700, { type: 'triangle', glide: 1200, gain: 0.06, att: 0.003 });
    },
    crack2: function (t) {
      burst(t, 0.08, { f0: 2200, f1: 900, gain: 0.22 });
      burst(t + 0.07, 0.1, { f0: 1800, f1: 700, gain: 0.19 });
      tone(t, 0.05, 1400, { type: 'triangle', glide: 900, gain: 0.07, att: 0.003 });
    },
    crackBig: function (t) {
      burst(t, 0.12, { f0: 2400, f1: 600, gain: 0.26 });
      burst(t + 0.08, 0.16, { ftype: 'lowpass', f0: 1600, f1: 350, gain: 0.28, q: 0.8 });
      burst(t + 0.18, 0.2, { ftype: 'lowpass', f0: 900, f1: 220, gain: 0.24, q: 0.7 });
      tone(t + 0.05, 0.25, 240, { glide: 130, gain: 0.11 });
    },
    pop: function (t) {

    chime: function (t) {

    click: function (t) {

    snap: function (t) { // parça yerine oturdu
      tone(t, 0.05, 620, { type: 'square', glide: 520, gain: 0.1, att: 0.002 });
      burst(t, 0.025, { ftype: 'highpass', f0: 2500, gain: 0.11 });
    },
    fanfare: function (t) { // tier2: kısa pentatonik arpej

    fanfareBig: function (t) { // tier3: iki oktavlı arpej + akor + parıltı
      var seq = [392.0, PENT[0], PENT[1], PENT[2], PENT[3], PENT[4], PENT[5]];

        tone(t + i * 0.085, 0.3, seq[i], { type: 'triangle', gain: 0.12, att: 0.012 });
      }
      tone(t + 0.62, 0.8, PENT[3], { gain: 0.09, att: 0.02 });
      tone(t + 0.62, 0.8, PENT[5], { gain: 0.07, att: 0.02 });
      tone(t + 0.62, 0.8, 1567.98, { gain: 0.05, att: 0.02 });
      burst(t + 0.6, 0.7, { ftype: 'highpass', f0: 5000, gain: 0.045, att: 0.05, q: 0.7 });
    },
    star: function (t) { // ⭐ kazanımı
      tone(t, 0.16, 1568, { glide: 2093, glideT: 0.7, gain: 0.11, att: 0.006 });
      tone(t + 0.06, 0.18, 2093, { gain: 0.06, att: 0.01 });
    },
    page: function (t) { // albüm sayfası hışırtısı
      burst(t, 0.13, { ftype: 'lowpass', f0: 1000, f1: 300, gain: 0.15, q: 0.5 });
    }
  };

  /* ===================================================================
     RİTÜEL SESLERİ (v2·06 §5.6, art-audio EK) — mevcut sesler ve play()
     deseni aynen korunur; opts yalnız yeni seslerin ince ayarı içindir.
     =================================================================== */

  SOUNDS.foilTear = function (t) { // şerit "cırt" — her çağrıda pitch varyasyonu
    var p = 0.85 + Math.random() * 0.4;
    burst(t, 0.12, { f0: 3400 * p, f1: 1000 * p, gain: 0.22, q: 1.4 });
    burst(t + 0.05, 0.09, { f0: 2400 * p, f1: 800 * p, gain: 0.16 });
    tone(t, 0.05, 1900 * p, { type: 'triangle', glide: 900 * p, gain: 0.05, att: 0.003 });

    if (fam === 'koy' || fam === 'su') {          // su şıpırtısı
      for (i = 0; i < 3; i++) tone(t + 0.05 + i * 0.1, 0.12, 1300 - i * 180, { glide: 620, gain: 0.07, att: 0.004 });
    } else if (fam === 'pofuduk' || fam === 'tuy') { // tüy hışırtısı

  SOUNDS.capsuleTwist = function (t) { // "gıc" — burgu sürtünmesi

    tone(t + 0.1, 0.95, 523.25, { glide: 1046.5, glideT: 0.9, gain: 0.05, att: 0.15 });
    tone(t + 0.2, 0.9, 659.25, { glide: 1318.5, glideT: 0.9, gain: 0.045, att: 0.15 });
    burst(t + 0.2, 0.8, { ftype: 'highpass', f0: 4500, gain: 0.04, att: 0.35, q: 0.7 });

  };
  SOUNDS.goldenFanfare = function (t) { // Altın Folyo — sıcak majör çıkış + çan
    var seq = [523.25, 659.25, 783.99, 1046.5, 1318.5], i;
    tone(t, 0.9, 130.8, { gain: 0.06, att: 0.02 });
    for (i = 0; i < seq.length; i++) {
      tone(t + i * 0.11, 0.34, seq[i], { type: 'triangle', gain: 0.12, att: 0.01 });
    }
    tone(t + 0.58, 0.85, 1568, { gain: 0.08, att: 0.015 });
    tone(t + 0.6, 0.85, 2093, { gain: 0.055, att: 0.015 });
    burst(t + 0.56, 0.7, { ftype: 'highpass', f0: 5500, gain: 0.045, att: 0.06, q: 0.7 });

  SOUNDS.pufiChirp = function (t, o) { // her Pufi'nin KENDİ cıvıltısı: id-hash imzalı
    var s = String((o && o.id) || 'pufi'), h = 2166136261 >>> 0, i;
    for (i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var base = 520 + (h % 700);                       // 520–1220 Hz taban perdesi
    var step = 0.08 + ((h >>> 4) % 40) / 1000;        // nota aralığı 80–120 ms
    var type = ((h >>> 8) % 2) ? 'triangle' : 'sine';
    var SEQ2 = [[1, 1.25, 1.5], [1, 1.5, 1.2], [1.2, 1, 1.4], [1, 1.33, 1, 1.6]];
    var seq = SEQ2[h % 4];
    for (i = 0; i < seq.length; i++) {
      tone(t + i * step, 0.14, base * seq[i],
        { type: type, glide: base * seq[i] * 1.07, glideT: 0.6, gain: 0.09, att: 0.008 });

  };
  SOUNDS.stampSlap = function (t) { // defter "şlap"
    burst(t, 0.06, { ftype: 'lowpass', f0: 900, f1: 250, gain: 0.28, q: 0.6 });
    burst(t, 0.03, { f0: 1800, f1: 900, gain: 0.13 });
    tone(t, 0.07, 220, { glide: 140, gain: 0.1, att: 0.003 });
    burst(t + 0.07, 0.09, { ftype: 'lowpass', f0: 1100, f1: 400, gain: 0.08, q: 0.6 }); // sayfa oturması
  };

  /* --- crinkle: SÜREKLİ folyo dokusu — parmak hızı gain/tını modüle eder --- */
  var crinkleN = null;
  Y.audio.crinkleStart = function () {
    try {
      if (!ctx || !master || !noiseBuf || crinkleN) return;
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      var src = ctx.createBufferSource();
      src.buffer = noiseBuf; src.loop = true;
      var f = ctx.createBiquadFilter();
      f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 1.6;
      var g = ctx.createGain(); g.gain.value = 0.0001;
      src.connect(f); f.connect(g); g.connect(master);
      src.start();
      crinkleN = { src: src, f: f, g: g };
    } catch (e) { crinkleN = null; }
  };
  Y.audio.crinkleLevel = function (v) { // 0..1 (pointer hızı)
    try {
      if (!crinkleN || !ctx) return;
      v = Math.max(0, Math.min(1, +v || 0));
      var t = ctx.currentTime;
      crinkleN.g.gain.setTargetAtTime(0.0001 + v * 0.13, t, 0.03);
      crinkleN.f.frequency.setTargetAtTime(1700 + v * 2300, t, 0.05);
    } catch (e) { /* sessiz */ }
  };
  Y.audio.crinkleStop = function () {
    try {
      if (!crinkleN) return;
      var n = crinkleN; crinkleN = null;
      if (!ctx) return;
      var t = ctx.currentTime;
      n.g.gain.setTargetAtTime(0.0001, t, 0.05);
      n.src.stop(t + 0.4);
    } catch (e) { crinkleN = null; }
  };

  Y.audio.play = function (name, opts) {
    try {
      if (!ctx || !master || !noiseBuf) return;
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      var fn = SOUNDS[name];
      if (!fn) return;
      fn(ctx.currentTime + 0.01, opts);
    } catch (e) { /* sessiz */ }
  };
})();

/* == js/ui-dialog.js == */
/* =====================================================================
   YUVO — Konuşma balonu sistemi (Yuvo.dialog)
   =====================================================================
   Alt kenara sabit sticker balon: karakter portresi (Yuvo.art.story)
   + ad + metin. Kuyruk: say() art arda çağrılır, balona dokununca
   sıradaki gelir; kuyruk bitince kapanır. Sahne değişse de yaşar
   (kendi katmanı #dialog-root, #app içinde).
   API:
     Yuvo.dialog.say({ kim:'kiki'|'luna'|'ustakabuk'|'sako'|'pofu'|null,
                       metin:'...', mood:'happy', cb:fn })  // kuyruğa ekle
     Yuvo.dialog.clear()                                    // kuyruğu boşalt
     Yuvo.dialog.busy()                                     // balon açık mı
   kim:null → anlatıcı (portre yerine yıldız simgesi).
   ===================================================================== */
(function () {
  'use strict';
  var Y = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };

  var ADLAR = { kiki:'Kiki', luna:'Luna', ustakabuk:'Usta Kabuk', sako:'Şako', pofu:'Pofu' };
  var queue = [];
  var root = null, open = false, autoTimer = null;

  function clearAuto () {
    if (autoTimer !== null) { clearTimeout(autoTimer); autoTimer = null; }
  }

  function play (n) { try { if (Y.audio && Y.audio.play) Y.audio.play(n); } catch (e) {} }

  function ensureRoot () {
    if (root && root.parentNode) return root;
    var app = document.getElementById('app') || document.body;
    root = document.createElement('div');
    root.id = 'dialog-root';
    app.appendChild(root);
    return root;
  }

  function portrait (kim, mood) {
    if (kim && Y.art && Y.art.story && Y.art.story.portre) {
      try {
        var s = Y.art.story.portre(kim, { mood: mood || 'happy' });
        if (s) return s;
      } catch (e) {}
    }
    // Anlatıcı / portre yoksa: yıldız rozeti
    return '<svg viewBox="0 0 80 80" aria-hidden="true">' +
      '<circle cx="40" cy="40" r="30" fill="#FFEFC2" stroke="#3E2A1C" stroke-width="3"/>' +
      '<path d="M40 22 L45 35 L59 36 L48 45 L52 58 L40 50 L28 58 L32 45 L21 36 L35 35 Z"' +
      ' fill="#FFD34D" stroke="#3E2A1C" stroke-width="2.4" stroke-linejoin="round"/></svg>';
  }

  function render (item) {
    var r = ensureRoot();
    var ad = item.kim ? (ADLAR[item.kim] || item.kim) : 'Yıldız Sesi';
    r.innerHTML =
      '<div class="dlg-bubble" role="dialog" aria-label="' + ad + ' konuşuyor">' +
        '<span class="dlg-avatar" aria-hidden="true">' + portrait(item.kim, item.mood) + '</span>' +
        '<span class="dlg-main">' +
          '<b class="dlg-name">' + ad + '</b>' +
          '<span class="dlg-text">' + item.metin + '</span>' +
        '</span>' +
        '<span class="dlg-next" aria-hidden="true">▸</span>' +
      '</div>';
    var bub = r.firstChild;
    bub.addEventListener('click', advance);
    open = true;
    play('pop');
    // sure verildiyse balon kendiliğinden akar (tören kutlamaları / selamlar)
    clearAuto();
    if (item.sure > 0) autoTimer = setTimeout(advance, item.sure);
  }

  function advance () {
    clearAuto();
    var done = queue.shift();
    if (done && typeof done.cb === 'function') { try { done.cb(); } catch (e) {} }
    if (queue.length) { render(queue[0]); }
    else { close(); }
  }

  function close () {
    clearAuto();
    open = false;
    if (root) root.innerHTML = '';
  }

  Y.dialog = {
    say: function (opts) {
      if (!opts || !opts.metin) return;
      queue.push({ kim: opts.kim || null, metin: opts.metin, mood: opts.mood, cb: opts.cb,
                   sure: (opts.sure > 0) ? (opts.sure | 0) : 0 });
      if (!open) render(queue[0]);
    },
    clear: function () { queue = []; close(); },
    busy: function () { return open; }
  };

  // Test kancası: açık balonu ilerlet (duman testi diyalogları kapatabilsin)
  Y.test = Y.test || {};
  Y.test.dialogNext = function () { if (open) { advance(); return true; } return false; };
})();

/* Yuvo — Motor: state, kalıcılık, ekonomi + ritüel mutasyonları. Sahip: engine ajanı. */
(function () {

  var STREAK_GOAL = 7;                      // Bekçi Takvimi: 7 yıldız → rozet + Kabuk
  var STREAK_KABUK = 25;

  var GOREV_OYUN_HEDEF = 1;

  // Kilometre taşları: ownedCount eşiği → { anahtar, Kabuk ödülü }
  var MILESTONES = [
    { at:10, key:'m10', kabuk:15 },
    { at:20, key:'m20', kabuk:30 },
    { at:27, key:'m27', kabuk:60 },
    { at:30, key:'m30', kabuk:100 }
  ];

  function freshSeed () {
    return ((Date.now() ^ (Math.random() * 0xFFFFFFFF)) >>> 0) || 1;
  }

  // Ritüel sabitleri (data/wrappers.js); veri henüz yoksa güvenli varsayılanlar.
  function ritual () {
    var r = (Yuvo.data && Yuvo.data.RITUAL) || {};
    return {
      KUMBARA_ESIK: (typeof r.KUMBARA_ESIK === 'number') ? r.KUMBARA_ESIK : 15,
      KUMBARA_GUNLUK: (typeof r.KUMBARA_GUNLUK === 'number') ? r.KUMBARA_GUNLUK : 1,
      ISIRIK_YILDIZ: (typeof r.ISIRIK_YILDIZ === 'number') ? r.ISIRIK_YILDIZ : 2,
      CIKOLATA_YILDIZ_TAVAN: (typeof r.CIKOLATA_YILDIZ_TAVAN === 'number') ? r.CIKOLATA_YILDIZ_TAVAN : 40
    };
  }

  function seriesKeys () {
    var d = (Yuvo.data && Yuvo.data.WRAPPER_SERIES) || null;
    var keys = d ? Object.keys(d) : [];
    return keys.length ? keys : ['gunesbahcesi'];
  }

  function variantCount () {
    var n = Yuvo.data && Yuvo.data.WRAPPER_VARIANTS;
    return (typeof n === 'number' && n > 0) ? n : 8;
  }

  Yuvo.engine.activeSeries = function () {
    var s = Yuvo.engine.state;

  };

  }

  // nadirlik/altın sızdıramaz çünkü sonuç vitrin anında henüz yok (dürüstlük sözleşmesi §1.3).
  function makeEgg (day, seri) {
    if (!seri || seriesKeys().indexOf(seri) === -1) seri = daySeries(day);
    return { seri:seri, variant: Math.floor(Math.random() * variantCount()), golden:null };
  }

  // Vitrini yeniden kurar ve sayaç senkronunu garanti eder (eggsAvailable = todayEggs.length).
  function fillTodayEggs (s, count) {
    s.todayEggs = [];
    for (var i = 0; i < count; i++) s.todayEggs.push(makeEgg(s.day));
    s.eggsAvailable = s.todayEggs.length;
  }

    var s = {

      eggCounter: 0, pityN: 0, pityD: 0, pityE: 0, copyStreak: 0,
      owned: {},                              // pufiId -> adet

      weekCrafts: 0, rewardedPlaysToday: 0,

      todayEggs: [],                          // vitrindeki ambalajlı yumurtalar [{seri,variant,golden:null}]
      firstRitualDoneToday: false,            // tam ritüel / hızlı mod anahtarı (ceremony mount'ta true olur)
      chocolates: 0,                          // Çikolata Kumbarası sayacı
      chocolateStarsToday: 0,                 // çikolatadan bugün kazanılan ⭐ (tavan 40)
      kumbaraToday: 0,                        // bugünkü Çikolata Şöleni dönüşümü (günde max 1)
      lastChocolateChoice: 'ye',              // 'ye' | 'biriktir' — hızlı modun varsayılan davranışı
      foilBook: {},                           // seriId -> { variants:{0:count,...}, golden:count }
      goldenPity: 0,                          // Altın Folyo pity sayacı (gacha.js işler)
      tools: FREE_TOOLS.slice(),              // sahip olunan açma araçları
      activeTool: 'burgu',                    // seçili araç (saf kozmetik — orana asla dokunmaz)
      // --- v3 ebeveyn/mağaza alanları (docs/v2/05 §1-§2) — DEMO, gerçek ödeme yok ---
      parent: {
        pin: '1234',                          // DEMO varsayılanı (panel ekranda açıkça yazar)
        limitTL: storeLimits().varsayilanAylik,

      kiler: { adet: 0, bugunAcilan: 0 },     // satın alınan yumurtalar buraya düşer (binge freni)
      wishes: [],                             // [{pufiId, ts}] — Dilek Kavanozu (çocuk fiyat görmez)
      purchases: [],                          // [{paketId, ad, tutar, adet, ts}] — ebeveyn raporu

        var saved = JSON.parse(raw);
        if (saved && typeof saved === 'object') {

    if (!base.owned || typeof base.owned !== 'object') base.owned = {};
    if (!Array.isArray(base.milestones)) base.milestones = [];
    if (!base.seed) base.seed = freshSeed();

    // --- version:2 migrasyonu + tip onarımı: eski (v1) kayıt yeni alanları varsayılanla açılır ---
    var i, e;
    if (!Array.isArray(base.todayEggs)) { base.todayEggs = []; savedHadEggs = false; }
    if (!savedHadEggs) {
      // v1 kaydı: eldeki yumurta hakkı korunur, vitrine ambalajlı karşılıkları konur
      fillTodayEggs(base, Math.max(0, base.eggsAvailable | 0));
    } else {
      var keys = seriesKeys(), temiz = [];
      for (i = 0; i < base.todayEggs.length; i++) {
        e = base.todayEggs[i];
        if (!e || typeof e !== 'object') continue;
        if (keys.indexOf(e.seri) === -1) e.seri = daySeries(base.day);
        e.variant = Math.max(0, Math.min(variantCount() - 1, e.variant | 0));
        if (e.golden !== true) e.golden = null;
        if (e.kulucka !== true) delete e.kulucka;
        temiz.push(e);
      }
      base.todayEggs = temiz;
    }
    if (!base.foilBook || typeof base.foilBook !== 'object' || Array.isArray(base.foilBook)) base.foilBook = {};
    if (!Array.isArray(base.tools) || !base.tools.length) base.tools = FREE_TOOLS.slice();
    for (i = 0; i < FREE_TOOLS.length; i++) {
      if (base.tools.indexOf(FREE_TOOLS[i]) === -1) base.tools.push(FREE_TOOLS[i]);
    }
    if (base.tools.indexOf(base.activeTool) === -1) base.activeTool = base.tools[0];
    if (base.lastChocolateChoice !== 'biriktir') base.lastChocolateChoice = 'ye';
    base.chocolates = Math.max(0, base.chocolates | 0);
    base.chocolateStarsToday = Math.max(0, base.chocolateStarsToday | 0);
    base.kumbaraToday = Math.max(0, base.kumbaraToday | 0);
    base.goldenPity = Math.max(0, base.goldenPity | 0);
    base.firstRitualDoneToday = base.firstRitualDoneToday === true;

    // --- version:3 migrasyonu: v1/v2 kayıtları ebeveyn/mağaza alanlarını varsayılanla açar ---
    var L = storeLimits();
    if (!base.parent || typeof base.parent !== 'object' || Array.isArray(base.parent)) base.parent = {};
    if (typeof base.parent.pin !== 'string' || !/^\d{4}$/.test(base.parent.pin)) base.parent.pin = '1234';
    if (typeof base.parent.limitTL !== 'number' || base.parent.limitTL < 0) base.parent.limitTL = L.varsayilanAylik;
    base.parent.spentTL = Math.max(0, round2(base.parent.spentTL));
    if (typeof base.parent.ay !== 'string') base.parent.ay = monthKey();
    base.parent.clubActive = base.parent.clubActive === true;
    base.parent.limitRaiseTs = Math.max(0, base.parent.limitRaiseTs | 0);
    syncMonth(base);                            // ay döndüyse harcama sayacı sıfırlanır
    if (!base.kiler || typeof base.kiler !== 'object' || Array.isArray(base.kiler)) base.kiler = {};
    base.kiler.adet = Math.max(0, base.kiler.adet | 0);
    base.kiler.bugunAcilan = Math.max(0, base.kiler.bugunAcilan | 0);
    if (!Array.isArray(base.wishes)) base.wishes = [];
    var temizW = [];
    for (i = 0; i < base.wishes.length; i++) {
      var w = base.wishes[i];
      if (w && typeof w === 'object' && typeof w.pufiId === 'string') {
        var tw = { pufiId: w.pufiId, ts: Math.max(0, w.ts | 0) };
        if (w.not === 'dogumgunu') tw.not = 'dogumgunu';   // ebeveyn notu (panel)
        if (w.durum === 'sonra') tw.durum = 'sonra';        // "şimdi değil" işareti
        temizW.push(tw);
      }
    }
    base.wishes = temizW;
    if (!Array.isArray(base.purchases)) base.purchases = [];

    // --- oturum döngüsü alanları (tip onarımı — eski kayıt varsayılanla açılır) ---
    if (!base.kulucka || typeof base.kulucka !== 'object' || typeof base.kulucka.seri !== 'string') {
      base.kulucka = null;
    }
    if (!Array.isArray(base.bugunAcilanlar)) base.bugunAcilanlar = [];
    if (!base.gorevler || typeof base.gorevler !== 'object' || Array.isArray(base.gorevler)) {
      base.gorevler = { ac: 0, oyun: 0, albumZiyaret: false, bonusVerildi: false };
    }
    base.gorevler.ac = Math.max(0, base.gorevler.ac | 0);
    base.gorevler.oyun = Math.max(0, base.gorevler.oyun | 0);
    base.gorevler.albumZiyaret = base.gorevler.albumZiyaret === true;
    base.gorevler.bonusVerildi = base.gorevler.bonusVerildi === true;
    base.gorevBonusYeni = base.gorevBonusYeni === true;
    if (!base.streak || typeof base.streak !== 'object' || Array.isArray(base.streak)) {
      base.streak = { yildiz: 0, rozet: 0 };
    }
    base.streak.yildiz = Math.max(0, base.streak.yildiz | 0);
    base.streak.rozet = Math.max(0, base.streak.rozet | 0);

    base.version = 3;
    base.eggsAvailable = base.todayEggs.length;  // ZORUNLU senkron (main.js HUD / home bunu okur)

    Yuvo.engine.state = base;
    return base;
  };

  Yuvo.engine.save = function () {
    try {
      if (window.localStorage) window.localStorage.setItem(STORAGE_KEY, JSON.stringify(Yuvo.engine.state));
    } catch (e) { /* depolama yoksa sessizce devam */ }
  };

  Yuvo.engine.reset = function (seed) {
    var s = defaults();
    if (seed !== undefined && seed !== null) s.seed = (seed >>> 0) || 1;
    Yuvo.engine.state = s;
    commit();
    return s;
  };

  Yuvo.engine.newDay = function () {
    var s = Yuvo.engine.state;
    // Bekçi Takvimi: dün en az 1 yumurta açıldıysa 1 yıldız. CEZASIZ — oynanmayan gün
    // zinciri KIRMAZ, yıldızlar birikmeye devam eder; "kaybettin" dili hiçbir yerde yok.
    if (s.gorevler && (s.gorevler.ac | 0) > 0) {
      s.streak.yildiz = (s.streak.yildiz | 0) + 1;
      if (s.streak.yildiz >= STREAK_GOAL) {
        s.streak.yildiz = 0;
        s.streak.rozet = (s.streak.rozet | 0) + 1;
        s.kabuk += STREAK_KABUK;
      }
    }
    s.day += 1;
    // Haklar BİRİKİR: vitrin sıfırlanmaz — kalan + 3 yeni, tavan 9 (TCG Pocket stack modeli).
    var kalan = Array.isArray(s.todayEggs) ? s.todayEggs.slice(0, EGG_STACK_MAX) : [];
    var eklenecek = Math.min(DAILY_EGGS, Math.max(0, EGG_STACK_MAX - kalan.length));
    for (var ne = 0; ne < eklenecek; ne++) kalan.push(makeEgg(s.day));
    s.todayEggs = kalan;
    if (s.parent.clubActive) {              // Club: her gün 1 bonus yumurta (tavanı aşmaz)
      var cAdet = clubInfo().gunlukYumurta | 0, ci;
      for (ci = 0; ci < cAdet; ci++) {
        if (s.todayEggs.length < EGG_STACK_MAX) s.todayEggs.push(makeEgg(s.day));
      }
    }
    // Kuluçka: Şako'nun dün akşam bıraktığı yumurta sabah "hazır!" olur — vitrinin İLK
    // sırasına düşer ve tavana SAYILMAZ (bekletilen sürpriz asla yanmaz).
    if (s.kulucka && typeof s.kulucka === 'object') {
      var kEgg = makeEgg(s.day, s.kulucka.seri);
      kEgg.kulucka = true;
      s.todayEggs.unshift(kEgg);
      s.kulucka = null;
    }
    s.eggsAvailable = s.todayEggs.length;   // ZORUNLU senkron
    s.extraEggsBought = 0;
    s.rewardedPlaysToday = 0;
    s.firstRitualDoneToday = false;         // günün ilk yumurtası yine tam ritüel
    s.chocolateStarsToday = 0;
    s.kumbaraToday = 0;
    s.kiler.bugunAcilan = 0;                // kilerden günlük açma hakkı tazelenir
    s.gorevler = { ac: 0, oyun: 0, albumZiyaret: false, bonusVerildi: false };
    s.gorevBonusYeni = false;
    s.bugunAcilanlar = [];
    syncMonth(s);                           // ay döndüyse ebeveyn harcaması sıfırlanır
    // Şako: orman açıkken sahipli bir orman parçasını "saklar" (yok olmaz, iz bırakır)
    if (s.ormanAcik && !s.sakoHidden) {
      var ormanIds = [], oid, op;
      for (oid in s.owned) {
        if (!s.owned[oid]) continue;
        op = Yuvo.data.pufiById && Yuvo.data.pufiById(oid);
        if (op && op.biome === 'orman' && op.rarity !== 'gizli') ormanIds.push(oid);
      }
      if (ormanIds.length >= 2) s.sakoHidden = ormanIds[Math.floor(Math.random() * ormanIds.length)];
    }
    if ((s.day - 1) % 7 === 0) s.weekCrafts = 0;  // yeni hafta → Atölye hakkı tazelenir
    commit();
  };

  Yuvo.engine.addStardust = function (n) {
    var s = Yuvo.engine.state;
    s.stardust = Math.max(0, s.stardust + (n | 0));
    commit();
  };

  Yuvo.engine.spendStardust = function (n) {
    var s = Yuvo.engine.state;
    n = n | 0;
    if (n < 0 || s.stardust < n) return false;
    s.stardust -= n;
    commit();
    return true;
  };

  Yuvo.engine.buyExtraEgg = function () {
    var s = Yuvo.engine.state;
    if (s.extraEggsBought >= EXTRA_EGG_MAX) return false;
    if (s.stardust < EXTRA_EGG_COST) return false;
    s.stardust -= EXTRA_EGG_COST;
    s.extraEggsBought += 1;
    s.todayEggs.push(makeEgg(s.day));       // satın alınan yumurta vitrine aynı ambalaj diliyle düşer
    s.eggsAvailable += 1;                   // todayEggs ile birlikte artar (senkron)
    commit();
    return true;
  };

  // Vitrine ambalajlı yumurta ekler (görev ödülü / kiler / Çikolata Şöleni).
  // seri verilmezse günün aktif serisi; variant rastgele. Eklenen yumurtayı döndürür.
  Yuvo.engine.grantEgg = function (seri) {
    var s = Yuvo.engine.state;
    var egg = makeEgg(s.day, seri);
    s.todayEggs.push(egg);
    s.eggsAvailable += 1;                   // senkron: todayEggs.length ile birlikte
    commit();
    return egg;
  };

  // Isırık: +2⭐ (çikolata kaynaklı ⭐ günlük tavanı 40 — docs/v2/06 §2.c).
  // Kazanılan ⭐ miktarını döndürür (tavana takıldıysa 0; ısırık yine sayılır, tören bozulmaz).
  Yuvo.engine.eatChocolate = function () {
    var s = Yuvo.engine.state, R = ritual();
    var gain = Math.max(0, Math.min(R.ISIRIK_YILDIZ, R.CIKOLATA_YILDIZ_TAVAN - s.chocolateStarsToday));
    s.chocolateStarsToday += gain;
    s.stardust += gain;
    s.lastChocolateChoice = 'ye';
    commit();
    return gain;
  };

  // Çikolata Kumbarası: çikolata bütün hâlde kavanoza. Yeni kumbara sayısını döndürür.
  Yuvo.engine.bankChocolate = function () {
    var s = Yuvo.engine.state;
    s.chocolates += 1;
    s.lastChocolateChoice = 'biriktir';
    commit();
    return s.chocolates;
  };

  // Çikolata Şöleni: 15 çikolata + günde 1 hak → 1 bonus vitrin yumurtası (günlük tavana sayılır).
  Yuvo.engine.redeemChocolates = function () {
    var s = Yuvo.engine.state, R = ritual();
    if (s.chocolates < R.KUMBARA_ESIK) return false;
    if (s.kumbaraToday >= R.KUMBARA_GUNLUK) return false;
    s.chocolates -= R.KUMBARA_ESIK;
    s.kumbaraToday += 1;
    Yuvo.engine.grantEgg();                 // commit'i grantEgg yapar (tek kayıt)
    return true;
  };

  // Açılan folyoyu Ambalaj Defteri'ne işler — openEgg içinden çağrılır; commit'i openEgg yapar
  // (checkMilestones deseniyle aynı). Altın folyo Altın Şeref Yuvası'na, normal folyo varyant
  // yuvasına (×n kopya sayacı) yazılır. Defter saf kozmetiktir: oran/pity'ye etkisi yoktur (§2.f).
  Yuvo.engine.registerFoil = function (seri, variant, golden) {
    var s = Yuvo.engine.state;
    if (!s.foilBook || typeof s.foilBook !== 'object') s.foilBook = {};
    var rec = s.foilBook[seri];
    if (!rec || typeof rec !== 'object') rec = s.foilBook[seri] = { variants:{}, golden:0 };
    if (!rec.variants || typeof rec.variants !== 'object') rec.variants = {};
    if (golden) rec.golden = (rec.golden | 0) + 1;
    else rec.variants[variant] = (rec.variants[variant] | 0) + 1;
    return rec;
  };

  // Araç seçimi (saf kozmetik): yalnız sahip olunan araç aktifleşir.
  Yuvo.engine.setTool = function (id) {
    var s = Yuvo.engine.state;
    if (!Array.isArray(s.tools) || s.tools.indexOf(id) === -1) return false;
    s.activeTool = id;
    commit();
    return true;
  };

  // Gizli HARİÇ sahip olunan farklı parça sayısı (0-30).
  // biome verilirse yalnız o biyomun parçaları sayılır ('cayir'|'orman');
  // verilmezse tüm biyomların toplamı (geriye uyumlu).
  Yuvo.engine.ownedCount = function (biome) {
    var s = Yuvo.engine.state, n = 0;
    for (var id in s.owned) {
      if (!s.owned[id]) continue;
      var p = Yuvo.data.pufiById && Yuvo.data.pufiById(id);
      if (p && p.rarity === 'gizli') continue;
      if (biome && p && (p.biome || 'cayir') !== biome) continue;
      n += 1;
    }
    return n;
  };

  // Kilometre taşı ödülleri — bir kez, state.milestones ile (Çayır Sezon-1 rozetleri).
  // Not: burada commit çağrılmaz; yeni parça kazandıran akış (openEgg/craft) zaten commit eder.
  Yuvo.engine.checkMilestones = function () {
    var s = Yuvo.engine.state;
    var count = Yuvo.engine.ownedCount('cayir');
    var granted = [];
    for (var i = 0; i < MILESTONES.length; i++) {
      var m = MILESTONES[i];
      if (count >= m.at && s.milestones.indexOf(m.key) === -1) {
        s.milestones.push(m.key);
        s.kabuk += m.kabuk;
        granted.push(m.key);
      }
    }
    return granted;
  };

  // Atölye: Kabuk yeterliyse üret; gizli için ownedCount()==30 şartı.
  Yuvo.engine.craft = function (pufiId) {
    var s = Yuvo.engine.state;
    var pufi = Yuvo.data.pufiById && Yuvo.data.pufiById(pufiId);
    if (!pufi) return { ok:false, reason:'bilinmiyor' };
    if (s.owned[pufiId]) return { ok:false, reason:'sahipli' };
    if (pufi.rarity === 'gizli' && Yuvo.engine.ownedCount(pufi.biome || 'cayir') !== 30) {
      return { ok:false, reason:'gizli-kilitli' };
    }
    var cost = (Yuvo.data.RARITIES[pufi.rarity] || {}).uretim || 0;
    if (s.kabuk < cost) return { ok:false, reason:'kabuk-yetersiz' };
    s.kabuk -= cost;
    s.owned[pufiId] = 1;
    s.weekCrafts += 1;
    Yuvo.engine.checkMilestones();
    commit();
    return { ok:true };
  };

  /* ======================================================================
     Oturum döngüsü: görev zinciri + kuluçka (araştırma: "yarın sebebi" =
     ekranda fiziksel duran kanca; geri sayım sayacı YOK — hikâye kapısı)
     ====================================================================== */

  // Günlük görev zinciri ilerletir: 'ac' | 'oyun' | 'album'. Üçü de tamamlanınca
  // BİR KEZ +1 bonus yumurta düşer ve true döner (yuva kutlar). Baskı dili yok.
  Yuvo.engine.gorevIlerle = function (tip) {
    var s = Yuvo.engine.state, g = s.gorevler;
    if (!g || typeof g !== 'object') {
      g = s.gorevler = { ac: 0, oyun: 0, albumZiyaret: false, bonusVerildi: false };
    }
    if (tip === 'ac') g.ac = (g.ac | 0) + 1;
    else if (tip === 'oyun') g.oyun = (g.oyun | 0) + 1;
    else if (tip === 'album') g.albumZiyaret = true;
    else return false;
    if (!g.bonusVerildi && (g.ac | 0) >= GOREV_AC_HEDEF &&
        (g.oyun | 0) >= GOREV_OYUN_HEDEF && g.albumZiyaret === true) {
      g.bonusVerildi = true;
      s.gorevBonusYeni = true;              // yuva bir kez kutlar, sonra bayrağı düşürür
      Yuvo.engine.grantEgg();               // commit'i grantEgg yapar (tek kayıt)
      return true;
    }
    commit();
    return false;
  };

  // Görev hedefleri — sahnelerin çip çizimi için tek kaynak.
  Yuvo.engine.gorevHedef = function () {
    return { ac: GOREV_AC_HEDEF, oyun: GOREV_OYUN_HEDEF };
  };

  // Kuluçka: Şako gün batımında "yarın sürprizini" bırakır. Seri verilmezse YARININ
  // serisi seçilir — kapanış ekranındaki silüet vaadiyle sabahki yumurta hep tutarlı.
  Yuvo.engine.kuluckaBirak = function (seri) {
    var s = Yuvo.engine.state;
    if (s.kulucka) return false;            // zaten bekleyen bir kuluçka var
    if (!seri || seriesKeys().indexOf(seri) === -1) seri = daySeries(s.day + 1);
    s.kulucka = { seri: seri };
    commit();
    return true;
  };

  // Yarının ambalaj serisi (kapanış ritüeli "Yarın: …" satırı bunu okur).
  Yuvo.engine.yarinSeri = function () {
    return daySeries(Yuvo.engine.state.day + 1);
  };

  // Bekçi Takvimi görünümü için sabitler.
  Yuvo.engine.streakInfo = function () {
    return { hedef: STREAK_GOAL, kabuk: STREAK_KABUK };
  };

  /* ======================================================================
     İkinci biyom: Fısıltı Ormanı + Şako Saklambaç (docs/v2/03-04, D3 vuruşu)
     ====================================================================== */

  // Aktif biyomu değiştirir; orman yalnız kilidi açıksa seçilebilir.
  Yuvo.engine.setBiome = function (b) {
    var s = Yuvo.engine.state;
    if (b !== 'cayir' && !(b === 'orman' && s.ormanAcik)) return false;
    if (s.activeBiome === b) return true;
    s.activeBiome = b;
    commit();
    return true;
  };

  // Çayır 10/30'a ulaşınca ormanı BİR KEZ açar; yeni açıldıysa true döner.
  // (commit yok: openEgg/craft akışı zaten commit eder — checkMilestones deseni.)
  Yuvo.engine.checkOrmanUnlock = function () {
    var s = Yuvo.engine.state;
    if (s.ormanAcik) return false;
    if (Yuvo.engine.ownedCount('cayir') >= 10) { s.ormanAcik = true; return true; }
    return false;
  };

  // Şako Saklambaç kazanımı: saklanan parça geri döner ("yok olmaz, iz bırakır" —
  // parça hep sahipli kalır, yalnız albümde Şako tüyüyle gizli görünür).
  Yuvo.engine.sakoRecover = function () {
    var s = Yuvo.engine.state;
    if (!s.sakoHidden) return false;
    s.sakoHidden = null;
    commit();
    return true;
  };

  /* ======================================================================
     v3 — Ebeveyn paneli / mağaza SİMÜLASYONU API'leri (docs/v2/05 §1-§2)
     DEMO: gerçek ödeme yok. Satın alma yalnız Kiler'e yumurta ekler;
     vitrine tek giriş drawFromKiler() → günlük tavanla (binge freni).
     ====================================================================== */

  // Dilek Kavanozu: çocuk fiyat GÖRMEZ; son 7 günde en çok 5 dilek, tekrar yok.
  Yuvo.engine.addWish = function (pufiId) {
    var s = Yuvo.engine.state, i, hafta = 7 * 24 * 3600 * 1000, now = nowTs();
    if (typeof pufiId !== 'string' || !pufiId) return false;
    var taze = [];
    for (i = 0; i < s.wishes.length; i++) {
      if (now - s.wishes[i].ts < hafta) taze.push(s.wishes[i]);
    }
    s.wishes = taze;
    for (i = 0; i < s.wishes.length; i++) if (s.wishes[i].pufiId === pufiId) return false;
    if (s.wishes.length >= 5) return false;
    s.wishes.push({ pufiId: pufiId, ts: now });
    commit();
    return true;
  };

  Yuvo.engine.clearWish = function (pufiId) {
    var s = Yuvo.engine.state, i, kaldi = [];
    for (i = 0; i < s.wishes.length; i++) if (s.wishes[i].pufiId !== pufiId) kaldi.push(s.wishes[i]);
    var degisti = kaldi.length !== s.wishes.length;
    s.wishes = kaldi;
    if (degisti) commit();
    return degisti;
  };

  // Paket satın alma (SİMÜLASYON): limit kontrolü → Kiler'e ekle → kayıt.
  // ASLA doğrudan vitrine koymaz; Club bonusu yukarı yuvarlanır (10→11).
  Yuvo.engine.buyPack = function (paketId) {
    var s = Yuvo.engine.state;
    var p = packById(paketId);
    if (!p) return { ok: false, reason: 'bilinmiyor' };
    syncMonth(s);
    var tutar = round2(p.tl);
    if (round2(s.parent.spentTL + tutar) > s.parent.limitTL + 1e-9) {
      return { ok: false, reason: 'limit' };
    }
    var adet = p.adet | 0;
    if (s.parent.clubActive) {
      var C = clubInfo();
      adet += Math.ceil(adet * (C.bonusYuzde / 100));   // eksik teslim yok
    }
    s.parent.spentTL = round2(s.parent.spentTL + tutar);
    s.kiler.adet += adet;
    s.purchases.push({ paketId: p.id, ad: p.ad, tutar: tutar, adet: adet, ts: nowTs() });
    commit();
    return { ok: true, adet: adet, tutar: tutar };
  };

  // Kilerden günlük çekim: tavan = 5 (+1 Club). Vitrine grantEgg ile düşer.
  Yuvo.engine.drawFromKiler = function () {
    var s = Yuvo.engine.state;
    if (s.kiler.adet <= 0) return false;
    var tavan = storeLimits().kilerGunluk + (s.parent.clubActive ? clubInfo().kilerEk : 0);
    if (s.kiler.bugunAcilan >= tavan) return false;
    s.kiler.adet -= 1;
    s.kiler.bugunAcilan += 1;
    s.todayEggs.push(makeEgg(s.day));
    s.eggsAvailable = s.todayEggs.length;
    commit();
    return true;
  };

  Yuvo.engine.setLimit = function (tl) {
    var s = Yuvo.engine.state;
    tl = Math.max(0, round2(tl));
    var eski = s.parent.limitTL;
    s.parent.limitTL = tl;
    var soguma = tl > eski;                   // ARTIRIM → 24 sa soğuma bilgisi (DEMO'da bilgilendirme)
    if (soguma) s.parent.limitRaiseTs = nowTs();
    commit();
    return { ok: true, soguma: soguma, sogumaSaat: storeLimits().sogumaSaat };
  };

  Yuvo.engine.setPin = function (p) {
    var s = Yuvo.engine.state;
    if (typeof p !== 'string' || !/^\d{4}$/.test(p)) return false;
    s.parent.pin = p;
    commit();
    return true;
  };

  Yuvo.engine.toggleClub = function () {
    var s = Yuvo.engine.state;
    s.parent.clubActive = !s.parent.clubActive;
    commit();
    return s.parent.clubActive;
  };

  // Ebeveyn raporu özeti — satış teklifi içermez (v2·05 §2.5).
  Yuvo.engine.spendReport = function () {
    var s = Yuvo.engine.state, i, toplamYumurta = 0, dokum = {}, liste = [];
    syncMonth(s);
    for (i = 0; i < s.purchases.length; i++) {
      var pr = s.purchases[i];
      toplamYumurta += pr.adet | 0;
      if (!dokum[pr.paketId]) dokum[pr.paketId] = { ad: pr.ad, adet: 0, tutar: 0 };
      dokum[pr.paketId].adet += 1;
      dokum[pr.paketId].tutar = round2(dokum[pr.paketId].tutar + pr.tutar);
    }
    for (var k in dokum) liste.push(dokum[k]);
    var pufiSayisi = 0;
    for (var id in s.owned) if (s.owned[id]) pufiSayisi += 1;
    return {
      ay: s.parent.ay, spentTL: s.parent.spentTL, limitTL: s.parent.limitTL,
      clubActive: s.parent.clubActive,
      paketler: liste, paketAdet: s.purchases.length,
      yumurta: toplamYumurta, kiler: s.kiler.adet, pufi: pufiSayisi
    };
  };

  // Test kancaları (motor kısmı) — nesneyi toptan yazma: sahne kancaları korunur.
  Yuvo.test = Yuvo.test || {};
  Yuvo.test.state = function () { return Yuvo.engine.state; };
  Yuvo.test.grantStardust = function (n) { Yuvo.engine.addStardust(n); };
  Yuvo.test.grantEggs = function (n) {      // artık vitrine AMBALAJLI yumurta ekler (grantEgg dili)
    var s = Yuvo.engine.state;
    n = Math.max(0, n | 0);
    for (var i = 0; i < n; i++) s.todayEggs.push(makeEgg(s.day));
    s.eggsAvailable += n;                   // senkron: todayEggs ile birlikte
    commit();
  };
  Yuvo.test.grantChocolates = function (n) {
    var s = Yuvo.engine.state;
    s.chocolates = Math.max(0, s.chocolates + (n | 0));
    commit();
  };
  Yuvo.test.setTool = function (id) { return Yuvo.engine.setTool(id); };
  Yuvo.test.foilBook = function () { return Yuvo.engine.state.foilBook; };
})();

/* == js/engine/gacha.js == */
/* Yuvo — Motor: düşüş algoritması (docs/v2/02 §2.2, proto sabitleriyle). Sahip: engine ajanı. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.engine = Yuvo.engine || {};

  // ---------- SABİTLER (Güneş Çayırı onboarding istisnası: E pity 35/50) ----------
  var SOFT_PITY_E = 35;
  var SOFT_ARTIS = 0.06;
  var HARD_PITY_E = 50;
  var PITY_DESTANSI = 40;   // 40 yumurtadır Destansı+ görmediyse
  var PITY_NADIR = 15;      // 15 yumurtadır Nadir+ görmediyse
  var ONBOARDING = 10;      // ilk 10 yumurta: hep eksik; 3.'sü Nadir+ garanti
  var KOPYA_SERI_ESIGI = 6; // 6 ardışık kopya → sıradaki kesin eksik parça
  var W_EKSIK = 4;          // akıllı düşüş: eksik parça ağırlığı
  var W_EKSIK_SON3 = 12;    // ownedCount >= 27 iken eksik ağırlığı

  var TIERS = ['yaygin', 'azbulunur', 'nadir', 'destansi', 'efsanevi', 'gizli'];
  var RANK = { yaygin:0, azbulunur:1, nadir:2, destansi:3, efsanevi:4, gizli:5 };

  // Altın Folyo sabitleri (data/wrappers.js; veri yoksa güvenli varsayılanlar) — docs/v2/06 §2.f.
  function ritualConst () {
    var r = (Yuvo.data && Yuvo.data.RITUAL) || {};
    return {
      GOLDEN_ORAN: (typeof r.GOLDEN_ORAN === 'number') ? r.GOLDEN_ORAN : 0.02,
      GOLDEN_HARD: (typeof r.GOLDEN_HARD === 'number') ? r.GOLDEN_HARD : 40
    };
  }
  var forceGoldenNext = false;              // test kancası: sıradaki açılış kesin altın

  // ---------- RNG: mulberry32, tohum state'te kalıcı ----------
  function rand () {
    var s = Yuvo.engine.state;
    s.seed = (s.seed + 0x6D2B79F5) >>> 0;
    var t = s.seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function weightedPick (keys, weights, r) {
    var total = 0, i;
    for (i = 0; i < keys.length; i++) total += weights[i];
    var x = r * total;
    for (i = 0; i < keys.length; i++) {
      x -= weights[i];
      if (x < 0) return keys[i];
    }
    // Kayan-nokta artığı: ağırlığı 0 olan anahtar asla dönmesin — geriye tara
    for (i = keys.length - 1; i >= 0; i--) { if (weights[i] > 0) return keys[i]; }
    return keys[keys.length - 1];
  }

  // Aktif biyom ('cayir'|'orman') — havuz yalnız o biyomun ailesinden çekilir.
  // biome alanı olmayan eski kayıtlar çayır sayılır (geriye uyumlu).
  function activeBiome () {
    var s = Yuvo.engine.state;
    return (s && s.activeBiome) || 'cayir';
  }

  function poolOf (tier) {
    var out = [], list = Yuvo.data.PUFIS || [], b = activeBiome();
    for (var i = 0; i < list.length; i++) {
      if (list[i].rarity !== tier) continue;
      if ((list[i].biome || 'cayir') !== b) continue;
      out.push(list[i]);
    }
    return out;
  }

  function tierEksikVar (s, tier) {
    var havuz = poolOf(tier);
    for (var i = 0; i < havuz.length; i++) { if (!s.owned[havuz[i].id]) return true; }
    return false;
  }

  // ---------- KADEME SEÇİMİ ----------
  function pickTier (s, gizliHavuzda) {
    if (s.pityE >= HARD_PITY_E - 1) return 'efsanevi'; // mutlak tavan

    var base = Yuvo.data.RARITIES;
    var w = {
      yaygin: base.yaygin.oran, azbulunur: base.azbulunur.oran, nadir: base.nadir.oran,
      destansi: base.destansi.oran, efsanevi: base.efsanevi.oran, gizli: base.gizli.oran
    };
    if (!gizliHavuzda) { w.yaygin += w.gizli; w.gizli = 0; } // gizli yalnız 30/30'da havuzda

    if (s.pityE >= SOFT_PITY_E - 1) { // soft pity: Gizli oranına dokunmadan normalize
      w.efsanevi = Math.min(0.95, base.efsanevi.oran + SOFT_ARTIS * (s.pityE - SOFT_PITY_E + 2));
      var rest = 1 - w.efsanevi - w.gizli;
      var restSum = w.yaygin + w.azbulunur + w.nadir + w.destansi;
      if (restSum > 0 && rest > 0) {
        var f = rest / restSum;
        w.yaygin *= f; w.azbulunur *= f; w.nadir *= f; w.destansi *= f;
      } else {
        w.yaygin = Math.max(0, rest); w.azbulunur = 0; w.nadir = 0; w.destansi = 0;
      }
    }

    var tier = weightedPick(TIERS, [w.yaygin, w.azbulunur, w.nadir, w.destansi, w.efsanevi, w.gizli], rand());

    // Taban-yükseltme pity'leri
    if (s.pityD >= PITY_DESTANSI - 1 && RANK[tier] < RANK.destansi) tier = 'destansi';
    else if (s.pityN >= PITY_NADIR - 1 && RANK[tier] < RANK.nadir) tier = 'nadir';
    // Onboarding garantisi: 3. yumurta Nadir+
    if (s.eggCounter === 3 && RANK[tier] < RANK.nadir) tier = 'nadir';
    return tier;
  }

  // ---------- PARÇA SEÇİMİ (akıllı düşüş) ----------
  function pickPufi (s, tier, zorlaEksik) {
    var havuz = poolOf(tier);
    var eksik = [], i;
    for (i = 0; i < havuz.length; i++) { if (!s.owned[havuz[i].id]) eksik.push(havuz[i]); }

    if ((tier === 'efsanevi' || tier === 'gizli') && eksik.length) {
      return eksik[Math.floor(rand() * eksik.length)]; // E/G hep eksik-öncelikli
    }
    if (zorlaEksik && eksik.length) {
      return eksik[Math.floor(rand() * eksik.length)];
    }
    var wEksik = (Yuvo.engine.ownedCount(activeBiome()) >= 27) ? W_EKSIK_SON3 : W_EKSIK;
    var weights = [];
    for (i = 0; i < havuz.length; i++) weights.push(s.owned[havuz[i].id] ? 1 : wEksik);
    return weightedPick(havuz, weights, rand());
  }

  // ---------- YUMURTA AÇ ----------
  // openEgg(eggIdx): vitrindeki (state.todayEggs) yumurtayı açar — docs/v2/06 §5.3.
  // eggIdx yalnız ambalaj görselini seçer, havuzu/oranı DEĞİŞTİRMEZ (proto tek aile;
  // çok-biyomlu oyunda kaynakBiyom olur). Nadirlik burada, açılış anında çekilir (§1.3).
  Yuvo.engine.openEgg = function (eggIdx) {
    var s = Yuvo.engine.state;
    if (!s || s.eggsAvailable <= 0) return { error:'no-egg' };
    var vitrin = Array.isArray(s.todayEggs) ? s.todayEggs : (s.todayEggs = []);
    var idx = (eggIdx === undefined || eggIdx === null) ? 0 : (eggIdx | 0);
    if (idx < 0) return { error:'no-egg' };
    var alinan = vitrin.splice(idx, 1);
    if (!alinan.length) {
      // vitrinde o yumurta yok — hayalet sayaç kendini onarır (elle bozulmuş
      // state'te HUD bir sonraki load()'a dek var olmayan yumurta göstermesin)
      s.eggsAvailable = vitrin.length;
      return { error:'no-egg' };
    }
    var egg = alinan[0];

    s.eggsAvailable = vitrin.length;        // ZORUNLU senkron (main.js HUD / home okur)
    s.eggCounter += 1;

    var zorlaEksik = (s.eggCounter <= ONBOARDING) || (s.copyStreak >= KOPYA_SERI_ESIGI);
    var gizliHavuzda = Yuvo.engine.ownedCount(activeBiome()) === 30; // gizli, KENDİ biyomu 30/30 olunca

    var tier = pickTier(s, gizliHavuzda);

    // Kesin-eksik garantisi kademeler ARASI da işler: çekilen kademenin havuzu tam
    // sahipliyse, aynı-veya-üstü ranktan eksikli bir kademeye (oranları koruyarak)
    // yükselt. Asla düşürme (pity tavanları bozulmaz); Gizli hariç — docs/v2/02 §2.1.4
    // "Pity YOK (bilinçli)", zorlama onu fiilen pity'ye çevirirdi.
    if (zorlaEksik && !tierEksikVar(s, tier)) {
      var adaylar = [], aw = [], ti;
      for (ti = 0; ti < TIERS.length; ti++) {
        var t2 = TIERS[ti];
        if (t2 === 'gizli' || RANK[t2] < RANK[tier]) continue;
        if (!tierEksikVar(s, t2)) continue;
        adaylar.push(t2); aw.push((Yuvo.data.RARITIES[t2] || {}).oran || 0);
      }
      if (adaylar.length === 1) tier = adaylar[0];
      else if (adaylar.length > 1) tier = weightedPick(adaylar, aw, rand());
      // adaylar boşsa kopya kaçınılmaz (ör. tek Efsanevi zaten sahipli) — olduğu gibi bırak
    }

    var pufi = pickPufi(s, tier, zorlaEksik);
    var rarity = pufi.rarity; // = tier

    var isNew, kabukGained = 0, ormanUnlocked = false;
    if (s.owned[pufi.id]) {
      isNew = false;
      s.owned[pufi.id] += 1;
      kabukGained = (Yuvo.data.RARITIES[rarity] || {}).kabuk || 0;
      s.kabuk += kabukGained;
      s.copyStreak += 1;
    } else {
      isNew = true;
      s.owned[pufi.id] = 1;
      s.copyStreak = 0;
      if (Yuvo.engine.checkMilestones) Yuvo.engine.checkMilestones();
      if (Yuvo.engine.checkOrmanUnlock) ormanUnlocked = Yuvo.engine.checkOrmanUnlock();
    }

    // Sayaçlar — asla süreyle/paketle sıfırlanmaz, yalnız düşüşle
    var r = RANK[rarity];
    s.pityN = (r >= RANK.nadir) ? 0 : s.pityN + 1;
    s.pityD = (r >= RANK.destansi) ? 0 : s.pityD + 1;
    s.pityE = (r >= RANK.efsanevi) ? 0 : s.pityE + 1;

    // ---- Altın Folyo (§2.f) — tören katmanı: çekiliş matematiğinden tamamen bağımsız ----
    var G = ritualConst();
    s.goldenPity += 1;
    var golden = false;
    if (forceGoldenNext || rand() < G.GOLDEN_ORAN || s.goldenPity >= G.GOLDEN_HARD) {
      golden = true;
      s.goldenPity = 0;
      forceGoldenNext = false;
    }
    egg.golden = golden;

    // Folyo Ambalaj Defteri'ne işlenir (saf kozmetik; commit'i aşağıdaki save yapar)
    var seri = egg.seri || 'gunesbahcesi';
    var variant = egg.variant | 0;
    if (Yuvo.engine.registerFoil) Yuvo.engine.registerFoil(seri, variant, golden);

    // Oturum döngüsü: kapanış özeti + görev zinciri (bonus grantEgg kendi commit'ini yapar)
    if (!Array.isArray(s.bugunAcilanlar)) s.bugunAcilanlar = [];
    s.bugunAcilanlar.push(pufi.id);
    var gorevBonus = false;
    if (Yuvo.engine.gorevIlerle) gorevBonus = Yuvo.engine.gorevIlerle('ac') === true;

    Yuvo.engine.save();
    if (Yuvo.refresh) { try { Yuvo.refresh(); } catch (e) {} }

    var celebrationTier = (r >= RANK.efsanevi) ? 3 : (rarity === 'destansi') ? 2 : (rarity === 'nadir') ? 1 : 0;
    return {
      pufi:pufi, rarity:rarity, isNew:isNew, kabukGained:kabukGained, celebrationTier:celebrationTier,
      wrapper:{ seri:seri, variant:variant, golden:golden },  // tören görselleri buradan beslenir
      chocolate:1,                                            // her ambalajlı yumurtadan 1 çikolata
      ormanUnlocked:ormanUnlocked,                            // bu açılış Fısıltı Ormanı'nı açtıysa true
      gorevBonus:gorevBonus                                   // bu açılış görev zincirini tamamladıysa true
    };
  };

  // Test kancaları (motor kısmı)
  Yuvo.test = Yuvo.test || {};
  Yuvo.test.openEggRaw = function () { return Yuvo.engine.openEgg(); };
  Yuvo.test.forceGoldenNext = function () { forceGoldenNext = true; };
})();

/* == js/scenes/home.js == */
/* Yuvo — Sahne: Yuva ("Gün doğumu çayırı" + Balon Postanesi tezgâhı).
   Sahip: scenes-meta ajanı. Sözleşme: ARCHITECTURE.md + docs/v2/06 §2.a, §5.5.
   v2 revizyonu: yuva sepeti "Balon Postanesi tezgâhı"na dönüştü — state.todayEggs
   ambalajlı çizilir (wrapperSVG); İLK tap = eline al, 400ms BASILI TUT = salla
   (shakeRattle; tap fallback: eldeki "Salla!" butonu), eldeyken İKİNCİ tap =
   Yuvo.go('ceremony',{eggIdx}). Kumbara kavanozu tezgâh köşesinde (redeemChocolates).
   Çimen/gezinen Pufi/ilerleme şeridi/gün-sonu paneli mantığı AYNEN korunur.
   Görsel dil: BRAND.md §3 (sticker reçetesi) + §5 Yuva atmosferi. */
(function () {
  var Yuvo = window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  Yuvo.scenes = Yuvo.scenes || {};

  var el = null;        // sahne kök konteyneri
  var timers = [];
  var onState = null;
  var SEQ = 0;          // benzersiz SVG gradyan id sayacı (önek: ysh- ; yi-/yv- başkasının)

  // --- vitrin etkileşim durumu (mount'ta sıfırlanır) ---
  var heldIdx = null;       // eldeki yumurtanın todayEggs index'i (null = elde yok)
  var holdTimer = null;     // 400ms basılı-tut sayacı
  var suppressClick = false;// basılı-tut sonrası gelen click yutulur
  var dropNew = false;      // şölen/ek yumurta sonrası "vitrine düşme" animasyonu

  /* ---------- yardımcılar (savunmacı) ---------- */
  function st () { return (Yuvo.engine && Yuvo.engine.state) || {}; }
  function play (n, o) { try { if (Yuvo.audio && Yuvo.audio.play) Yuvo.audio.play(n, o); } catch (e) {} }
  function toast (t) { if (Yuvo.toast) Yuvo.toast(t); }
  function later (fn, ms) { var id = setTimeout(fn, ms); timers.push(id); return id; }
  function uid (n) { return 'ysh-' + n + '-' + (SEQ++); }

  // Yuvo.icons güvenli erişim (main.js ico() deseni): ikon yoksa emoji fallback
  function ico (name, fb) {
    try {
      if (Yuvo.icons && Yuvo.icons[name]) { var s = Yuvo.icons[name](); if (s) return s; }
    } catch (e) {}
    return '<span class="ico-fallback">' + fb + '</span>';
  }
  function ic (name, fb, cls) {
    return '<span class="ys-ico' + (cls ? ' ' + cls : '') + '" aria-hidden="true">' +
           ico(name, fb) + '</span>';
  }

  function ritual () {
    var r = (Yuvo.data && Yuvo.data.RITUAL) || {};
    return {
      ESIK: (typeof r.KUMBARA_ESIK === 'number') ? r.KUMBARA_ESIK : 15,
      GUNLUK: (typeof r.KUMBARA_GUNLUK === 'number') ? r.KUMBARA_GUNLUK : 1
    };
  }

  function defaultSeri () {
    try {
      if (Yuvo.engine && Yuvo.engine.activeSeries) { var a = Yuvo.engine.activeSeries(); if (a) return a; }
    } catch (e) {}
    var d = (Yuvo.data && Yuvo.data.WRAPPER_SERIES) || null;
    if (d) { for (var k in d) return k; }
    return 'gunesbahcesi';
  }

  // Vitrindeki ambalajlı yumurtalar; eski motor (todayEggs yok) → eggsAvailable'dan türet
  function eggsList () {
    var s = st();
    if (Array.isArray(s.todayEggs)) return s.todayEggs;
    var n = Math.max(0, s.eggsAvailable | 0), out = [];
    for (var i = 0; i < n; i++) out.push({ seri: defaultSeri(), variant: i % 8, golden: null });
    return out;
  }

  function ownedCount (biome) {
    if (Yuvo.engine && Yuvo.engine.ownedCount) { try { return Yuvo.engine.ownedCount(biome); } catch (e) {} }
    var s = st(), n = 0, owned = s.owned || {};
    for (var id in owned) {
      if (!owned[id]) continue;
      var p = Yuvo.data && Yuvo.data.pufiById && Yuvo.data.pufiById(id);
      if (p && p.rarity === 'gizli') continue;
      if (biome && p && (p.biome || 'cayir') !== biome) continue;
      n += 1;
    }
    return n;
  }

  // Ambalajlı yumurta sanatı (ambalaj nadirlik SIZDIRMAZ — torn:0, golden yok; §1.3)
  function wrapperArt (egg) {
    egg = egg || {};
    if (Yuvo.art && Yuvo.art.wrapperSVG) {
      try {
        var s = Yuvo.art.wrapperSVG(egg.seri || defaultSeri(), { torn:0, variant: egg.variant | 0 });
        if (s) return s;
      } catch (e) {}
    }
    if (Yuvo.art && Yuvo.art.eggSVG) {
      try { var s2 = Yuvo.art.eggSVG('yaygin', { crack:0 }); if (s2) return s2; } catch (e) {}
    }
    return '<span class="home-art-fallback">🥚</span>';
  }

  function pufiArt (p) {
    if (Yuvo.art && Yuvo.art.pufiSVG) {
      try { var s = Yuvo.art.pufiSVG(p, { mood:'happy' }); if (s) return s; } catch (e) {}
    }
    return '<span class="home-art-fallback">🐣</span>';
  }

  // Sahip olunan son 3-5 Pufi (ekleme sırasına göre sondakiler; aktif biyomdan)
  function lastOwnedPufis () {
    var s = st(), owned = s.owned || {}, biome = s.activeBiome === 'orman' ? 'orman' : 'cayir';
    var out = [];
    for (var id in owned) {
      if (!owned[id]) continue;
      var p = Yuvo.data && Yuvo.data.pufiById && Yuvo.data.pufiById(id);
      if (p && (p.biome || 'cayir') === biome) out.push(p);
    }
    return out.slice(-5);
  }

  /* ---------- dekor SVG'leri (düz dolgu; id yalnız gradyan/clip gerekince) ---------- */

  // 5 taç yapraklı düz dolgulu çiçek (manzara + çayır süsü ortak)
  function flowerAt (x, y, c, sc) {
    var out = '';
    for (var a = 0; a < 5; a++) {
      var ang = (a * 72 - 90) * Math.PI / 180;
      out += '<circle cx="' + (x + Math.cos(ang) * 6 * sc).toFixed(1) +
             '" cy="' + (y + Math.sin(ang) * 6 * sc).toFixed(1) +
             '" r="' + (4.2 * sc).toFixed(1) + '" fill="' + c + '"/>';
    }
    out += '<circle cx="' + x + '" cy="' + y + '" r="' + (3 * sc).toFixed(1) + '" fill="#F2A400"/>';
    return out;
  }

  // (BRAND §5 "ekranın tamamı kompozisyondur; boş bant yasak").
  function skyline () {
    var env = Yuvo.art && Yuvo.art.env;
    if (env) {
      try {
        var out = '';
        if (env.sky) out += '<div class="home-env home-env-sky">' + (env.sky() || '') + '</div>';
        if (env.clouds) out += '<div class="home-env home-env-clouds">' + (env.clouds() || '') + '</div>';
        if (env.meadow) out += '<div class="home-env home-env-meadow">' + (env.meadow() || '') + '</div>';
        if (out) return out;
      } catch (e) {}
    }
    // fallback'te güneşi CSS .home-sun çizer (env meadow güneşi yok)
    return landscapeSVG() + '<div class="home-sun"></div>';
  }

    if (h > 6) {
      balls = '<circle cx="26" cy="' + (top + 3) + '" r="5" fill="#8A5A2B"/>' +
