.fb-chip.ready small { color:var(--ink); font-weight:800; }
@keyframes fb-chip-glow {
  from { box-shadow:var(--halo-sm), 0 3px 0 #C98A00, 0 0 4px rgba(242,166,27,.4); }
  to   { box-shadow:var(--halo-sm), 0 3px 0 #C98A00, 0 0 18px rgba(242,166,27,.9); }
}

/* Izgara: 8 varyant yuvası + Altın Şeref Yuvası */
.fb-grid { position:relative; z-index:1;
  display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; max-width:100%; }
.fb-cell {
  position:relative; aspect-ratio:1 / 1; min-width:0; min-height:64px;
  border:2.5px solid var(--line); border-radius:var(--radius-sm);
  cursor:pointer; padding:4px;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF6E6 100%);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 3px 6px rgba(122,74,32,.16),
    inset 0 2px 0 rgba(255,255,255,.6);
  transition:transform .1s ease, box-shadow .1s ease;
}
.fb-cell:active { transform:translateY(2px);
  box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 1px 3px rgba(122,74,32,.14); }
.fb-cell svg { width:100%; height:100%; }
/* Eksik yuva: gofre çukuru + soluk desen silüeti */
.fb-cell.missing {
  background:linear-gradient(180deg, #F8EDD6 0%, #F2E3C6 100%);
  border-color:rgba(62,42,28,.45);
  box-shadow:0 0 0 3px rgba(255,255,255,.6),
    inset 0 4px 8px rgba(122,74,32,.22), inset 0 -2px 0 rgba(255,255,255,.5);
}
.fb-cell.missing svg { opacity:.3; filter:grayscale(.55); }
/* Altın Şeref Yuvası — Efsanevi altın dili (nefes alan ışıma) */
.fb-cell.gold { background:linear-gradient(180deg, #FFF8E4 0%, var(--r-efsanevi-soft, #FFF1D4) 100%);
  border-color:#F2A61B; }
.fb-cell.gold.owned {
  box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 3px 6px rgba(122,74,32,.16),
    0 0 14px rgba(242,166,27,.55), inset 0 2px 0 rgba(255,255,255,.6);
  animation:fb-gold-breathe 2.2s ease-in-out infinite alternate;
}
@keyframes fb-gold-breathe {
  from { box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 3px 6px rgba(122,74,32,.16),
    0 0 6px rgba(242,166,27,.35); }
  to   { box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 3px 6px rgba(122,74,32,.16),
    0 0 18px rgba(242,166,27,.8); }
}
.fb-cell.gold.missing svg { opacity:.85; filter:none; }
.fb-note { position:relative; z-index:1; margin:12px 4px 0; text-align:center;
  font-family:var(--font-body); font-weight:700; font-size:13.5px; color:var(--ink-soft); }
.fb-art-fallback { font-size:34px; line-height:1; }

/* Araç Rafı — ahşap raf kartı */
.fb-shelf {
  margin-top:14px; padding:12px 12px 14px;
  background:
    repeating-linear-gradient(90deg, rgba(122,74,32,.05) 0 3px, rgba(122,74,32,0) 3px 26px),
    linear-gradient(180deg, #FFE9C4 0%, #F7D9A6 100%);
  border:2.5px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--halo-sm), 0 5px 0 rgba(62,42,28,.14), 0 12px 20px rgba(122,74,32,.16);
}
.fb-shelf-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  margin:0 2px 10px; }
.fb-shelf-title { font-size:21px; color:var(--ink); }
.fb-shelf-sub { font-family:var(--font-body); font-weight:700; font-size:13.5px;
  color:var(--ink-soft); }
.fb-tools { display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; }
.fb-tool {
  position:relative; min-width:0; min-height:112px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border:2.5px solid var(--line); border-radius:var(--radius-sm);
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF3DF 100%);
  color:var(--ink); cursor:pointer; padding:8px 4px;
  box-shadow:0 3px 0 rgba(62,42,28,.16), 0 6px 10px rgba(122,74,32,.12),
    inset 0 2px 0 rgba(255,255,255,.7);
  transition:transform .1s ease, box-shadow .1s ease;
}
.fb-tool:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(62,42,28,.16); }
.fb-tool-art { display:block; width:58px; height:58px; }
.fb-tool-art svg { width:100%; height:100%; }
/* Kilitli araç: gofre + silüet + kilit rozeti */
.fb-tool.locked {
  background:linear-gradient(180deg, #F6E9CF 0%, #F0DFC0 100%);
  border-color:rgba(62,42,28,.45);
  box-shadow:inset 0 3px 6px rgba(122,74,32,.2), inset 0 -2px 0 rgba(255,255,255,.5);
}
.fb-tool-art.sil svg { filter:grayscale(1) brightness(.92); opacity:.45; }
.fb-tool-lock { position:absolute; top:6px; right:6px; width:22px; height:22px;
  pointer-events:none; }
.fb-tool-lock svg { width:100%; height:100%; }
/* Aktif araç: güneş vurgusu + onay rozeti */
.fb-tool.active {
  background:linear-gradient(180deg, #FFF3C9 0%, #FFE9A8 100%);
  box-shadow:var(--halo-sm), 0 3px 0 #C98A00, inset 0 2px 0 rgba(255,255,255,.6);
}
.fb-tool-check {
  position:absolute; top:-8px; right:-6px; width:26px; height:26px; z-index:2;
  display:flex; align-items:center; justify-content:center;
  background:#FFFFFF; border:2px solid var(--line); border-radius:50%;
  box-shadow:0 2px 0 rgba(62,42,28,.2); pointer-events:none;
}
.fb-tool-check svg { width:20px; height:20px; }
.fb-tool-check .ico-fallback { font-size:14px; color:var(--meadow-deep); }
.fb-tool-name { font-family:var(--font-display); font-weight:700; font-size:13.5px;
  text-align:center; line-height:1.15; }
.fb-tool-tag {
  display:inline-flex; align-items:center; white-space:nowrap; max-width:100%;
  overflow:hidden; text-overflow:ellipsis;
  background:var(--bg2); border:2px solid var(--line); border-radius:999px;
  padding:1px 8px; font-family:var(--font-body); font-weight:800; font-size:13.5px;
  color:var(--ink);
}
.fb-tool-tag.on { background:linear-gradient(180deg, #C9F2A0 0%, var(--meadow) 100%); }

/* Defter modal içeriği */
.fb-modal { display:flex; flex-direction:column; align-items:center; gap:8px;
  padding-top:8px; }
.fb-modal-art {
  width:150px; height:150px; border-radius:var(--radius);
  background-color:var(--paper); padding:10px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 4px rgba(255,255,255,.9), 0 6px 12px rgba(122,74,32,.18);
}
.fb-modal-art svg { width:100%; height:100%; }
.fb-modal-name { font-size:26px; text-align:center; }
.fb-modal-sub { font-size:15px; font-weight:800; color:var(--ink-soft);
  font-variant-numeric:tabular-nums; }
.fb-modal-txt { font-size:15px; color:var(--ink); font-style:italic; text-align:center;
  max-width:280px; }

/* --------- Hareket azaltma (v2 ekleri) -------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  .home-belt-dots, .home-balloon, .home-egg.held, .home-egg-art.shake, .home-egg.drop,
  .home-jar.ready svg, .fb-chip.ready, .fb-cell.gold.owned { animation:none; }
  .fb-progress-fill { transition:none; }
}

/* == css/story.css == */
/* =====================================================================
   YUVO — Hikâye katmanı stilleri: konuşma balonu (dlg-), FTUE (intro-),
   Luna günbatımı (dusk-). Marka dili: BRAND.md sticker reçetesi.
   ===================================================================== */

/* ---------- Konuşma balonu ---------- */
#dialog-root {
  position: absolute;
  left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  z-index: 60;
  pointer-events: none;
  padding: 0 12px;
}
#app.fullscreen #dialog-root { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.dlg-bubble {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 480px;
  margin: 0 auto;
  background: #FFFDF6;
  border: 2.5px solid #3E2A1C;
  border-radius: 20px;
  box-shadow: 0 4px 0 rgba(62, 42, 28, 0.28), 0 0 0 4px rgba(255, 255, 255, 0.85);
  padding: 10px 14px 10px 10px;
  cursor: pointer;
  animation: dlg-in 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  user-select: none;
  -webkit-user-select: none;
}
@keyframes dlg-in {
  from { transform: translateY(16px) scale(0.92); opacity: 0; }
  to   { transform: none; opacity: 1; }
}
.dlg-avatar {
  flex: 0 0 56px;
  width: 56px; height: 56px;
  border-radius: 14px;
  overflow: hidden;
  background: #FFF3D6;
  border: 2px solid #3E2A1C;
}
.dlg-avatar svg { width: 100%; height: 100%; display: block; }
.dlg-main { flex: 1; min-width: 0; }
.dlg-name {
  display: block;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 13px;
  color: #C75B2E;
  letter-spacing: 0.02em;
}
.dlg-text {
  display: block;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 600;
  font-size: 15.5px;
  line-height: 1.3;
  color: #3E2A1C;
}
.dlg-next {
  flex: 0 0 auto;
  font-size: 18px;
  color: #C75B2E;
  animation: dlg-nudge 0.9s ease-in-out infinite;
}
@keyframes dlg-nudge {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(4px); }
}

/* ---------- FTUE (intro) ---------- */
.intro-scene { position: absolute; inset: 0; overflow: hidden; }
.intro-stage {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.8s ease;
}
.intro-dark { background: radial-gradient(120% 90% at 50% 42%, #241B33 0%, #120D1D 70%); }
.intro-dusk { background: linear-gradient(180deg, #1B1533 0%, #3A2C57 55%, #6B4A6E 100%); }
.intro-dawn { background: linear-gradient(180deg, #4A3A6B 0%, #C97B7E 55%, #F2B879 100%); }

.intro-hills {
  position: absolute; left: -10%; right: -10%; bottom: 0; height: 34%;
  background:
    radial-gradient(60% 100% at 30% 100%, #262038 0%, #262038 68%, transparent 69%),
    radial-gradient(70% 110% at 78% 100%, #1D1830 0%, #1D1830 66%, transparent 67%);
  transition: filter 0.9s ease, opacity 0.9s ease;
}
.intro-hills.lit {
  background:
    radial-gradient(60% 100% at 30% 100%, #5E7C4A 0%, #5E7C4A 68%, transparent 69%),
    radial-gradient(70% 110% at 78% 100%, #4C6B3E 0%, #4C6B3E 66%, transparent 67%);
}

.intro-glow-egg {
  width: 148px; height: 148px;
  filter: drop-shadow(0 0 26px rgba(255, 223, 130, 0.55));
}
.intro-glow-egg svg { width: 100%; height: 100%; }
.intro-glow-egg.beat { animation: intro-beat 1.1s ease-in-out infinite; }
@keyframes intro-beat {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 18px rgba(255, 223, 130, 0.4)); }
  38% { transform: scale(1.05); filter: drop-shadow(0 0 32px rgba(255, 223, 130, 0.7)); }
  52% { transform: scale(1.02); }
}

.intro-star {
  position: relative;
  width: 128px; height: 128px;
  background: none; border: 0; padding: 0; cursor: pointer;
  animation: intro-fall 1.4s cubic-bezier(0.22, 0.9, 0.36, 1) both;
  -webkit-tap-highlight-color: transparent;
}
@keyframes intro-fall {
  from { transform: translateY(-58vh) rotate(-24deg); opacity: 0; }
  60%  { opacity: 1; }
  to   { transform: none; }
}
.intro-star-body { display: block; width: 90px; height: 90px; margin: 0 auto;
  filter: drop-shadow(0 0 18px rgba(255, 211, 77, 0.75));
  animation: intro-hover 2s ease-in-out 1.4s infinite; }
.intro-star-body svg { width: 100%; height: 100%; }
@keyframes intro-hover {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}
.intro-star-ring {
  position: absolute; left: 50%; top: 50%;
  width: 118px; height: 118px; margin: -59px 0 0 -59px;
  border: 3px solid rgba(255, 223, 130, 0.9);
  border-radius: 50%;
  animation: intro-ring 1.5s ease-out 1.5s infinite;
  opacity: 0;
}
@keyframes intro-ring {
  from { transform: scale(0.6); opacity: 0.95; }
  to   { transform: scale(1.35); opacity: 0; }
}
.intro-star.caught { animation: intro-caught 0.8s ease both; pointer-events: none; }
@keyframes intro-caught {
  30% { transform: scale(1.25); }
  100% { transform: translateY(26vh) scale(0.55); opacity: 0.0; }
}

.intro-hint {
  position: absolute; top: 16%; left: 0; right: 0;
  text-align: center;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800; font-size: 20px;
  color: #FFF6E3;
  text-shadow: 0 2px 0 rgba(62, 42, 28, 0.45);
  padding: 0 24px;
}
.intro-egg {
  position: relative;
  width: 200px; height: 210px;
  background: none; border: 0; padding: 0; cursor: pointer;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
.intro-egg-art { display: block; width: 100%; height: 100%; }
.intro-egg-art svg { width: 100%; height: 100%; }
.intro-egg.shiver .intro-egg-art { animation: intro-shiver 0.5s ease-in-out infinite; }
@keyframes intro-shiver {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-2.4deg); }
  75% { transform: rotate(2.4deg); }
}
.intro-egg-warm {
  position: absolute; inset: -14%;
  border-radius: 50%;
  background: radial-gradient(50% 50% at 50% 52%, rgba(255, 214, 110, 0.0) 0%, transparent 70%);
  transition: background 0.45s ease;
  pointer-events: none;
}
.intro-egg.warm-1 .intro-egg-warm { background: radial-gradient(50% 50% at 50% 52%, rgba(255, 214, 110, 0.3) 0%, transparent 70%); }
.intro-egg.warm-2 .intro-egg-warm { background: radial-gradient(52% 52% at 50% 52%, rgba(255, 214, 110, 0.55) 0%, transparent 72%); }
.intro-egg.warm-3 .intro-egg-warm { background: radial-gradient(56% 56% at 50% 52%, rgba(255, 226, 140, 0.85) 0%, transparent 74%); }
.intro-egg.pulse .intro-egg-art { animation: intro-pulse 0.4s ease; }
@keyframes intro-pulse {
  40% { transform: scale(1.07); }
}
.intro-hand {
  position: absolute; bottom: 18%; left: 50%;
  font-size: 34px;
  animation: intro-rub 1.6s ease-in-out infinite;
  pointer-events: none;
  filter: drop-shadow(0 2px 0 rgba(62, 42, 28, 0.4));
}
@keyframes intro-rub {
  0%, 100% { transform: translateX(-46px) rotate(-8deg); }
  50% { transform: translateX(14px) rotate(8deg); }
}

/* ---------- Luna günbatımı örtüsü ---------- */
.dusk-layer {
  position: absolute; inset: 0;
  z-index: 55;
  opacity: 0;
  transition: opacity 0.65s ease;
  pointer-events: none;
}
.dusk-layer.on { opacity: 1; }
.dusk-sky {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(27, 21, 51, 0.94) 0%, rgba(74, 58, 107, 0.88) 60%, rgba(201, 123, 126, 0.8) 100%);
}
.dusk-star {
  position: absolute;
  color: #FFE9A8;
  font-size: 15px;
  animation: dusk-twinkle 1.8s ease-in-out infinite;
  text-shadow: 0 0 8px rgba(255, 233, 168, 0.8);
}
@keyframes dusk-twinkle {
  0%, 100% { opacity: 0.35; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.15); }
}
.dusk-luna {
  position: absolute;
  right: 8%; top: 12%;
  width: 96px; height: 96px;
  border-radius: 22px;
  overflow: hidden;
  border: 2.5px solid #3E2A1C;
  background: #2A2244;
  box-shadow: 0 0 24px rgba(142, 124, 195, 0.55);
  animation: dusk-float 3.2s ease-in-out infinite;
}
.dusk-luna svg { width: 100%; height: 100%; }
@keyframes dusk-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

/* ---------- Yuva kenar düğmeleri (Ebeveyn / biyom kapısı / Şako) ----------
   Akış içinde, ilerleme şeridinin hemen altında sağa yaslı yatay sıra —
   yumurta vitriniyle ÇAKIŞMAZ (absolute yerleşim vitrini örtüyordu). */
.home-side {
  position: relative;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin: 4px 12px 0;
  z-index: 6;
}
.home-side-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 999px;
  border: 2px solid rgba(62, 42, 28, 0.35);
  background: rgba(255, 253, 246, 0.85);
  box-shadow: 0 2px 0 rgba(62, 42, 28, 0.18);
  cursor: pointer;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.home-side-btn span { font-size: 16px; line-height: 1; }
.home-side-btn small {
  font-size: 11px;
  font-weight: 800;
  color: #6B7280;
  letter-spacing: 0.01em;
}
.home-parent-btn { filter: grayscale(0.55); opacity: 0.88; }
.home-sako-btn.alert { border-color: #C75B2E; animation: sako-wob 1.6s ease-in-out infinite; }
@keyframes sako-wob {
  0%, 100% { transform: rotate(0); }
  30% { transform: rotate(-3deg); }
  60% { transform: rotate(3deg); }
}

/* ---------- Kiler sürpriz çipi ---------- */
.home-kiler {
  position: absolute;
  left: 10px; bottom: 6px;
  z-index: 5;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 13px;
  border-radius: 16px;
  border: 2.5px solid #3E2A1C;
  background: linear-gradient(180deg, #FFE9A8, #FFD34D);
  box-shadow: 0 3px 0 rgba(62, 42, 28, 0.3);
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 13.5px;
  color: #3E2A1C;
  cursor: pointer;
  animation: kiler-pop 2s ease-in-out infinite;
  -webkit-tap-highlight-color: transparent;
}
@keyframes kiler-pop {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* ---------- Fısıltı Ormanı görünümü (yuva teni) ---------- */
.home-scene.orman .home-sky { filter: hue-rotate(58deg) saturate(0.82) brightness(0.9); }
.home-scene.orman .home-meadow { filter: hue-rotate(24deg) saturate(0.9) brightness(0.92); }
.home-scene.orman .home-grass { filter: hue-rotate(24deg) brightness(0.9); }

/* ---------- Albüm: biyom sekmeleri + Şako izi ---------- */
.alb-biomes {
  display: flex;
  gap: 8px;
  margin: 2px 0 10px;
}
.alb-biome-tab {
  flex: 1;
  padding: 9px 10px;
  border-radius: 14px;
  border: 2.5px solid #3E2A1C;
  background: #FFFDF6;
  box-shadow: 0 3px 0 rgba(62, 42, 28, 0.22);
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 14px;
  color: #3E2A1C;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.alb-biome-tab.active {
  background: linear-gradient(180deg, #FFE9A8, #FFD34D);
  transform: translateY(2px);
  box-shadow: 0 1px 0 rgba(62, 42, 28, 0.22);
}
.alb-biome-tab.locked {
  opacity: 0.55;
  background: #EEF0F4;
  border-style: dashed;
}
.alb-cell.sako-izi { position: relative; background: rgba(142, 124, 195, 0.14); }
.alb-cell.sako-izi .alb-feather {
  position: absolute;
  right: 3px; top: 2px;
  font-size: 15px;
  transform: rotate(18deg);
  animation: sako-wob 1.8s ease-in-out infinite;
}

/* =====================================================================
   REVEAL SAHNELEMESİ (araştırma: unboxing duraklaması + ipucu merdiveni)
   ===================================================================== */

/* "Ne çıkacak?" anı: POP'tan önce 420ms — vinyet + hafif zoom + tam sessizlik */
.rit-stage.hush::after {
  content: '';
  position: absolute; inset: 0;
  z-index: 3;
  pointer-events: none;
  background: radial-gradient(circle at 50% 46%,
    transparent 26%, rgba(30, 18, 10, 0.28) 62%, rgba(30, 18, 10, 0.5) 100%);
  animation: hush-in 0.42s ease forwards;
}
.rit-stage.hush .cere-egg-wrap {
  animation: hush-zoom 0.42s ease forwards;
}
@keyframes hush-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes hush-zoom {
  from { transform: scale(1); }
  to   { transform: scale(1.07); }
}

/* Nadirlik SPLASH'i — renk + simge + büyük yazı (okuma bilmeyene simge/renk yeter) */
.rit-rarity-splash {
  position: absolute;
  left: 50%; top: 20%;
  transform: translateX(-50%);
  z-index: 7;
  pointer-events: none;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 30px;
  letter-spacing: 0.03em;
  color: var(--rc, #4FB8D8);
  background: #FFFDF6;
  border: 3px solid var(--rc, #4FB8D8);
  border-radius: 999px;
  padding: 8px 26px;
  box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.9), 0 6px 0 rgba(62, 42, 28, 0.22),
    0 0 28px var(--rc, #4FB8D8);
  animation: splash-pop 2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  white-space: nowrap;
}
.rit-rarity-splash.t3 { font-size: 34px; }
@keyframes splash-pop {
  0%   { transform: translateX(-50%) scale(0.2) rotate(-8deg); opacity: 0; }
  14%  { transform: translateX(-50%) scale(1.18) rotate(2deg); opacity: 1; }
  22%  { transform: translateX(-50%) scale(1) rotate(0deg); }
  82%  { transform: translateX(-50%) scale(1); opacity: 1; }
  100% { transform: translateX(-50%) scale(0.92) translateY(-14px); opacity: 0; }
}

/* Sonuç kartı cilası: flip girişi + arkada dönen güneş huzmesi + seri numarası */
.cere-card {
  position: relative;
  overflow: hidden;
  animation: card-flip-in 0.55s cubic-bezier(0.34, 1.4, 0.64, 1) both !important;
}
@keyframes card-flip-in {
  0%   { transform: perspective(700px) rotateY(88deg) scale(0.9); opacity: 0; }
  55%  { transform: perspective(700px) rotateY(-8deg) scale(1.02); opacity: 1; }
  100% { transform: none; opacity: 1; }
}
.cere-card-rays {
  position: absolute;
  left: 50%; top: 86px;
  width: 430px; height: 430px;
  margin: -215px 0 0 -215px;
  border-radius: 50%;
  pointer-events: none;
  background: repeating-conic-gradient(rgba(255, 199, 52, 0.2) 0deg 11deg,
    rgba(255, 199, 52, 0) 11deg 30deg);
  animation: card-rays-spin 16s linear infinite;
}
@keyframes card-rays-spin { to { transform: rotate(360deg); } }
.cere-card > *:not(.cere-card-rays) { position: relative; z-index: 1; }
.cere-serino {
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: #8A6B4F;
  margin-top: -4px;
}

/* Salla = olabilirlik karuseli: eldeki yumurtanın üstünde 3 eksik-dost silüeti */
.home-shake-hints {
  position: absolute;
  left: 50%; top: -66px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  pointer-events: none;
  z-index: 9;
}
.home-shake-hints .hint-p {
  width: 52px; height: 52px;
  background: #FFFDF6;
  border: 2.5px solid #3E2A1C;
  border-radius: 50%;
  padding: 4px;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85), 0 3px 0 rgba(62, 42, 28, 0.22);
  animation: hint-pop 1.9s ease both;
  animation-delay: var(--d, 0s);
  opacity: 0;
}
.home-shake-hints .hint-p svg { width: 100%; height: 100%; opacity: 0.55; }
.home-shake-hints .hint-q {
  font-family: 'Baloo 2', system-ui, sans-serif;
  font-weight: 800;
  font-size: 26px;
  color: #FFFDF6;
  text-shadow: 0 2px 0 rgba(62, 42, 28, 0.5);
  animation: hint-pop 1.9s ease 0.66s both;
  opacity: 0;
}
@keyframes hint-pop {
  0%   { transform: translateY(8px) scale(0.4); opacity: 0; }
  16%  { transform: translateY(-4px) scale(1.1); opacity: 1; }
  26%  { transform: none; opacity: 1; }
  80%  { transform: none; opacity: 1; }
  100% { transform: translateY(-8px) scale(0.8); opacity: 0; }
}

/* ---------- Albüm: oyuncak sandığı + yaklaşma vurgusu ---------- */
.alb-cell.cell-jump {
  animation: cell-jump 0.6s cubic-bezier(0.3, 1.6, 0.5, 1);
}
@keyframes cell-jump {
  0%   { transform: translateY(0) scale(1); }
  30%  { transform: translateY(-8px) scale(1.08); }
  60%  { transform: translateY(0) scale(0.96); }
  100% { transform: none; }
}
.alb-progress-bar.yakin .alb-progress-fill {
  animation: bar-glow 1.1s ease-in-out infinite alternate;
}
@keyframes bar-glow {
  from { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5); }
  to   { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), 0 0 14px rgba(255, 124, 51, 0.9); }
}
.alb-yakin {
  position: relative; z-index: 1;
  text-align: center;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 16px;
  color: #E85C1E;
  margin: -4px 0 10px;
  animation: yakin-bob 1.4s ease-in-out infinite;
}
@keyframes yakin-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.alb-gold-teaser {
  position: relative; z-index: 1;
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  margin: 0 0 12px;
  padding: 9px 14px;
  border: 2.5px dashed rgba(201, 138, 0, 0.75);
  border-radius: 16px;
  background: linear-gradient(180deg, #FFF8E4, #FFF1CE);
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 700;
  font-size: 13.5px;
  color: #8A6B4F;
  text-align: left;
  cursor: pointer;
}
.alb-gold-teaser b { color: #C98A00; }
.alb-gold-teaser .agt-ico { font-size: 22px; }
.alb-gold-teaser.ready {
  border-style: solid;
  border-color: #F2A61B;
  animation: glow 1.6s ease-in-out infinite alternate;
}
.alb-hedef-btn { width: 100%; }

/* ---------- Şako Saklambaç sahnesi ---------- */
.sk-scene { position: absolute; inset: 0; }
.sk-stage {
  position: absolute; inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 14px calc(20px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(180deg, #24322A 0%, #35493A 55%, #4C6B3E 100%);
  overflow: hidden;
}
.sk-back {
  position: absolute; left: 12px; top: 12px;
  padding: 8px 14px;
  border-radius: 14px;
  border: 2.5px solid #3E2A1C;
  background: #FFFDF6;
  box-shadow: 0 3px 0 rgba(62, 42, 28, 0.3);
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 14px;
  color: #3E2A1C;
  cursor: pointer;
}
.sk-sako {
  width: 92px; height: 92px;
  margin-top: 26px;
  border-radius: 22px;
  overflow: hidden;
  border: 2.5px solid #3E2A1C;
  background: #2C3B31;
  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
}
.sk-sako svg { width: 100%; height: 100%; }
.sk-line {
  margin: 12px 8px 2px;
  text-align: center;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 17px;
  color: #FFF6E3;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
}
.sk-note {
  margin: 2px 10px;
  text-align: center;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 700;
  font-size: 13.5px;
  color: #FFE9A8;
}
.sk-bushes {
  display: flex;
  gap: 6px;
  align-items: flex-end;
  justify-content: center;
  margin-top: auto;
  margin-bottom: auto;
  width: 100%;
  max-width: 430px;
}
.sk-bush {
  position: relative;
  flex: 1;
  background: none; border: 0; padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.sk-bush svg { width: 100%; height: auto; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.22)); }
.sk-bush:not([disabled]):active { transform: translateY(3px); }
.sk-bushes.mixing .sk-bush:nth-child(1) { animation: sk-mix1 0.6s ease-in-out 2; }
.sk-bushes.mixing .sk-bush:nth-child(2) { animation: sk-mix2 0.6s ease-in-out 2; }
.sk-bushes.mixing .sk-bush:nth-child(3) { animation: sk-mix3 0.6s ease-in-out 2; }
@keyframes sk-mix1 { 50% { transform: translateX(105%) translateY(-8px); } }
@keyframes sk-mix2 { 50% { transform: translateX(-105%) translateY(6px); } }
@keyframes sk-mix3 { 50% { transform: translateX(-40%) translateY(-12px) rotate(6deg); } }
.sk-spark {
  position: absolute;
  left: 50%; top: -34px;
  width: 52px; height: 52px;
  margin-left: -26px;
  animation: sk-spark 0.9s ease-in-out infinite;
  z-index: 2;
}
.sk-spark svg { width: 100%; height: 100%; filter: drop-shadow(0 0 12px rgba(255, 211, 77, 0.8)); }
@keyframes sk-spark {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-7px) scale(1.08); }
}
.sk-hint {
  margin: 4px 0 14px;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 15px;
  color: #FFF6E3;
}
.sk-actions {
  display: flex;
  gap: 10px;
  margin: 6px 0 12px;
}

/* ======================================================================
   P3 — Oturum döngüsü: görev çipleri, hedef çipi, kuluçka, kapanış ritüeli
   (araştırma: randevu = ekranda DURAN kanca; geri sayım/baskı dili YOK)
   ====================================================================== */

/* Günlük görev zinciri çipleri (ilerleme şeridinin hemen altında) */
.home-gorev {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 6px 14px 0;
  width: fit-content;
  padding: 5px 10px;
  background: rgba(255, 251, 240, 0.92);
  border: 2.5px solid #3E2A1C;
  border-radius: 999px;
  box-shadow: 0 3px 0 rgba(62, 42, 28, 0.2);
}
.gorev-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border: 2px solid #E5D5BC;
  border-radius: 999px;
  background: #FFF;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 13px;
  color: #7A6A54;
  cursor: pointer;
}
button.gorev-chip { -webkit-tap-highlight-color: transparent; }
.gorev-chip b { font-size: 12px; }
.gorev-chip.ok {
  border-color: #55B944;
  background: #EAF9E2;
  color: #2E7D22;
}
.gorev-odul {
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 13px;
  color: #B08A4F;
}
.gorev-odul.ok { color: #2E7D22; }
.home-gorev.done { border-color: #55B944; }

/* Hedef çipi — "Arıyorum: <dost>" (çocuğun kendi hedefi; fiyat dili yok) */
.home-hedef {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 6px 14px 0;
  width: fit-content;
  padding: 6px 12px;
  background: rgba(255, 244, 214, 0.95);
  border: 2.5px solid #F2A400;
  border-radius: 999px;
  box-shadow: 0 3px 0 rgba(62, 42, 28, 0.2);
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 13.5px;
  color: #6E4520;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.home-hedef .hedef-sil { width: 26px; height: 26px; display: inline-flex; }
.home-hedef .hedef-sil svg { width: 100%; height: 100%; }
.home-hedef.found {
  border-color: #55B944;
  background: #EAF9E2;
  color: #2E7D22;
  animation: hedef-found-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.home-hedef .hedef-star { animation: hedef-star-spin 1.4s ease-in-out infinite; }
@keyframes hedef-found-pop {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes hedef-star-spin {
  0%, 100% { transform: rotate(-12deg) scale(1); }
  50% { transform: rotate(12deg) scale(1.2); }
}

/* Kuluçka yumurtası — vitrinde "Hazır!" rozeti + sıcak ışıma */
.home-egg { position: relative; }  /* rozet + salla ipuçları bu kapsayıcıya demirler */
.home-egg.kulucka .home-egg-art {
  filter: drop-shadow(0 0 10px rgba(255, 199, 52, 0.85));
  animation: kulucka-glow 1.6s ease-in-out infinite;
}
@keyframes kulucka-glow {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.home-egg-badge {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  padding: 2px 8px;
  background: #FFC734;
  border: 2px solid #3E2A1C;
  border-radius: 999px;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 11px;
  color: #3E2A1C;
  white-space: nowrap;
  animation: badge-bob 1.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes badge-bob {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-3px); }
}

/* Şako gece uçuşu — tam ekran gece katmanı (2.3 sn, dekor) */
.home-sako-flyby {
  position: fixed;
  inset: 0;
  z-index: 240;
  background: linear-gradient(180deg, #141B38 0%, #23305C 55%, #37457B 100%);
  overflow: hidden;
  animation: flyby-fade 2.3s ease-in-out both;
  pointer-events: none;
}
@keyframes flyby-fade {
  0% { opacity: 0; }
  12%, 86% { opacity: 1; }
  100% { opacity: 0; }
}
.home-sako-flyby .flyby-kus {
  position: absolute;
  top: 26%;
  left: -140px;
  width: 120px;
  height: 70px;
  animation: flyby-kus 2.1s ease-in-out 0.1s both;
}
.home-sako-flyby .flyby-kus svg { width: 100%; height: 100%; }
@keyframes flyby-kus {
  0% { transform: translateX(0) translateY(0); }
  45% { transform: translateX(58vw) translateY(26px); }
  100% { transform: translateX(120vw) translateY(-10px); }
}
.home-sako-flyby .flyby-egg {
  position: absolute;
  top: 30%;
  left: 50%;
  font-size: 40px;
  transform: translateX(-50%);
  animation: flyby-egg 1.5s cubic-bezier(0.3, 0, 0.6, 1) 0.75s both;
}
.home-sako-flyby .flyby-egg i {
  position: absolute;
  right: -12px;
  top: -8px;
  font-size: 20px;
  font-style: normal;
}
@keyframes flyby-egg {
  0% { transform: translateX(-50%) translateY(-30px) scale(0.5); opacity: 0; }
  35% { opacity: 1; }
  100% { transform: translateX(-50%) translateY(34vh) scale(1); opacity: 1; }
}
.home-sako-flyby .flyby-metin {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 18%;
  margin: 0;
  text-align: center;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 17px;
  color: #FFF6E3;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
  animation: flyby-metin 2.3s ease-in-out both;
}
@keyframes flyby-metin {
  0%, 30% { opacity: 0; transform: translateY(8px); }
  55%, 88% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; }
}

/* Kapanış ritüeli — gün sonu paneli ekleri */
.dayend-baslik {
  display: block;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 12.5px;
  letter-spacing: 0.4px;
  color: #7A6A54;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.dayend-dostlar {
  margin: 2px 0 8px;
  text-align: center;
}
.dayend-dost-row {
  display: inline-flex;
  gap: 6px;
  justify-content: center;
}
.dayend-dost {
  width: 44px;
  height: 44px;
  display: inline-flex;
  background: rgba(255, 251, 240, 0.9);
  border: 2.5px solid #3E2A1C;
  border-radius: 50%;
  padding: 4px;
  animation: dost-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  animation-delay: var(--d, 0s);
}
.dayend-dost svg { width: 100%; height: 100%; }
@keyframes dost-pop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}
.dayend-yarin {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 4px 0 8px;
  padding: 7px 12px;
  background: rgba(40, 53, 107, 0.1);
  border: 2px dashed #28356B;
  border-radius: 14px;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 700;
  font-size: 13.5px;
  color: #28356B;
}
.dayend-yarin-egg {
  width: 30px;
  height: 38px;
  display: inline-flex;
  filter: grayscale(0.55) brightness(0.75) opacity(0.85); /* silüet vaadi — içerik sızmaz */
  animation: badge-bob 2s ease-in-out infinite;
}
.dayend-yarin-egg svg { width: 100%; height: 100%; }
.dayend-takvim {
  margin: 2px 0 10px;
  text-align: center;
}
.takvim-stars { display: inline-flex; gap: 4px; }
.takvim-star {
  font-style: normal;
  font-size: 19px;
  color: rgba(62, 42, 28, 0.22);
  -webkit-text-stroke: 1px rgba(62, 42, 28, 0.3);
}
.takvim-star.on { color: #FFC734; -webkit-text-stroke: 1px #3E2A1C; }
.takvim-star.today {
  color: #FFE9A8;
  -webkit-text-stroke: 1px #B08A4F;
  animation: takvim-today 1.2s ease-in-out infinite;
}
@keyframes takvim-today {
  0%, 100% { transform: scale(1); opacity: 0.75; }
  50% { transform: scale(1.25); opacity: 1; }
}
.dayend-takvim small {
  display: block;
  margin-top: 2px;
  font-family: 'Nunito', system-ui, sans-serif;
  font-weight: 700;
  font-size: 12px;
  color: #7A6A54;
}

/* ======================================================================
   P4 — İlk 60 saniye & yuva canlılığı & sahne geçişi
   ====================================================================== */

/* Yumuşak sahne girişi: mount senkron, yalnız görsel giriş 180ms */
#scene-root.scene-fade > * { animation: scene-fade-in 0.18s ease-out; }
@keyframes scene-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Intro: yıldız serpintili gök */
.intro-starfield { position: absolute; inset: 0; pointer-events: none; }
.if-star {
  position: absolute;
  color: #FFE9A8;
  opacity: 0.5;
  animation: if-twinkle 2.2s ease-in-out infinite;
}
@keyframes if-twinkle {
  0%, 100% { opacity: 0.25; transform: scale(0.85); }
  50% { opacity: 0.95; transform: scale(1.15); }
}

/* Intro: kuyruklu yıldız izi (düşüş sırasında görünür, sonra söner) */
.intro-star-tail {
  position: absolute;
  left: 50%; top: -6px;
  width: 10px; height: 64vh;
  margin-left: -5px;
  transform-origin: top center;
  transform: rotate(24deg);
  background: linear-gradient(180deg, rgba(255, 223, 130, 0) 0%,
    rgba(255, 223, 130, 0.55) 70%, rgba(255, 223, 130, 0.9) 100%);
  border-radius: 999px;
  filter: blur(2px);
  animation: tail-fade 1.7s ease-out both;
  pointer-events: none;
}
@keyframes tail-fade {
  0% { opacity: 1; }
  75% { opacity: 0.8; }
  100% { opacity: 0; }
}

/* Yuva çağrısı: periyodik hop + parıltı */
.home-egg-art.hop { animation: egg-hop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes egg-hop {
  0%, 100% { transform: translateY(0); }
  40% { transform: translateY(-14px) rotate(-3deg); }
  70% { transform: translateY(0) scale(1.04, 0.94); }
}
.home-egg-spark {
  position: absolute;
  top: -6px; right: -4px;
  font-size: 17px;
  animation: spark-float 0.95s ease-out both;
  pointer-events: none;
}
@keyframes spark-float {
  0% { opacity: 0; transform: translateY(6px) scale(0.6); }
  30% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-16px) scale(1.15) rotate(24deg); }
}

/* İlk oturum el ipucu: yumurtaların üstünde dokunuş jesti */
.home-hand {
  position: absolute;
  bottom: -34px;
  left: 50%;
  font-size: 32px;
  z-index: 4;
  animation: hand-tap 1.5s ease-in-out infinite;
  pointer-events: none;
  filter: drop-shadow(0 2px 0 rgba(62, 42, 28, 0.4));
}
@keyframes hand-tap {
  0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.95; }
  45% { transform: translateX(-50%) translateY(-16px) scale(0.94); }
  60% { transform: translateX(-50%) translateY(-4px); }
}

/* Gezinen Pufi selam balonu */
.home-roamer { overflow: visible; }
.roamer-bubble {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 10px;
  background: #FFFBF0;
  border: 2.5px solid #3E2A1C;
  border-radius: 12px;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 12.5px;
  color: #3E2A1C;
  white-space: nowrap;
  box-shadow: 0 3px 0 rgba(62, 42, 28, 0.2);
  animation: bubble-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  pointer-events: none;
  z-index: 5;
}
.roamer-bubble::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  margin-left: -5px;
  border: 5px solid transparent;
  border-top-color: #3E2A1C;
}
@keyframes bubble-pop {
  0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
  100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

/* ======================================================================
   P5 — Ebeveyn paneli güven kancaları + kargo balonu
   ====================================================================== */

/* Güven şeridi — panelin ilk cümlesi 4 ilke */
.par-trust {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0 0 12px;
}
.par-trust span {
  padding: 5px 10px;
  background: #EFF6EE;
  border: 1.5px solid #BFDCC0;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  color: #2E5C33;
}

/* Üst şerit dilek rozeti */
.par-strip-wish {
  margin-top: 6px;
  padding: 4px 10px;
  background: #FFF4D6;
  border: 1.5px solid #E8C56B;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  color: #6E4520;
  cursor: pointer;
  width: fit-content;
}

/* Dilek Kartı+ */
.par-wish-eta {
  display: block;
  font-size: 11.5px;
  color: #6B7280;
  margin-top: 2px;
}
.par-wish-chip {
  display: inline-block;
  padding: 1px 7px;
  background: #FDE7EF;
  border: 1px solid #F2B8CD;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  color: #9D3B63;
  vertical-align: 1px;
}
.par-wish-chip.par-chip-mute {
  background: #F3F4F6;
  border-color: #D1D5DB;
  color: #6B7280;
}
.par-wish-acts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: flex-end;
  max-width: 46%;
}
.par-wish-act { font-size: 11.5px; padding: 4px 8px; }
.par-wish-row.is-later { opacity: 0.62; }

/* Hoş Geldin Sepeti — geri sayımsız tek seferlik karşılama */
.par-welcome {
  border: 2px solid #E8C56B;
  background: linear-gradient(180deg, #FFFDF5 0%, #FFF6DF 100%);
}
.par-welcome-price {
  font-size: 22px;
  font-weight: 800;
  color: #6E4520;
  margin: 4px 0 2px;
}

/* Yayılım önizlemesi satırı */
.par-buy-yayilim {
  margin: 6px 0;
  padding: 8px 10px;
  background: #EFF6FE;
  border: 1.5px solid #BBD7F2;
  border-radius: 10px;
  font-size: 12.5px;
  color: #29517A;
}

/* Kargo balonu teslimatı (home) */
.home-kargo {
  position: absolute;
  inset: 0;
  z-index: 30;
  pointer-events: none;
}
.home-kargo .kargo-balon {
  position: absolute;
  left: 50%;
  top: -120px;
  width: 84px;
  height: 118px;
  margin-left: -42px;
  animation: kargo-in 1.6s cubic-bezier(0.3, 0, 0.45, 1) both;
}
.home-kargo .kargo-balon svg { width: 100%; height: 100%; }
@keyframes kargo-in {
  0% { transform: translateY(0) rotate(-4deg); }
  60% { transform: translateY(46vh) rotate(3deg); }
  100% { transform: translateY(52vh) rotate(0deg); opacity: 0.15; }
}
.home-kargo .kargo-egg {
  position: absolute;
  left: 50%;
  top: -34px;
  font-size: 26px;
  margin-left: -13px;
  animation: kargo-egg 1.6s cubic-bezier(0.3, 0, 0.45, 1) both;
}
@keyframes kargo-egg {
  0% { transform: translateY(0); opacity: 0; }
  25% { opacity: 1; }
  60% { transform: translateY(48vh); }
  100% { transform: translateY(56vh) scale(0.85); opacity: 0; }
}

/* ======================================================================
   P6 — Çıt Çıt Köşesi (ödülsüz ASMR kabuk çıtlatma)
   ====================================================================== */
.mg-citcit-btn {
  margin-top: 8px;
  padding: 6px 14px;
  background: #FFF4D6;
  border: 2.5px solid #3E2A1C;
  border-radius: 999px;
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 13.5px;
  color: #6E4520;
  cursor: pointer;
  box-shadow: 0 3px 0 rgba(62, 42, 28, 0.25);
  -webkit-tap-highlight-color: transparent;
}
.mg-citcit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 18px 0 30px;
}
.mg-cc-egg {
  width: 190px;
  height: 220px;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  filter: drop-shadow(0 6px 6px rgba(74, 59, 42, 0.3));
  -webkit-tap-highlight-color: transparent;
}
.mg-cc-egg svg { width: 100%; height: 100%; }
.mg-cc-egg:active { transform: translateY(3px) scale(0.98); }
.mg-cc-egg.c1 svg, .mg-cc-egg.c2 svg { animation: cc-jolt 0.22s ease; }
.mg-cc-egg.c3 svg {
  animation: cc-jolt 0.22s ease;
  filter: drop-shadow(0 0 18px rgba(255, 226, 140, 0.9));
}
@keyframes cc-jolt {
  30% { transform: rotate(-3deg) scale(1.04); }
  70% { transform: rotate(2.4deg); }
}
.mg-cc-hint {
  font-family: 'Baloo 2', 'Nunito', system-ui, sans-serif;
  font-weight: 800;
  font-size: 15px;
  color: #7A6A54;
  margin: 0;
}

/* Dilek Kartı+ eylemleri: metin değil, dokunulabilir mini haplar */
.par-wish-acts .par-btn {
  padding: 4px 10px;
  font-size: 12px;
  line-height: 1.2;
  border: 1.5px solid #D1D5DB;
  border-radius: 999px;
  background: #FFFFFF;
}
.par-wish-acts .par-wish-rm { border-color: #F2B8B8; color: #9D3B3B; }

/* == css/parent.css == */
/* Yuvo — Ebeveyn Paneli stilleri (parent.css)
 * Çocuk arayüzünden kesin ayrık: Nunito, düz kartlar, tek vurgu rengi,
 * sticker gölge / kalın kontur / vinil gradyan YOK.
 * Tüm sınıflar 'par-' önekli. Mobil öncelikli (390px).
 */

/* ---------- Belirteçler ---------- */
:root {
  --par-bg: #F5F6F8;
  --par-card: #FFFFFF;
  --par-text: #1F2937;
  --par-muted: #6B7280;
  --par-line: #E5E7EB;
  --par-accent: #2563EB;
  --par-warn: #B45309;
  --par-err: #B91C1C;
  --par-ok: #047857;
  --par-radius: 12px;
  --par-shadow: 0 1px 2px rgba(16, 24, 40, .06);
  --par-font: 'Nunito', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
}

/* Panel tam ekran: mount'ta #app.fullscreen eklenir */
#app.fullscreen {
  position: fixed;
  inset: 0;
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 0;
  border-radius: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--par-bg);
  z-index: 50;
}

/* ---------- Kök ---------- */
.par-root {
  font-family: var(--par-font);
  font-weight: 600;
  color: var(--par-text);
  background: var(--par-bg);
  min-height: 100%;
  line-height: 1.5;
  text-align: left;
  -webkit-font-smoothing: antialiased;
  box-sizing: border-box;
}

.par-root *,
.par-root *::before,
.par-root *::after { box-sizing: border-box; }

.par-root h1,
.par-root h2,
.par-root h3 {
  font-family: var(--par-font);
  font-weight: 700;
  margin: 0;
  letter-spacing: -.01em;
}

.par-root p { margin: 0; }

.par-num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }

.par-sr {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.par-root.par-modal-open { overflow: hidden; }

/* ---------- Düğmeler ---------- */
.par-btn {
  font-family: var(--par-font);
  font-weight: 700;
  font-size: 15px;
  min-height: 48px;
  padding: 12px 18px;
  border-radius: 10px;
  border: 1px solid var(--par-line);
  background: #FFFFFF;
  color: var(--par-text);
  cursor: pointer;
  text-align: center;
  transition: background-color .12s ease, border-color .12s ease, color .12s ease;
}
.par-btn:focus-visible { outline: 2px solid var(--par-accent); outline-offset: 2px; }
.par-btn:disabled { opacity: .5; cursor: default; }

.par-btn-primary {
  background: var(--par-accent);
  border-color: var(--par-accent);
  color: #FFFFFF;
}
.par-btn-primary:hover { background: #1D4ED8; border-color: #1D4ED8; }

.par-btn-outline {
  background: #FFFFFF;
  border-color: var(--par-accent);
  color: var(--par-accent);
}
.par-btn-outline:hover { background: #EFF6FF; }

.par-btn-quiet {
  background: transparent;
  border-color: transparent;
  color: var(--par-muted);
}
.par-btn-quiet:hover { background: #F3F4F6; color: var(--par-text); }

.par-btn-ghost {
  background: #FFFFFF;
  border-color: var(--par-line);
  color: var(--par-accent);
}
.par-btn-ghost:hover { background: #F9FAFB; }

.par-btn-danger {
  background: #FFFFFF;
  border-color: var(--par-err);
  color: var(--par-err);
}
.par-btn-danger:hover { background: #FEF2F2; }

/* ---------- PIN KAPISI ---------- */
.par-gate {
  max-width: 420px;
  margin: 0 auto;
  padding: 32px 20px 40px;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.par-gate-title { font-size: 22px; margin-bottom: 6px; }
.par-gate-sub { color: var(--par-muted); font-size: 14px; margin-bottom: 24px; }

.par-dots {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin: 8px 0 14px;
}
.par-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1px solid #9CA3AF;
  background: transparent;
  transition: background-color .12s ease, border-color .12s ease;
}
.par-dot.is-on { background: var(--par-accent); border-color: var(--par-accent); }

.par-gate-msg {
  min-height: 22px;
  font-size: 14px;
  text-align: center;
  color: var(--par-muted);
  margin-bottom: 12px;
}
.par-msg-err { color: var(--par-err); }
.par-msg-warn { color: var(--par-warn); }
.par-msg-ok { color: var(--par-ok); }

.par-keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.par-key {
  min-height: 64px;
  min-width: 64px;
  font-family: var(--par-font);
  font-weight: 700;
  font-size: 22px;
  font-variant-numeric: tabular-nums;
  color: var(--par-text);
  background: var(--par-card);
  border: 1px solid var(--par-line);
  border-radius: var(--par-radius);
  box-shadow: var(--par-shadow);
  cursor: pointer;
}
.par-key:hover { background: #F9FAFB; }
.par-key:active { background: #F3F4F6; }
.par-key:focus-visible { outline: 2px solid var(--par-accent); outline-offset: 2px; }
.par-key:disabled { opacity: .45; cursor: default; }
.par-key-alt { color: var(--par-muted); font-size: 20px; }
.par-key-ok { color: #FFFFFF; background: var(--par-accent); border-color: var(--par-accent); }
.par-key-ok:hover { background: #1D4ED8; }

.par-gate.is-locked .par-keypad { opacity: .6; }

.par-gate-hint {
  font-size: 13px;
  color: var(--par-muted);
  background: var(--par-card);
  border: 1px solid var(--par-line);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 16px;
}

.par-gate-back { align-self: flex-start; }

/* ---------- ÜST ŞERİT ---------- */
.par-strip {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--par-card);
  border-bottom: 1px solid var(--par-line);
  padding: 12px 16px 10px;
}
.par-strip-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  max-width: 720px;
  margin: 0 auto;
}
.par-strip-info { flex: 1 1 auto; min-width: 0; }
.par-strip-main { font-size: 15px; }
.par-strip-main strong { font-weight: 700; }
.par-strip-note { font-size: 12px; color: var(--par-muted); margin-top: 6px; }
.par-strip-back { flex: 0 0 auto; padding: 10px 14px; font-size: 14px; }

.par-bar {
  margin-top: 8px;
  height: 8px;
  width: 100%;
  background: #EEF0F3;
  border-radius: 999px;
  overflow: hidden;
}
.par-bar-fill {
  display: block;
  height: 100%;
  width: 0;
  background: var(--par-accent);
  border-radius: 999px;
  transition: width .2s ease;
}
.par-bar.is-warn .par-bar-fill { background: var(--par-warn); }
.par-bar.is-over .par-bar-fill { background: var(--par-err); }

/* ---------- SEKMELER ---------- */
.par-tabs {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  gap: 4px;
  background: var(--par-card);
  border-bottom: 1px solid var(--par-line);
  padding: 0 12px;
  max-width: 720px;
  margin: 0 auto;
}
.par-tab {
  font-family: var(--par-font);
  font-weight: 700;
  font-size: 15px;
  min-height: 48px;
  padding: 12px 14px;
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--par-muted);
  cursor: pointer;
}
.par-tab:hover { color: var(--par-text); }
.par-tab:focus-visible { outline: 2px solid var(--par-accent); outline-offset: -2px; }
.par-tab.is-active { color: var(--par-accent); border-bottom-color: var(--par-accent); }

/* ---------- GÖVDE ---------- */
.par-body {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px 48px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.par-card {
  background: var(--par-card);
  border: 1px solid var(--par-line);
  border-radius: var(--par-radius);
  box-shadow: var(--par-shadow);
  padding: 18px 16px;
}
.par-card-title { font-size: 17px; margin-bottom: 4px; }
.par-card-sub { font-size: 13px; color: var(--par-muted); margin-bottom: 14px; }
.par-sub-title { font-size: 15px; margin: 18px 0 8px; }

.par-note {
  font-size: 13px;
  color: var(--par-muted);
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--par-line);
}
.par-note-warn { color: var(--par-warn); }

.par-empty {
  font-size: 14px;
  color: var(--par-muted);
  padding: 14px 0;
}

.par-status { font-size: 14px; color: var(--par-muted); margin: 10px 0 14px; }

.par-list {
  list-style: none;
  margin: 0 0 4px;
  padding: 0;
}
.par-list li {
  font-size: 14px;
  color: var(--par-text);
  padding: 8px 0 8px 16px;
  position: relative;
  border-bottom: 1px solid var(--par-line);
}
.par-list li:last-child { border-bottom: 0; }
.par-list li::before {
  content: '';
  position: absolute;
  left: 2px; top: 16px;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #9CA3AF;
}
.par-rules li { color: var(--par-muted); }

.par-footer-demo {
  font-size: 12px;
  color: var(--par-muted);
  text-align: left;
  padding-top: 4px;
}

/* ---------- DİLEK KAVANOZU ---------- */
.par-wish-list { list-style: none; margin: 0; padding: 0; }
.par-wish-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--par-line);
}
.par-wish-row:last-child { border-bottom: 0; }

.par-wish-art {
  flex: 0 0 auto;
  width: 40px; height: 40px;
  display: block;
  border: 1px solid var(--par-line);
  border-radius: 8px;
  overflow: hidden;
  background: #FAFAFB;
}
.par-wish-art svg { width: 100%; height: 100%; display: block; }

.par-wish-meta { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
.par-wish-name {
  font-size: 15px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.par-wish-rarity { font-size: 12px; color: var(--par-muted); }
.par-wish-rm { flex: 0 0 auto; min-height: 48px; padding: 10px 12px; font-size: 14px; }

/* ---------- PAKETLER ---------- */
.par-packs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.par-pack {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  background: var(--par-card);
  border: 1px solid var(--par-line);
  border-radius: var(--par-radius);
  box-shadow: var(--par-shadow);
  padding: 14px 12px;
  cursor: pointer;
  min-width: 0;
}
.par-pack:hover { border-color: #D3D8DF; }
.par-pack:focus-visible { outline: 2px solid var(--par-accent); outline-offset: 2px; }
.par-pack.is-popular { border-color: var(--par-accent); padding-top: 30px; }

.par-ribbon {
  position: absolute;
  top: 0; left: 0; right: 0;
  background: var(--par-accent);
  color: #FFFFFF;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  padding: 4px 10px;
  border-radius: 11px 11px 0 0;
}

.par-pack-name {
  font-size: 15px;
  line-height: 1.25;
  word-break: break-word;
}
.par-pack-count { font-size: 13px; color: var(--par-muted); }
.par-pack-price { font-size: 19px; font-weight: 700; margin-top: 2px; }
.par-pack-unit { font-size: 12px; color: var(--par-muted); }

.par-badge {
  display: inline-block;
  align-self: flex-start;
  max-width: 100%;
  margin-top: 8px;
  font-size: 11px;
  font-weight: 700;

/* =====================================================================
   YUVO SANAT SİSTEMİ — pufi-svg.js  (sahip: sanat-lideri)
   =====================================================================
   BAĞLAYICI STİL KILAVUZU (karakter ressamları buna uyar — istisna yok)

   1) MARKA DİLİ — "ŞEKER-VİNİL STICKER"
      Her Pufi ve her yumurta, bir çıkartma (sticker) gibi durur:
      kalın yumuşak TEK RENK koyu kontur + beyaz sticker halesi +
      şeker-vinil dolgu. Keskin köşe YOK; her form yuvarlak.

   2) ANATOMİ ORANLARI (viewBox "0 0 120 120")
      - Kafa/gövde ≈ 1:1 (tombul, bebek oranı). Kafa merkezi ~ (60,44),
        yarıçap 19–22; gövde merkezi ~ (60,81), rx 22–26, ry 18–21.
      - Ayaklar y≈99–101'de biter; zemin gölgesini API çizer (siz çizmeyin).
      - Karakter x=60'ta ortalanır; toplam kapladığı alan ~ x:22–98, y:12–102.
      - Uzuvlar kısa ve tıknaz; boyun yok (kafa gövdeye oturur).

   3) KONTUR (tek renk, yumuşak koyu)
      - Renk: INK '#3E2A1C' (BRAND §1.1 --line sıcak kahve — tüm sticker
        konturlarıyla TEK mürekkep; kabuk UI ile aynı). Siyah YASAK.
      - Kalınlık: dış formlarda LW=3.5, iç detayda LW2=2.4.
      - stroke-linejoin/linecap daima 'round'.
      - Primitifler (ball/blob/caps/drop/leaf/path) konturu otomatik basar;
        kapatmak için {line:false}.

   4) BEYAZ STICKER HALESİ
      - API, karakteri feMorphology-dilate filtresiyle beyaz hale içine alır
        (silüette kapalı). Ressam kendisi hale ÇİZMEZ.

   5) ŞEKER-VİNİL DOLGU REÇETESİ (her büyük form için)
      a. c.vinyl(ad, açık, koyu): 2-duraklı radyal gradyan
         (odak sol-üst: cx .36, cy .28, r 1.05) — ışık daima SOL-ÜSTten.
      b. c.gloss(cx,cy,rx,ry,rot): sol-üste eğik BEYAZ PARLAMA ŞERİDİ
         (op .55) + minik ikincil damla — "yeni vinil" hissi.
      c. c.bounce(cx,cy,rx,ry): formun ALT kenarında yumuşak yansıma
         (op ~.18) — yerden sekmiş ışık, hacmi tamamlar.

   6) GÖZ SİSTEMİ (iri, çift parlamalı) — c.eyes(cx,cy,o)
      - İri INK ovaller (r 4.4–5.2, ry = r*1.18), aralarında dx 7–9.
      - ÇİFT parlama: büyük beyaz nokta sol-üst (r*0.42) + küçük nokta
        sağ-alt (r*0.2). Efsanevi'de {spark:true} → yıldız parlaması.
      - mood 'sleep' → kirpikli kapalı kapaklar (otomatik).
      - Yanaklar: c.cheeks — pembe '#FFA4B8', op ~.55, gözlerin alt-dışında.

   7) İFADE VARYANTLARI
      - 'happy' (varsayılan): açık gözler + gülümseme/açık ağız.
      - 'sleep': kapalı kapaklar + mini nefes ağzı (c.mouth otomatik).
      - Ağız tipleri: 'smile' | 'open' (dilli) | 'o' | 'none'.

   8) NADİRLİK IŞIMASI
      - Efsanevi/Gizli karakterde aura + yıldız/parıltı ZORUNLU.
      - registerKind tanımında {ownAura:true} diyen ressam aurayı kendi
        çizer; demezse API nadirliğe göre standart aurayı ekler.

   9) KAYIT SÖZLEŞMESİ — Yuvo.art.registerKind(kind, def)
      def = {
        pufi(c, opts)  -> string   // 120×120 iç markup; c.mood'a saygılı
        parts(c)       -> { govde, bas, aksesuar }  // 3 sticker-parça,
                                   // her biri kendi karesinde ortalanmış
        ownAura?: true             // aurayı kendim çizdim
      }
      Kayıtsız kind → sevimli "gizemli Pufi" yer tutucusu.
      Ressam SVG stringini YALNIZ c.* primitifleriyle üretir; gradyan
      id'leri c.vinyl/c.lin üzerinden alınır (SEQ sayaçlı, çakışmaz).
   ===================================================================== */
(function () {
  window.Yuvo = window.Yuvo || { data:{}, art:{}, audio:{}, engine:{}, scenes:{}, test:{} };
  var Y = window.Yuvo;
  Y.art = Y.art || {};

  var INK   = '#3E2A1C';   // tek kontur rengi (BRAND --line sıcak kahve)
  var SIL   = '#4A2E1D';   // silüet dolgusu (BRAND --ink)
  var CHEEK = '#FFA4B8';   // yanak pembesi
  var LW    = 3.5;         // dış kontur
  var LW2   = 2.4;         // iç detay konturu

  /* ---------- temel yardımcılar ---------- */

  function N (x) { return Math.round(x * 100) / 100; }

  function E (name, attrs, inner) {
    var s = '<' + name;
    for (var k in attrs) {
      var v = attrs[k];
      if (v === null || v === undefined || v === '') continue;
      s += ' ' + k + '="' + v + '"';
    }
    return (inner === undefined || inner === null) ? s + '/>' : s + '>' + inner + '</' + name + '>';
  }

  function mix (a, b) { var r = {}, k; for (k in a) r[k] = a[k]; for (k in b) r[k] = b[k]; return r; }

  function hash (s) {
    s = String(s);
    var h = 2166136261 >>> 0;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  function seeded (a) { // mulberry32
    a = a >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function sanit (s) { return String(s).replace(/[^a-zA-Z0-9_-]/g, ''); }

  // Aynı sanat aynı sayfada tekrar basıldığında gradient/clip/filter id'leri
  // çakışmasın diye artan örnek sayacı (mevcut çözüm korunur).
  var SEQ = 0;

  /* ---------- çizim bağlamı (c) — ressam alet çantası ---------- */

  function outAttrs (c, o, w) {
    o = o || {};
    if (o.line === false) return {};
    return {
      stroke: c.sil ? SIL : (o.lc || INK),
      'stroke-width': N(o.lw || w || LW),
      'stroke-linejoin': 'round',
      'stroke-linecap': 'round'
    };
  }

  function rotAt (deg, x, y) {
    return deg ? 'rotate(' + N(deg) + ' ' + N(x) + ' ' + N(y) + ')' : null;
  }

  function makeCtx (id, opts) {
    opts = opts || {};
    var h = hash(id);
    var c = {
      id: id,
      uid: 'yv-' + sanit(id) + '-' + (opts.tag || 'm') + '-' + (SEQ++),
      sil: !!opts.sil,
      mood: opts.mood === 'sleep' ? 'sleep' : 'happy',
      defs: [],
      INK: INK, SIL: SIL, CHEEK: CHEEK, LW: LW, LW2: LW2,
      E: E, N: N
    };

    // 0..1 deterministik mikro-varyasyon (aynı id → aynı sanat)
    c.v = function (n) { return ((h >>> ((n * 5) % 27)) & 31) / 31; };

    // Dolgu güvenliği: silüette her şey SIL
    c.paint = function (f) { return c.sil ? SIL : f; };
    c.flat  = c.paint;
    c.ink   = function () { return c.sil ? SIL : INK; };
    c.o     = function (v) { return c.sil ? 1 : v; };

    /* --- şeker-vinil gradyanlar --- */
    c.vinyl = function (name, lt, dk, o) {
      if (c.sil) return SIL;
      o = o || {};
      var gid = c.uid + '-' + name;
      var mid = o.md ? '<stop offset="0.55" stop-color="' + o.md + '"/>' : '';
      c.defs.push(
        '<radialGradient id="' + gid + '" cx="' + (o.cx != null ? o.cx : 0.36) +
        '" cy="' + (o.cy != null ? o.cy : 0.28) + '" r="' + (o.r != null ? o.r : 1.05) + '">' +
        '<stop offset="0" stop-color="' + lt + '"/>' + mid +
        '<stop offset="1" stop-color="' + dk + '"/></radialGradient>');
      return 'url(#' + gid + ')';
    };
    c.lin = function (name, stops, x1, y1, x2, y2) {
      if (c.sil) return SIL;
      var gid = c.uid + '-' + name, s = '', i;
      for (i = 0; i < stops.length; i++) {
        s += '<stop offset="' + stops[i][0] + '" stop-color="' + stops[i][1] + '"' +
             (stops[i][2] != null ? ' stop-opacity="' + stops[i][2] + '"' : '') + '/>';
      }
      c.defs.push('<linearGradient id="' + gid + '" x1="' + x1 + '" y1="' + y1 +
                  '" x2="' + x2 + '" y2="' + y2 + '">' + s + '</linearGradient>');
      return 'url(#' + gid + ')';
    };

    /* --- konturlu form primitifleri --- */
    c.ball = function (cx, cy, r, fill, o) {
      o = o || {};
      return E('circle', mix({ cx: N(cx), cy: N(cy), r: N(r), fill: c.paint(fill),
        opacity: o.op != null ? c.o(o.op) : null }, outAttrs(c, o)));
    };
    c.blob = function (cx, cy, rx, ry, fill, o) {
      o = o || {};
      return E('ellipse', mix({ cx: N(cx), cy: N(cy), rx: N(rx), ry: N(ry), fill: c.paint(fill),
        opacity: o.op != null ? c.o(o.op) : null, transform: rotAt(o.rot, cx, cy) }, outAttrs(c, o)));
    };
    c.caps = function (cx, cy, w, hh, fill, o) {
      o = o || {};
      var rx = (o.rx != null) ? o.rx : Math.min(w, hh) / 2;
      return E('rect', mix({ x: N(cx - w / 2), y: N(cy - hh / 2), width: N(w), height: N(hh),
        rx: N(rx), fill: c.paint(fill), opacity: o.op != null ? c.o(o.op) : null,
        transform: rotAt(o.rot, cx, cy) }, outAttrs(c, o)));
    };
    c.drop = function (cx, cy, r, len, fill, o) { // damla: sivri uç yukarıda, top altta
      o = o || {};
      var d = 'M' + N(cx) + ' ' + N(cy - len) +
              ' Q' + N(cx + r * 0.92) + ' ' + N(cy - len * 0.42) + ' ' + N(cx + r) + ' ' + N(cy) +
              ' A' + N(r) + ' ' + N(r) + ' 0 0 1 ' + N(cx - r) + ' ' + N(cy) +
              ' Q' + N(cx - r * 0.92) + ' ' + N(cy - len * 0.42) + ' ' + N(cx) + ' ' + N(cy - len) + ' Z';
      return E('path', mix({ d: d, fill: c.paint(fill), opacity: o.op != null ? c.o(o.op) : null,
        transform: rotAt(o.rot, cx, cy) }, outAttrs(c, o)));
    };
    c.leaf = function (cx, cy, rx, ry, fill, o) { // iki ucu sivri yaprak/petal
      o = o || {};
      var d = 'M' + N(cx) + ' ' + N(cy - ry) +
              ' Q' + N(cx + rx) + ' ' + N(cy) + ' ' + N(cx) + ' ' + N(cy + ry) +
              ' Q' + N(cx - rx) + ' ' + N(cy) + ' ' + N(cx) + ' ' + N(cy - ry) + ' Z';
      return E('path', mix({ d: d, fill: c.paint(fill), opacity: o.op != null ? c.o(o.op) : null,
        transform: rotAt(o.rot, cx, cy) }, outAttrs(c, o)));
    };
    c.path = function (d, fill, o) {
      o = o || {};
      return E('path', mix({ d: d, fill: c.paint(fill), opacity: o.op != null ? c.o(o.op) : null,
        transform: o.tr || null }, outAttrs(c, o)));
    };
    c.line = function (d, w, col, o) {
      o = o || {};
      return E('path', { d: d, stroke: c.sil ? SIL : col, 'stroke-width': N(w), fill: 'none',
        'stroke-linecap': 'round', 'stroke-linejoin': 'round',
        opacity: o.op != null ? c.o(o.op) : null,
        'stroke-dasharray': o.dash || null });
    };
    c.rope = function (d, w, col, o) { // konturlu kalın şerit (kuyruk/sap)
      o = o || {};
      var s = E('path', { d: d, stroke: c.sil ? SIL : (o.lc || INK), 'stroke-width': N(w + 4.4),
        fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
      s += E('path', { d: d, stroke: c.paint(col), 'stroke-width': N(w), fill: 'none',
        'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
      if (o.hi && !c.sil) {
        s += E('path', { d: d, stroke: '#FFFFFF', 'stroke-width': N(Math.max(1.4, w * 0.32)),
          fill: 'none', 'stroke-linecap': 'round', opacity: 0.4 });
      }
      return s;
    };

    /* --- ışık: parlama şeridi + alt yansıma --- */
    c.gloss = function (cx, cy, rx, ry, rot) {
      if (c.sil) return '';
      return E('ellipse', { cx: N(cx), cy: N(cy), rx: N(rx), ry: N(ry), fill: '#FFFFFF',
               opacity: 0.55, transform: rotAt(rot == null ? -18 : rot, cx, cy) }) +
             E('circle', { cx: N(cx + rx * 0.9), cy: N(cy + ry * 1.7), r: N(Math.max(1.2, rx * 0.28)),
               fill: '#FFFFFF', opacity: 0.32 });
    };
    c.bounce = function (cx, cy, rx, ry, col, op) {
      if (c.sil) return '';
      return E('ellipse', { cx: N(cx), cy: N(cy), rx: N(rx), ry: N(ry),
        fill: col || '#FFFFFF', opacity: op != null ? op : 0.18 });
    };
    c.dot = function (x, y, r, op) {
      if (c.sil) return '';
      return E('circle', { cx: N(x), cy: N(y), r: N(r), fill: '#FFFFFF', opacity: op != null ? op : 0.7 });
    };

    /* --- yüz sistemi --- */
    c.eyes = function (cx, cy, o) {
      if (c.sil) return '';
      o = o || {};
      var dx = o.dx != null ? o.dx : 8;
      var r  = o.r  != null ? o.r  : 4.8;
      var ry = o.ry != null ? o.ry : r * 1.18;
      var closed = (c.mood === 'sleep') || o.closed;
      var s = '', i, ex;
      for (i = -1; i <= 1; i += 2) {
        ex = cx + dx * i;
        if (closed) {
          s += E('path', { d: 'M' + N(ex - r) + ' ' + N(cy) + ' Q' + N(ex) + ' ' + N(cy + r * 1.05) +
                 ' ' + N(ex + r) + ' ' + N(cy), stroke: INK, 'stroke-width': 2.8, fill: 'none',
                 'stroke-linecap': 'round' });
          if (o.lash !== false) {
            s += E('path', { d: 'M' + N(ex + r * 0.72 * i) + ' ' + N(cy + r * 0.72) + ' L' +
                   N(ex + r * 1.2 * i) + ' ' + N(cy + r * 1.2), stroke: INK, 'stroke-width': 2,
                   fill: 'none', 'stroke-linecap': 'round' });
          }
        } else {
          s += E('ellipse', { cx: N(ex), cy: N(cy), rx: N(r), ry: N(ry), fill: INK });
          if (o.spark) {
            s += c.sparkle(ex - r * 0.2, cy - ry * 0.26, r * 0.66, '#FFFFFF', 0.95);
            s += E('circle', { cx: N(ex + r * 0.32), cy: N(cy + ry * 0.34), r: N(r * 0.2),
                   fill: '#FFFFFF', opacity: 0.85 });
          } else {
            s += E('circle', { cx: N(ex - r * 0.3), cy: N(cy - ry * 0.32), r: N(r * 0.42), fill: '#FFFFFF' });
            s += E('circle', { cx: N(ex + r * 0.32), cy: N(cy + ry * 0.3), r: N(r * 0.2),
                   fill: '#FFFFFF', opacity: 0.9 });
          }
        }
      }
      return s;
    };
    c.cheeks = function (cx, cy, dx, o) {
      if (c.sil) return '';
      o = o || {};
      var rx = o.rx || 4.2, ry = o.ry || 2.8, op = o.op != null ? o.op : 0.55;
      return E('ellipse', { cx: N(cx - dx), cy: N(cy), rx: N(rx), ry: N(ry), fill: CHEEK, opacity: op }) +
             E('ellipse', { cx: N(cx + dx), cy: N(cy), rx: N(rx), ry: N(ry), fill: CHEEK, opacity: op });
    };
    c.mouth = function (cx, cy, type, o) {
      if (c.sil || type === 'none') return '';
      o = o || {};
      var w = o.w || 9;
      if (c.mood === 'sleep' && !o.force) {
        return E('path', { d: 'M' + N(cx - 2.6) + ' ' + N(cy) + ' Q' + N(cx) + ' ' + N(cy + 2.2) +
               ' ' + N(cx + 2.6) + ' ' + N(cy), stroke: INK, 'stroke-width': 2.2, fill: 'none',
               'stroke-linecap': 'round' });
      }
      if (type === 'open') {
        return E('path', { d: 'M' + N(cx - w / 2) + ' ' + N(cy) +
                 ' Q' + N(cx) + ' ' + N(cy + w * 0.95) + ' ' + N(cx + w / 2) + ' ' + N(cy) +
                 ' Q' + N(cx) + ' ' + N(cy + w * 0.16) + ' ' + N(cx - w / 2) + ' ' + N(cy) + ' Z',
                 fill: INK, 'stroke-linejoin': 'round' }) +
               E('path', { d: 'M' + N(cx - w * 0.22) + ' ' + N(cy + w * 0.3) +
                 ' Q' + N(cx) + ' ' + N(cy + w * 0.64) + ' ' + N(cx + w * 0.22) + ' ' + N(cy + w * 0.3) +
                 ' Q' + N(cx) + ' ' + N(cy + w * 0.4) + ' ' + N(cx - w * 0.22) + ' ' + N(cy + w * 0.3) + ' Z',
                 fill: '#FF8FA0' });
      }
      if (type === 'o') return E('circle', { cx: N(cx), cy: N(cy + 1), r: 2.2, fill: INK });
      return E('path', { d: 'M' + N(cx - w / 2) + ' ' + N(cy) + ' Q' + N(cx) + ' ' + N(cy + w * 0.5) +
             ' ' + N(cx + w / 2) + ' ' + N(cy), stroke: INK, 'stroke-width': 2.6, fill: 'none',
             'stroke-linecap': 'round' });
    };
    c.face = function (cx, cy, o) { // pratik birleşik yüz
      if (c.sil) return '';
      o = o || {};
      var s = c.eyes(cx, cy - 2, o.eyes || {});
      if (o.cheeks !== false) {
        var edx = (o.eyes && o.eyes.dx != null ? o.eyes.dx : 8);
        s += c.cheeks(cx, cy + 4.5, edx + 6, o.cheekOpts || {});
      }
      s += c.mouth(cx, cy + (o.my != null ? o.my : 6.5), o.m || 'smile', o.mOpts || {});
      return s;
    };

    /* --- karakter parçaları --- */
    c.beak = function (cx, cy, w, col, o) { // gaga (o.open → sevinçli açık)
      o = o || {};
      var dk = o.dk || col;
      var open = o.open && c.mood !== 'sleep' && !c.sil;
      var s = c.path('M' + N(cx - w / 2) + ' ' + N(cy) +
              ' Q' + N(cx) + ' ' + N(cy - w * 0.52) + ' ' + N(cx + w / 2) + ' ' + N(cy) +
              ' Q' + N(cx) + ' ' + N(cy + w * (open ? 0.3 : 0.55)) + ' ' + N(cx - w / 2) + ' ' + N(cy) + ' Z',
              col, { lw: LW2 });
      if (open) {
        s += c.path('M' + N(cx - w * 0.32) + ' ' + N(cy + w * 0.22) +
             ' Q' + N(cx) + ' ' + N(cy + w * 0.78) + ' ' + N(cx + w * 0.32) + ' ' + N(cy + w * 0.22) +
             ' Q' + N(cx) + ' ' + N(cy + w * 0.4) + ' ' + N(cx - w * 0.32) + ' ' + N(cy + w * 0.22) + ' Z',
             dk, { lw: LW2 });
      }
      return s;
    };
    c.earRound = function (cx, cy, r, fill, inner) { // fare/ayı kulağı
      var s = c.ball(cx, cy, r, fill, {});
      if (!c.sil) {
        s += E('circle', { cx: N(cx), cy: N(cy + r * 0.08), r: N(r * 0.55), fill: inner });
        s += c.dot(cx - r * 0.38, cy - r * 0.38, r * 0.2, 0.6);
      }
      return s;
    };
    c.antenna = function (d, col, tx, ty, tr) { // anten: eğri sap + top uç
      return c.line(d, 2.6, c.sil ? SIL : col) + c.ball(tx, ty, tr || 3, col, { lw: LW2 });
    };
    c.sparkle = function (x, y, s, col, op) { // 4 uçlu ışıltı
      return E('path', { d: 'M' + N(x) + ' ' + N(y - s) +
        ' Q' + N(x + s * 0.22) + ' ' + N(y - s * 0.22) + ' ' + N(x + s) + ' ' + N(y) +
        ' Q' + N(x + s * 0.22) + ' ' + N(y + s * 0.22) + ' ' + N(x) + ' ' + N(y + s) +
        ' Q' + N(x - s * 0.22) + ' ' + N(y + s * 0.22) + ' ' + N(x - s) + ' ' + N(y) +
        ' Q' + N(x - s * 0.22) + ' ' + N(y - s * 0.22) + ' ' + N(x) + ' ' + N(y - s) + ' Z',
        fill: c.sil ? SIL : col, opacity: c.sil ? 1 : (op != null ? op : 0.9) });
    };
    c.moon = function (cx, cy, r, col, o) { // hilal (ağzı sağa bakar)
      o = o || {};
      var d = 'M' + N(cx) + ' ' + N(cy - r) +
              ' A' + N(r) + ' ' + N(r) + ' 0 1 0 ' + N(cx) + ' ' + N(cy + r) +
              ' A' + N(r * 1.55) + ' ' + N(r * 1.55) + ' 0 0 1 ' + N(cx) + ' ' + N(cy - r) + ' Z';
      return E('path', mix({ d: d, fill: c.paint(col), transform: rotAt(o.rot, cx, cy),
        opacity: o.op != null ? c.o(o.op) : null }, outAttrs(c, o, LW2)));
    };
    c._hn = 0;
    c.aura = function (col, cy, r, a) { // nadirlik ışıması (arka plan)
      if (c.sil) return '';
      var gid = c.uid + '-au' + (c._hn++);
      a = a != null ? a : 0.5;
      c.defs.push(
        '<radialGradient id="' + gid + '" cx="0.5" cy="0.5" r="0.5">' +
        '<stop offset="0" stop-color="' + col + '" stop-opacity="' + N(a) + '"/>' +
        '<stop offset="0.65" stop-color="' + col + '" stop-opacity="' + N(a * 0.42) + '"/>' +
        '<stop offset="1" stop-color="' + col + '" stop-opacity="0"/></radialGradient>');
      return E('circle', { cx: 60, cy: cy != null ? N(cy) : 58, r: r != null ? N(r) : 54,
        fill: 'url(#' + gid + ')' });
    };

    /* --- poz yardımcıları --- */
    c.grp  = function (attrs, inner) { return E('g', attrs, inner); };
    c.move = function (x, y, inner) {
      return E('g', { transform: 'translate(' + N(x) + ' ' + N(y) + ')' }, inner);
    };
    c.spin = function (deg, px, py, inner) {
      return E('g', { transform: 'rotate(' + N(deg) + ' ' + N(px) + ' ' + N(py) + ')' }, inner);
    };
    c.zoom = function (s, px, py, inner) {
      return E('g', { transform: 'translate(' + N(px * (1 - s)) + ' ' + N(py * (1 - s)) +
        ') scale(' + N(s) + ')' }, inner);
    };

    return c;
  }

  function svgWrap (c, inner) {
    var defs = c.defs.length ? '<defs>' + c.defs.join('') + '</defs>' : '';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true">' +
           defs + inner + '</svg>';
  }

  // Beyaz sticker halesi: karakter grubunu dilate-beyaz filtresine sarar.
  function sticker (c, inner) {
    if (c.sil || !inner) return inner;
    var fid = c.uid + '-stk';
    c.defs.push(
      '<filter id="' + fid + '" x="-18%" y="-18%" width="136%" height="136%">' +
      '<feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="yvd"/>' +
      '<feFlood flood-color="#FFFFFF"/>' +
      '<feComposite in2="yvd" operator="in" result="yvh"/>' +
      '<feMerge><feMergeNode in="yvh"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter>');
    return '<g filter="url(#' + fid + ')">' + inner + '</g>';
  }

  // Zemin gölgesi (API basar; ressam çizmez)
  function groundShadow (op, ry) {
    return E('ellipse', { cx: 60, cy: 104.5, rx: 25, ry: ry || 4.6, fill: SIL, opacity: op || 0.14 });
  }
  /* =====================================================================
     KAYIT SİSTEMİ — Yuvo.art.registerKind
     ===================================================================== */

  var KINDS = {};

  Y.art.registerKind = function (kind, def) {
    if (!kind || !def || typeof def.pufi !== 'function') return false;
    KINDS[String(kind)] = def;
    return true;
  };

  /* --- yer tutucu: "gizemli Pufi" (kayıtsız kind sevimli kalır) --- */

  function placeholderPufi (c) {
    var LT = '#EFE4FB', DK = '#B49BDD';
    var s = '';
    // ayaklar
    s += c.caps(48, 98, 13, 8, '#C9B4E8', {});
    s += c.caps(72, 98, 13, 8, '#C9B4E8', {});
    // tombul gövde-baş tek kütle
    s += c.blob(60, 68, 29, 33, c.vinyl('bd', LT, DK), {});
    s += c.blob(60, 86, 15, 11, '#F8F1FF', { line: false, op: 0.9 });
    s += c.gloss(46, 48, 9.5, 6);
    s += c.bounce(60, 95, 17, 5, '#EFE4FB');
    // filiz anten + soru kıvrımı
    s += c.antenna('M60 35 Q59 24 64 19', '#8F76C2', 65, 17.5, 3.2);
    s += c.line('M64 19 Q72 14 74 21 Q75 26 69 26', 2.6, c.sil ? SIL : '#8F76C2');
    // yüz
    s += c.face(60, 60, { eyes: { dx: 9, r: 5 }, m: 'smile' });
    return s;
  }

  function placeholderParts (c) {
    var LT = '#EFE4FB', DK = '#B49BDD';
    return {
      govde: c.caps(49, 84, 13, 8, '#C9B4E8', {}) + c.caps(71, 84, 13, 8, '#C9B4E8', {}) +
             c.blob(60, 60, 28, 26, c.vinyl('bd', LT, DK), {}) +
             c.blob(60, 72, 14, 9, '#F8F1FF', { line: false, op: 0.9 }) +
             c.gloss(47, 44, 9, 5.5),
      bas:   c.ball(60, 60, 26, c.vinyl('hd', LT, DK), {}) + c.gloss(48, 48, 8.5, 5) +
             c.face(60, 62, { eyes: { dx: 9.5, r: 5.2 }, m: 'smile' }),
      aksesuar: c.antenna('M60 78 Q58 58 66 48', '#8F76C2', 68, 45, 4.2) +
                c.line('M68 45 Q80 38 82 48 Q83 55 74 55', 3, c.sil ? SIL : '#8F76C2') +
                c.sparkle(40, 52, 5, '#D9C6F5', 0.9) + c.sparkle(84, 72, 4, '#D9C6F5', 0.8)
    };
  }

  var PLACEHOLDER = { pufi: placeholderPufi, parts: placeholderParts };

  function kindDef (pufi) {
    var kind = (pufi && pufi.kind) ? String(pufi.kind) : '';
    return KINDS[kind] || PLACEHOLDER;
  }

  /* =====================================================================
     BEŞ ÖRNEK KARAKTER (kalite çıtası — ressamlar bu düzeye çıkar)
     ===================================================================== */

  /* --- 1. CİVCİV (cikcik) — sarı tombiş, horoz çırağı --- */

  function civcivBits (c) {
    var LT = '#FFF6BE', DK = '#FFC531', WG = '#F5A623', FT = '#FF9F3D';
    var b = {};
    b.tail = c.drop(85, 84, 4.6, 12, c.vinyl('tl', '#FFE98F', WG), { rot: 118 });
    b.feet = c.caps(48, 99, 13, 8, FT, {}) + c.caps(72, 99, 13, 8, FT, {});
    b.body = c.blob(60, 80, 25, 21, c.vinyl('bd', LT, DK), {}) +
             c.blob(60, 86, 13.5, 10.5, '#FFF1B0', { line: false, op: 0.95 }) +
             c.gloss(47.5, 67, 9.5, 5.5) +
             c.bounce(60, 96, 16, 4.6, '#FFF3C0', 0.22);
    b.wingL = c.drop(35.5, 82, 6.8, 14, c.vinyl('w1', '#FFEC9E', WG), { rot: -150 });
    b.wingR = c.drop(84.5, 82, 6.8, 14, c.vinyl('w2', '#FFEC9E', WG), { rot: 150 });
    b.head = c.ball(60, 43, 21.5, c.vinyl('hd', LT, DK), {}) +
             c.gloss(49.5, 32.5, 8.2, 4.6);
    b.crest = c.drop(52, 26.5, 3.3, 8.5, c.vinyl('c1', '#FFEC9E', WG), { rot: -16 }) +
              c.drop(60, 23.5, 3.9, 10.5, c.vinyl('c2', '#FFF3B8', WG), {}) +
              c.drop(68, 26.5, 3.3, 8.5, c.vinyl('c3', '#FFEC9E', WG), { rot: 16 });
    b.face = c.eyes(60, 42, { dx: 8.6, r: 4.9 }) +
             c.cheeks(60, 49, 14.6, {}) +
             c.beak(60, 52.5, 9.5, FT, { open: true, dk: '#E8842B' });
    return b;
  }

  Y.art.registerKind('civciv', {
    pufi: function (c) {
      var b = civcivBits(c);
      return b.tail + b.feet + b.body + b.wingL + b.wingR + b.head + b.crest + b.face;
    },
    parts: function (c) {
      var b = civcivBits(c);
      return {
        govde: c.move(0, -10, b.tail + b.feet + b.body),
        bas:   c.zoom(1.25, 60, 44, c.move(0, 14, b.head + b.face)),
        aksesuar: c.zoom(1.35, 60, 60,
          c.move(0, 22, b.crest) +
          c.move(14, -14, b.wingL) + c.move(-14, -14, b.wingR))
      };
    }
  });

  /* --- 2. FARE (toprik) — tarla faresi, kulağında başak --- */

  function fareBits (c) {
    var LT = '#F5F2FB', DK = '#BDB6D4', EAR = '#FFC4D9', TAIL = '#F49CC0';

  var AURA_BY_RARITY = { efsanevi: '#FFB63C', gizli: '#8D7BD8' };

  Y.art.hasKind = function (kind) { return !!KINDS[String(kind)]; };

  function buildPufi (pufi, opts) {
    var id = (pufi && pufi.id) ? String(pufi.id) : 'pufi';
    var c = makeCtx(id, opts);
    var def = kindDef(pufi);
    var body;
    try { body = def.pufi(c, opts || {}); }
    catch (e) { def = PLACEHOLDER; body = placeholderPufi(c); }
    if (!body) { def = PLACEHOLDER; body = placeholderPufi(c); }
    return { c: c, def: def, body: body };
  }

  Y.art.pufiSVG = function (pufi, opts) {
    opts = opts || {};
    var r = buildPufi(pufi, { tag: 'm', mood: opts.mood });
    var inner = '';
    var auraCol = AURA_BY_RARITY[(pufi && pufi.rarity) || ''];
    if (auraCol && !r.def.ownAura) inner += r.c.aura(auraCol, 58, 54, 0.5);
    inner += groundShadow();
    inner += sticker(r.c, r.body);
    return svgWrap(r.c, inner);
  };

  Y.art.pufiSilhouetteSVG = function (pufi) {
    var r = buildPufi(pufi, { tag: 's', sil: true });
    return svgWrap(r.c, r.body);
  };

  Y.art.toyParts = function (pufi) {
    var id = (pufi && pufi.id) ? String(pufi.id) : 'pufi';
    var order = ['govde', 'bas', 'aksesuar'];
    var tags = { govde: 'pg', bas: 'pb', aksesuar: 'pa' };
    var out = [], i, c, def, piece, set;
    for (i = 0; i < order.length; i++) {
      c = makeCtx(id, { tag: tags[order[i]] });
      def = kindDef(pufi);
      piece = '';
      try {
        set = (typeof def.parts === 'function') ? def.parts(c) : null;
        piece = (set && set[order[i]]) ? set[order[i]] : '';
      } catch (e) { piece = ''; }
      if (!piece) { // savunmacı: boş parça olmasın
        try { set = placeholderParts(c); piece = set[order[i]] || ''; } catch (e2) {}
        if (!piece) piece = c.ball(60, 60, 14, '#C9B4E8', {});
      }
      out.push({ id: order[i], svg: svgWrap(c, sticker(c, piece)) });
    }
    return out;
  };

  /* ---------- ortak geometri ---------- */

  var EGG_D = 'M60 13 C82 13 96 41 96 67 C96 90 80 106 60 106 C40 106 24 90 24 67 C24 41 38 13 60 13 Z';

  Y.art.wrapperSVG = function (seriId, opts) {

    var P = pal(seriId, opts.golden);

          fill: '#FFFFFF', opacity: 0.95 }) +
        E('path', { d: 'M-1.6 -1.2 L0.2 0.2 L-1 1.4 L0.8 2.6', stroke: P.deep, 'stroke-width': 0.9,

    for (i = 0; i < 2; i++) f += E('circle', { cx: 51 + i * 18, cy: 74, r: 1.3, fill: P.deep, opacity: 0.6 });
    // E · ALT BİLGİ (%8): seri adı krem plaka üstünde (ton-üstü-ton yasak,

    f += E('path', { d: 'M27 66 L38 72.5 L28 76 Z', fill: P.deep, opacity: 0.26 });
    f += E('path', { d: 'M86 42 L96 51 L84 49 Z', fill: P.deep, opacity: 0.22 });
