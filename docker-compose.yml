services:
  cms:
    build: .
    image: codex-cms
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # İlk çalıştırmada oluşturulacak yönetici hesabı (yalnızca DB ilk kez
      # oluşturulurken kullanılır). Üretimde mutlaka değiştirin.
      CMS_ADMIN_EMAIL: ${CMS_ADMIN_EMAIL:-admin@codex.local}
      CMS_ADMIN_PASSWORD: ${CMS_ADMIN_PASSWORD:-admin123!}
      # Veritabanı ve yüklemeler bu dizinde (kalıcı volume) tutulur.
      CMS_DATA_DIR: /data
    volumes:
      # SQLite veritabanı + yüklenen medya kalıcı volume'da saklanır.
      - codex-data:/data

volumes:
  codex-data:
